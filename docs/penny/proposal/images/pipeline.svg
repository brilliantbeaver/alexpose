<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">Where our pipeline replaces the old one</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">Same MediaPipe poses, two paths: the old one wastes unlabeled data, the new one learns from all of it</text>

  <!-- Shared start box -->
  <rect x="300" y="82" width="360" height="58" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480" y="107" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">MediaPipe BLAZEPOSE_33 poses</text>
  <text x="480" y="126" font-size="12" text-anchor="middle" fill="#334155">33 tracked 3D joints per frame, from GAVD videos</text>

  <!-- Split connectors -->
  <line x1="400" y1="140" x2="240" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="140" x2="720" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== OLD PATH (left, amber) ===================== -->
  <text x="240" y="182" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">OLD PATH (prior work)</text>

  <!-- 82 hand features -->
  <rect x="90" y="200" width="300" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="240" y="225" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c2d12">82 hand-engineered features</text>
  <text x="240" y="245" font-size="12" text-anchor="middle" fill="#334155">person-weeks to build, only from labels</text>
  <line x1="240" y1="260" x2="240" y2="296" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Random Forest -->
  <rect x="90" y="300" width="300" height="52" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="240" y="331" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c2d12">Random Forest classifier</text>
  <line x1="240" y1="352" x2="240" y2="388" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 76 percent result -->
  <rect x="90" y="392" width="300" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="240" y="417" font-size="15" font-weight="bold" text-anchor="middle" fill="#7c2d12">76 percent test accuracy</text>
  <text x="240" y="437" font-size="12" text-anchor="middle" fill="#334155">on 68 labels, 5 classes (chance = 20 percent)</text>

  <!-- wasted-data note under old path -->
  <rect x="90" y="470" width="300" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="240" y="493" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Wastes the unlabeled pool</text>
  <text x="240" y="512" font-size="11" text-anchor="middle" fill="#334155">trains only on the 68 labeled sequences;</text>
  <text x="240" y="528" font-size="11" text-anchor="middle" fill="#334155">all other GAVD poses are thrown away</text>

  <!-- ===================== NEW PATH (right, blue/green) ===================== -->
  <text x="720" y="182" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">NEW PATH (Gait-JEPA)</text>

  <!-- pretrain on all poses -->
  <rect x="570" y="200" width="300" height="70" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="720" y="224" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">Pretrain Gait-JEPA</text>
  <text x="720" y="243" font-size="12" text-anchor="middle" fill="#334155">on ALL poses, UNLABELED</text>
  <text x="720" y="260" font-size="11" text-anchor="middle" fill="#15803d">the large pool the old path wastes</text>
  <line x1="720" y1="270" x2="720" y2="304" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- freeze encoder -->
  <rect x="570" y="308" width="300" height="52" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="720" y="333" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Freeze the context encoder</text>
  <text x="720" y="351" font-size="11" text-anchor="middle" fill="#334155">no fine-tuning in the headline result</text>
  <line x1="720" y1="360" x2="720" y2="396" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- small probe -->
  <rect x="570" y="400" width="300" height="60" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="720" y="424" font-size="14" font-weight="bold" text-anchor="middle" fill="#4c1d95">Small probe on 68 labels</text>
  <text x="720" y="444" font-size="12" text-anchor="middle" fill="#334155">frozen features, same 70/30 split</text>
  <line x1="720" y1="460" x2="720" y2="496" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- compare to 76 -->
  <rect x="570" y="500" width="300" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="720" y="531" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">Compare to the 76 percent baseline</text>

  <!-- apples-to-apples link between the two endpoints -->
  <line x1="390" y1="422" x2="568" y2="524" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="480" y="486" font-size="11" font-weight="bold" text-anchor="middle" fill="#64748b">apples-to-apples</text>
  <text x="480" y="500" font-size="10" text-anchor="middle" fill="#64748b">both = frozen features + light classifier</text>
</svg>
