<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>

  <text x="470" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">The collapse trap and the VICReg fix</text>
  <text x="470" y="58" font-size="13" text-anchor="middle" fill="#475569">Predicting in latent space can cheat by shrinking everything to one point; VICReg keeps the space alive</text>

  <!-- LEFT PANEL: collapse trap -->
  <rect x="30" y="80" width="415" height="410" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="237" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f1d1d">The collapse trap</text>

  <!-- source points, all arrowing into one dot -->
  <circle cx="90" cy="170" r="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="100" cy="240" r="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="90" cy="310" r="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="115" cy="205" r="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="115" cy="275" r="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="95" cy="135" r="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="95" cy="345" r="7" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>

  <text x="60" y="128" font-size="10" fill="#7f1d1d">clips</text>

  <!-- converging arrows to a single point -->
  <line x1="102" y1="135" x2="290" y2="238" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="99" y1="170" x2="290" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="124" y1="205" x2="290" y2="241" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="240" x2="290" y2="242" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="124" y1="275" x2="290" y2="243" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="99" y1="310" x2="290" y2="244" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="104" y1="345" x2="290" y2="246" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- the single collapsed dot -->
  <circle cx="305" cy="242" r="13" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <text x="360" y="238" font-size="11" text-anchor="middle" fill="#7f1d1d">one</text>
  <text x="360" y="252" font-size="11" text-anchor="middle" fill="#7f1d1d">point</text>

  <!-- caption box -->
  <rect x="50" y="388" width="375" height="86" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="65" y="410" font-size="12" fill="#7f1d1d">Every clip maps to the same useless point.</text>
  <text x="65" y="430" font-size="12" fill="#7f1d1d">Predicted = target = a constant, so the</text>
  <text x="65" y="450" font-size="12" fill="#7f1d1d">loss is zero but nothing has been learned.</text>
  <text x="65" y="468" font-size="11" font-style="italic" fill="#b91c1c">This is representation collapse.</text>

  <!-- RIGHT PANEL: VICReg fix -->
  <rect x="495" y="80" width="415" height="410" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="702" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">The VICReg fix</text>

  <!-- spread cloud of points -->
  <circle cx="600" cy="150" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="670" cy="185" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="560" cy="215" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="640" cy="240" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="720" cy="200" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="590" cy="290" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="700" cy="285" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="655" cy="325" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="760" cy="255" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="535" cy="270" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="615" cy="200" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="740" cy="325" r="7" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>

  <!-- variance term callout -->
  <line x1="770" y1="160" x2="820" y2="160" stroke="#15803d" stroke-width="1.5"/>
  <line x1="820" y1="160" x2="820" y2="140" stroke="#15803d" stroke-width="1.5"/>
  <rect x="505" y="352" width="185" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="518" y="373" font-size="12" font-weight="bold" fill="#14532d">Variance term</text>
  <text x="518" y="391" font-size="11" fill="#14532d">keep each dimension</text>
  <text x="518" y="405" font-size="11" fill="#14532d">spread out (not constant)</text>

  <!-- covariance term callout -->
  <rect x="710" y="352" width="185" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="723" y="373" font-size="12" font-weight="bold" fill="#14532d">Covariance term</text>
  <text x="723" y="391" font-size="11" fill="#14532d">keep dimensions carrying</text>
  <text x="723" y="405" font-size="11" fill="#14532d">different information</text>

  <!-- note -->
  <rect x="505" y="426" width="390" height="48" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="700" y="447" font-size="12" text-anchor="middle" fill="#14532d">Collapse is prevented by the slow EMA target plus VICReg:</text>
  <text x="700" y="465" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">no negative examples, no decoder.</text>
</svg>
