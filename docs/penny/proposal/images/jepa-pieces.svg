<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>

  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">The four pieces of a JEPA</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">Hide part of the pose sequence, then predict it in latent space, not in raw coordinates</text>

  <!-- ============ TOP ROW: hidden part -> target encoder ============ -->
  <!-- hidden part input -->
  <rect x="70" y="96" width="150" height="58" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="145" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">hidden part</text>
  <text x="145" y="139" font-size="11" text-anchor="middle" fill="#7c2d12">masked joints / frames</text>

  <!-- target encoder -->
  <rect x="300" y="88" width="210" height="74" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="405" y="114" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">Target encoder</text>
  <text x="405" y="133" font-size="11" text-anchor="middle" fill="#14532d">EMA copy (the answer key)</text>
  <text x="405" y="150" font-size="11" text-anchor="middle" fill="#14532d">stop-gradient</text>

  <!-- target embedding -->
  <rect x="600" y="96" width="170" height="58" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="685" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">target embedding</text>
  <text x="685" y="139" font-size="11" text-anchor="middle" fill="#14532d">answer key</text>

  <line x1="220" y1="125" x2="298" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="125" x2="598" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ BOTTOM ROW: visible tokens -> context encoder ============ -->
  <!-- visible tokens input -->
  <rect x="70" y="360" width="150" height="58" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="145" y="384" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">visible tokens</text>
  <text x="145" y="403" font-size="11" text-anchor="middle" fill="#1e3a8a">the part we can see</text>

  <!-- context encoder -->
  <rect x="300" y="352" width="210" height="74" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="405" y="380" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Context encoder</text>
  <text x="405" y="399" font-size="11" text-anchor="middle" fill="#1e3a8a">spatiotemporal transformer</text>
  <text x="405" y="416" font-size="11" text-anchor="middle" fill="#1e3a8a">reads visible tokens</text>

  <!-- context embedding -->
  <rect x="600" y="360" width="170" height="58" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="685" y="384" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">context embedding</text>
  <text x="685" y="403" font-size="11" text-anchor="middle" fill="#1e3a8a">summary of visible</text>

  <line x1="220" y1="389" x2="298" y2="389" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="389" x2="598" y2="389" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ EMA slow update arrow: context encoder UP to target encoder ============ -->
  <path d="M405,352 L405,164" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="112" y="210" width="586" height="52" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="405" y="232" font-size="12" font-weight="bold" text-anchor="middle" fill="#4c1d95">slow EMA update (m near 1.0, e.g. 0.996)</text>
  <text x="405" y="251" font-size="12" text-anchor="middle" fill="#4c1d95">target = m * target + (1 - m) * context</text>

  <!-- ============ PREDICTOR (middle) ============ -->
  <rect x="300" y="470" width="210" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="405" y="498" font-size="14" font-weight="bold" text-anchor="middle" fill="#4c1d95">Predictor</text>
  <text x="405" y="517" font-size="11" text-anchor="middle" fill="#4c1d95">context embedding +</text>
  <text x="405" y="533" font-size="11" text-anchor="middle" fill="#4c1d95">hidden token positions</text>

  <!-- context embedding down into predictor -->
  <path d="M685,418 L685,510 L512,510" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="503" font-size="10" text-anchor="middle" fill="#64748b">+ hidden positions</text>

  <!-- predicted embedding -->
  <rect x="600" y="481" width="170" height="58" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="685" y="505" font-size="13" font-weight="bold" text-anchor="middle" fill="#4c1d95">predicted embedding</text>
  <text x="685" y="524" font-size="11" text-anchor="middle" fill="#7c3aed">the guess</text>

  <line x1="510" y1="510" x2="598" y2="510" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ LOSS (right) ============ -->
  <rect x="795" y="300" width="145" height="238" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="867" y="326" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Loss</text>
  <text x="867" y="352" font-size="11" text-anchor="middle" fill="#7f1d1d">compares</text>
  <text x="867" y="368" font-size="11" text-anchor="middle" fill="#7f1d1d">predicted vs target</text>
  <text x="867" y="392" font-size="11" text-anchor="middle" fill="#7f1d1d">on masked</text>
  <text x="867" y="408" font-size="11" text-anchor="middle" fill="#7f1d1d">positions only</text>
  <line x1="815" y1="424" x2="919" y2="424" stroke="#b91c1c" stroke-width="1"/>
  <text x="867" y="446" font-size="11" font-weight="bold" text-anchor="middle" fill="#7f1d1d">MSE (L2) in</text>
  <text x="867" y="462" font-size="11" font-weight="bold" text-anchor="middle" fill="#7f1d1d">latent space</text>
  <text x="867" y="486" font-size="11" font-weight="bold" text-anchor="middle" fill="#7f1d1d">+ VICReg</text>
  <text x="867" y="506" font-size="10" text-anchor="middle" fill="#b91c1c">variance + covariance</text>
  <text x="867" y="521" font-size="10" text-anchor="middle" fill="#b91c1c">stops collapse</text>

  <!-- target embedding into loss -->
  <path d="M770,125 L905,125 L905,298" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="118" font-size="10" text-anchor="middle" fill="#64748b">target</text>
  <!-- predicted embedding into loss -->
  <line x1="770" y1="512" x2="793" y2="512" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
