<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="56" font-size="30" font-weight="bold" text-anchor="middle" fill="#0f172a">Squeezing a clip into 82 numbers loses the melody</text>
  <text x="640" y="90" font-size="17" text-anchor="middle" fill="#475569">The old approach hand-picks 82 features per clip. Most of the walking cycle never makes it through.</text>

  <!-- ================= LEFT: RICH SIGNAL ================= -->
  <rect x="70" y="140" width="470" height="420" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="305" y="182" font-size="19" font-weight="bold" text-anchor="middle" fill="#1e3a8a">the full walking cycle</text>
  <text x="305" y="208" font-size="15" text-anchor="middle" fill="#475569">every joint, every frame</text>

  <!-- baseline -->
  <line x1="110" y1="370" x2="500" y2="370" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- rich smooth waveform / melody line -->
  <path d="M110,370
           C 140,300 160,300 185,360
           C 210,420 232,300 258,330
           C 284,360 300,250 326,300
           C 352,350 372,440 398,380
           C 424,320 444,320 470,368
           C 486,398 494,398 500,378"
        fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- a lighter overlaid harmony line to feel rich -->
  <path d="M110,410
           C 150,380 180,440 220,400
           C 260,360 300,430 340,400
           C 380,370 420,430 460,405
           C 480,392 494,398 500,398"
        fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <text x="305" y="512" font-size="15" font-style="italic" text-anchor="middle" fill="#1e40af">a full, continuous signal, like a melody</text>

  <!-- ================= ARROW ================= -->
  <line x1="552" y1="350" x2="700" y2="350" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="626" y="324" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">squeeze into</text>
  <text x="626" y="382" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">82 numbers</text>

  <!-- ================= RIGHT: FLATTENED 82 FEATURES ================= -->
  <rect x="712" y="140" width="498" height="420" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="961" y="182" font-size="19" font-weight="bold" text-anchor="middle" fill="#92400e">82 hand features</text>
  <text x="961" y="208" font-size="15" text-anchor="middle" fill="#92400e">avg loudness, tempo... the melody is gone</text>

  <!-- a few flat bars: the compressed leftovers -->
  <g fill="#fed7aa" stroke="#d97706" stroke-width="1.5">
    <rect x="770" y="300" width="60" height="120" rx="4"/>
    <rect x="850" y="340" width="60" height="80" rx="4"/>
    <rect x="930" y="280" width="60" height="140" rx="4"/>
    <rect x="1010" y="360" width="60" height="60" rx="4"/>
    <rect x="1090" y="330" width="60" height="90" rx="4"/>
  </g>
  <line x1="758" y1="420" x2="1162" y2="420" stroke="#d97706" stroke-width="1.5"/>

  <text x="961" y="466" font-size="14" text-anchor="middle" fill="#92400e">just a handful of flat summary numbers</text>
  <text x="961" y="512" font-size="15" font-style="italic" text-anchor="middle" fill="#7f1d1d">the shape of the walk did not survive</text>

  <!-- ================= BOTTOM CAPTION ================= -->
  <text x="640" y="628" font-size="18" font-weight="bold" text-anchor="middle" fill="#0f172a">Like describing a whole song with 82 numbers. You lose the melody.</text>
  <text x="640" y="662" font-size="16" text-anchor="middle" fill="#475569">And every new feature is a person-week of engineering.</text>
</svg>
