<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Block masking over a strip of skeleton frames</text>
  <text x="480" y="55" font-size="13" text-anchor="middle" fill="#475569">Two useful ways to hide pose, and the too-easy baseline we contrast against.</text>

  <!-- =================== STYLE A: limb over time =================== -->
  <rect x="24" y="78" width="912" height="118" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="40" y="102" font-size="13" font-weight="bold" text-anchor="start" fill="#14532d">Style A - limb over time</text>
  <text x="40" y="120" font-size="10.5" text-anchor="start" fill="#475569">hide ONE whole limb (here the left leg) across a window of consecutive frames</text>

  <!-- Frame 1 (visible) -->
  <g transform="translate(96,132)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="10" y2="46" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="-10" y2="46" stroke="#334155" stroke-width="2"/>
  </g>
  <!-- Frame 2 (left leg hidden) -->
  <g transform="translate(236,132)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="11" y2="46" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="-11" y2="46" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Frame 3 (left leg hidden) -->
  <g transform="translate(376,132)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="8" y2="47" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="-8" y2="47" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Frame 4 (left leg hidden) -->
  <g transform="translate(516,132)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="6" y2="47" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="-13" y2="43" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Frame 5 (visible) -->
  <g transform="translate(656,132)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="12" y2="45" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="-12" y2="45" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- masked band bracket for Style A (frames 2..4); label sits below the feet, clear of the heads -->
  <rect x="216" y="126" width="320" height="52" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="376" y="192" font-size="10" text-anchor="middle" fill="#64748b">left leg hidden in these frames</text>

  <!-- legend note on the right for A -->
  <text x="760" y="150" font-size="11" text-anchor="start" fill="#334155">grey = hidden joints</text>
  <text x="760" y="168" font-size="11" text-anchor="start" fill="#334155">dark = visible joints</text>
  <line x1="712" y1="146" x2="748" y2="146" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="712" y1="164" x2="748" y2="164" stroke="#334155" stroke-width="2"/>

  <!-- =================== STYLE B: time window =================== -->
  <rect x="24" y="208" width="912" height="118" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="40" y="232" font-size="13" font-weight="bold" text-anchor="start" fill="#1e3a8a">Style B - time window</text>
  <text x="40" y="250" font-size="10.5" text-anchor="start" fill="#475569">hide ALL 33 joints across a short contiguous window of frames</text>

  <!-- Frame 1 (visible) -->
  <g transform="translate(96,262)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="10" y2="46" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="-10" y2="46" stroke="#334155" stroke-width="2"/>
  </g>
  <!-- Frame 2 (all hidden) -->
  <g transform="translate(236,262)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="11" y2="46" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="-11" y2="46" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Frame 3 (all hidden) -->
  <g transform="translate(376,262)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="8" y2="47" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="-8" y2="47" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Frame 4 (all hidden) -->
  <g transform="translate(516,262)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="6" y2="47" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="26" x2="-13" y2="43" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Frame 5 (visible) -->
  <g transform="translate(656,262)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="5" x2="0" y2="26" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="-12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="10" x2="12" y2="20" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="12" y2="45" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="26" x2="-12" y2="45" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- masked band bracket for Style B (frames 2..4); label sits below the feet, clear of the heads -->
  <rect x="216" y="254" width="320" height="52" rx="6" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="376" y="320" font-size="10" text-anchor="middle" fill="#64748b">whole pose hidden in this window</text>

  <text x="720" y="278" font-size="11" text-anchor="middle" fill="#334155">the model must fill</text>
  <text x="720" y="295" font-size="11" text-anchor="middle" fill="#334155">a gap in time</text>

  <!-- =================== BASELINE: scattered single joints =================== -->
  <rect x="24" y="338" width="600" height="66" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="40" y="360" font-size="12.5" font-weight="bold" text-anchor="start" fill="#7f1d1d">Baseline we contrast against - scattered single joints = too easy</text>
  <text x="40" y="380" font-size="10.5" text-anchor="start" fill="#7f1d1d">a hidden joint is guessable from its own neighbors, so no coordination is learned.</text>

  <!-- tiny stick figure with a few random single joints greyed -->
  <g transform="translate(560,352)">
    <circle cx="0" cy="0" r="4" fill="none" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="4" x2="0" y2="22" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="8" x2="-10" y2="17" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="10" y2="17" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="22" x2="9" y2="40" stroke="#334155" stroke-width="2"/>
    <line x1="0" y1="22" x2="-9" y2="40" stroke="#334155" stroke-width="2"/>
    <circle cx="-9" cy="40" r="3" fill="#cbd5e1"/>
    <circle cx="10" cy="17" r="3" fill="#334155"/>
  </g>

  <!-- takeaway box to the right of baseline -->
  <rect x="644" y="338" width="292" height="66" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text x="790" y="360" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#92400e">Why blocks, not scatter</text>
  <text x="790" y="379" font-size="10.5" text-anchor="middle" fill="#92400e">hiding a whole limb or a whole time window forces</text>
  <text x="790" y="394" font-size="10.5" text-anchor="middle" fill="#92400e">reasoning about coordinated motion, which is walking.</text>
</svg>
