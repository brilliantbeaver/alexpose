<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title / subtitle -->
  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">The two-step big idea</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">Learn the shape of walking from cheap unlabeled video, then spend the scarce labels on a tiny probe</text>

  <!-- ================= LEFT PANEL (blue) ================= -->
  <rect x="30" y="82" width="470" height="410" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="265" y="112" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Step 1: Self-supervised pretraining</text>
  <text x="265" y="132" font-size="12" text-anchor="middle" fill="#1d4ed8">no labels needed</text>

  <!-- big stack of unlabeled clips -->
  <rect x="72" y="170" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="66" y="182" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="60" y="194" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="54" y="206" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="48" y="218" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="42" y="230" width="150" height="34" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="117" y="252" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">thousands of clips</text>

  <text x="120" y="290" font-size="11" text-anchor="middle" fill="#334155">UNLABELED walking clips</text>
  <text x="120" y="306" font-size="11" text-anchor="middle" fill="#334155">(cheap, no doctor)</text>

  <!-- arrow to JEPA box -->
  <line x1="212" y1="247" x2="272" y2="247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- JEPA box -->
  <rect x="278" y="200" width="180" height="94" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="368" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">JEPA learns</text>
  <text x="368" y="252" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">the shape of walking</text>
  <text x="368" y="276" font-size="10" text-anchor="middle" fill="#1d4ed8">predict hidden motion in latent space</text>

  <!-- bottleneck callout (inside left panel, bottom) -->
  <rect x="54" y="340" width="392" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="250" y="366" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">The 68 labels are the bottleneck</text>
  <text x="250" y="390" font-size="11" text-anchor="middle" fill="#7f1d1d">Raw walking video is cheap to collect.</text>
  <text x="250" y="408" font-size="11" text-anchor="middle" fill="#7f1d1d">Clinical labels are slow and expensive.</text>
  <text x="250" y="426" font-size="11" text-anchor="middle" fill="#7f1d1d">The old pipeline could only train on the 68</text>
  <text x="250" y="444" font-size="11" text-anchor="middle" fill="#7f1d1d">labeled rows, wasting all unlabeled pose data.</text>

  <!-- ================= frozen encoder arrow (step 1 -> step 2) ================= -->
  <line x1="458" y1="247" x2="540" y2="247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="462" y="218" width="74" height="24" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="499" y="234" font-size="10" font-weight="bold" text-anchor="middle" fill="#334155">frozen</text>
  <text x="499" y="264" font-size="10" text-anchor="middle" fill="#334155">encoder</text>

  <!-- ================= RIGHT PANEL (green) ================= -->
  <rect x="548" y="82" width="382" height="410" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="739" y="112" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">Step 2: Tiny labeled probe</text>
  <text x="739" y="132" font-size="12" text-anchor="middle" fill="#15803d">reuse the frozen encoder</text>

  <!-- tiny stack of labeled clips -->
  <rect x="600" y="206" width="130" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <rect x="594" y="218" width="130" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <rect x="588" y="230" width="130" height="30" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="653" y="250" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">only 68 clips</text>

  <text x="650" y="298" font-size="11" text-anchor="middle" fill="#334155">LABELED clips</text>
  <text x="650" y="314" font-size="11" text-anchor="middle" fill="#334155">(slow, a doctor</text>
  <text x="650" y="330" font-size="11" text-anchor="middle" fill="#334155">must label each)</text>

  <!-- arrow to classifier -->
  <line x1="726" y1="245" x2="782" y2="245" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- classifier box -->
  <rect x="786" y="212" width="122" height="66" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="847" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">5-class</text>
  <text x="847" y="258" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">classifier</text>

  <!-- right-panel note -->
  <rect x="588" y="368" width="304" height="92" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="740" y="394" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532d">Labels are spent only here</text>
  <text x="740" y="416" font-size="11" text-anchor="middle" fill="#334155">A light linear or MLP probe on top of the</text>
  <text x="740" y="434" font-size="11" text-anchor="middle" fill="#334155">frozen features, using the same 70/30 split</text>
  <text x="740" y="452" font-size="11" text-anchor="middle" fill="#334155">as the prior Random Forest baseline.</text>
</svg>
