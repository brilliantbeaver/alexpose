<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="sans-serif">
  <defs>
    <marker id="wlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Why per-clip splits leak: overlapping windows straddle the train/test line</text>
  <text x="470" y="57" font-size="12.5" text-anchor="middle" fill="#475569">One sequence produces about 7 overlapping windows. If the split unit is the window, siblings land on both sides.</text>

  <!-- Divider between panels -->
  <line x1="470" y1="80" x2="470" y2="430" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ========= LEFT PANEL: per-clip (leaky) ========= -->
  <text x="235" y="94" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">per-clip split (leaky)</text>

  <!-- The one sequence as a strip with overlapping windows -->
  <text x="235" y="122" font-size="11.5" text-anchor="middle" fill="#334155">one sequence, sliding windows</text>

  <!-- sequence rail -->
  <rect x="60" y="132" width="350" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="60" y="126" font-size="10" fill="#64748b">t = 0</text>
  <text x="410" y="126" font-size="10" text-anchor="end" fill="#64748b">t = end</text>

  <!-- 7 overlapping windows drawn as stacked pill rows -->
  <!-- window width ~90, stride ~40, so overlaps are visible -->
  <g>
    <rect x="60" y="152" width="90" height="16" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="105" y="164" font-size="10" text-anchor="middle" fill="#1e3a8a">w1</text>
    <rect x="100" y="172" width="90" height="16" rx="4" fill="#fecaca" stroke="#b91c1c"/>
    <text x="145" y="184" font-size="10" text-anchor="middle" fill="#7f1d1d">w2</text>
    <rect x="140" y="192" width="90" height="16" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="185" y="204" font-size="10" text-anchor="middle" fill="#1e3a8a">w3</text>
    <rect x="180" y="212" width="90" height="16" rx="4" fill="#fecaca" stroke="#b91c1c"/>
    <text x="225" y="224" font-size="10" text-anchor="middle" fill="#7f1d1d">w4</text>
    <rect x="220" y="232" width="90" height="16" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="265" y="244" font-size="10" text-anchor="middle" fill="#1e3a8a">w5</text>
    <rect x="260" y="252" width="90" height="16" rx="4" fill="#fecaca" stroke="#b91c1c"/>
    <text x="305" y="264" font-size="10" text-anchor="middle" fill="#7f1d1d">w6</text>
    <rect x="300" y="272" width="90" height="16" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="345" y="284" font-size="10" text-anchor="middle" fill="#1e3a8a">w7</text>
  </g>

  <!-- TRAIN and TEST bins -->
  <rect x="60" y="308" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="135" y="330" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">TRAIN</text>
  <text x="135" y="348" font-size="10.5" text-anchor="middle" fill="#334155">w1, w3, w5, w7</text>
  <text x="135" y="362" font-size="10.5" text-anchor="middle" fill="#334155">(blue)</text>

  <rect x="260" y="308" width="150" height="60" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="335" y="330" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">TEST</text>
  <text x="335" y="348" font-size="10.5" text-anchor="middle" fill="#334155">w2, w4, w6</text>
  <text x="335" y="362" font-size="10.5" text-anchor="middle" fill="#334155">(red)</text>

  <!-- arrows from windows into bins -->
  <line x1="105" y1="168" x2="115" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>
  <line x1="185" y1="208" x2="155" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>
  <line x1="145" y1="188" x2="305" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>
  <line x1="305" y1="268" x2="320" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>

  <!-- warning -->
  <rect x="55" y="388" width="360" height="34" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="235" y="408" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">windows from one sequence leak across train/test, inflated ~0.88</text>

  <!-- ========= RIGHT PANEL: per-sequence (honest) ========= -->
  <text x="705" y="94" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">per-sequence split (honest)</text>
  <text x="705" y="122" font-size="11.5" text-anchor="middle" fill="#334155">pool the sequence to one vector, then split</text>

  <!-- Show 5 sequences as dots -->
  <g>
    <!-- sequence 1 -->
    <rect x="500" y="146" width="70" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="500" y="141" font-size="9.5" fill="#64748b">seq A</text>
    <!-- mean-pool arrow -->
    <line x1="575" y1="152" x2="595" y2="152" stroke="#334155" stroke-width="1.2" marker-end="url(#wlArrow)"/>
    <circle cx="608" cy="152" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>

    <rect x="500" y="170" width="70" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="500" y="165" font-size="9.5" fill="#64748b">seq B</text>
    <line x1="575" y1="176" x2="595" y2="176" stroke="#334155" stroke-width="1.2" marker-end="url(#wlArrow)"/>
    <circle cx="608" cy="176" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>

    <rect x="500" y="194" width="70" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="500" y="189" font-size="9.5" fill="#64748b">seq C</text>
    <line x1="575" y1="200" x2="595" y2="200" stroke="#334155" stroke-width="1.2" marker-end="url(#wlArrow)"/>
    <circle cx="608" cy="200" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>

    <rect x="500" y="218" width="70" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="500" y="213" font-size="9.5" fill="#64748b">seq D</text>
    <line x1="575" y1="224" x2="595" y2="224" stroke="#334155" stroke-width="1.2" marker-end="url(#wlArrow)"/>
    <circle cx="608" cy="224" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>

    <rect x="500" y="242" width="70" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="500" y="237" font-size="9.5" fill="#64748b">seq E</text>
    <line x1="575" y1="248" x2="595" y2="248" stroke="#334155" stroke-width="1.2" marker-end="url(#wlArrow)"/>
    <circle cx="608" cy="248" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  </g>

  <text x="608" y="278" font-size="10" text-anchor="middle" fill="#64748b">one vector per sequence</text>

  <!-- bins on the right, sequences never straddle -->
  <rect x="660" y="308" width="130" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="725" y="330" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">TRAIN</text>
  <text x="725" y="348" font-size="10.5" text-anchor="middle" fill="#334155">seq A, B, D</text>
  <text x="725" y="362" font-size="10.5" text-anchor="middle" fill="#334155">(3 dots)</text>

  <rect x="800" y="308" width="130" height="60" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  <text x="865" y="330" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">TEST</text>
  <text x="865" y="348" font-size="10.5" text-anchor="middle" fill="#334155">seq C, E</text>
  <text x="865" y="362" font-size="10.5" text-anchor="middle" fill="#334155">(2 dots)</text>

  <!-- clean routing arrows -->
  <line x1="615" y1="152" x2="685" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>
  <line x1="615" y1="176" x2="705" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>
  <line x1="615" y1="200" x2="820" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>
  <line x1="615" y1="224" x2="750" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>
  <line x1="615" y1="248" x2="855" y2="308" stroke="#334155" stroke-width="1" marker-end="url(#wlArrow)" opacity="0.55"/>

  <rect x="500" y="388" width="405" height="34" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="702" y="408" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#14532d">one vector per sequence, no leakage, honest ~0.49</text>

  <!-- ========= FOOTER caption ========= -->
  <rect x="60" y="450" width="820" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="472" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#92400e">the gap between them is window leakage, about 39 points</text>
  <text x="470" y="490" font-size="11.5" text-anchor="middle" fill="#475569">per-clip evaluation memorises within-sequence style; per-sequence evaluation forces generalisation to a new person.</text>
</svg>
