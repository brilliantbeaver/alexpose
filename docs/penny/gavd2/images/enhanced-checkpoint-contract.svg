<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" font-family="Inter, Arial, sans-serif">
  <title id="title">The contract between notebooks 06 and 07</title>
  <desc id="desc">Notebook 06 trains and saves weights plus configuration. Notebook 07 checks identity and shape, loads strictly, freezes the encoder, embeds in small batches, and evaluates by sequence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Notebook 06 and notebook 07 make a promise to each other</text>
  <text x="600" y="70" text-anchor="middle" font-size="16" fill="#475569">The checkpoint must carry both learned numbers and the recipe that gives those numbers meaning.</text>

  <rect x="42" y="128" width="250" height="248" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="167" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Notebook 06</text>
  <text x="167" y="194" text-anchor="middle" font-size="15" fill="#475569">pretrain enhanced JEPA</text>
  <text x="72" y="235" font-size="14" fill="#334155">• 4 layers</text>
  <text x="72" y="263" font-size="14" fill="#334155">• width 128</text>
  <text x="72" y="291" font-size="14" fill="#334155">• 8 heads, FF 512</text>
  <text x="72" y="319" font-size="14" fill="#334155">• 4,000 training steps</text>
  <text x="72" y="347" font-size="14" fill="#334155">• corpus hash recorded</text>

  <rect x="385" y="112" width="430" height="280" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3412">Unique enhanced checkpoint</text>
  <text x="600" y="177" text-anchor="middle" font-size="13" fill="#7c2d12">jepa_encoder_gavd_enhanced_l4_d128_h8_ff4.pt</text>
  <rect x="420" y="205" width="160" height="142" rx="12" fill="#ffffff" stroke="#fb923c"/>
  <text x="500" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">weights</text>
  <text x="500" y="266" text-anchor="middle" font-size="13" fill="#475569">801,920 learned</text>
  <text x="500" y="288" text-anchor="middle" font-size="13" fill="#475569">encoder values</text>
  <text x="500" y="322" text-anchor="middle" font-size="13" fill="#475569">state_dict</text>
  <rect x="620" y="205" width="160" height="142" rx="12" fill="#ffffff" stroke="#fb923c"/>
  <text x="700" y="235" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">configuration</text>
  <text x="700" y="266" text-anchor="middle" font-size="13" fill="#475569">model ID + shapes</text>
  <text x="700" y="288" text-anchor="middle" font-size="13" fill="#475569">training settings</text>
  <text x="700" y="322" text-anchor="middle" font-size="13" fill="#475569">provenance hash</text>

  <rect x="908" y="128" width="250" height="248" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1033" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Notebook 07</text>
  <text x="1033" y="194" text-anchor="middle" font-size="15" fill="#475569">evaluate the frozen encoder</text>
  <text x="938" y="235" font-size="14" fill="#334155">1. check model ID</text>
  <text x="938" y="263" font-size="14" fill="#334155">2. check all shapes</text>
  <text x="938" y="291" font-size="14" fill="#334155">3. load strictly</text>
  <text x="938" y="319" font-size="14" fill="#334155">4. freeze all weights</text>
  <text x="938" y="347" font-size="14" fill="#334155">5. embed in batches of 4</text>

  <line x1="292" y1="252" x2="375" y2="252" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="815" y1="252" x2="898" y2="252" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="290" y="432" width="620" height="58" rx="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="600" y="457" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Real evaluation must stop on a mismatch.</text>
  <text x="600" y="479" text-anchor="middle" font-size="14" fill="#7f1d1d">Silently replacing the checkpoint with random weights would make every later graph invalid.</text>
</svg>
