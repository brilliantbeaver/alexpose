<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="480" fill="#ffffff"/>

  <!-- ================= Title ================= -->
  <text x="550" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">The two attempts, side by side</text>
  <text x="550" y="56" font-size="12.5" text-anchor="middle" fill="#475569">First attempt found four problems. Second attempt fixed each one and made the comparison fair.</text>

  <!-- ================= TOP lane: gavd (first attempt) ================= -->
  <text x="26" y="104" font-size="14" font-weight="bold" text-anchor="start" fill="#b91c1c">gavd (first attempt)</text>

  <!-- start box: full pipeline built -->
  <rect x="24" y="118" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="99" y="140" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#334155">Built pipeline</text>
  <text x="99" y="158" font-size="11.5" text-anchor="middle" fill="#475569">notebooks 00 to 05</text>

  <!-- arrow into the bug chain -->
  <line x1="178" y1="144" x2="206" y2="144" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Bug 1 -->
  <rect x="210" y="118" width="176" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="298" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">Bug 1</text>
  <text x="298" y="158" font-size="11.5" text-anchor="middle" fill="#7f1d1d">silent synthetic cache</text>

  <line x1="390" y1="144" x2="410" y2="144" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Bug 2 -->
  <rect x="414" y="118" width="176" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="502" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">Bug 2</text>
  <text x="502" y="158" font-size="11.5" text-anchor="middle" fill="#7f1d1d">bag of points, no order</text>

  <line x1="594" y1="144" x2="614" y2="144" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Bug 3 -->
  <rect x="618" y="118" width="176" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="706" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">Bug 3</text>
  <text x="706" y="158" font-size="11.5" text-anchor="middle" fill="#7f1d1d">loss drifts up</text>

  <line x1="798" y1="144" x2="818" y2="144" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Bug 4 (bigger honesty chip) -->
  <rect x="822" y="112" width="254" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="949" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">Bug 4: window leakage</text>
  <text x="949" y="150" font-size="11.5" text-anchor="middle" fill="#7f1d1d">inflated the headline</text>
  <text x="949" y="167" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">0.88 vs honest 0.49</text>

  <!-- ================= Down connectors: each bug maps to its fix ================= -->
  <line x1="298" y1="174" x2="298" y2="288" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="502" y1="174" x2="502" y2="288" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="706" y1="174" x2="706" y2="288" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="949" y1="180" x2="949" y2="288" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <text x="1090" y="234" font-size="11" text-anchor="end" fill="#64748b">each fix answers one bug</text>

  <!-- ================= BOTTOM lane: gavd2 (second attempt) ================= -->
  <text x="26" y="284" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">gavd2 (second attempt)</text>

  <!-- Fix 1 (under Bug 1) -->
  <rect x="210" y="292" width="176" height="52" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="298" y="314" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">Fix 1</text>
  <text x="298" y="332" font-size="11.5" text-anchor="middle" fill="#166534">exact-68 lock, fail-stop</text>

  <line x1="390" y1="318" x2="410" y2="318" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Fix 2 (under Bug 2) -->
  <rect x="414" y="292" width="176" height="52" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="502" y="314" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">Fix 2</text>
  <text x="502" y="332" font-size="11.5" text-anchor="middle" fill="#166534">per-sequence eval</text>

  <line x1="594" y1="318" x2="614" y2="318" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Fix 3 (under Bug 3) -->
  <rect x="618" y="292" width="176" height="52" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="706" y="314" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">Fix 3</text>
  <text x="706" y="332" font-size="11.5" text-anchor="middle" fill="#166534">video-level leak control</text>

  <line x1="798" y1="318" x2="818" y2="318" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Fix 4 (under Bug 4) -->
  <rect x="822" y="292" width="254" height="52" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="949" y="314" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803d">Fix 4</text>
  <text x="949" y="332" font-size="11.5" text-anchor="middle" fill="#166534">matched RF probe, id hash</text>

  <!-- start box aligned under pipeline -->
  <rect x="24" y="292" width="150" height="52" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="99" y="314" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#15803d">Same pipeline</text>
  <text x="99" y="332" font-size="11.5" text-anchor="middle" fill="#166534">rebuilt honestly</text>
  <line x1="178" y1="318" x2="206" y2="318" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- arrow from fix chain down into the result banner -->
  <line x1="550" y1="352" x2="550" y2="392" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= Final result banner ================= -->
  <rect x="150" y="396" width="800" height="62" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="550" y="422" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#15803d">Honest result: per-sequence 0.49 to 0.63</text>
  <text x="550" y="444" font-size="12" text-anchor="middle" fill="#166534">RF on exp5 exact split 0.619, versus the 0.762 hand-feature baseline (chance 0.20)</text>
</svg>
