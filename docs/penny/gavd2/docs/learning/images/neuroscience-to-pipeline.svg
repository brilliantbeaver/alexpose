<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <!-- Title + subtitle -->
  <text x="490" y="36" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">From Penny's clinical map into the code, in three places</text>
  <text x="490" y="60" font-size="13" text-anchor="middle" fill="#475569">Two clinical axes graded by neuroscience shape the masking, the probes, and how we read the errors.</text>

  <!-- ================= LEFT: Penny's clinical map ================= -->
  <text x="60" y="98" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">Penny's clinical map</text>
  <text x="60" y="116" font-size="11.5" text-anchor="start" fill="#64748b">gait/neuroscience/</text>

  <!-- AXIS 1 box -->
  <rect x="46" y="140" width="288" height="140" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="66" y="166" font-size="13" font-weight="bold" text-anchor="start" fill="#1e3a8a">Axis 1: Left vs right asymmetry</text>
  <text x="66" y="190" font-size="11.5" text-anchor="start" fill="#334155">Stroke: stiff-knee gait,</text>
  <text x="66" y="207" font-size="11.5" text-anchor="start" fill="#334155">one-sided brain injury.</text>
  <text x="66" y="231" font-size="11.5" text-anchor="start" fill="#334155">Parkinson's: often begins on</text>
  <text x="66" y="248" font-size="11.5" text-anchor="start" fill="#334155">one side first.</text>
  <text x="66" y="269" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1e3a8a">16 of 20 had hip asymmetry.</text>

  <!-- AXIS 2 box -->
  <rect x="46" y="300" width="288" height="120" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="66" y="326" font-size="13" font-weight="bold" text-anchor="start" fill="#14532d">Axis 2: Reduced range, short stride</text>
  <text x="66" y="350" font-size="11.5" text-anchor="start" fill="#334155">Parkinson's: shuffling gait,</text>
  <text x="66" y="367" font-size="11.5" text-anchor="start" fill="#334155">greatly reduced stride.</text>
  <text x="66" y="391" font-size="11.5" text-anchor="start" fill="#334155">Myopathic: weak muscles,</text>
  <text x="66" y="408" font-size="11.5" text-anchor="start" fill="#334155">short steps.</text>

  <!-- hub bar tying both axes to the three arrows -->
  <line x1="342" y1="210" x2="372" y2="210" stroke="#334155" stroke-width="2"/>
  <line x1="342" y1="360" x2="372" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="372" y1="210" x2="372" y2="360" stroke="#334155" stroke-width="2"/>

  <!-- three arrows from the hub to the three boxes (no crossings) -->
  <line x1="372" y1="215" x2="588" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="372" y1="285" x2="588" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="372" y1="355" x2="588" y2="450" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= RIGHT: three pipeline boxes ================= -->

  <!-- PLACE 1 -->
  <rect x="590" y="106" width="352" height="118" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="608" y="130" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1e3a8a">1. Masking (nb04, Style A)</text>
  <text x="608" y="152" font-size="11.5" text-anchor="start" fill="#334155">Hide one WHOLE leg across time.</text>
  <text x="608" y="171" font-size="11.5" text-anchor="start" fill="#334155">The model must rebuild it from</text>
  <text x="608" y="190" font-size="11.5" text-anchor="start" fill="#334155">the OTHER leg.</text>
  <text x="608" y="212" font-size="11.5" font-weight="bold" text-anchor="start" fill="#1e3a8a">= the left vs right comparison.</text>

  <!-- PLACE 2 -->
  <rect x="590" y="256" width="352" height="140" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="608" y="280" font-size="12.5" font-weight="bold" text-anchor="start" fill="#14532d">2. Clinical probes (nb05, RQ3)</text>
  <text x="608" y="302" font-size="11.5" text-anchor="start" fill="#334155">Probe two scalars from the frozen</text>
  <text x="608" y="321" font-size="11.5" text-anchor="start" fill="#334155">latent, with no labels used:</text>
  <text x="608" y="345" font-size="11.5" font-weight="bold" text-anchor="start" fill="#14532d">step_amplitude: R2 = 0.682</text>
  <text x="608" y="366" font-size="11.5" text-anchor="start" fill="#334155">(avg ankle swing, joints 27 and 28)</text>
  <text x="608" y="388" font-size="11.5" font-weight="bold" text-anchor="start" fill="#166534">asymmetry_index: R2 = 0.081</text>

  <!-- PLACE 3 -->
  <rect x="590" y="428" width="352" height="110" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="608" y="452" font-size="12.5" font-weight="bold" text-anchor="start" fill="#92400e">3. Confusion matrix (nb05)</text>
  <text x="608" y="474" font-size="11.5" text-anchor="start" fill="#334155">Clinical reasoning checks the</text>
  <text x="608" y="493" font-size="11.5" text-anchor="start" fill="#334155">mistakes are sensible: CP is</text>
  <text x="608" y="512" font-size="11.5" text-anchor="start" fill="#334155">confused with myopathic because</text>
  <text x="608" y="531" font-size="11.5" text-anchor="start" fill="#334155">both alter load-bearing.</text>

</svg>
