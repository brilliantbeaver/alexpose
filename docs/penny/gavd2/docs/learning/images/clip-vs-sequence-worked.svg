<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Per-clip versus per-sequence: one walk, two ways to score</text>
  <text x="490" y="55" font-size="13" text-anchor="middle" fill="#475569">The same encoder, the same data. Only the way we split train and test changes the number.</text>

  <!-- ONE WALK -> WINDOWS -->
  <text x="60" y="92" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">One stroke sequence (one continuous walk)</text>
  <rect x="60" y="102" width="500" height="30" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="310" y="122" font-size="11" text-anchor="middle" fill="#475569">frames 0 ................................................................ 220</text>

  <text x="60" y="156" font-size="12" text-anchor="start" fill="#475569">cut into short OVERLAPPING windows (neighbors share most of their frames):</text>
  <!-- overlapping window bars -->
  <rect x="60"  y="166" width="150" height="18" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="135" y="179" font-size="9.5" text-anchor="middle" fill="#1e3a8a">window A</text>
  <rect x="130" y="188" width="150" height="18" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="205" y="201" font-size="9.5" text-anchor="middle" fill="#1e3a8a">window B</text>
  <rect x="200" y="210" width="150" height="18" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="275" y="223" font-size="9.5" text-anchor="middle" fill="#1e3a8a">window C</text>
  <rect x="270" y="232" width="150" height="18" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="345" y="245" font-size="9.5" text-anchor="middle" fill="#1e3a8a">window D</text>
  <text x="600" y="210" font-size="11" text-anchor="start" fill="#7f1d1d">windows A and B share</text>
  <text x="600" y="226" font-size="11" text-anchor="start" fill="#7f1d1d">most of the same frames,</text>
  <text x="600" y="242" font-size="11" text-anchor="start" fill="#7f1d1d">so they look almost identical.</text>

  <!-- divider -->
  <line x1="40" y1="276" x2="940" y2="276" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ LEFT: PER-CLIP (leaky) ============ -->
  <rect x="40" y="292" width="435" height="238" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="257" y="316" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Per-clip split (the leaky way)</text>
  <text x="257" y="335" font-size="10.5" text-anchor="middle" fill="#7f1d1d">split the windows at random, ignoring which walk they came from</text>

  <text x="70" y="366" font-size="11.5" font-weight="bold" text-anchor="start" fill="#334155">TRAIN</text>
  <rect x="70" y="374" width="150" height="18" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="145" y="387" font-size="9.5" text-anchor="middle" fill="#1e3a8a">window A</text>
  <rect x="70" y="396" width="150" height="18" rx="4" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="145" y="409" font-size="9.5" text-anchor="middle" fill="#1e3a8a">window C</text>

  <text x="295" y="366" font-size="11.5" font-weight="bold" text-anchor="start" fill="#334155">TEST</text>
  <rect x="295" y="374" width="150" height="18" rx="4" fill="#fecaca" stroke="#b91c1c"/>
  <text x="370" y="387" font-size="9.5" text-anchor="middle" fill="#7f1d1d">window B</text>
  <rect x="295" y="396" width="150" height="18" rx="4" fill="#fecaca" stroke="#b91c1c"/>
  <text x="370" y="409" font-size="9.5" text-anchor="middle" fill="#7f1d1d">window D</text>

  <!-- leak arrow A(train) -> B(test) -->
  <path d="M220,383 C255,383 262,383 293,383" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="257" y="432" font-size="10" text-anchor="middle" fill="#b91c1c">test window B is almost a copy of train window A</text>
  <text x="257" y="448" font-size="10" text-anchor="middle" fill="#b91c1c">so the model wins by remembering, not by learning gait</text>

  <rect x="70" y="464" width="375" height="46" rx="6" fill="#fff1f2" stroke="#b91c1c"/>
  <text x="257" y="484" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">score looks great: about 0.87 to 0.92</text>
  <text x="257" y="501" font-size="10.5" text-anchor="middle" fill="#b91c1c">inflated, NOT comparable to the baseline</text>

  <!-- ============ RIGHT: PER-SEQUENCE (honest) ============ -->
  <rect x="505" y="292" width="435" height="238" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="722" y="316" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">Per-sequence split (the honest way)</text>
  <text x="722" y="335" font-size="10.5" text-anchor="middle" fill="#14532d">average a walk's windows into ONE vector, keep whole walks on one side</text>

  <!-- pooled vector -->
  <text x="535" y="368" font-size="10.5" text-anchor="start" fill="#334155">A + B + C + D pooled into one per-walk vector:</text>
  <rect x="535" y="376" width="26" height="20" rx="3" fill="#bbf7d0" stroke="#15803d"/>
  <rect x="562" y="376" width="26" height="20" rx="3" fill="#86efac" stroke="#15803d"/>
  <rect x="589" y="376" width="26" height="20" rx="3" fill="#bbf7d0" stroke="#15803d"/>
  <rect x="616" y="376" width="26" height="20" rx="3" fill="#4ade80" stroke="#15803d"/>
  <rect x="643" y="376" width="26" height="20" rx="3" fill="#bbf7d0" stroke="#15803d"/>
  <text x="690" y="391" font-size="10.5" text-anchor="start" fill="#14532d">one vector = one walk</text>

  <text x="535" y="424" font-size="11" text-anchor="start" fill="#334155">whole walks go to TRAIN or TEST, never both.</text>
  <text x="535" y="442" font-size="11" text-anchor="start" fill="#334155">the test walk was never seen in any form, so the</text>
  <text x="535" y="458" font-size="11" text-anchor="start" fill="#334155">score reflects real transfer to a new person's walk.</text>

  <rect x="535" y="464" width="375" height="46" rx="6" fill="#ecfdf5" stroke="#15803d"/>
  <text x="722" y="484" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">honest score: about 0.49 to 0.63</text>
  <text x="722" y="501" font-size="10.5" text-anchor="middle" fill="#15803d">smaller but real, and comparable to the 0.762 baseline</text>

  <!-- bottom takeaway -->
  <text x="490" y="548" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#d97706">The 30 to 40 point drop from left to right is the leak being removed, not the model getting worse.</text>
</svg>
