<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning about gait from video · AlexPose</title>
<style>
:root {
  color-scheme:light;
  --ink:#142f42;
  --navy:#1f3864;
  --muted:#485f6e;
  --green:#006d60;
  --line:#cddadd;
  --paper:#fbfaf6;
  --blue:#285d92;
  --pad:clamp(18px,4vw,64px);
}
* {
  box-sizing:border-box;
}
html {
  scroll-padding-top:18px;
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:17px/1.64 'Source Sans 3',Calibri,'Segoe UI',Arial,sans-serif;
}
.bar {
  background:var(--navy);
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px var(--pad);
  gap:12px;
}
.brand {
  font:600 18px/1.3 Georgia,serif;
}
.bar a {
  color:white;
  text-decoration:none;
  border-bottom:1px solid #a7bfd0;
  font-size:15px;
}
.bar div {
  display:flex;
  gap:24px;
}
.shell {
  display:grid;
  grid-template-columns:210px minmax(0,880px);
  gap:clamp(30px,5vw,86px);
  max-width:1330px;
  padding:48px var(--pad) 65px;
  margin:auto;
}
.menu {
  position:sticky;
  top:24px;
  align-self:start;
}
.menu h2 {
  font-size:14px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 14px;
}
.menu a {
  display:flex;
  color:var(--ink);
  text-decoration:none;
  border-top:1px solid var(--line);
  padding:13px 6px;
  gap:10px;
  align-items:baseline;
  line-height:1.3;
  font-size:16px;
}
.menu a span {
  font:12px/1.5 monospace;
  color:var(--muted);
  min-width:42px;
}
.menu a[aria-current=page] {
  font-weight:700;
  color:var(--green);
  border-left:3px solid var(--green);
  padding-left:9px;
  background:#e9f3ee;
}
.menu a:hover,.next:hover {
  background:#edf3f1;
}
.menu small {
  display:block;
  color:var(--muted);
  margin-top:17px;
}
.paper {
  min-width:0;
}
h1,h2,h3 {
  line-height:1.15;
  text-wrap:balance;
}
h1 {
  font:normal clamp(38px,5.25vw,70px)/1.04 Georgia,'Times New Roman',serif;
  letter-spacing:-.045em;
  margin:0 0 22px;
  color:var(--navy);
}
h2 {
  font:normal clamp(27px,3vw,38px)/1.18 Georgia,serif;
  margin:45px 0 13px;
  letter-spacing:-.025em;
}
h3 {
  font-size:22px;
  margin:32px 0 12px;
}
p,li {
  max-width:78ch;
}
a {
  color:#075c78;
  text-underline-offset:3px;
}
a:hover {
  text-decoration-thickness:2px;
}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible {
  outline:3px solid #ac501a;
  outline-offset:4px;
}
p {
  margin:11px 0 18px;
}
li+li {
  margin-top:7px;
}
table {
  border-collapse:collapse;
  width:100%;
  font-size:15px;
  line-height:1.45;
  background:#fff;
}
td,th {
  text-align:left;
  vertical-align:top;
  border-bottom:1px solid var(--line);
  padding:10px;
}
th {
  background:#edf2f2;
  color:var(--navy);
}
.tablewrap {
  overflow-x:auto;
}
code {
  font-size:.85em;
  overflow-wrap:anywhere;
  background:#e9efed;
  padding:1px 4px;
}
pre {
  overflow:auto;
  background:#e9efed;
  padding:16px;
  line-height:1.5;
}
pre code {
  padding:0;
}
figure {
  margin:25px 0;
  background:white;
  border-block:1px solid var(--line);
  padding:16px 10px 13px;
}
figure svg {
  max-width:100%;
  height:auto;
  width:100%;
  display:block;
}
figcaption {
  color:var(--muted);
  font-size:15px;
  margin:12px 12px 2px;
}
.lesson>[data-lead] {
  font-size:1.1em;
}
.lab {
  margin:22px 0 32px;
  border:1px solid #b7cdc8;
  background:#f1f7f3;
  border-radius:12px;
  padding:clamp(16px,2.5vw,30px);
}
.lab h2,.quiz h2 {
  font:bold 23px/1.25 'Source Sans 3',Calibri,Arial,sans-serif;
  margin:0 0 7px;
  letter-spacing:-.02em;
}
.lab p,.quiz p {
  margin:8px 0 12px;
}
.choices {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0;
}
button,select {
  cursor:pointer;
  font:inherit;
  line-height:1.3;
  border-radius:5px;
  padding:8px 13px;
  background:white;
  border:1px solid #92a7a9;
  color:var(--ink);
}
button[aria-pressed=true],.next.primary {
  background:var(--green);
  border-color:var(--green);
  color:white;
}
label[for] {
  font-weight:600;
}
input[type=range] {
  width:min(340px,90%);
  accent-color:var(--green);
  vertical-align:middle;
}
.readout {
  background:#fff;
  padding:12px 15px;
  border-left:3px solid var(--green);
  margin-top:16px;
  color:var(--ink);
}
.strip {
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.strip+.strip {
  margin-top:6px;
}
.strip b {
  width:65px;
}
.chip {
  padding:3px 11px;
  background:#dfebf7;
  border:1px solid #95aec9;
  border-radius:3px;
  font:600 15px/1.5 monospace;
}
.chip.b {
  background:#d9eee8;
  border-color:#77ae9f;
  border-radius:12px;
}
.maskgrid {
  display:grid;
  gap:5px;
  grid-template-columns:65px repeat(4,minmax(32px,1fr));
  align-items:center;
  max-width:520px;
  font-size:15px;
}
.maskgrid button {
  padding:9px 3px;
  min-height:38px;
}
.maskgrid button:disabled {
  color:#617075;
  background:repeating-linear-gradient(135deg,#e8ebec 0px,#e8ebec 4px,#fff 4px,#fff 8px);
  cursor:default;
}
.axis {
  text-align:center;
}
.lab svg.plot {
  display:block;
  width:100%;
  max-width:620px;
  height:auto;
}
.footnav {
  margin:40px 0 0;
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.next {
  text-decoration:none;
  padding:8px 15px;
  border-radius:5px;
}
.quiz {
  border-top:1px solid var(--line);
  padding-top:25px;
  margin:36px 0 0;
}
.jump {
  margin:18px 0;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-size:15px;
}
.jump select {
  max-width:100%;
}
.skip {
  position:absolute;
  left:8px;
  top:-100px;
  background:white;
  z-index:20;
  padding:10px;
}
.skip:focus {
  top:5px;
}
.chaptercode {
  font-size:13px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--green);
  font-weight:700;
  margin:0 0 12px;
}
button[hidden],[hidden] {
  display:none!important;
}
.muted {
  color:var(--muted);
}
@media(max-width:820px) {
  .shell {
    display:block;
    padding-top:22px;
  }
  .menu {
    position:static;
    margin:0 0 27px;
  }
  .menu h2,.menu small {
    display:none;
  }
  .menu nav {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 8px;
  }
  .menu a {
    font-size:14px;
    align-items:center;
    padding:9px 3px;
  }
  .menu a span {
    min-width:35px;
  }
  .bar {
    padding:12px 18px;
  }
  .bar div {
    gap:13px;
  }
  .brand {
    font-size:15px;
  }
  .bar a {
    font-size:14px;
  }
  .chaptercode {
    margin-top:14px;
  }
}
@media(max-width:480px) {
  body {
    font-size:16px;
  }
  .shell {
    padding-inline:15px;
  }
  .brand {
    max-width:135px;
  }
  .bar div {
    gap:10px;
  }
  td,th {
    padding:7px;
    font-size:14px;
  }
  .maskgrid {
    grid-template-columns:46px repeat(4,minmax(24px,1fr));
  }
  .maskgrid button {
    font-size:13px;
  }
  .jump select {
    width:100%;
  }
  .lab {
    padding:14px;
  }
}
@media print {
  .menu,.bar,.choices,.quiz,.footnav,.jump,.skip,.lab {
    display:none;
  }
  .shell {
    display:block;
    padding:0;
  }
  .lesson[hidden] {
    display:block!important;
  }
  .lesson {
    break-before:page;
  }
  figure,table,h2,h3 {
    break-inside:avoid;
  }
}
</style></head>

<nav aria-label="Lessons">%%NAV%%</nav>

</aside>

</div>
<script>%%SCRIPT%%</script>
</body>
</html>
