<svg xmlns="http://www.w3.org/2000/svg" width="760" height="287" viewBox="0 0 760 287" role="img" aria-labelledby="title desc"><title id="title">Four example pairs for AUROC</title><desc id="desc">Normal scores are 1 and 4. Abnormal scores are 3 and 5. Scores 3 and 5 both beat 1, and 5 beats 4. Three of the four pairs are ranked correctly, yielding AUROC 0.75.</desc><rect x="0" y="0" width="760" height="287" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="16" y="34" fill="#1f3864" font-family="Calibri,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Which score is higher?</text><text x="454" y="34" fill="#1f3864" font-family="Calibri,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start">Abnormal example</text><text x="499" y="80" fill="#1f3864" font-family="Calibri,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Score 3</text><text x="636" y="80" fill="#1f3864" font-family="Calibri,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Score 5</text><text x="20" y="140" fill="#405562" font-family="Calibri,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Normal example: score 1</text><rect x="442" y="109" width="115" height="50" rx="5" fill="#e7f2ed" stroke="#00776b" stroke-width="2"/><text x="500" y="142" fill="#00776b" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">3 &gt; 1</text><rect x="579" y="109" width="115" height="50" rx="5" fill="#e7f2ed" stroke="#00776b" stroke-width="2"/><text x="637" y="142" fill="#00776b" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">5 &gt; 1</text><text x="20" y="208" fill="#405562" font-family="Calibri,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start">Normal example: score 4</text><rect x="442" y="177" width="115" height="50" rx="5" fill="#faf0e9" stroke="#a24725" stroke-width="2"/><text x="500" y="210" fill="#a24725" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">3 &lt; 4</text><rect x="579" y="177" width="115" height="50" rx="5" fill="#e7f2ed" stroke="#00776b" stroke-width="2"/><text x="637" y="210" fill="#00776b" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">5 &gt; 4</text><text x="20" y="266" fill="#1f3864" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">The abnormal example scores higher in 3 of 4 pairs.</text></svg>
