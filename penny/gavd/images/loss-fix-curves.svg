<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
  <text x="480" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">The loss-drift bug and its fix</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#475569">Same JEPA, two loss recipes over 400 steps: the original drifts up, the fixed loss falls monotonically.</text>

  <!-- ================= LEFT PLOT ================= -->
  <!-- panel title -->
  <text x="270" y="86" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Original loss (VICReg on target, raw L2, heavy weights)</text>

  <!-- plot frame: x 100..440, y 110..320 -->
  <!-- gridlines -->
  <line x1="100" y1="110" x2="440" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="163" x2="440" y2="163" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="215" x2="440" y2="215" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="100" y1="268" x2="440" y2="268" stroke="#e2e8f0" stroke-width="1"/>

  <!-- axes -->
  <line x1="100" y1="110" x2="100" y2="320" stroke="#334155" stroke-width="2"/>
  <line x1="100" y1="320" x2="440" y2="320" stroke="#334155" stroke-width="2"/>

  <!-- y tick labels: total loss, range 40 (bottom, y=320) to 65 (top, y=110) -->
  <text x="92" y="114" font-size="10.5" text-anchor="end" fill="#64748b">65</text>
  <text x="92" y="167" font-size="10.5" text-anchor="end" fill="#64748b">58</text>
  <text x="92" y="219" font-size="10.5" text-anchor="end" fill="#64748b">52</text>
  <text x="92" y="272" font-size="10.5" text-anchor="end" fill="#64748b">46</text>
  <text x="92" y="324" font-size="10.5" text-anchor="end" fill="#64748b">40</text>

  <!-- x tick labels: training steps 0..400 -->
  <text x="100" y="337" font-size="10.5" text-anchor="middle" fill="#64748b">0</text>
  <text x="270" y="337" font-size="10.5" text-anchor="middle" fill="#64748b">200</text>
  <text x="440" y="337" font-size="10.5" text-anchor="middle" fill="#64748b">400</text>

  <!-- axis titles -->
  <text x="270" y="356" font-size="11.5" text-anchor="middle" fill="#475569">training steps</text>
  <text x="66" y="215" font-size="11.5" text-anchor="middle" fill="#475569" transform="rotate(-90 66 215)">total loss</text>

  <!-- curve: dips for ~50 steps then RISES 46 -> 62.
       y map: loss L -> 320 - (L-40)*8.4 ; step s -> 100 + s*0.85
       start ~46 (y=270), dip to ~44.5 at step 50 (y=282), rise to ~62 at 400 (y=135) -->
  <polyline fill="none" stroke="#b91c1c" stroke-width="2.5"
    points="100,270 121,278 143,282 164,281 185,277 228,268 270,252 313,231 355,201 398,166 440,135"/>

  <!-- note in the clear upper-left region, with a short arrow pointing at the rising tail -->
  <text x="116" y="128" font-size="10.5" text-anchor="start" fill="#92400e">MSE rises 0.36 -&gt; 0.47,</text>
  <text x="116" y="143" font-size="10.5" text-anchor="start" fill="#92400e">embedding std inflating</text>
  <line x1="250" y1="150" x2="352" y2="196" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= RIGHT PLOT ================= -->
  <!-- panel title -->
  <text x="700" y="86" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Fixed loss (LayerNorm target, online-only VICReg, light weights)</text>

  <!-- plot frame: x 540..880, y 110..320 -->
  <!-- gridlines -->
  <line x1="540" y1="110" x2="880" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="540" y1="163" x2="880" y2="163" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="540" y1="215" x2="880" y2="215" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="540" y1="268" x2="880" y2="268" stroke="#e2e8f0" stroke-width="1"/>

  <!-- axes -->
  <line x1="540" y1="110" x2="540" y2="320" stroke="#334155" stroke-width="2"/>
  <line x1="540" y1="320" x2="880" y2="320" stroke="#334155" stroke-width="2"/>

  <!-- y tick labels: total loss, range 4 (bottom, y=320) to 14 (top, y=110) -->
  <text x="532" y="114" font-size="10.5" text-anchor="end" fill="#64748b">14</text>
  <text x="532" y="167" font-size="10.5" text-anchor="end" fill="#64748b">11.5</text>
  <text x="532" y="219" font-size="10.5" text-anchor="end" fill="#64748b">9</text>
  <text x="532" y="272" font-size="10.5" text-anchor="end" fill="#64748b">6.5</text>
  <text x="532" y="324" font-size="10.5" text-anchor="end" fill="#64748b">4</text>

  <!-- x tick labels -->
  <text x="540" y="337" font-size="10.5" text-anchor="middle" fill="#64748b">0</text>
  <text x="710" y="337" font-size="10.5" text-anchor="middle" fill="#64748b">200</text>
  <text x="880" y="337" font-size="10.5" text-anchor="middle" fill="#64748b">400</text>

  <!-- axis titles -->
  <text x="710" y="356" font-size="11.5" text-anchor="middle" fill="#475569">training steps</text>
  <text x="506" y="215" font-size="11.5" text-anchor="middle" fill="#475569" transform="rotate(-90 506 215)">total loss</text>

  <!-- curve: falls monotonically 12.8 -> 6.0.
       y map: loss L -> 320 - (L-4)*21 ; step s -> 540 + s*0.85
       12.8 -> y=135 ; 6.0 -> y=278 -->
  <polyline fill="none" stroke="#15803d" stroke-width="2.5"
    points="540,135 583,161 625,183 668,202 710,218 753,232 795,246 838,262 880,278"/>

  <!-- note near the falling tail -->
  <text x="872" y="150" font-size="10.5" text-anchor="end" fill="#14532d">MSE falls</text>
  <text x="872" y="165" font-size="10.5" text-anchor="end" fill="#14532d">0.24 -&gt; 0.23,</text>
  <text x="872" y="180" font-size="10.5" text-anchor="end" fill="#14532d">context std steady</text>
  <text x="872" y="195" font-size="10.5" text-anchor="end" fill="#14532d">~0.37 (no collapse)</text>

  <!-- divider between panels -->
  <line x1="480" y1="86" x2="480" y2="320" stroke="#e2e8f0" stroke-width="1"/>

  <!-- footer takeaway -->
  <text x="480" y="384" font-size="11.5" text-anchor="middle" fill="#334155">Rising MSE with rising embedding std is the tell: normalize the target, regularize the online side only, keep VICReg light.</text>
</svg>
