<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="sans-serif">
  <defs>
    <marker id="e68Arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="620" fill="#ffffff"/>
  <text x="470" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Locking the labelled set to exactly the exp5 68</text>
  <text x="470" y="57" font-size="12.5" text-anchor="middle" fill="#475569">A three-tier resolver picks the SAME 68 sequences the Random Forest trained on. REAL runs fail-stop if all three fail.</text>

  <!-- ============ Tier 1 ============ -->
  <rect x="180" y="90" width="580" height="82" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="116" font-size="13" font-weight="bold" fill="#1e3a8a">Tier 1: unpickle exp5 all82_features.pkl</text>
  <text x="200" y="136" font-size="11.5" fill="#334155">read the exp5 artefact directly: (sample_id, label, ORDER) tuples</text>
  <text x="200" y="154" font-size="11" fill="#64748b">preserves row ordering so the seed-42 split lines up bit-for-bit</text>

  <!-- arrow to Tier 2 -->
  <line x1="470" y1="172" x2="470" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#e68Arrow)"/>
  <text x="490" y="196" font-size="10.5" fill="#64748b">fallback if pkl missing</text>

  <!-- ============ Tier 2 ============ -->
  <rect x="180" y="216" width="580" height="82" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="200" y="242" font-size="13" font-weight="bold" fill="#1e3a8a">Tier 2: glob the 5 curated exp4/data folders</text>
  <text x="200" y="262" font-size="11.5" fill="#334155">scan normal/parkinsons/stroke/cerebralpalsy/myopathic -> 68 CSV stems</text>
  <text x="200" y="280" font-size="11" fill="#64748b">each stem becomes a sample_id; folder name becomes the label</text>

  <!-- arrow to Tier 3 -->
  <line x1="470" y1="298" x2="470" y2="336" stroke="#334155" stroke-width="2" marker-end="url(#e68Arrow)"/>
  <text x="490" y="322" font-size="10.5" fill="#64748b">fallback if folders missing (e.g. Colab)</text>

  <!-- ============ Tier 3 ============ -->
  <rect x="180" y="342" width="580" height="82" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="368" font-size="13" font-weight="bold" fill="#5b21b6">Tier 3: checked-in CANONICAL_68 constant</text>
  <text x="200" y="388" font-size="11.5" fill="#334155">a Python list of the 68 (sample_id, label) pairs, versioned in the repo</text>
  <text x="200" y="406" font-size="11" fill="#64748b">last resort for a fresh Colab kernel with no local exp5 artefacts</text>

  <!-- Side note about fail-stop -->
  <rect x="780" y="90" width="146" height="334" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="853" y="116" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">REAL run</text>
  <text x="853" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">fail-stops</text>
  <text x="853" y="152" font-size="11" text-anchor="middle" fill="#334155">if all three</text>
  <text x="853" y="168" font-size="11" text-anchor="middle" fill="#334155">tiers fail.</text>
  <text x="853" y="196" font-size="11" text-anchor="middle" fill="#475569">no silent</text>
  <text x="853" y="212" font-size="11" text-anchor="middle" fill="#475569">first-N fallback,</text>
  <text x="853" y="228" font-size="11" text-anchor="middle" fill="#475569">no synthetic</text>
  <text x="853" y="244" font-size="11" text-anchor="middle" fill="#475569">labels, no</text>
  <text x="853" y="260" font-size="11" text-anchor="middle" fill="#475569">reshuffling.</text>
  <text x="853" y="290" font-size="11" text-anchor="middle" fill="#334155">the labelled</text>
  <text x="853" y="306" font-size="11" text-anchor="middle" fill="#334155">set either</text>
  <text x="853" y="322" font-size="11" text-anchor="middle" fill="#334155">matches exp5</text>
  <text x="853" y="338" font-size="11" text-anchor="middle" fill="#334155">exactly, or</text>
  <text x="853" y="354" font-size="11" text-anchor="middle" fill="#334155">the notebook</text>
  <text x="853" y="370" font-size="11" text-anchor="middle" fill="#334155">refuses to run.</text>

  <!-- arrow down to output -->
  <line x1="470" y1="424" x2="470" y2="460" stroke="#334155" stroke-width="2.5" marker-end="url(#e68Arrow)"/>

  <!-- ============ Output box ============ -->
  <rect x="90" y="466" width="760" height="104" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="470" y="492" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">68 sequence ids</text>

  <!-- per class chips -->
  <g font-size="11.5" fill="#334155">
    <rect x="110" y="506" width="130" height="46" rx="6" fill="#ffffff" stroke="#15803d"/>
    <text x="175" y="523" font-size="11" text-anchor="middle" fill="#14532d">normal</text>
    <text x="175" y="542" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">12</text>

    <rect x="252" y="506" width="130" height="46" rx="6" fill="#ffffff" stroke="#15803d"/>
    <text x="317" y="523" font-size="11" text-anchor="middle" fill="#14532d">parkinsons</text>
    <text x="317" y="542" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">9</text>

    <rect x="394" y="506" width="130" height="46" rx="6" fill="#ffffff" stroke="#15803d"/>
    <text x="459" y="523" font-size="11" text-anchor="middle" fill="#14532d">stroke</text>
    <text x="459" y="542" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">12</text>

    <rect x="536" y="506" width="140" height="46" rx="6" fill="#ffffff" stroke="#15803d"/>
    <text x="606" y="523" font-size="11" text-anchor="middle" fill="#14532d">cerebral palsy</text>
    <text x="606" y="542" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">15</text>

    <rect x="688" y="506" width="140" height="46" rx="6" fill="#ffffff" stroke="#15803d"/>
    <text x="758" y="523" font-size="11" text-anchor="middle" fill="#14532d">myopathic</text>
    <text x="758" y="542" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">20</text>
  </g>

  <text x="470" y="598" font-size="12" text-anchor="middle" fill="#475569">the exact same labelled videos the Random Forest trained on.</text>
</svg>
