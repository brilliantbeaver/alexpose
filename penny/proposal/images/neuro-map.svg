<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">Neuroscience map: shared axes and one distinct axis each</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">Two conditions share the same gait axes, but each keeps one axis of its own</text>

  <!-- Shared group 1: Asymmetry -->
  <rect x="330" y="92" width="300" height="112" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="480" y="114" font-size="14" font-weight="bold" text-anchor="middle" fill="#4c1d95">Shared group 1: Asymmetry</text>
  <text x="480" y="134" font-size="11" text-anchor="middle" fill="#334155">left vs right; symmetry indices</text>
  <text x="480" y="150" font-size="11" text-anchor="middle" fill="#7c3aed">touched by limb-over-time masking</text>
  <text x="480" y="172" font-size="10.5" text-anchor="middle" fill="#334155">hip / knee / ankle_symmetry_index,</text>
  <text x="480" y="187" font-size="10.5" text-anchor="middle" fill="#334155">stride_length_si</text>

  <!-- Shared group 2: Postural instability -->
  <rect x="330" y="224" width="300" height="112" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="480" y="246" font-size="14" font-weight="bold" text-anchor="middle" fill="#4c1d95">Shared group 2: Postural instability</text>
  <text x="480" y="266" font-size="11" text-anchor="middle" fill="#334155">body sway / center of mass</text>
  <text x="480" y="282" font-size="11" text-anchor="middle" fill="#7c3aed">touched by time-window mask</text>
  <text x="480" y="304" font-size="10.5" text-anchor="middle" fill="#334155">com_stability_index,</text>
  <text x="480" y="319" font-size="10.5" text-anchor="middle" fill="#334155">postural_sway_area</text>

  <!-- Parkinsons (left, blue) -->
  <rect x="30" y="150" width="278" height="196" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="169" y="172" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Parkinsons disease</text>
  <text x="169" y="191" font-size="10.5" text-anchor="middle" fill="#334155">substantia nigra dopamine loss,</text>
  <text x="169" y="206" font-size="10.5" text-anchor="middle" fill="#334155">basal-ganglia timing failure,</text>
  <text x="169" y="221" font-size="10.5" text-anchor="middle" fill="#334155">variability-driven, becomes bilateral</text>

  <rect x="46" y="236" width="246" height="98" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="169" y="256" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">PD extra group:</text>
  <text x="169" y="272" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Rhythm and variability</text>
  <text x="169" y="290" font-size="10" text-anchor="middle" fill="#334155">stride_time_cv, step_length_cv,</text>
  <text x="169" y="304" font-size="10" text-anchor="middle" fill="#334155">stride_velocity_cv; suspicious &gt; 0.06 to 0.08</text>
  <text x="169" y="322" font-size="10" text-anchor="middle" fill="#334155">touched by whole-cycle masking</text>

  <!-- Stroke (right, amber) -->
  <rect x="652" y="150" width="278" height="196" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="791" y="172" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c2d12">Stroke</text>
  <text x="791" y="191" font-size="10.5" text-anchor="middle" fill="#334155">one-sided corticospinal injury,</text>
  <text x="791" y="206" font-size="10.5" text-anchor="middle" fill="#334155">fixed unilateral deficit</text>

  <rect x="668" y="222" width="246" height="112" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="791" y="242" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c2d12">Stroke extra group:</text>
  <text x="791" y="258" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">Spatiotemporal slowing</text>
  <text x="791" y="276" font-size="10" text-anchor="middle" fill="#334155">walking_speed_ms ~0.5, cadence 50 to 65,</text>
  <text x="791" y="290" font-size="10" text-anchor="middle" fill="#334155">double_support 30 to 40 percent,</text>
  <text x="791" y="304" font-size="10" text-anchor="middle" fill="#334155">stance_swing_ratio ~2.3</text>
  <text x="791" y="322" font-size="10" text-anchor="middle" fill="#334155">touched by whole-cycle timing</text>

  <!-- Connectors: PD to shared boxes -->
  <line x1="308" y1="210" x2="330" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="308" y1="250" x2="330" y2="272" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Connectors: Stroke to shared boxes -->
  <line x1="652" y1="210" x2="630" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="652" y1="250" x2="630" y2="272" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Red note: keep third axis separate -->
  <rect x="255" y="382" width="450" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="480" y="405" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Keep the third axis SEPARATE:</text>
  <text x="480" y="423" font-size="11.5" text-anchor="middle" fill="#7f1d1d">do not merge PD rhythm with stroke slowing.</text>

  <!-- Green note: frozen-latent probes -->
  <rect x="255" y="454" width="450" height="46" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="482" font-size="11.5" text-anchor="middle" fill="#14532d">Frozen-latent probes check whether each axis was learned.</text>
</svg>
