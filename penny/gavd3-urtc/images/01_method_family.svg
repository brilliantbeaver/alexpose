<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Three related skeleton representation learning methods</title>
  <desc>MAMP predicts coordinate motion, S-JEPA predicts latent targets, and the Nature MTM method combines reconstruction with contrastive learning.</desc>
  <defs><style>
    .h{font:700 34px Arial;fill:#10233f}.t{font:700 24px Arial;fill:#10233f}
    .b{font:18px Arial;fill:#263a54}.s{font:15px Arial;fill:#4d6077}
    .box{stroke:#17324d;stroke-width:2}.rule{stroke:#8ca0b5;stroke-width:2}
  </style></defs>
  <rect width="1200" height="675" fill="#f5f1e8"/>
  <text x="60" y="62" class="h">Related methods differ most in what they predict</text>
  <line x1="60" y1="88" x2="1140" y2="88" class="rule"/>
  <rect x="60" y="130" width="330" height="430" rx="18" fill="#e8f1f8" class="box"/>
  <rect x="435" y="130" width="330" height="430" rx="18" fill="#e5f4ed" class="box"/>
  <rect x="810" y="130" width="330" height="430" rx="18" fill="#f7eadf" class="box"/>
  <text x="90" y="180" class="t">MAMP</text>
  <text x="90" y="216" class="b">Visible joint-time patches</text>
  <text x="90" y="255" class="b">Transformer encoder</text>
  <text x="90" y="294" class="b">Transformer decoder</text>
  <rect x="90" y="330" width="270" height="82" rx="12" fill="#fff" class="box"/>
  <text x="115" y="365" class="t">Target</text>
  <text x="100" y="392" class="b">normalized coordinate motion</text>
  <text x="90" y="458" class="s">Motion also biases which</text>
  <text x="90" y="482" class="s">tokens are masked.</text>
  <text x="465" y="180" class="t">S-JEPA</text>
  <text x="465" y="216" class="b">Visible joint-time patches</text>
  <text x="465" y="255" class="b">View encoder + predictor</text>
  <text x="465" y="294" class="b">EMA target encoder</text>
  <rect x="465" y="330" width="270" height="82" rx="12" fill="#fff" class="box"/>
  <text x="490" y="365" class="t">Target</text>
  <text x="490" y="392" class="b">contextual latent vector</text>
  <text x="465" y="458" class="s">This tutorial keeps this</text>
  <text x="465" y="482" class="s">learning objective.</text>
  <text x="840" y="180" class="t">Nature MTM</text>
  <text x="840" y="216" class="b">Motion + topology masks</text>
  <text x="840" y="255" class="b">Bi-GRU encoder and decoder</text>
  <text x="840" y="294" class="b">Contrastive queue</text>
  <rect x="840" y="330" width="270" height="82" rx="12" fill="#fff" class="box"/>
  <text x="865" y="365" class="t">Targets</text>
  <text x="865" y="392" class="b">coordinates + contrast</text>
  <text x="840" y="458" class="s">Related work, not an</text>
  <text x="840" y="482" class="s">S-JEPA implementation.</text>
  <rect x="435" y="585" width="330" height="48" rx="24" fill="#17324d"/>
  <text x="478" y="616" style="font:700 18px Arial;fill:#fff">Chosen foundation: S-JEPA</text>
</svg>
