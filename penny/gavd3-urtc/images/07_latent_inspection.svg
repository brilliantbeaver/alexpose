<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Ways to inspect learned latent motion</title>
  <desc>Prediction similarity, nearest neighbor retrieval, and distance to the normal reference are diagnostics, not coordinate forecasts.</desc>
  <defs><style>.h{font:700 34px Arial;fill:#10233f}.t{font:700 23px Arial;fill:#10233f}.b{font:17px Arial;fill:#344b62}.box{stroke:#18324c;stroke-width:2}</style></defs>
  <rect width="1200" height="675" fill="#f5f1e8"/><text x="55" y="62" class="h">Inspect what the representation learned before classifying</text>
  <rect x="65" y="145" width="320" height="340" rx="20" fill="#e8f1f8" class="box"/><text x="98" y="195" class="t">Masked-token match</text><text x="98" y="245" class="b">Cosine similarity between</text><text x="98" y="274" class="b">predicted and target latents</text><circle cx="225" cy="370" r="72" fill="#fff" stroke="#2f6f99" stroke-width="14"/><path d="M225 298A72 72 0 0 1 287 406" fill="none" stroke="#ef7d57" stroke-width="14"/>
  <rect x="440" y="145" width="320" height="340" rx="20" fill="#e5f4ed" class="box"/><text x="473" y="195" class="t">Neighbor retrieval</text><text x="473" y="245" class="b">Which complete gait clips</text><text x="473" y="274" class="b">land closest in latent space?</text><circle cx="540" cy="370" r="28" fill="#2f6f99"/><circle cx="640" cy="330" r="28" fill="#66a17b"/><circle cx="675" cy="410" r="28" fill="#ef7d57"/><line x1="565" y1="360" x2="615" y2="340" stroke="#18324c" stroke-width="3"/>
  <rect x="815" y="145" width="320" height="340" rx="20" fill="#f9e5cf" class="box"/><text x="848" y="195" class="t">Normal reference</text><text x="848" y="245" class="b">Distance from the normal</text><text x="848" y="274" class="b">embedding centroid</text><circle cx="955" cy="375" r="80" fill="none" stroke="#66a17b" stroke-width="4" stroke-dasharray="10 8"/><circle cx="955" cy="375" r="16" fill="#66a17b"/><circle cx="1060" cy="320" r="16" fill="#ef7d57"/>
  <text x="65" y="570" class="b">S-JEPA performs latent infilling within an observed clip. It does not autoregressively generate future coordinates.</text>
</svg>
