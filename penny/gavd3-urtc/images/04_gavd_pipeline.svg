<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>GAVD sequence ingestion pipeline</title>
  <desc>Each CSV identifies annotated frames inside a YouTube source. Full videos are cached once, annotated frames are decoded, and one pose artifact is written per sequence.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18324c"/></marker><style>.h{font:700 34px Arial;fill:#10233f}.n{font:700 22px Arial;fill:#10233f}.b{font:16px Arial;fill:#344b62}.box{stroke:#18324c;stroke-width:2}.a{stroke:#18324c;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="675" fill="#f6f3ec"/><text x="55" y="62" class="h">One CSV sequence stays one scientific sample</text>
  <g transform="translate(55,170)">
    <rect x="0" y="0" width="190" height="210" rx="18" fill="#e8f1f8" class="box"/>
    <text x="35" y="48" class="n">GAVD CSV</text><text x="24" y="88" class="b">sequence ID</text><text x="24" y="118" class="b">absolute frame rows</text><text x="24" y="148" class="b">bbox per frame</text><text x="24" y="178" class="b">YouTube ID</text>
    <path d="M190 105H260" class="a"/>
    <rect x="260" y="0" width="190" height="210" rx="18" fill="#f9e5cf" class="box"/>
    <text x="292" y="48" class="n">Manifest</text><text x="284" y="88" class="b">canonical condition</text><text x="284" y="118" class="b">first and last frame</text><text x="284" y="148" class="b">source dimensions</text><text x="284" y="178" class="b">cache location</text>
    <path d="M450 105H520" class="a"/>
    <rect x="520" y="0" width="190" height="210" rx="18" fill="#e5f4ed" class="box"/>
    <text x="551" y="48" class="n">Full MP4</text><text x="544" y="88" class="b">download once</text><text x="544" y="118" class="b">keep frame numbers</text><text x="544" y="148" class="b">probe actual FPS</text><text x="544" y="178" class="b">validate decoding</text>
    <path d="M710 105H780" class="a"/>
    <rect x="780" y="0" width="190" height="210" rx="18" fill="#e9e3f5" class="box"/>
    <text x="806" y="48" class="n">BlazePose</text><text x="804" y="88" class="b">decode annotated span</text><text x="804" y="118" class="b">crop around bbox</text><text x="804" y="148" class="b">33 landmarks</text><text x="804" y="178" class="b">preserve failures</text>
    <path d="M970 105H1040" class="a"/>
    <rect x="1040" y="0" width="100" height="210" rx="18" fill="#fff" class="box"/>
    <text x="1065" y="48" class="n">NPZ</text><text x="1061" y="88" class="b">T × 33</text><text x="1064" y="118" class="b">× 4</text><text x="1058" y="158" class="b">per seq</text>
  </g>
  <rect x="55" y="475" width="1090" height="105" rx="18" fill="#18324c"/>
  <text x="85" y="518" style="font:700 21px Arial;fill:#fff">Why full videos?</text>
  <text x="85" y="552" style="font:17px Arial;fill:#fff">Downloading trimmed clips can change frame numbering. The CSV rows refer to the original source timeline.</text>
</svg>
