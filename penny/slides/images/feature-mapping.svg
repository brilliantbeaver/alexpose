<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="44" font-size="30" font-weight="bold" text-anchor="middle" fill="#0f172a">The bridge: from neurology to named, measurable features</text>
  <text x="640" y="72" font-size="16" text-anchor="middle" fill="#475569">Penny's mapping grades all 82 gait features by how directly each traces to the neurological basis of the condition.</text>

  <!-- section labels -->
  <text x="185" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">1. Neurological basis</text>
  <text x="640" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">2. Penny's feature-to-condition mapping</text>
  <text x="1120" y="104" font-size="17" font-weight="bold" text-anchor="middle" fill="#0f172a">3. How the method uses it</text>

  <!-- ===================== COLUMN 1: NEUROLOGICAL BASIS ===================== -->
  <!-- PD card (violet) -->
  <rect x="40" y="122" width="290" height="222" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="150" font-size="16" font-weight="bold" fill="#5b21b6">Parkinson's disease (PD)</text>
  <text x="60" y="173" font-size="13" fill="#7c3aed">dopamine loss in the substantia</text>
  <text x="60" y="190" font-size="13" fill="#7c3aed">nigra disrupts basal-ganglia timing</text>
  <line x1="60" y1="202" x2="310" y2="202" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="60" y="224" font-size="13" fill="#5b21b6">effects on gait:</text>
  <text x="60" y="246" font-size="13" fill="#5b21b6">one-sided onset, slowness</text>
  <text x="60" y="267" font-size="13" fill="#5b21b6">small shuffling steps</text>
  <text x="60" y="288" font-size="13" fill="#5b21b6">reduced arm swing</text>
  <text x="60" y="309" font-size="13" fill="#5b21b6">high step-to-step variability</text>
  <text x="60" y="332" font-size="12" font-style="italic" fill="#7c3aed">rhythm and variability</text>

  <!-- Stroke card (blue) -->
  <rect x="40" y="358" width="290" height="222" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="60" y="386" font-size="16" font-weight="bold" fill="#1e3a8a">Stroke</text>
  <text x="60" y="409" font-size="13" fill="#1d4ed8">one-sided injury to the corticospinal</text>
  <text x="60" y="426" font-size="13" fill="#1d4ed8">tract weakens one side</text>
  <line x1="60" y1="438" x2="310" y2="438" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="60" y="460" font-size="13" fill="#1e3a8a">effects on gait:</text>
  <text x="60" y="482" font-size="13" fill="#1e3a8a">spastic one-sided weakness</text>
  <text x="60" y="503" font-size="13" fill="#1e3a8a">stiff-knee gait, circumduction</text>
  <text x="60" y="524" font-size="13" fill="#1e3a8a">slower pace</text>
  <text x="60" y="545" font-size="13" fill="#1e3a8a">more double support</text>
  <text x="60" y="568" font-size="12" font-style="italic" fill="#1d4ed8">spatiotemporal slowing</text>

  <!-- arrows column 1 -> column 2 -->
  <line x1="330" y1="233" x2="378" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="469" x2="378" y2="402" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== COLUMN 2: PENNY'S MAPPING (centerpiece) ===================== -->
  <rect x="382" y="122" width="516" height="458" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="150" font-size="17" font-weight="bold" text-anchor="middle" fill="#5b21b6">Penny's feature-to-condition mapping</text>
  <text x="640" y="172" font-size="12.5" text-anchor="middle" fill="#475569">each of the 82 gait features graded H / M / L / NA per condition,</text>
  <text x="640" y="189" font-size="12.5" text-anchor="middle" fill="#475569">with a neurological reason and a significance threshold</text>

  <!-- grade legend -->
  <rect x="402" y="202" width="476" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="418" y="223" font-size="12.5" font-weight="bold" fill="#5b21b6">Grades:</text>
  <text x="418" y="242" font-size="12" fill="#5b21b6">H = directly tied to mechanism   M = partial   L = weak   NA = not relevant</text>

  <!-- example mapped rows (feature -> grade -> threshold) -->
  <!-- row 1 -->
  <rect x="402" y="264" width="476" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="416" y="284" font-size="12.5" font-weight="bold" fill="#5b21b6">stride_length_si</text>
  <rect x="762" y="271" width="102" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="813" y="286" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">H PD + stroke</text>
  <text x="416" y="302" font-size="11.5" fill="#7c3aed">symmetry index absolute value above 16 percent</text>

  <!-- row 2 -->
  <rect x="402" y="316" width="476" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="416" y="336" font-size="12.5" font-weight="bold" fill="#5b21b6">stride_time_cv</text>
  <rect x="812" y="323" width="52" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="838" y="338" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">H PD</text>
  <text x="416" y="354" font-size="11.5" fill="#7c3aed">high step-to-step variability</text>

  <!-- row 3 -->
  <rect x="402" y="368" width="476" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="416" y="388" font-size="12.5" font-weight="bold" fill="#5b21b6">com_stability_index</text>
  <rect x="804" y="375" width="60" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="834" y="390" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">H both</text>
  <text x="416" y="406" font-size="11.5" fill="#7c3aed">lower score means less stable</text>

  <!-- row 4 -->
  <rect x="402" y="420" width="476" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="416" y="440" font-size="12.5" font-weight="bold" fill="#5b21b6">knee_asymmetry</text>
  <rect x="792" y="427" width="72" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="828" y="442" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">H stroke</text>
  <text x="416" y="458" font-size="11.5" fill="#7c3aed">knee-flexion difference at least 17 degrees (stiff-knee gait)</text>

  <!-- row 5 -->
  <rect x="402" y="472" width="476" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="416" y="492" font-size="12.5" font-weight="bold" fill="#5b21b6">walking_speed_ms</text>
  <rect x="792" y="479" width="72" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="828" y="494" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">H stroke</text>
  <text x="416" y="510" font-size="11.5" fill="#7c3aed">about 0.5 m/s versus about 1.4 normal</text>

  <!-- row 6 -->
  <rect x="402" y="524" width="476" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="416" y="544" font-size="12.5" font-weight="bold" fill="#5b21b6">double_support_percentage</text>
  <rect x="792" y="531" width="72" height="20" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="828" y="546" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">H stroke</text>
  <text x="416" y="562" font-size="11.5" fill="#7c3aed">30 to 40 percent versus about 20 percent normal</text>

  <!-- arrow column 2 -> column 3 -->
  <line x1="898" y1="351" x2="946" y2="351" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== COLUMN 3: HOW THE METHOD USES IT (green) ===================== -->
  <rect x="950" y="122" width="290" height="458" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="1095" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">How Gait-JEPA</text>
  <text x="1095" y="171" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">uses the mapping</text>

  <rect x="970" y="192" width="250" height="112" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="982" y="216" font-size="13.5" font-weight="bold" fill="#14532d">limb-over-time masking</text>
  <text x="982" y="238" font-size="12.5" fill="#15803d">pressures the H-priority</text>
  <text x="982" y="256" font-size="12.5" fill="#15803d">asymmetry features</text>
  <text x="982" y="286" font-size="11.5" font-style="italic" fill="#475569">stride_length_si,</text>
  <text x="982" y="300" font-size="11.5" font-style="italic" fill="#475569">knee_asymmetry</text>

  <rect x="970" y="316" width="250" height="112" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="982" y="340" font-size="13.5" font-weight="bold" fill="#14532d">whole-cycle masking</text>
  <text x="982" y="362" font-size="12.5" fill="#15803d">pressures PD rhythm-</text>
  <text x="982" y="380" font-size="12.5" fill="#15803d">variability and stroke</text>
  <text x="982" y="398" font-size="12.5" fill="#15803d">slowing features</text>
  <text x="982" y="420" font-size="11.5" font-style="italic" fill="#475569">stride_time_cv, walking_speed_ms</text>

  <rect x="970" y="440" width="250" height="124" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="982" y="464" font-size="13.5" font-weight="bold" fill="#14532d">frozen linear probes</text>
  <text x="982" y="486" font-size="12.5" fill="#15803d">read the H-priority</text>
  <text x="982" y="504" font-size="12.5" fill="#15803d">scalars back out (RQ3)</text>
  <text x="982" y="534" font-size="12.5" fill="#15803d">error is decomposed</text>
  <text x="982" y="552" font-size="12.5" fill="#15803d">by mechanism group</text>

  <!-- ===================== BOTTOM CAPTION STRIP (amber) ===================== -->
  <rect x="60" y="602" width="1160" height="88" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="638" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">Penny's mapping turns the neurology of each condition into named, measurable gait features.</text>
  <text x="640" y="666" font-size="15" text-anchor="middle" fill="#92400e">Every masking choice and probe is aimed at the H-priority features, so the model learns clinically meaningful structure.</text>
</svg>
