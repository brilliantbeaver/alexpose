name: Comprehensive Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
        test-category: ["fast", "slow"]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --python "${{ matrix.python-version }}" --all-extras --dev
    
    - name: Run ${{ matrix.test-category }} tests
      run: |
        if [ "${{ matrix.test-category }}" = "fast" ]; then
          uv run pytest -m "fast" --tb=short --cov=ambient --cov=server --cov-report=xml --cov-report=term-missing -v
        elif [ "${{ matrix.test-category }}" = "slow" ]; then
          uv run pytest -m "slow and not performance and not integration" --tb=short --cov=ambient --cov=server --cov-report=xml --cov-report=term-missing -v
        fi
    
    - name: Upload coverage to Codecov
      if: matrix.test-category == 'fast' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7.0.0
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Store test results
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-results-${{ matrix.python-version }}-${{ matrix.test-category }}
        path: |
          coverage.xml
          htmlcov/
          test-results.xml
        retention-days: 30

  integration-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --python "3.12" --all-extras --dev

    - name: Run integration tests
      id: integration
      continue-on-error: true
      run: |
        uv run pytest -m "integration" --tb=short -v

    - name: Record known integration debt
      if: steps.integration.outcome == 'failure'
      run: |
        echo "Integration failures remain visible but do not block merges until the legacy contracts are remediated."

  quality-gates:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.12"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Verify dependency lock
      run: |
        uv lock --check

    - name: Compile Python sources
      run: |
        uv run python -m compileall -q ambient server tests

    - name: Validate test collection
      run: |
        uv run pytest --collect-only -q -o addopts="--strict-markers --strict-config"

    - name: Validate GAVD3 notebooks
      run: |
        for notebook in penny/gavd3/*.ipynb; do
          uv run python -m json.tool "$notebook" > /dev/null
        done

  property-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.12"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Run property-based tests
      run: |
        uv run pytest -m "property" --hypothesis-profile=ci --tb=short -v
      env:
        HYPOTHESIS_PROFILE: ci
    
    - name: Store property test results
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: property-test-results
        path: |
          .hypothesis/
        if-no-files-found: ignore
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.12"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
    
    - name: Run security scan with bandit
      run: |
        uv add bandit[toml]
        uv run bandit -r ambient/ server/ -f json -o bandit-report.json || true
    
    - name: Run safety check
      run: |
        uv add safety
        uv run safety check --json --output safety-report.json || true
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  test-summary:
    runs-on: ubuntu-latest
    needs: [test-matrix, quality-gates, property-tests, security-scan]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8.0.1
    
    - name: Generate test summary
      run: |
        echo "# Test Execution Summary" > test_summary.md
        echo "" >> test_summary.md
        echo "## Test Matrix Results" >> test_summary.md
        
        # Check if any test jobs failed
        if [ "${{ needs.test-matrix.result }}" != "success" ]; then
          echo "❌ Test matrix failed" >> test_summary.md
        else
          echo "✅ Test matrix passed" >> test_summary.md
        fi
        
        if [ "${{ needs.quality-gates.result }}" != "success" ]; then
          echo "❌ Quality gates failed" >> test_summary.md
        else
          echo "✅ Quality gates passed" >> test_summary.md
        fi
        
        if [ "${{ needs.property-tests.result }}" != "success" ]; then
          echo "❌ Property tests failed" >> test_summary.md
        else
          echo "✅ Property tests passed" >> test_summary.md
        fi
        
        if [ "${{ needs.security-scan.result }}" != "success" ]; then
          echo "⚠️ Security scan completed with warnings" >> test_summary.md
        else
          echo "✅ Security scan passed" >> test_summary.md
        fi
        
        echo "" >> test_summary.md
        echo "## Artifacts Generated" >> test_summary.md
        echo "- Test results and coverage reports" >> test_summary.md
        echo "- Quality gate analysis" >> test_summary.md
        echo "- Property test execution data" >> test_summary.md
        echo "- Security scan reports" >> test_summary.md
        
        cat test_summary.md

    - name: Enforce aggregate result
      if: >-
        needs.test-matrix.result != 'success' ||
        needs.quality-gates.result != 'success' ||
        needs.property-tests.result != 'success' ||
        needs.security-scan.result != 'success'
      run: |
        echo "One or more required test jobs did not pass."
        exit 1
    
    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: test-summary
        path: test_summary.md
        retention-days: 30
