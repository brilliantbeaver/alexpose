<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="44" font-size="30" font-weight="bold" text-anchor="middle" fill="#0f172a">How Penny's mapping is used across the three stages</text>
  <text x="640" y="72" font-size="16" text-anchor="middle" fill="#475569">The H-priority features shape the self-supervised task, then grade the result. They are never training labels.</text>

  <!-- ===================== COLUMN 1: TRAINING (blue) ===================== -->
  <rect x="30" y="98" width="386" height="500" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="46" y="128" font-size="18" font-weight="bold" fill="#1e3a8a">1. TRAINING</text>
  <text x="46" y="149" font-size="13.5" fill="#1d4ed8">self-supervised, no labels</text>
  <line x1="46" y1="160" x2="400" y2="160" stroke="#1d4ed8" stroke-width="1.5"/>

  <text x="46" y="186" font-size="14" fill="#1e3a8a">Pretrain the JEPA on the unlabeled</text>
  <text x="46" y="205" font-size="14" fill="#1e3a8a">GAVD pool.</text>

  <text x="46" y="234" font-size="14" fill="#1e3a8a">The mapping chooses WHICH blocks to</text>
  <text x="46" y="253" font-size="14" fill="#1e3a8a">mask, so the task pressures the</text>
  <text x="46" y="272" font-size="14" fill="#1e3a8a">H-priority mechanisms:</text>

  <!-- sub-line 1 (limb-over-time) -->
  <rect x="46" y="288" width="354" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="62" y="311" font-size="13.5" font-weight="bold" fill="#1e3a8a">limb-over-time masking</text>
  <text x="62" y="330" font-size="12.5" fill="#1d4ed8">to H asymmetry features:</text>
  <text x="62" y="348" font-size="11.5" font-style="italic" fill="#475569">stride_length_si,</text>
  <text x="62" y="365" font-size="11.5" font-style="italic" fill="#475569">hip / knee / ankle_symmetry_index</text>

  <!-- sub-line 2 (whole-cycle) -->
  <rect x="46" y="384" width="354" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="62" y="407" font-size="13.5" font-weight="bold" fill="#1e3a8a">whole-cycle masking</text>
  <text x="62" y="426" font-size="12.5" fill="#1d4ed8">to PD rhythm and stroke slowing:</text>
  <text x="62" y="444" font-size="11.5" font-style="italic" fill="#475569">stride_time_cv (rhythm),</text>
  <text x="62" y="461" font-size="11.5" font-style="italic" fill="#475569">walking_speed_ms (slowing)</text>

  <!-- amber note chip -->
  <rect x="46" y="484" width="354" height="98" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="62" y="508" font-size="13" font-weight="bold" fill="#92400e">Key: the H-priority scalars are NOT</text>
  <text x="62" y="527" font-size="13" font-weight="bold" fill="#92400e">fed as labels.</text>
  <text x="62" y="552" font-size="13" fill="#92400e">Pretraining stays fully</text>
  <text x="62" y="571" font-size="13" fill="#92400e">self-supervised.</text>

  <!-- arrow column 1 -> column 2 -->
  <line x1="416" y1="348" x2="446" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== COLUMN 2: EVALUATION (violet) ===================== -->
  <rect x="448" y="98" width="386" height="500" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="464" y="128" font-size="18" font-weight="bold" fill="#5b21b6">2. EVALUATION</text>
  <text x="464" y="149" font-size="13.5" fill="#7c3aed">frozen encoder, the 68 labels</text>
  <line x1="464" y1="160" x2="818" y2="160" stroke="#7c3aed" stroke-width="1.5"/>

  <text x="464" y="186" font-size="14" fill="#5b21b6">Freeze the encoder. Fit tiny probes on</text>
  <text x="464" y="205" font-size="14" fill="#5b21b6">the pooled latent.</text>

  <text x="464" y="234" font-size="13.5" font-weight="bold" fill="#5b21b6">RQ3 probe</text>
  <text x="464" y="253" font-size="13" fill="#7c3aed">ridge regression from the frozen latent</text>
  <text x="464" y="271" font-size="13" fill="#7c3aed">to each H-priority scalar. Report test</text>
  <text x="464" y="289" font-size="13" fill="#7c3aed">R-squared.</text>

  <text x="464" y="316" font-size="13.5" font-weight="bold" fill="#5b21b6">Threshold check</text>
  <text x="464" y="335" font-size="13" fill="#7c3aed">does the probe land on the correct side</text>
  <text x="464" y="353" font-size="13" fill="#7c3aed">of Penny's cutoffs (symmetry index</text>
  <text x="464" y="371" font-size="13" fill="#7c3aed">above 16 percent, stride_time_cv above</text>
  <text x="464" y="389" font-size="13" fill="#7c3aed">0.06, knee-flexion difference at least</text>
  <text x="464" y="407" font-size="13" fill="#7c3aed">17 degrees) over 70 percent of the time.</text>

  <text x="464" y="434" font-size="13.5" font-weight="bold" fill="#5b21b6">Mechanism-grouped error</text>
  <text x="464" y="453" font-size="13" fill="#7c3aed">split the masked-prediction error into</text>
  <text x="464" y="471" font-size="13" fill="#7c3aed">asymmetry, rhythm-variability, and</text>
  <text x="464" y="489" font-size="13" fill="#7c3aed">postural-stability groups.</text>

  <!-- green note chip -->
  <rect x="464" y="506" width="354" height="76" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="480" y="530" font-size="13" fill="#14532d">This tests whether the encoder learned</text>
  <text x="480" y="549" font-size="13" fill="#14532d">the mechanisms without ever being</text>
  <text x="480" y="568" font-size="13" fill="#14532d">told them.</text>

  <!-- arrow column 2 -> column 3 -->
  <line x1="834" y1="348" x2="864" y2="348" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== COLUMN 3: INFERENCE (green) ===================== -->
  <rect x="866" y="98" width="384" height="500" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="882" y="128" font-size="18" font-weight="bold" fill="#14532d">3. INFERENCE</text>
  <text x="882" y="149" font-size="13.5" fill="#15803d">a new walking clip</text>
  <line x1="882" y1="160" x2="1234" y2="160" stroke="#15803d" stroke-width="1.5"/>

  <text x="882" y="186" font-size="14" fill="#14532d">Run a new clip through the frozen</text>
  <text x="882" y="205" font-size="14" fill="#14532d">encoder to get its latent.</text>

  <text x="882" y="234" font-size="14" fill="#14532d">The 5-class probe predicts the</text>
  <text x="882" y="253" font-size="14" fill="#14532d">condition (RQ1).</text>

  <text x="882" y="282" font-size="13.5" font-weight="bold" fill="#14532d">The H-priority probes read out named,</text>
  <text x="882" y="301" font-size="13.5" font-weight="bold" fill="#14532d">clinically meaningful axes:</text>
  <text x="882" y="323" font-size="13" fill="#15803d">an asymmetry score, a rhythm-</text>
  <text x="882" y="341" font-size="13" fill="#15803d">variability score, a postural-stability</text>
  <text x="882" y="359" font-size="13" fill="#15803d">score, and a slowing score.</text>

  <text x="882" y="388" font-size="14" fill="#14532d">Compare each read-out to Penny's</text>
  <text x="882" y="407" font-size="14" fill="#14532d">threshold to flag which mechanism</text>
  <text x="882" y="426" font-size="14" fill="#14532d">looks abnormal.</text>

  <!-- green note chip -->
  <rect x="882" y="486" width="352" height="96" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="898" y="516" font-size="13" fill="#14532d">Output is an interpretable,</text>
  <text x="898" y="535" font-size="13" fill="#14532d">mechanism-level readout,</text>
  <text x="898" y="554" font-size="13" fill="#14532d">not just a black-box label.</text>

  <!-- ===================== BOTTOM CAPTION STRIP (amber) ===================== -->
  <rect x="30" y="616" width="1220" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="650" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">Penny's mapping is the throughline: it aims the masking during training, it defines the probes and thresholds during</text>
  <text x="640" y="676" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400e">evaluation, and it turns a prediction into a clinical readout at inference.</text>
</svg>
