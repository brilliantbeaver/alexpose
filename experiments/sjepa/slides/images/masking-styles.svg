<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="56" font-size="30" font-weight="bold" text-anchor="middle" fill="#0f172a">Two block-masking styles on the joint-time grid</text>
  <text x="640" y="90" font-size="18" text-anchor="middle" fill="#475569">Rows are the six joint groups, columns are time frames. Hide blocks, not scattered dots.</text>

  <!-- ================= STYLE A: LIMB-OVER-TIME (LEFT) ================= -->
  <rect x="40" y="120" width="560" height="450" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="152" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Style A: limb-over-time</text>
  <text x="320" y="176" font-size="15" text-anchor="middle" fill="#1e3a8a">hide ONE whole limb across a window of frames</text>

  <!-- row labels -->
  <text x="150" y="222" font-size="13" text-anchor="end" fill="#475569">face</text>
  <text x="150" y="258" font-size="13" text-anchor="end" fill="#475569">left_arm</text>
  <text x="150" y="294" font-size="13" text-anchor="end" fill="#475569">right_arm</text>
  <text x="150" y="330" font-size="13" text-anchor="end" fill="#475569">torso</text>
  <text x="150" y="366" font-size="13" text-anchor="end" fill="#475569">left_leg</text>
  <text x="150" y="402" font-size="13" text-anchor="end" fill="#475569">right_leg</text>

  <!-- visible cells 6 rows x 8 cols, left_leg row (y=352) has the masked window removed -->
  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5">
    <!-- face -->
    <rect x="164" y="208" width="30" height="26"/><rect x="200" y="208" width="30" height="26"/><rect x="236" y="208" width="30" height="26"/><rect x="272" y="208" width="30" height="26"/><rect x="308" y="208" width="30" height="26"/><rect x="344" y="208" width="30" height="26"/><rect x="380" y="208" width="30" height="26"/><rect x="416" y="208" width="30" height="26"/>
    <!-- left_arm -->
    <rect x="164" y="244" width="30" height="26"/><rect x="200" y="244" width="30" height="26"/><rect x="236" y="244" width="30" height="26"/><rect x="272" y="244" width="30" height="26"/><rect x="308" y="244" width="30" height="26"/><rect x="344" y="244" width="30" height="26"/><rect x="380" y="244" width="30" height="26"/><rect x="416" y="244" width="30" height="26"/>
    <!-- right_arm -->
    <rect x="164" y="280" width="30" height="26"/><rect x="200" y="280" width="30" height="26"/><rect x="236" y="280" width="30" height="26"/><rect x="272" y="280" width="30" height="26"/><rect x="308" y="280" width="30" height="26"/><rect x="344" y="280" width="30" height="26"/><rect x="380" y="280" width="30" height="26"/><rect x="416" y="280" width="30" height="26"/>
    <!-- torso -->
    <rect x="164" y="316" width="30" height="26"/><rect x="200" y="316" width="30" height="26"/><rect x="236" y="316" width="30" height="26"/><rect x="272" y="316" width="30" height="26"/><rect x="308" y="316" width="30" height="26"/><rect x="344" y="316" width="30" height="26"/><rect x="380" y="316" width="30" height="26"/><rect x="416" y="316" width="30" height="26"/>
    <!-- left_leg (window cols 3-6 removed) -->
    <rect x="164" y="352" width="30" height="26"/><rect x="200" y="352" width="30" height="26"/>
    <rect x="416" y="352" width="30" height="26"/>
    <!-- right_leg -->
    <rect x="164" y="388" width="30" height="26"/><rect x="200" y="388" width="30" height="26"/><rect x="236" y="388" width="30" height="26"/><rect x="272" y="388" width="30" height="26"/><rect x="308" y="388" width="30" height="26"/><rect x="344" y="388" width="30" height="26"/><rect x="380" y="388" width="30" height="26"/><rect x="416" y="388" width="30" height="26"/>
  </g>
  <!-- masked block: left_leg across mid window -->
  <g fill="#fecaca" stroke="#ef4444" stroke-width="1.5">
    <rect x="236" y="352" width="30" height="26"/><rect x="272" y="352" width="30" height="26"/><rect x="308" y="352" width="30" height="26"/><rect x="344" y="352" width="30" height="26"/><rect x="380" y="352" width="30" height="26"/>
  </g>
  <rect x="233" y="349" width="180" height="32" rx="4" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>

  <text x="320" y="440" font-size="13" text-anchor="middle" fill="#475569">time (frames) -&gt;</text>
  <rect x="80" y="470" width="480" height="82" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="498" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">forces reasoning about coordinated,</text>
  <text x="320" y="520" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">left-right motion</text>
  <text x="320" y="540" font-size="13" text-anchor="middle" font-style="italic" fill="#475569">reconstruct one side from the other side</text>

  <!-- ================= STYLE B: TIME-WINDOW (RIGHT) ================= -->
  <rect x="680" y="120" width="560" height="450" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="960" y="152" font-size="20" font-weight="bold" text-anchor="middle" fill="#14532d">Style B: time-window</text>
  <text x="960" y="176" font-size="15" text-anchor="middle" fill="#14532d">hide ALL 33 joints in a short window of frames</text>

  <!-- row labels -->
  <text x="790" y="222" font-size="13" text-anchor="end" fill="#475569">face</text>
  <text x="790" y="258" font-size="13" text-anchor="end" fill="#475569">left_arm</text>
  <text x="790" y="294" font-size="13" text-anchor="end" fill="#475569">right_arm</text>
  <text x="790" y="330" font-size="13" text-anchor="end" fill="#475569">torso</text>
  <text x="790" y="366" font-size="13" text-anchor="end" fill="#475569">left_leg</text>
  <text x="790" y="402" font-size="13" text-anchor="end" fill="#475569">right_leg</text>

  <!-- visible cells (columns outside the window: cols 1,2 and 6,7,8) -->
  <g fill="#dcfce7" stroke="#4ade80" stroke-width="1.5">
    <rect x="804" y="208" width="30" height="26"/><rect x="840" y="208" width="30" height="26"/><rect x="984" y="208" width="30" height="26"/><rect x="1020" y="208" width="30" height="26"/><rect x="1056" y="208" width="30" height="26"/>
    <rect x="804" y="244" width="30" height="26"/><rect x="840" y="244" width="30" height="26"/><rect x="984" y="244" width="30" height="26"/><rect x="1020" y="244" width="30" height="26"/><rect x="1056" y="244" width="30" height="26"/>
    <rect x="804" y="280" width="30" height="26"/><rect x="840" y="280" width="30" height="26"/><rect x="984" y="280" width="30" height="26"/><rect x="1020" y="280" width="30" height="26"/><rect x="1056" y="280" width="30" height="26"/>
    <rect x="804" y="316" width="30" height="26"/><rect x="840" y="316" width="30" height="26"/><rect x="984" y="316" width="30" height="26"/><rect x="1020" y="316" width="30" height="26"/><rect x="1056" y="316" width="30" height="26"/>
    <rect x="804" y="352" width="30" height="26"/><rect x="840" y="352" width="30" height="26"/><rect x="984" y="352" width="30" height="26"/><rect x="1020" y="352" width="30" height="26"/><rect x="1056" y="352" width="30" height="26"/>
    <rect x="804" y="388" width="30" height="26"/><rect x="840" y="388" width="30" height="26"/><rect x="984" y="388" width="30" height="26"/><rect x="1020" y="388" width="30" height="26"/><rect x="1056" y="388" width="30" height="26"/>
  </g>
  <!-- masked block: all joints across mid window (cols 3,4,5) -->
  <g fill="#fecaca" stroke="#ef4444" stroke-width="1.5">
    <rect x="876" y="208" width="30" height="26"/><rect x="912" y="208" width="30" height="26"/><rect x="948" y="208" width="30" height="26"/>
    <rect x="876" y="244" width="30" height="26"/><rect x="912" y="244" width="30" height="26"/><rect x="948" y="244" width="30" height="26"/>
    <rect x="876" y="280" width="30" height="26"/><rect x="912" y="280" width="30" height="26"/><rect x="948" y="280" width="30" height="26"/>
    <rect x="876" y="316" width="30" height="26"/><rect x="912" y="316" width="30" height="26"/><rect x="948" y="316" width="30" height="26"/>
    <rect x="876" y="352" width="30" height="26"/><rect x="912" y="352" width="30" height="26"/><rect x="948" y="352" width="30" height="26"/>
    <rect x="876" y="388" width="30" height="26"/><rect x="912" y="388" width="30" height="26"/><rect x="948" y="388" width="30" height="26"/>
  </g>
  <rect x="873" y="205" width="108" height="212" rx="4" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>

  <text x="960" y="440" font-size="13" text-anchor="middle" fill="#475569">time (frames) -&gt;</text>
  <rect x="720" y="470" width="480" height="82" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="960" y="498" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">forces predicting the whole body</text>
  <text x="960" y="520" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">through the gap</text>
  <text x="960" y="540" font-size="13" text-anchor="middle" font-style="italic" fill="#475569">extrapolate rhythm across the gait cycle</text>

  <!-- ================= SCATTERED DOTS INSET (avoid) ================= -->
  <rect x="40" y="596" width="330" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="205" y="622" font-size="14" font-weight="bold" text-anchor="middle" fill="#64748b">scattered dots: too easy, avoid</text>
  <!-- small grid with a few scattered hidden dots, crossed out -->
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <rect x="120" y="636" width="16" height="14"/><rect x="140" y="636" width="16" height="14"/><rect x="160" y="636" width="16" height="14"/><rect x="180" y="636" width="16" height="14"/><rect x="200" y="636" width="16" height="14"/><rect x="220" y="636" width="16" height="14"/><rect x="240" y="636" width="16" height="14"/><rect x="260" y="636" width="16" height="14"/>
    <rect x="120" y="654" width="16" height="14"/><rect x="140" y="654" width="16" height="14"/><rect x="160" y="654" width="16" height="14"/><rect x="180" y="654" width="16" height="14"/><rect x="200" y="654" width="16" height="14"/><rect x="220" y="654" width="16" height="14"/><rect x="240" y="654" width="16" height="14"/><rect x="260" y="654" width="16" height="14"/>
    <rect x="120" y="672" width="16" height="14"/><rect x="140" y="672" width="16" height="14"/><rect x="160" y="672" width="16" height="14"/><rect x="180" y="672" width="16" height="14"/><rect x="200" y="672" width="16" height="14"/><rect x="220" y="672" width="16" height="14"/><rect x="240" y="672" width="16" height="14"/><rect x="260" y="672" width="16" height="14"/>
  </g>
  <g fill="#fecaca" stroke="#ef4444" stroke-width="1">
    <rect x="140" y="636" width="16" height="14"/><rect x="220" y="636" width="16" height="14"/>
    <rect x="180" y="654" width="16" height="14"/><rect x="260" y="654" width="16" height="14"/>
    <rect x="120" y="672" width="16" height="14"/><rect x="200" y="672" width="16" height="14"/>
  </g>
  <line x1="118" y1="634" x2="278" y2="688" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="278" y1="634" x2="118" y2="688" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="300" y="662" font-size="11" text-anchor="start" fill="#64748b">a lone joint</text>
  <text x="300" y="678" font-size="11" text-anchor="start" fill="#64748b">is easy to guess</text>

  <!-- legend -->
  <rect x="700" y="600" width="18" height="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="726" y="614" font-size="13" fill="#475569">visible = context</text>
  <rect x="880" y="600" width="18" height="18" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="906" y="614" font-size="13" fill="#475569">hidden block = prediction target</text>

  <!-- caption -->
  <text x="960" y="662" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">Masking blocks, not dots, forces</text>
  <text x="960" y="684" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400e">the model to learn coordinated motion.</text>
</svg>
