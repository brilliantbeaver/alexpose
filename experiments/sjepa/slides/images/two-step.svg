<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="56" font-size="30" font-weight="bold" text-anchor="middle" fill="#0f172a">The two-step plan</text>
  <text x="640" y="90" font-size="17" text-anchor="middle" fill="#475569">Learn from the mountain of unlabeled video first, then spend the 68 labels only at the very end.</text>

  <!-- ================= STEP 1 ================= -->
  <rect x="50" y="130" width="600" height="530" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="350" y="172" font-size="22" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Step 1: Self-supervised pretraining</text>
  <text x="350" y="200" font-size="16" text-anchor="middle" fill="#1e3a8a">no human labels needed</text>

  <!-- big stack of unlabeled clips -->
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5">
    <rect x="90" y="250" width="200" height="26" rx="5"/>
    <rect x="98" y="284" width="200" height="26" rx="5"/>
    <rect x="106" y="318" width="200" height="26" rx="5"/>
    <rect x="114" y="352" width="200" height="26" rx="5"/>
    <rect x="122" y="386" width="200" height="26" rx="5"/>
    <rect x="130" y="420" width="200" height="26" rx="5"/>
    <rect x="138" y="454" width="200" height="26" rx="5"/>
    <rect x="146" y="488" width="200" height="26" rx="5"/>
  </g>
  <text x="240" y="546" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">the mountain of</text>
  <text x="240" y="568" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">UNLABELED clips</text>
  <text x="240" y="592" font-size="14" text-anchor="middle" fill="#475569">cheap, no doctor required</text>

  <!-- clips flow into JEPA box -->
  <line x1="352" y1="382" x2="430" y2="382" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- JEPA learns box -->
  <rect x="440" y="330" width="180" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="530" y="368" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">JEPA learns</text>
  <text x="530" y="392" font-size="14" text-anchor="middle" fill="#1e3a8a">the shape of</text>
  <text x="530" y="412" font-size="14" text-anchor="middle" fill="#1e3a8a">walking</text>

  <text x="350" y="636" font-size="15" font-style="italic" text-anchor="middle" fill="#1e40af">Step 1 uses the mountain.</text>

  <!-- ================= STEP 1 -> STEP 2 ARROW ================= -->
  <line x1="656" y1="390" x2="738" y2="390" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="697" y="364" font-size="15" font-weight="bold" text-anchor="middle" fill="#334155">frozen</text>
  <text x="697" y="418" font-size="15" font-weight="bold" text-anchor="middle" fill="#334155">encoder</text>

  <!-- ================= STEP 2 ================= -->
  <rect x="750" y="130" width="480" height="530" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="990" y="172" font-size="22" font-weight="bold" text-anchor="middle" fill="#14532d">Step 2: Tiny labeled probe</text>
  <text x="990" y="200" font-size="16" text-anchor="middle" fill="#14532d">reuse the frozen encoder</text>

  <!-- small stack of 68 labeled clips -->
  <g fill="#dcfce7" stroke="#15803d" stroke-width="1.5">
    <rect x="800" y="360" width="150" height="26" rx="5"/>
    <rect x="806" y="392" width="150" height="26" rx="5"/>
  </g>
  <text x="875" y="446" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">only 68</text>
  <text x="875" y="468" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">LABELED clips</text>

  <!-- clips flow into classifier -->
  <line x1="962" y1="386" x2="1030" y2="386" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- small classifier box -->
  <rect x="1040" y="340" width="160" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="1120" y="376" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">small 5-class</text>
  <text x="1120" y="398" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">classifier</text>
  <text x="1120" y="420" font-size="12" text-anchor="middle" fill="#166534">the only trained part</text>

  <text x="990" y="628" font-size="15" font-style="italic" text-anchor="middle" fill="#14532d">Step 2 spends the 68 labels only at the very end.</text>
</svg>
