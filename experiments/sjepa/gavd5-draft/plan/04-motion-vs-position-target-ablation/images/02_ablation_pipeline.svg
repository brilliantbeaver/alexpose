<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>S-JEPA ablation: swap the teacher-lane target representation</title>
  <desc>The student path, masking, view encoder, predictor, and the downstream loss, JEPA cross-entropy plus VICReg plus group term, stay identical. Only the teacher-lane input changes from position patches to motion-difference patches.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#20364e"/>
    </marker>
    <style>
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .u{font:700 16px Arial,Helvetica,sans-serif;fill:#0f2440}
      .wt{font:700 20px Arial,Helvetica,sans-serif;fill:#ffffff}
      .ws{font:14px Arial,Helvetica,sans-serif;fill:#cdd8e4}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .lbl{font:700 14px Arial,Helvetica,sans-serif;fill:#5f9e7e}
      .box{stroke:#20364e;stroke-width:1.75}
      .hot{stroke:#a44c26;stroke-width:1.75}
      .a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .ema{stroke:#5f9e7e;stroke-width:2.5;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="64" y="58" class="h">The ablation is a single swap, not a new pipeline</text>
  <text x="64" y="88" class="s">Orange marks the only box this proposal changes. Every other box is copied unchanged from the current curriculum.</text>

  <!-- Student lane -->
  <text x="64" y="128" class="s">Student path (unchanged)</text>

  <rect x="64" y="156" width="170" height="90" rx="16" fill="#e7f0f8" class="box"/>
  <text x="88" y="192" class="t">Stage batch</text>
  <text x="88" y="219" class="b">stage replay</text>

  <path d="M234 201H274" class="a"/>

  <rect x="290" y="156" width="230" height="90" rx="16" fill="#e7f0f8" class="box"/>
  <text x="314" y="192" class="t">Choose targets</text>
  <text x="314" y="219" class="b">12 landmarks</text>

  <path d="M520 201H580" class="a"/>

  <rect x="596" y="156" width="190" height="90" rx="16" fill="#e7f0f8" class="box"/>
  <text x="620" y="192" class="t">View encoder</text>
  <text x="620" y="219" class="b">masked tokens</text>

  <path d="M786 201H796" class="a"/>

  <rect x="812" y="156" width="170" height="90" rx="16" fill="#ece6f6" class="box"/>
  <text x="836" y="192" class="t">Predictor</text>
  <text x="836" y="219" class="b">guesses latent</text>

  <!-- Teacher lane -->
  <text x="64" y="280" class="s">Teacher path (one box changes)</text>

  <rect x="64" y="308" width="170" height="90" rx="16" fill="#e6f2ea" class="box"/>
  <text x="88" y="344" class="t">Full clip</text>
  <text x="88" y="371" class="b">no masking</text>

  <path d="M234 353H274" class="a"/>

  <rect x="290" y="308" width="260" height="90" rx="16" fill="#f7e7d8" class="hot"/>
  <line x1="290" y1="353" x2="550" y2="353" stroke="#c4cdd8" stroke-width="1.5"/>
  <text x="314" y="337" class="u">(A) Position (now)</text>
  <text x="314" y="382" class="u">(B) Motion (new)</text>

  <path d="M550 353H580" class="a"/>

  <rect x="596" y="308" width="190" height="90" rx="16" fill="#e6f2ea" class="box"/>
  <text x="620" y="344" class="t">EMA encoder</text>
  <text x="620" y="371" class="b">full input</text>

  <path d="M786 353H796" class="a"/>

  <rect x="812" y="308" width="170" height="90" rx="16" fill="#e6f2ea" class="box"/>
  <text x="836" y="344" class="t">Read target</text>
  <text x="836" y="371" class="b">the new target</text>

  <!-- EMA feedback link between the two unchanged encoders -->
  <path d="M691 246V292" class="ema"/>
  <text x="703" y="273" class="lbl">EMA copy</text>

  <!-- Convergence into total loss -->
  <path d="M897 246V266H976" class="a"/>
  <path d="M897 308V288H976" class="a"/>

  <rect x="992" y="225" width="160" height="190" rx="16" fill="#20364e"/>
  <text x="1014" y="257" class="wt">Total loss</text>
  <text x="1014" y="287" class="ws">(unchanged)</text>
  <text x="1014" y="313" class="ws">JEPA</text>
  <text x="1014" y="339" class="ws">+ VICReg</text>
  <text x="1014" y="365" class="ws">+ group (S1-4)</text>

  <!-- Invariants banner -->
  <rect x="64" y="450" width="1088" height="90" rx="16" fill="#20364e"/>
  <text x="90" y="480" class="w">Unchanged: masking sparsity, VICReg weight, five-stage curriculum, 11,400 optimizer updates.</text>
  <text x="90" y="506" class="w" style="font:400 14px Arial,Helvetica,sans-serif;fill:#cdd8e4">Changed: only the orange box, the teacher-lane input representation, position versus motion.</text>
</svg>
