<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How the signed left-right feature is computed</title>
  <desc id="desc">Four steps read left-right joint pairs from the already-cached pose tensors, take the signed difference per time segment, summarize each pair by mean, peak, and peak timing, then concatenate into one 18-dimensional feature.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; fill: #0f2440; }
    .t { font-size: 20px; font-weight: 700; fill: #0f2440; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="58" class="h" text-anchor="start">How the signed left-right feature is computed</text>

  <!-- Row 1, left to right -->
  <rect x="48" y="112" width="524" height="230" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="148" class="t" text-anchor="start">Step 1 &#8212; Matched joint trajectories</text>
  <text x="72" y="174" class="b" text-anchor="start">For each of 6 authorized left-right pairs</text>
  <text x="72" y="200" class="b" text-anchor="start">(shoulder, hip, knee, ankle, heel, foot index),</text>
  <text x="72" y="226" class="b" text-anchor="start">read the cached per-segment coordinates.</text>

  <rect x="628" y="112" width="524" height="230" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text x="652" y="148" class="t" text-anchor="start">Step 2 &#8212; Take the signed difference</text>
  <text x="652" y="174" class="b" text-anchor="start">diff(t) = left(t) - right(t) at each</text>
  <text x="652" y="200" class="b" text-anchor="start">of the 16 time segments. The sign is</text>
  <text x="652" y="226" class="b" text-anchor="start">kept, so left-ahead and right-ahead differ.</text>

  <!-- Row 2 (right to left), under row 1 -->
  <rect x="628" y="398" width="524" height="230" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="652" y="434" class="t" text-anchor="start">Step 3 &#8212; Summarize, keep the timing</text>
  <text x="652" y="460" class="b" text-anchor="start">mean(diff) = average asymmetry</text>
  <text x="652" y="486" class="b" text-anchor="start">peak diff (signed) = worst moment</text>
  <text x="652" y="512" class="b" text-anchor="start">peak time = which of 16 segments</text>

  <rect x="48" y="398" width="524" height="230" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="434" class="t" text-anchor="start">Step 4 &#8212; Concatenate the feature</text>
  <text x="72" y="460" class="b" text-anchor="start">6 pairs &#215; 3 numbers (mean, peak,</text>
  <text x="72" y="486" class="b" text-anchor="start">peak-time) = one 18-dimensional</text>
  <text x="72" y="512" class="b" text-anchor="start">signed-asymmetry feature.</text>

  <!-- Connectors: row1 left-to-right, drop down, row2 right-to-left -->
  <path d="M572,227 L612,227" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M890,342 L890,382" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M628,513 L588,513" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <text x="48" y="668" class="s" text-anchor="start">No new pose tracking and no S-JEPA retraining: everything here reuses data the pipeline already extracted.</text>
</svg>
