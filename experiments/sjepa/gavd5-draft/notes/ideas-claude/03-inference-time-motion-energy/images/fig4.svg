<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t4 d4">
  <title id="t4">The rhythm-regularity axis this study asks the frozen model to see</title>
  <desc id="d4">Two side-by-side cartoons of a walk. On the left, a Parkinson's-style walk with a broken internal clock: the slot-to-slot motion is uneven, so the per-slot motion residual is scattered. On the right, a myopathic walk with a preserved, metronome-steady clock: the slot-to-slot motion is even, so the per-slot motion residual is evenly structured. The study asks whether the frozen predictor's slot-to-slot residual carries a more-regular-versus-less-regular ordering that separates these two ends. This is a within-window relative regularity contrast only, not absolute cadence, which the 64-frame resize erases. All shapes are illustrative, not measured results.</desc>
  <defs>
    <style>
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 22px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .axis{stroke:#20364e;stroke-width:1.75}
      .grid{stroke:#c4cdd8;stroke-width:1}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="60" class="h">The axis this study asks the frozen model to see</text>
  <text x="48" y="90" class="s">Illustrative expected shape. Within-window RELATIVE regularity only, not absolute cadence. All numbers transductive, checkpoint d0acc262.</text>

  <!-- ============ LEFT PANEL: PD, irregular ============ -->
  <rect x="60" y="120" width="520" height="440" rx="18" fill="#ffffff" class="axis" stroke-width="1.75"/>
  <text x="90" y="160" class="t">Parkinson's end: broken autopilot</text>
  <text x="90" y="186" class="s">Loss of automaticity, so stride timing wobbles</text>
  <text x="90" y="206" class="s">(Hausdorff 1998 PMID 9613733). The signal is the</text>
  <text x="90" y="226" class="s">spread of the wobble, not the average speed.</text>

  <!-- per-slot motion residual bars: uneven heights -->
  <text x="90" y="264" class="b">Per-slot motion residual across the 16 time slots</text>
  <!-- baseline y = 470, bars go up; x from 96 to 540, 16 bars width ~24, gap ~4 -->
  <line x1="90" y1="470" x2="548" y2="470" class="axis"/>
  <rect x="96"  y="380" width="24" height="90"  fill="#e07a4b"/>
  <rect x="124" y="330" width="24" height="140" fill="#e07a4b"/>
  <rect x="152" y="420" width="24" height="50"  fill="#e07a4b"/>
  <rect x="180" y="300" width="24" height="170" fill="#e07a4b"/>
  <rect x="208" y="400" width="24" height="70"  fill="#e07a4b"/>
  <rect x="236" y="350" width="24" height="120" fill="#e07a4b"/>
  <rect x="264" y="440" width="24" height="30"  fill="#e07a4b"/>
  <rect x="292" y="310" width="24" height="160" fill="#e07a4b"/>
  <rect x="320" y="390" width="24" height="80"  fill="#e07a4b"/>
  <rect x="348" y="340" width="24" height="130" fill="#e07a4b"/>
  <rect x="376" y="430" width="24" height="40"  fill="#e07a4b"/>
  <rect x="404" y="320" width="24" height="150" fill="#e07a4b"/>
  <rect x="432" y="410" width="24" height="60"  fill="#e07a4b"/>
  <rect x="460" y="360" width="24" height="110" fill="#e07a4b"/>
  <rect x="488" y="300" width="24" height="170" fill="#e07a4b"/>
  <rect x="516" y="420" width="24" height="50"  fill="#e07a4b"/>

  <text x="90" y="512" class="s">Scattered, uneven bars = a less regular rhythm.</text>
  <text x="90" y="536" class="b" fill="#0f2440">High dispersion of the per-slot residual</text>

  <!-- ============ RIGHT PANEL: myopathy, regular ============ -->
  <rect x="620" y="120" width="520" height="440" rx="18" fill="#ffffff" class="axis" stroke-width="1.75"/>
  <text x="650" y="160" class="t">Myopathic end: clock intact</text>
  <text x="650" y="186" class="s">Weak muscles, but no rhythm-generator lesion, so</text>
  <text x="650" y="206" class="s">cadence stays steady (Vandekerckhove 2022 PMID</text>
  <text x="650" y="226" class="s">35721358) and left-right stays symmetric (Xiong 2023).</text>

  <text x="650" y="264" class="b">Per-slot motion residual across the 16 time slots</text>
  <line x1="650" y1="470" x2="1108" y2="470" class="axis"/>
  <rect x="656"  y="370" width="24" height="100" fill="#5f9e7e"/>
  <rect x="684"  y="366" width="24" height="104" fill="#5f9e7e"/>
  <rect x="712"  y="372" width="24" height="98"  fill="#5f9e7e"/>
  <rect x="740"  y="368" width="24" height="102" fill="#5f9e7e"/>
  <rect x="768"  y="370" width="24" height="100" fill="#5f9e7e"/>
  <rect x="796"  y="365" width="24" height="105" fill="#5f9e7e"/>
  <rect x="824"  y="372" width="24" height="98"  fill="#5f9e7e"/>
  <rect x="852"  y="369" width="24" height="101" fill="#5f9e7e"/>
  <rect x="880"  y="367" width="24" height="103" fill="#5f9e7e"/>
  <rect x="908"  y="371" width="24" height="99"  fill="#5f9e7e"/>
  <rect x="936"  y="368" width="24" height="102" fill="#5f9e7e"/>
  <rect x="964"  y="370" width="24" height="100" fill="#5f9e7e"/>
  <rect x="992"  y="366" width="24" height="104" fill="#5f9e7e"/>
  <rect x="1020" y="372" width="24" height="98"  fill="#5f9e7e"/>
  <rect x="1048" y="369" width="24" height="101" fill="#5f9e7e"/>
  <rect x="1076" y="368" width="24" height="102" fill="#5f9e7e"/>

  <text x="650" y="512" class="s">Even, level bars = a metronome-steady rhythm.</text>
  <text x="650" y="536" class="b" fill="#0f2440">Low dispersion of the per-slot residual</text>

  <!-- interpretation banner -->
  <rect x="60" y="596" width="1080" height="64" rx="16" fill="#20364e"/>
  <text x="84" y="626" class="w">The endpoint: does the frozen predictor's slot-to-slot residual carry a more-regular-versus-less-regular ordering</text>
  <text x="84" y="648" class="w">that separates the two ends? It must beat a raw-coordinate speed baseline and survive the time-shuffle control to count.</text>
</svg>
