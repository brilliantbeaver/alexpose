<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t3 d3">
  <title id="t3">Beginner concept: a mirror flips the sign of an honest left-minus-right scale</title>
  <desc id="d3">A gentle three-card picture of the central idea. Card one shows a walker with a stronger left side; an honest left-minus-right scale reads a positive number. Card two shows the same walker seen in a mirror, which swaps left and right; the same honest scale must read the exact opposite, a negative number of the same size. Card three shows a both-sides-equal walker; the scale parks at exactly zero. A footer says this guaranteed sign-flip is what reflection-equivariant means, and that folder labels are dataset annotations, not diagnoses.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
    <style>
      .h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:32px;fill:#0f2440;}
      .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;fill:#0f2440;}
      .b{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#33475e;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5c6f84;}
      .w{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;fill:#ffffff;}
      .ws{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#cdd8e4;}
      .num{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:34px;fill:#0f2440;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="60" class="h">A mirror flips the sign of a left-minus-right scale</text>
  <text x="48" y="88" class="s">Read left to right. An honest "left minus right" scale must flip its reading when you flip the walker in a mirror.</text>

  <!-- ============ CARD 1: stronger-left walker -> positive ============ -->
  <!-- x 48..416, y 120..600 -->
  <rect x="48" y="120" width="368" height="480" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="78" y="156" class="t">1. One side works harder</text>
  <text x="78" y="182" class="b">Left leg does more than right.</text>

  <!-- stick walker, thicker (stronger) LEFT leg. figure centered at x=232 -->
  <!-- head -->
  <circle cx="232" cy="236" r="15" fill="#ffffff" stroke="#20364e" stroke-width="2"/>
  <!-- torso -->
  <line x1="232" y1="251" x2="232" y2="330" stroke="#20364e" stroke-width="2.5"/>
  <!-- arms -->
  <line x1="232" y1="272" x2="200" y2="300" stroke="#20364e" stroke-width="2.5"/>
  <line x1="232" y1="272" x2="264" y2="300" stroke="#20364e" stroke-width="2.5"/>
  <!-- LEFT leg (walker's left = viewer right), drawn strong/orange, wider stride -->
  <line x1="232" y1="330" x2="272" y2="404" stroke="#e07a4b" stroke-width="6"/>
  <!-- RIGHT leg, thin/ink, short stride -->
  <line x1="232" y1="330" x2="210" y2="404" stroke="#20364e" stroke-width="2.5"/>
  <text x="232" y="432" class="s" text-anchor="middle">thick line = stronger side</text>

  <!-- scale readout tile -->
  <rect x="96" y="470" width="272" height="94" rx="12" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="232" y="500" class="s" text-anchor="middle">left minus right scale reads</text>
  <text x="232" y="540" class="num" text-anchor="middle" fill="#a44c26">+ positive</text>

  <!-- arrow card1 -> card2 (through the mirror) -->
  <line x1="416" y1="360" x2="472" y2="360" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ CARD 2: mirrored walker -> negative ============ -->
  <!-- x 488..856, y 120..600 -->
  <rect x="488" y="120" width="368" height="480" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text x="518" y="156" class="t">2. Look in a mirror</text>
  <text x="518" y="182" class="b">Left and right swap places.</text>

  <!-- vertical mirror line down the card center at x=672 -->
  <line x1="672" y1="204" x2="672" y2="412" stroke="#5f9e7e" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="672" y="200" class="s" fill="#5f9e7e" text-anchor="middle">mirror</text>

  <!-- SAME walker mirrored: strong leg now on viewer LEFT. center x=672 -->
  <circle cx="672" cy="236" r="15" fill="#ffffff" stroke="#20364e" stroke-width="2"/>
  <line x1="672" y1="251" x2="672" y2="330" stroke="#20364e" stroke-width="2.5"/>
  <line x1="672" y1="272" x2="640" y2="300" stroke="#20364e" stroke-width="2.5"/>
  <line x1="672" y1="272" x2="704" y2="300" stroke="#20364e" stroke-width="2.5"/>
  <!-- strong leg mirrored to the other side -->
  <line x1="672" y1="330" x2="632" y2="404" stroke="#e07a4b" stroke-width="6"/>
  <line x1="672" y1="330" x2="694" y2="404" stroke="#20364e" stroke-width="2.5"/>
  <text x="672" y="432" class="s" text-anchor="middle">same walker, sides flipped</text>

  <rect x="536" y="470" width="272" height="94" rx="12" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="672" y="500" class="s" text-anchor="middle">same scale now reads</text>
  <text x="672" y="540" class="num" text-anchor="middle" fill="#2f6f99">- negative</text>

  <!-- arrow card2 -> card3 -->
  <line x1="856" y1="360" x2="912" y2="360" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ CARD 3: symmetric walker -> zero ============ -->
  <!-- x 928..1152, y 120..600 -->
  <rect x="928" y="120" width="224" height="480" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="958" y="156" class="t">3. Both sides</text>
  <text x="958" y="180" class="t">equal</text>

  <!-- symmetric walker, both legs same weight/ink, center x=1040 -->
  <circle cx="1040" cy="236" r="15" fill="#ffffff" stroke="#20364e" stroke-width="2"/>
  <line x1="1040" y1="251" x2="1040" y2="330" stroke="#20364e" stroke-width="2.5"/>
  <line x1="1040" y1="272" x2="1012" y2="300" stroke="#20364e" stroke-width="2.5"/>
  <line x1="1040" y1="272" x2="1068" y2="300" stroke="#20364e" stroke-width="2.5"/>
  <line x1="1040" y1="330" x2="1016" y2="404" stroke="#20364e" stroke-width="2.5"/>
  <line x1="1040" y1="330" x2="1064" y2="404" stroke="#20364e" stroke-width="2.5"/>
  <text x="1040" y="432" class="s" text-anchor="middle">both legs alike</text>

  <rect x="956" y="470" width="168" height="94" rx="12" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="1040" y="500" class="s" text-anchor="middle">scale reads</text>
  <text x="1040" y="540" class="num" text-anchor="middle" fill="#5f9e7e">0 zero</text>

  <!-- Footer note -->
  <text x="48" y="644" class="s">That guaranteed flip (plus to minus, same size) is what "reflection-equivariant" means. A both-sides-equal walker parks at exactly zero.</text>
  <text x="48" y="668" class="s">Folder labels (normal, parkinsons, stroke, myopathic, cerebral_palsy) are dataset annotations from GAVD, not diagnoses made here.</text>
</svg>
