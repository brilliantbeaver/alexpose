<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SJEPAGait.forward produces two aligned [B,M,D] tensors</title>
  <desc id="desc">The view path predicts masked positions while the target path selects the matching full-encoder positions without gradients.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; }
    .t { font-size: 20px; font-weight: 700; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .strong { font-weight: 700; fill: #20364e; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 15px; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="48" y="58" class="h" text-anchor="start"><tspan x="48" dy="0">SJEPAGait.forward produces two aligned [B,M,D] tensors</tspan></text>
  <rect x="48" y="112" width="190" height="148" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text x="72" y="148" class="t" text-anchor="start"><tspan x="72" dy="0">view</tspan></text><text x="72" y="184" class="b" text-anchor="start"><tspan x="72" dy="0">[B,F,V,C]</tspan></text><rect x="286" y="112" width="230" height="148" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text x="310" y="148" class="t" text-anchor="start"><tspan x="310" dy="0">view_encoder</tspan></text><text x="310" y="184" class="b" text-anchor="start"><tspan x="310" dy="0">keep ~target_mask</tspan><tspan x="310" dy="26">[B,K,D]</tspan></text><rect x="564" y="112" width="230" height="148" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/><text x="588" y="148" class="t" text-anchor="start"><tspan x="588" dy="0">predictor</tspan></text><text x="588" y="184" class="b" text-anchor="start"><tspan x="588" dy="0">restore N positions</tspan><tspan x="588" dy="26">select M</tspan></text><rect x="842" y="112" width="310" height="148" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/><text x="866" y="148" class="t" text-anchor="start"><tspan x="866" dy="0">predicted</tspan></text><text x="866" y="184" class="b" text-anchor="start"><tspan x="866" dy="0">[B,M,D]</tspan><tspan x="866" dy="26">trainable path</tspan></text><path d="M 238 186 L 270 186" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 516 186 L 548 186" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 794 186 L 826 186" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="398" width="190" height="148" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="72" y="434" class="t" text-anchor="start"><tspan x="72" dy="0">target</tspan></text><text x="72" y="470" class="b" text-anchor="start"><tspan x="72" dy="0">[B,F,V,C]</tspan><tspan x="72" dy="26">cleaned clip</tspan></text><rect x="286" y="398" width="230" height="148" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="310" y="434" class="t" text-anchor="start"><tspan x="310" dy="0">target_encoder</tspan></text><text x="310" y="470" class="b" text-anchor="start"><tspan x="310" dy="0">all N tokens</tspan><tspan x="310" dy="26">[B,N,D]</tspan></text><rect x="564" y="398" width="230" height="148" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="588" y="434" class="t" text-anchor="start"><tspan x="588" dy="0">mask select</tspan></text><text x="588" y="470" class="b" text-anchor="start"><tspan x="588" dy="0">same target_mask</tspan><tspan x="588" dy="26">choose M rows</tspan></text><rect x="842" y="398" width="310" height="148" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="866" y="434" class="t" text-anchor="start"><tspan x="866" dy="0">selected</tspan></text><text x="866" y="470" class="b" text-anchor="start"><tspan x="866" dy="0">[B,M,D]</tspan><tspan x="866" dy="26">no gradient path</tspan></text><path d="M 238 472 L 270 472" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 516 472 L 548 472" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 794 472 L 826 472" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="336" y="620" width="528" height="36" rx="18" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><text x="600.0" y="644" class="s strong" text-anchor="middle"><tspan x="600.0" dy="0">Same mask and flatten order align every pair</tspan></text>
</svg>
