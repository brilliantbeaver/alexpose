<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">S-JEPA learns by matching hidden latent targets</title>
  <desc id="desc">A trainable view encoder and predictor match a slowly updated target encoder at masked joint-time positions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; }
    .t { font-size: 20px; font-weight: 700; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .strong { font-weight: 700; fill: #20364e; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 15px; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="48" y="58" class="h" text-anchor="start"><tspan x="48" dy="0">S-JEPA learns by matching hidden latent targets</tspan></text>
  <rect x="48" y="118" width="240" height="150" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text x="72" y="154" class="t" text-anchor="start"><tspan x="72" dy="0">Augmented view</tspan></text><text x="72" y="190" class="b" text-anchor="start"><tspan x="72" dy="0">[B, F, V, C]</tspan><tspan x="72" dy="26">full coordinates + mask</tspan></text><rect x="344" y="118" width="250" height="150" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text x="368" y="154" class="t" text-anchor="start"><tspan x="368" dy="0">View encoder</tspan></text><text x="368" y="190" class="b" text-anchor="start"><tspan x="368" dy="0">Trainable student</tspan><tspan x="368" dy="26">Returns [B, K, D]</tspan></text><rect x="650" y="118" width="250" height="150" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/><text x="674" y="154" class="t" text-anchor="start"><tspan x="674" dy="0">Predictor</tspan></text><text x="674" y="190" class="b" text-anchor="start"><tspan x="674" dy="0">Restores N positions</tspan><tspan x="674" dy="26">Returns [B, M, D]</tspan></text><rect x="956" y="118" width="196" height="150" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/><text x="980" y="154" class="t" text-anchor="start"><tspan x="980" dy="0">Predictions</tspan></text><text x="980" y="190" class="b" text-anchor="start"><tspan x="980" dy="0">Hidden latent</tspan><tspan x="980" dy="26">vectors</tspan></text><path d="M 288 193 L 328 193" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 594 193 L 634 193" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 900 193 L 940 193" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="400" width="240" height="150" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="72" y="436" class="t" text-anchor="start"><tspan x="72" dy="0">Cleaned target</tspan></text><text x="72" y="472" class="b" text-anchor="start"><tspan x="72" dy="0">Same clip, unmasked</tspan><tspan x="72" dy="26">Not raw ground truth</tspan></text><rect x="344" y="400" width="250" height="150" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="368" y="436" class="t" text-anchor="start"><tspan x="368" dy="0">Target encoder</tspan></text><text x="368" y="472" class="b" text-anchor="start"><tspan x="368" dy="0">No gradients</tspan><tspan x="368" dy="26">Returns [B, N, D]</tspan></text><rect x="650" y="400" width="250" height="150" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="674" y="436" class="t" text-anchor="start"><tspan x="674" dy="0">Select mask rows</tspan></text><text x="674" y="472" class="b" text-anchor="start"><tspan x="674" dy="0">Boolean gather</tspan><tspan x="674" dy="26">Returns [B, M, D]</tspan></text><rect x="956" y="400" width="196" height="150" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="980" y="436" class="t" text-anchor="start"><tspan x="980" dy="0">Targets</tspan></text><text x="980" y="472" class="b" text-anchor="start"><tspan x="980" dy="0">selected teacher</tspan><tspan x="980" dy="26">latent vectors</tspan></text><path d="M 288 475 L 328 475" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 594 475 L 634 475" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 900 475 L 940 475" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 469 284 L 469 330 L 469 384" fill="none" stroke="#5f9e7e" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="477" y="320" class="s" text-anchor="start"><tspan x="477" dy="0">EMA update</tspan></text><rect x="412" y="622" width="376" height="36" rx="18" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><text x="600.0" y="646" class="s strong" text-anchor="middle"><tspan x="600.0" dy="0">Loss compares predictions and targets</tspan></text>
</svg>
