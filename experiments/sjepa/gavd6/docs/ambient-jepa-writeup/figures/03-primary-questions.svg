  <g id="text_6">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243343" x="12.6" y="18.670847" transform="rotate(-0 12.6 18.670847)">Three scientific questions; three uncertain benefits</text>
  </g>
  <g id="text_7">
   <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65717c" x="12.6" y="35.035856" transform="rotate(-0 12.6 35.035856)">Recorded primary comparisons reuse the same 14 development people and 3 seeds</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243343" x="17.64" y="80.262" transform="rotate(-0 17.64 80.262)">1  Does feature prediction help?</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243343" x="17.64" y="98.9352" transform="rotate(-0 17.64 98.9352)">Core JEPA/change versus direct/change</text>
  </g>
  <g id="text_10">
   <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65717c" x="17.64" y="114.9876" transform="rotate(-0 17.64 114.9876)">Response · crossed person/seed 95% interval</text>
  </g>
  <g id="text_11">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #65717c" x="411.768" y="68.796" transform="rotate(-0 411.768 68.796)">0.69 [-0.64, 1.98]°</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243343" x="17.64" y="154.9548" transform="rotate(-0 17.64 154.9548)">2  Does a feature difference help?</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243343" x="17.64" y="173.628" transform="rotate(-0 17.64 173.628)">Delta/change versus endpoint/change</text>
  </g>
  <g id="text_14">
   <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65717c" x="17.64" y="189.6804" transform="rotate(-0 17.64 189.6804)">Response · crossed person/seed 95% interval</text>
  </g>
  <g id="text_15">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d55e00" x="411.768" y="143.4888" transform="rotate(-0 411.768 143.4888)">0.37 [-1.11, 1.76]°</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243343" x="17.64" y="229.6476" transform="rotate(-0 17.64 229.6476)">3  Does dense supervision help?</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243343" x="17.64" y="248.3208" transform="rotate(-0 17.64 248.3208)">Delta/dense versus delta/low scalar</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #65717c" x="17.64" y="264.3732" transform="rotate(-0 17.64 264.3732)">ViTPose trajectory · person-t 95% interval</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d55e00" x="411.768" y="218.1816" transform="rotate(-0 411.768 218.1816)">0.28 [-0.19, 0.75]°</text>
  </g>
  <g id="text_20">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #65717c" transform="translate(12.6 307.876187)">Positive gains favor the candidate. Outcomes and interval procedures differ; there is no pooled effect.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #65717c" transform="translate(12.6 317.74625)">Every interval crosses zero. The first comparison uses direct/change, not the stronger direct-coordinate model.</text>
  </g>
