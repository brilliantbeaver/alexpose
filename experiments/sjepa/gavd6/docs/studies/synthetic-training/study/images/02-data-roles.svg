<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Different data serve different scientific roles</title><desc id="desc">Synthetic reference errors teach the source selector; target reference labels never enter lesson choice.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53677b"/></marker></defs>
<rect width="1200" height="490" fill="white"/>
<text x="36" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#172b40">Different data serve different scientific roles</text>
<text x="36" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#53677b">Synthetic reference errors teach the source selector; target reference labels never enter lesson choice.</text>
<rect x="36" y="120" width="540" height="140" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="306.0" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Training images</text>
<text x="306.0" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Labeled AMASS probe and candidate lessons</text>
<text x="306.0" y="212" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Labeled COCO replay retains real-image training</text>
<rect x="624" y="120" width="540" height="140" rx="14" fill="#fff4e7" stroke="#d5dfe7"/>
<text x="894.0" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Source diagnostic bank</text>
<text x="894.0" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Separate labeled synthetic images</text>
<text x="894.0" y="212" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Measures known weaknesses before and after the probe</text>
<rect x="36" y="305" width="540" height="140" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="306.0" y="339" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Unlabeled context</text>
<text x="306.0" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Predictions before/after + frozen visual descriptors</text>
<text x="306.0" y="397" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Describes the setting without reference coordinates</text>
<rect x="624" y="305" width="540" height="140" rx="14" fill="#eaf7f3" stroke="#d5dfe7"/>
<text x="894.0" y="339" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Separate reference images</text>
<text x="894.0" y="370" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Source: measure branch gains for fitting/validation</text>
<text x="894.0" y="397" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Real: score frozen choices only; not selector inputs</text>
</svg>