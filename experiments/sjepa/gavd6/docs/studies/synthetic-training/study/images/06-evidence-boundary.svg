<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">What has been measured, and what remains unconfirmed</title><desc id="desc">The retained results cover source adaptation and synthetic validation, not real-video transfer.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53677b"/></marker></defs>
<rect width="1200" height="400" fill="white"/>
<text x="36" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#172b40">What has been measured, and what remains unconfirmed</text>
<text x="36" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#53677b">The retained results cover source adaptation and synthetic validation, not real-video transfer.</text>
<rect x="36" y="125" width="350" height="176" rx="14" fill="#eaf7f3" stroke="#d5dfe7"/>
<text x="211.0" y="159" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Completed source trials</text>
<text x="211.0" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">RTMPose-M + HRNet-W32: fitting</text>
<text x="211.0" y="217" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">RTMPose-S + HRNet-W48: validation</text>
<text x="211.0" y="244" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">24 recurring synthetic conditions</text>
<text x="211.0" y="271" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">One training seed: 17</text>
<rect x="426" y="125" width="350" height="176" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="601.0" y="159" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Observed pilot conclusion</text>
<text x="601.0" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Some synthetic policies beat replay</text>
<text x="601.0" y="217" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Scene selection beats full response</text>
<text x="601.0" y="244" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">No useful response increment shown</text>
<text x="601.0" y="271" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Repeated rows are not new people</text>
<rect x="816" y="125" width="348" height="176" rx="14" fill="#fff4e7" stroke="#d5dfe7"/>
<text x="990.0" y="159" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Real evidence still needed</text>
<text x="990.0" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Unlabeled GAVD lesson choice</text>
<text x="990.0" y="217" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Independent landmark annotations</text>
<text x="990.0" y="244" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Held ViTPose-family evaluation</text>
<text x="990.0" y="271" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Protected recording confirmation</text>
<polyline points="386,214 426,214" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="776,214 816,214" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="600" y="365" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#53677b">No trained skeleton JEPA, temporal restoration or clinical efficacy claim follows from this pilot.</text>
</svg>