<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="345" viewBox="0 0 1200 345" role="img" aria-labelledby="title desc">
<title id="title">Does a short practice lesson reveal what to teach next?</title><desc id="desc">Study hypothesis: prediction changes could reveal useful lesson preferences.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53677b"/></marker></defs>
<rect width="1200" height="345" fill="white"/>
<text x="36" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#172b40">Does a short practice lesson reveal what to teach next?</text>
<text x="36" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#53677b">Study hypothesis: prediction changes could reveal useful lesson preferences.</text>
<rect x="36" y="130" width="229" height="120" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="150.5" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Pretrained student</text>
<text x="150.5" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Image pose estimator</text>
<rect x="335" y="130" width="229" height="120" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="449.5" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Common probe</text>
<text x="449.5" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Small, shared</text>
<text x="449.5" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">training intervention</text>
<rect x="635" y="130" width="229" height="120" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="749.5" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Observed response</text>
<text x="749.5" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Predictions after</text>
<text x="749.5" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">minus predictions before</text>
<rect x="935" y="130" width="229" height="120" rx="14" fill="#eaf7f3" stroke="#d5dfe7"/>
<text x="1049.5" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Select a lesson</text>
<text x="1049.5" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Predict benefit</text>
<text x="1049.5" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">over replay</text>
<polyline points="265,190 335,190" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="564,190 635,190" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="864,190 935,190" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="310" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#53677b">A change in prediction is observable without labels; whether it is an improvement is not.</text>
</svg>