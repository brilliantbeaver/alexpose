<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Learn from source outcomes; select without target answers</title><desc id="desc">The selector predicts a gain for each lesson. Replay is the zero-gain fallback.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53677b"/></marker></defs>
<rect width="1200" height="620" fill="white"/>
<text x="36" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#172b40">Learn from source outcomes; select without target answers</text>
<text x="36" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#53677b">The selector predicts a gain for each lesson. Replay is the zero-gain fallback.</text>
<text x="36" y="119" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#2862ba">A  SOURCE FITTING</text>
<rect x="36" y="145" width="335" height="135" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="203.5" y="179" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Source features</text>
<text x="203.5" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Context + current predictions</text>
<text x="203.5" y="237" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Probe response + diagnostics</text>
<text x="203.5" y="264" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Training progress + descriptors</text>
<rect x="36" y="322" width="335" height="120" rx="14" fill="#eaf7f3" stroke="#d5dfe7"/>
<text x="203.5" y="356" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Source gain targets</text>
<text x="203.5" y="387" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Replay error minus lesson error</text>
<text x="203.5" y="414" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Measured on separate references</text>
<rect x="490" y="222" width="260" height="140" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="620.0" y="256" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Fit gain predictor</text>
<text x="620.0" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Standardize source features</text>
<text x="620.0" y="314" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Nearest neighbors or ridge</text>
<text x="620.0" y="341" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">One gain per lesson</text>
<rect x="850" y="222" width="314" height="140" rx="14" fill="#fff4e7" stroke="#d5dfe7"/>
<text x="1007.0" y="256" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Validation students</text>
<text x="1007.0" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Select settings and update budget</text>
<text x="1007.0" y="314" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Then freeze the selector</text>
<text x="1007.0" y="341" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Reported results use this panel</text>
<polyline points="371,209 421,209 421,256 490,256" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="371,382 421,382 421,324 490,324" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="750,292 850,292" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="36" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#2862ba">B  INTENDED REAL DEPLOYMENT — NOT ESTABLISHED BY THE RETAINED RESULTS</text>
<rect x="36" y="513" width="280" height="87" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="176.0" y="547" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">New context + response</text>
<text x="176.0" y="578" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">No real reference coordinates</text>
<rect x="392" y="513" width="320" height="87" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="552.0" y="547" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Frozen gain predictor</text>
<text x="552.0" y="578" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Choose largest positive gain</text>
<rect x="792" y="513" width="372" height="87" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="978.0" y="547" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Run the chosen lesson</text>
<text x="978.0" y="578" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Use replay if no predicted gain is positive</text>
<polyline points="316,555 392,555" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="712,555 792,555" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>