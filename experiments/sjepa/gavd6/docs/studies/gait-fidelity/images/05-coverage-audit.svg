<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc">
<title id="title">Audit every joint at every time position</title><desc id="desc">A changing mask can still leave the same central tokens rarely visible.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536777"/></marker></defs>
<rect width="1000" height="445" fill="white"/>
<text x="32" y="40" font-family="Arial, sans-serif" font-size="27" fill="#183247" text-anchor="start" font-weight="bold">Audit every joint at every time position</text>
<text x="32" y="72" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="start" font-weight="normal">A changing mask can still leave the same central tokens rarely visible.</text>
<rect x="32" y="130" width="280" height="136" rx="12" fill="#fff5e6" stroke="#d5e0e7"/>
<text x="172.0" y="162" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Window-level count</text>
<text x="172.0" y="194" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">“Hip seen at least once”</text>
<text x="172.0" y="221" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Can hide central starvation</text>
<rect x="360" y="130" width="280" height="136" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="500.0" y="162" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Joint × time coverage</text>
<text x="500.0" y="194" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Count context and targets</text>
<text x="500.0" y="221" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Across an advancing RNG</text>
<rect x="688" y="130" width="280" height="136" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="828.0" y="162" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Accept the sampler</text>
<text x="828.0" y="194" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Both roles if eligible</text>
<text x="828.0" y="221" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Check paired-side balance</text>
<polyline points="312,198 360,198" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="640,198 688,198" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="320" font-family="Arial, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal">Retain achieved mask rate, span lengths, rejection rate and natural missingness.</text>
<rect x="95" y="354" width="810" height="57" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="500" y="390" font-family="Arial, sans-serif" font-size="20" fill="#183247" text-anchor="middle" font-weight="bold">No permanent hip or ankle mask. Verify this empirically before training.</text>
</svg>