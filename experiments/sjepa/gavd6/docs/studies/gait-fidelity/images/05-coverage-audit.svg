<title id="title">Check what hidden input and scaling change</title><desc id="desc">DIAGNOSTIC. The left schematic tracks how often each joint and time block is available. The right control repeats identical raw observations and references with independent hidden-input patterns and input-derived normalization. Teacher feature differences then isolate normalization, while student differences also include hidden context. No measured results are shown.</desc>
