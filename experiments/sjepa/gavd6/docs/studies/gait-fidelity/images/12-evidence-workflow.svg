<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685" role="img" aria-labelledby="title desc">
<title id="title">Set loss weights on training data, then run the comparison</title><desc id="desc">FOLLOW-UP. Calibration sets one fixed weight for each added loss; model weights do not update during this step.</desc>
