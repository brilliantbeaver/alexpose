<text x="741" y="293" font-family="Arial, sans-serif" font-size="26" fill="#183247" text-anchor="middle" font-weight="bold">Train</text>
<text x="741" y="332" font-family="Arial, sans-serif" font-size="20" fill="#566978" text-anchor="middle" font-weight="normal">18 phases</text>
