<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Advance from verified inputs to a frozen comparison</title><desc id="desc">New masks and real-video references must pass their checks before any new efficacy claim.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536777"/></marker></defs>
<rect width="1000" height="440" fill="white"/>
<text x="32" y="40" font-family="Arial, sans-serif" font-size="27" fill="#183247" text-anchor="start" font-weight="bold">Advance from verified inputs to a frozen comparison</text>
<text x="32" y="72" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="start" font-weight="normal">New masks and real-video references must pass their checks before any new efficacy claim.</text>
<rect x="32" y="135" width="192" height="151" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="128.0" y="167" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Audit inputs</text>
<text x="128.0" y="199" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Anatomy + time</text>
<text x="128.0" y="226" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Groups + rights</text>
<rect x="280" y="135" width="192" height="151" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="376.0" y="167" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Check masks</text>
<text x="376.0" y="199" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Coverage audit</text>
<text x="376.0" y="226" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Gradient check</text>
<rect x="528" y="135" width="192" height="151" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="624.0" y="167" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Compare on dev</text>
<text x="624.0" y="199" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Position + response</text>
<text x="624.0" y="226" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Matched controls</text>
<rect x="776" y="135" width="192" height="151" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="872.0" y="167" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Confirm once</text>
<text x="872.0" y="199" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Freeze protocol</text>
<text x="872.0" y="226" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Fresh source groups</text>
<polyline points="224,211 280,211" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="472,211 528,211" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="720,211 776,211" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="346" font-family="Arial, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal">Choose useful margins from reference precision; repeated renders are not new people.</text>
<text x="500" y="394" font-family="Arial, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal">If references cannot resolve the endpoint, retain a bounded engineering conclusion.</text>
</svg>