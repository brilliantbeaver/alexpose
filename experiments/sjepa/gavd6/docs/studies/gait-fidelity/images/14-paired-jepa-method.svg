<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="992" viewBox="0 0 1200 992" role="img" aria-labelledby="title desc">
<title id="title">Predict reference features, then learn coordinate corrections</title><desc id="desc">Paired JEPA is a proposed mechanism to test against matched coordinate training and simpler controls.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536879"/></marker></defs>
<rect width="1200" height="992" fill="white"/>
<text x="36" y="43" font-family="Arial, sans-serif" font-size="30" fill="#173247" text-anchor="start" font-weight="bold">Predict reference features, then learn coordinate corrections</text>
<text x="36" y="78" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Paired JEPA is a proposed mechanism to test against matched coordinate training and simpler controls.</text>
<rect x="24" y="106" width="1152" height="499" rx="12" fill="#f7fafc" stroke="#cfdce5"/>
<text x="42" y="142" font-family="Arial, sans-serif" font-size="24" fill="#173247" text-anchor="start" font-weight="bold">1. Pretraining: learn from paired observations and synthetic references</text>
<rect x="42" y="184" width="240" height="140" rx="12" fill="#edf3fb" stroke="#cfdce5"/>
<text x="60" y="218" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Observed pose track</text>
<text x="60" y="252" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Hide sampled tokens</text>
<text x="60" y="281" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Separate missingness</text>
<rect x="340" y="184" width="214" height="140" rx="12" fill="#edf3fb" stroke="#cfdce5"/>
<text x="358" y="218" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Student encoder</text>
<text x="358" y="252" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Turns context into</text>
<text x="358" y="281" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">numerical features</text>
<rect x="614" y="184" width="212" height="140" rx="12" fill="#edf3fb" stroke="#cfdce5"/>
<text x="632" y="218" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Predictor</text>
<text x="632" y="252" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Estimates reference</text>
<text x="632" y="281" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">features at queries</text>
<rect x="884" y="184" width="272" height="140" rx="12" fill="#edf3fb" stroke="#cfdce5"/>
<text x="902" y="218" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Predicted features</text>
<text x="902" y="252" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">No reference coordinates</text>
<text x="902" y="281" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">enter the student</text>
<polyline points="282,255 340,255" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="554,255 614,255" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="826,255 884,255" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="42" y="397" width="240" height="142" rx="12" fill="#e9f5f1" stroke="#cfdce5"/>
<text x="60" y="431" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Projected reference</text>
<text x="60" y="465" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Valid joints; paired time</text>
<text x="60" y="494" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Training input only</text>
<rect x="340" y="397" width="214" height="142" rx="12" fill="#e9f5f1" stroke="#cfdce5"/>
<text x="358" y="431" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Teacher encoder</text>
<text x="358" y="465" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Slow copy of student</text>
<text x="358" y="494" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">No loss gradient</text>
<rect x="614" y="397" width="212" height="142" rx="12" fill="#e9f5f1" stroke="#cfdce5"/>
<text x="632" y="431" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Target features</text>
<text x="632" y="465" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Summaries of valid</text>
<text x="632" y="494" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">reference sequences</text>
<rect x="884" y="397" width="272" height="142" rx="12" fill="#fff4e5" stroke="#cfdce5"/>
<text x="902" y="431" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Feature prediction loss</text>
<text x="902" y="465" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Compare eligible queries</text>
<text x="902" y="494" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Scale by valid target count</text>
<polyline points="282,468 340,468" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="554,468 614,468" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="826,468 884,468" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1018,324 1018,397" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="447,324 447,397" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="470" y="355" font-family="Arial, sans-serif" font-size="18" fill="#536879" text-anchor="start" font-weight="normal">EMA: gradual</text>
<text x="470" y="380" font-family="Arial, sans-serif" font-size="18" fill="#536879" text-anchor="start" font-weight="normal">weight update</text>
<text x="42" y="560" font-family="Arial, sans-serif" font-size="18" fill="#536879" text-anchor="start" font-weight="normal">EMA means exponential moving average: gradual teacher weight updates with no loss gradient.</text>
<text x="42" y="588" font-family="Arial, sans-serif" font-size="18" fill="#536879" text-anchor="start" font-weight="normal">Queries are locations to predict. A token is one joint over a short time block; invalid targets are excluded.</text>
<rect x="24" y="633" width="1152" height="335" rx="12" fill="#f7fafc" stroke="#cfdce5"/>
<text x="42" y="672" font-family="Arial, sans-serif" font-size="24" fill="#173247" text-anchor="start" font-weight="bold">2. Coordinate fitting and deployment</text>
<text x="42" y="709" font-family="Arial, sans-serif" font-size="20" fill="#536879" text-anchor="start" font-weight="normal">Fix the learned encoder; reference coordinates supervise the output network during training only.</text>
<rect x="42" y="750" width="240" height="134" rx="12" fill="#edf3fb" stroke="#cfdce5"/>
<text x="60" y="784" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Observed pose track</text>
<text x="60" y="818" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Coordinates + times</text>
<text x="60" y="847" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Availability indicators</text>
<rect x="340" y="750" width="214" height="134" rx="12" fill="#edf3fb" stroke="#cfdce5"/>
<text x="358" y="784" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Frozen encoder</text>
<text x="358" y="818" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Weights remain fixed</text>
<text x="358" y="847" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Produces features</text>
<rect x="614" y="750" width="240" height="134" rx="12" fill="#e9f5f1" stroke="#cfdce5"/>
<text x="632" y="784" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Coordinate readout</text>
<text x="632" y="818" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Learns joint corrections</text>
<text x="632" y="847" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">from those features</text>
<rect x="914" y="750" width="242" height="134" rx="12" fill="#e9f5f1" stroke="#cfdce5"/>
<text x="932" y="784" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="start" font-weight="bold">Restored trajectory</text>
<text x="932" y="818" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Return to input units</text>
<text x="932" y="847" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Measure gait afterward</text>
<polyline points="282,815 340,815" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="554,815 614,815" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="854,815 914,815" fill="none" stroke="#536879" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="929" font-family="Arial, sans-serif" font-size="21" fill="#173247" text-anchor="middle" font-weight="bold">Deployment follows this lower row without reference inputs or teacher features.</text>
</svg>