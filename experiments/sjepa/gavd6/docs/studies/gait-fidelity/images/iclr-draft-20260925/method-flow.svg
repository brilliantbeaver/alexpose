<text x="121.5" y="356" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#1c2c37" text-anchor="middle">no artificial masking</text>
<rect x="280" y="304" width="170" height="70" rx="4" fill="#f0f5f8" stroke="#becbd4"/>
<text x="365.0" y="331" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1c2c37" text-anchor="middle">Frozen encoder</text>
<text x="365.0" y="356" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#1c2c37" text-anchor="middle">learned features</text>
<rect x="502" y="304" width="170" height="70" rx="4" fill="#f0f5f8" stroke="#becbd4"/>
<text x="587.0" y="331" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1c2c37" text-anchor="middle">Fitted readout</text>
<text x="587.0" y="356" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#1c2c37" text-anchor="middle">coordinate output</text>
<rect x="745" y="304" width="260" height="70" rx="4" fill="#edf6f2" stroke="#becbd4"/>
<text x="875.0" y="331" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1c2c37" text-anchor="middle">Restored trajectory</text>
<text x="875.0" y="356" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#1c2c37" text-anchor="middle">12 joints × 128 frames</text>
