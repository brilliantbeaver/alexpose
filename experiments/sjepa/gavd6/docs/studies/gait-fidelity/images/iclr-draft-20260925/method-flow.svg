<polyline points="450,339 502,339" fill="none" stroke="#526571" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="672,339 745,339" fill="none" stroke="#526571" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="120,374 120,408 875,408 875,374" fill="none" stroke="#526571" stroke-width="1.8" marker-end="url(#arrow)"/>
