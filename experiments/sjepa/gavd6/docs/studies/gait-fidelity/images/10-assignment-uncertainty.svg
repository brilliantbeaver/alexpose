<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Uncertain anatomical side can reverse a signed measure</title><desc id="desc">DEFERRED. A bilateral interpretation extension requires independent side evidence.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#566978"/></marker></defs>
<rect width="1200" height="620" fill="#fcfcf9"/>
<rect x="36" y="18" width="146" height="30" rx="5" fill="#fbf1de" stroke="none"/>
<text x="48" y="40" font-family="Arial, sans-serif" font-size="18" fill="#986325" text-anchor="start" font-weight="bold">DEFERRED</text>
<text x="1164" y="40" font-family="Arial, sans-serif" font-size="18" fill="#566978" text-anchor="end" font-weight="normal">CONCEPTUAL · RESULTS PENDING</text>
<text x="36" y="91" font-family="Arial, sans-serif" font-size="32" fill="#183247" text-anchor="start" font-weight="bold">Uncertain anatomical side can reverse a signed measure</text>
<text x="36" y="124" font-family="Arial, sans-serif" font-size="20" fill="#566978" text-anchor="start" font-weight="normal">A bilateral interpretation extension requires independent side evidence.</text>
<rect x="36" y="167" width="456" height="353" rx="12" fill="white" stroke="#d9e2e5"/>
<text x="56" y="201" font-family="Arial, sans-serif" font-size="23" fill="#183247" text-anchor="start" font-weight="bold">Two plausible assignments</text>
<text x="73" y="265" font-family="Arial, sans-serif" font-size="22" fill="#183247" text-anchor="start" font-weight="bold">Assignment 1</text>
<text x="73" y="393" font-family="Arial, sans-serif" font-size="22" fill="#183247" text-anchor="start" font-weight="bold">Assignment 2</text>
<circle cx="383" cy="260" r="45" fill="#e7f4ef" stroke="#007f79" stroke-width="2"/>
<text x="383" y="271" font-family="Arial, sans-serif" font-size="31" fill="#007f79" text-anchor="middle" font-weight="bold">+a</text>
<circle cx="383" cy="388" r="45" fill="#edf0fa" stroke="#4c60af" stroke-width="2"/>
<text x="383" y="399" font-family="Arial, sans-serif" font-size="31" fill="#4c60af" text-anchor="middle" font-weight="bold">−a</text>
<text x="264" y="475" font-family="Arial, sans-serif" font-size="20" fill="#566978" text-anchor="middle" font-weight="normal">Illustrative equal probabilities</text>
<rect x="573" y="167" width="591" height="353" rx="12" fill="#fbf1de" stroke="#d9e2e5"/>
<text x="593" y="201" font-family="Arial, sans-serif" font-size="23" fill="#183247" text-anchor="start" font-weight="bold">A zero average can hide ambiguity</text>
<polyline points="681.00,326.00 1052.00,326.00" fill="none" stroke="#d9e2e5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="731" cy="326" r="15" fill="#4c60af" stroke="white" stroke-width="2"/>
<circle cx="1004" cy="326" r="15" fill="#007f79" stroke="white" stroke-width="2"/>
<text x="731" y="374" font-family="Arial, sans-serif" font-size="25" fill="#4c60af" text-anchor="middle" font-weight="normal">−a</text>
<text x="868" y="374" font-family="Arial, sans-serif" font-size="25" fill="#566978" text-anchor="middle" font-weight="normal">0</text>
<text x="1004" y="374" font-family="Arial, sans-serif" font-size="25" fill="#007f79" text-anchor="middle" font-weight="normal">+a</text>
<polyline points="868.00,309.00 868.00,341.00" fill="none" stroke="#566978" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="869" y="444" font-family="Arial, sans-serif" font-size="24" fill="#183247" text-anchor="middle" font-weight="bold">Magnitude a in both hypotheses</text>
<polyline points="492.00,342.00 573.00,342.00" fill="none" stroke="#566978" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<polyline points="36.00,563.00 1164.00,563.00" fill="none" stroke="#d9e2e5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="36" y="594" font-family="Arial, sans-serif" font-size="19" fill="#566978" text-anchor="start" font-weight="normal">The synthetic follow-up uses the parent&#x27;s anatomical references; it adds no side-assignment model.</text>
</svg>