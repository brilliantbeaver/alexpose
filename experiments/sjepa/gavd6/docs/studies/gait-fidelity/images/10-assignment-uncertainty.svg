<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Retain plausible side assignments before measuring gait</title><desc id="desc">Illustrative case: two equally plausible assignments imply opposite signed differences.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536777"/></marker></defs>
<rect width="1000" height="450" fill="white"/>
<text x="32" y="40" font-family="Arial, sans-serif" font-size="27" fill="#183247" text-anchor="start" font-weight="bold">Retain plausible side assignments before measuring gait</text>
<text x="32" y="72" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="start" font-weight="normal">Illustrative case: two equally plausible assignments imply opposite signed differences.</text>
<rect x="32" y="135" width="258" height="136" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="161.0" y="167" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Assignment 1</text>
<text x="161.0" y="199" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Signed difference: +a</text>
<text x="161.0" y="226" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Probability: 0.5</text>
<rect x="32" y="294" width="258" height="136" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="161.0" y="326" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Assignment 2</text>
<text x="161.0" y="358" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Signed difference: −a</text>
<text x="161.0" y="385" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Probability: 0.5</text>
<rect x="386" y="138" width="582" height="104" rx="12" fill="#fff5e6" stroke="#d5e0e7"/>
<text x="677.0" y="170" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Signed mean is zero</text>
<text x="677.0" y="202" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">This alone cannot establish a symmetric movement.</text>
<rect x="386" y="298" width="582" height="104" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="677.0" y="330" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Magnitude is a in both assignments</text>
<text x="677.0" y="362" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Measure each hypothesis, then summarize uncertainty.</text>
<polyline points="290,203 337,203 337,282" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="290,362 337,362 337,282" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="337" cy="282" r="5" fill="#536777" stroke="white" stroke-width="2"/>
<polyline points="337,282 360,282 360,190 386,190" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="337,282 360,282 360,350 386,350" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>