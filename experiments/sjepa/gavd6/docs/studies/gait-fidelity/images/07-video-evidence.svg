<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Use the local videos for the claims they can support</title><desc id="desc">Footage and folder labels are available; independent gait references remain to be established.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536777"/></marker></defs>
<rect width="1000" height="470" fill="white"/>
<text x="32" y="40" font-family="Arial, sans-serif" font-size="27" fill="#183247" text-anchor="start" font-weight="bold">Use the local videos for the claims they can support</text>
<text x="32" y="72" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="start" font-weight="normal">Footage and folder labels are available; independent gait references remain to be established.</text>
<rect x="32" y="126" width="292" height="139" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="178.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Available now</text>
<text x="178.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Natural imaging challenges</text>
<text x="178.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Qualitative failure review</text>
<rect x="354" y="126" width="292" height="139" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="500.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">After annotation</text>
<text x="500.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Visible joint / side checks</text>
<text x="500.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Reviewer disagreement</text>
<rect x="676" y="126" width="292" height="139" rx="12" fill="#fff5e6" stroke="#d5e0e7"/>
<text x="822.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Needs added reference</text>
<text x="822.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Clinical measurement error</text>
<text x="822.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Affected side or real change</text>
<text x="500" y="326" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">An MS or PD folder label does not identify an affected limb.</text>
<text x="500" y="366" font-family="Arial, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal">Another pose estimator supplies a comparison, not independent ground truth.</text>
<text x="500" y="414" font-family="Arial, sans-serif" font-size="18" fill="#183247" text-anchor="middle" font-weight="normal">Keep this collection as development until source overlap and rights are reviewed.</text>
</svg>