<polyline points="302,618 302,662" fill="none" stroke="#536575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="302,618 334,618" fill="none" stroke="#536575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="302,662 334,662" fill="none" stroke="#536575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="344" y="598" width="285" height="39" rx="9" fill="#eff5fc" stroke="#dbe4e9" stroke-width="1.4"/>
<rect x="344" y="644" width="285" height="39" rx="9" fill="#edf8f5" stroke="#dbe4e9" stroke-width="1.4"/>
<text x="486.5" y="625" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#265f9e" text-anchor="middle">Coordinate-only readout</text>
<text x="486.5" y="671" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#087e78" text-anchor="middle">Change-supervised readout</text>
<polyline points="631,618 662,618 662,641" fill="none" stroke="#536575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="631,664 662,664 662,641" fill="none" stroke="#536575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="662,641 698,641" fill="none" stroke="#536575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="708" y="598" width="252" height="85" rx="9" fill="#f6f8fa" stroke="#dbe4e9" stroke-width="1.4"/>
<text x="834" y="628" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#183247" text-anchor="middle">Evaluate each readout</text>
<text x="834" y="657" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#536575" text-anchor="middle">Response + trajectories</text>
<text x="500" y="740" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#536575" text-anchor="middle">Deployment: one observed sequence; no partner or clean reference is required.</text>
