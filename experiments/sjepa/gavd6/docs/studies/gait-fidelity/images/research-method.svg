<text x="150.5" y="630" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183247" text-anchor="middle">Frozen encoder</text>
<text x="150.5" y="659" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#536575" text-anchor="middle">Predictor discarded</text>
