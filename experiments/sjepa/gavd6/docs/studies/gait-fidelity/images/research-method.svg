<text x="38" y="395" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183247" text-anchor="start">2  Compare added losses at matched joint–time positions</text>
<rect x="40" y="411" width="445" height="73" rx="9" fill="#edf8f5" stroke="#087e78" stroke-width="1.4"/>
<text x="60" y="440" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#087e78" text-anchor="start">Feature-difference matching</text>
<text x="60" y="469" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#183247" text-anchor="start">Predicted change ≈ reference change</text>
<rect x="515" y="411" width="445" height="73" rx="9" fill="#eff5fc" stroke="#265f9e" stroke-width="1.4"/>
<text x="535" y="440" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#265f9e" text-anchor="start">Independent-state regression</text>
<text x="535" y="469" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#183247" text-anchor="start">Predict each reference state separately</text>
<text x="500" y="510" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#536575" text-anchor="middle">Both keep the original JEPA objective and feature regularization.</text>
<rect x="20" y="546" width="960" height="156" rx="9" fill="#ffffff" stroke="#dbe4e9" stroke-width="1.4"/>
<text x="38" y="578" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183247" text-anchor="start">3  Test what each frozen encoder supports</text>
