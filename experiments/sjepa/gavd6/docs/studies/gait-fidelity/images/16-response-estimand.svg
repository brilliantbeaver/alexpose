<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">Separate distortion of movement change from observation sensitivity</title><desc id="desc">Illustrative arithmetic only: signed right-minus-left knee excursion in the image plane, measured in degrees.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536879"/></marker></defs>
<rect width="1200" height="950" fill="white"/>
<text x="36" y="43" font-family="Arial, sans-serif" font-size="30" fill="#173247" text-anchor="start" font-weight="bold">Separate distortion of movement change from observation sensitivity</text>
<text x="36" y="78" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Illustrative arithmetic only: signed right-minus-left knee excursion in the image plane, measured in degrees.</text>
<rect x="30" y="117" width="1140" height="359" rx="12" fill="#f7fafc" stroke="#cfdce5"/>
<text x="52" y="157" font-family="Arial, sans-serif" font-size="24" fill="#173247" text-anchor="start" font-weight="bold">A. Change the motion; keep the observation condition fixed</text>
<text x="56" y="248" font-family="Arial, sans-serif" font-size="20" fill="#057b75" text-anchor="start" font-weight="bold">Reference</text>
<polyline points="319,242 607,242" fill="none" stroke="#057b75" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="319" cy="242" r="8" fill="#057b75" stroke="white" stroke-width="2"/>
<circle cx="607" cy="242" r="8" fill="#057b75" stroke="white" stroke-width="2"/>
<text x="319" y="218" font-family="Arial, sans-serif" font-size="20" fill="#057b75" text-anchor="middle" font-weight="bold">2°</text>
<text x="607" y="218" font-family="Arial, sans-serif" font-size="20" fill="#057b75" text-anchor="middle" font-weight="bold">6°</text>
<text x="319" y="275" font-family="Arial, sans-serif" font-size="18" fill="#173247" text-anchor="middle" font-weight="normal">Motion A</text>
<text x="607" y="275" font-family="Arial, sans-serif" font-size="18" fill="#173247" text-anchor="middle" font-weight="normal">Motion B</text>
<text x="737" y="249" font-family="Arial, sans-serif" font-size="20" fill="#057b75" text-anchor="end" font-weight="bold">Δ = +4°</text>
<text x="56" y="378" font-family="Arial, sans-serif" font-size="20" fill="#2866a8" text-anchor="start" font-weight="bold">Estimate</text>
<polyline points="355.0,372 499.0,372" fill="none" stroke="#2866a8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="355.0" cy="372" r="8" fill="#2866a8" stroke="white" stroke-width="2"/>
<circle cx="499.0" cy="372" r="8" fill="#2866a8" stroke="white" stroke-width="2"/>
<text x="355.0" y="348" font-family="Arial, sans-serif" font-size="20" fill="#2866a8" text-anchor="middle" font-weight="bold">2.5°</text>
<text x="499.0" y="348" font-family="Arial, sans-serif" font-size="20" fill="#2866a8" text-anchor="middle" font-weight="bold">4.5°</text>
<text x="355.0" y="405" font-family="Arial, sans-serif" font-size="18" fill="#173247" text-anchor="middle" font-weight="normal">Motion A</text>
<text x="499.0" y="405" font-family="Arial, sans-serif" font-size="18" fill="#173247" text-anchor="middle" font-weight="normal">Motion B</text>
<text x="737" y="379" font-family="Arial, sans-serif" font-size="20" fill="#2866a8" text-anchor="end" font-weight="bold">Δ = +2°</text>
<rect x="805" y="198" width="342" height="191" rx="12" fill="#fff4e5" stroke="#cfdce5"/>
<text x="823" y="232" font-family="Arial, sans-serif" font-size="22" fill="#173247" text-anchor="start" font-weight="bold">Response distortion</text>
<text x="823" y="266" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Estimated change − true change</text>
<text x="823" y="295" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">+2° − (+4°) = −2°</text>
<text x="823" y="324" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">The change is underestimated.</text>
<text x="52" y="449" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Baseline measurement error alone cannot describe this loss of movement response.</text>
<rect x="30" y="507" width="1140" height="323" rx="12" fill="#f7fafc" stroke="#cfdce5"/>
<text x="52" y="547" font-family="Arial, sans-serif" font-size="24" fill="#173247" text-anchor="start" font-weight="bold">B. Keep motion B fixed; add image occlusion at the same camera</text>
<text x="56" y="615" font-family="Arial, sans-serif" font-size="20" fill="#057b75" text-anchor="start" font-weight="bold">Reference</text>
<text x="276" y="615" font-family="Arial, sans-serif" font-size="22" fill="#057b75" text-anchor="middle" font-weight="bold">6°</text>
<polyline points="305,608 516,608" fill="none" stroke="#057b75" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="546" y="615" font-family="Arial, sans-serif" font-size="22" fill="#057b75" text-anchor="middle" font-weight="bold">6°</text>
<text x="737" y="615" font-family="Arial, sans-serif" font-size="20" fill="#057b75" text-anchor="end" font-weight="bold">Δ = 0°</text>
<text x="56" y="709" font-family="Arial, sans-serif" font-size="20" fill="#2866a8" text-anchor="start" font-weight="bold">Estimate</text>
<text x="276" y="709" font-family="Arial, sans-serif" font-size="22" fill="#2866a8" text-anchor="middle" font-weight="bold">4.5°</text>
<polyline points="312,702 510,702" fill="none" stroke="#2866a8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="546" y="709" font-family="Arial, sans-serif" font-size="22" fill="#2866a8" text-anchor="middle" font-weight="bold">5.5°</text>
<text x="737" y="709" font-family="Arial, sans-serif" font-size="20" fill="#2866a8" text-anchor="end" font-weight="bold">Δ = +1°</text>
<text x="276" y="750" font-family="Arial, sans-serif" font-size="19" fill="#173247" text-anchor="middle" font-weight="normal">Clean image</text>
<text x="546" y="750" font-family="Arial, sans-serif" font-size="19" fill="#173247" text-anchor="middle" font-weight="normal">Added occlusion</text>
<rect x="805" y="581" width="342" height="191" rx="12" fill="#fff4e5" stroke="#cfdce5"/>
<text x="823" y="615" font-family="Arial, sans-serif" font-size="22" fill="#173247" text-anchor="start" font-weight="bold">Observation-only error</text>
<text x="823" y="649" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">Estimated change − true change</text>
<text x="823" y="678" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">+1° − 0° = +1°</text>
<text x="823" y="707" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">The observation changes error.</text>
<text x="52" y="801" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">If the camera changes, use its own projected reference; a 2D quantity may legitimately change.</text>
<text x="36" y="874" font-family="Arial, sans-serif" font-size="19" fill="#173247" text-anchor="start" font-weight="normal">Knee excursion = 95th − 5th percentile of the 2D hip–knee–ankle angle over a fixed reviewed interval.</text>
<text x="36" y="910" font-family="Arial, sans-serif" font-size="19" fill="#536879" text-anchor="start" font-weight="normal">These image-plane quantities do not establish clinical 3D range of motion or a meaningful treatment effect.</text>
</svg>