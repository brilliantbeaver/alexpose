<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title desc">
<title id="title">Test each frozen encoder with two readout objectives</title>
<desc id="desc">Three pretraining variants are each trained at three seeds, giving nine encoders. Every frozen encoder checkpoint feeds two separately trained readouts: coordinate-only and change-supervised. The primary comparison is feature-difference versus independent-state JEPA with change-supervised readouts. The coordinate-only comparison and interaction with readout objective are secondary analyses. Nine pretraining fits plus eighteen readout fits yield eighteen final models through twenty-seven optimization phases. This diagram describes the design, not a result.</desc>
