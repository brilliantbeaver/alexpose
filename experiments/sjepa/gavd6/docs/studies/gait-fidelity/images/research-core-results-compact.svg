<title id="title">Gait fidelity: completed-core errors</title>
<desc id="desc">Completed-core development results: fourteen people, three training seeds. Both mean-error panels use a zero-to-25-degree scale. Blue circles indicate coordinate loss and open orange diamonds indicate coordinate plus change loss. Direct and JEPA each have two vertically offset points; thin gray connectors link their two fitted means, not individual observations or confidence intervals. Dashed vertical lines show unchanged-pose errors. All displayed means are rounded to one decimal. Lower error is better; means alone do not establish a JEPA improvement. The proposed follow-up has no results.</desc>
