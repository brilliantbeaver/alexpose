<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Split source families before extracting windows</title><desc id="desc">The current 41 filename-derived sources are not verified independent people.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536777"/></marker></defs>
<rect width="1000" height="470" fill="white"/>
<text x="32" y="40" font-family="Arial, sans-serif" font-size="27" fill="#183247" text-anchor="start" font-weight="bold">Split source families before extracting windows</text>
<text x="32" y="72" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="start" font-weight="normal">The current 41 filename-derived sources are not verified independent people.</text>
<rect x="32" y="126" width="268" height="146" rx="12" fill="#fff5e6" stroke="#d5e0e7"/>
<text x="166.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Audit original sources</text>
<text x="166.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Across GAVD and MS / PD</text>
<text x="166.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Link duplicate people if known</text>
<rect x="365" y="126" width="270" height="146" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="500.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Assign one partition</text>
<text x="500.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">All clips from that group</text>
<text x="500.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">All derived versions</text>
<rect x="700" y="126" width="268" height="146" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="834.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Then create windows</text>
<text x="834.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Overlaps stay together</text>
<text x="834.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">No split by frame or clip</text>
<polyline points="300,199 365,199" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="635,199 700,199" fill="none" stroke="#536777" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="198" y="330" width="604" height="97" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="500.0" y="362" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Report uncertainty by source family</text>
<text x="500.0" y="394" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Person identity and cross-source dependence remain unverified</text>
</svg>