<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Preserve the movement being measured</title><desc id="desc">Three different causes of an unusual pose trace require different responses.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#536777"/></marker></defs>
<rect width="1000" height="390" fill="white"/>
<text x="32" y="40" font-family="Arial, sans-serif" font-size="27" fill="#183247" text-anchor="start" font-weight="bold">Preserve the movement being measured</text>
<text x="32" y="72" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="start" font-weight="normal">Three different causes of an unusual pose trace require different responses.</text>
<rect x="32" y="126" width="296" height="146" rx="12" fill="#eaf6f3" stroke="#d5e0e7"/>
<text x="180.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Real movement</text>
<text x="180.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Unequal left / right steps</text>
<text x="180.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Retain the difference</text>
<rect x="352" y="126" width="296" height="146" rx="12" fill="#edf3fb" stroke="#d5e0e7"/>
<text x="500.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Observation error</text>
<text x="500.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Blur, gaps or jitter</text>
<text x="500.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Reduce estimation error</text>
<rect x="672" y="126" width="296" height="146" rx="12" fill="#fff5e6" stroke="#d5e0e7"/>
<text x="820.0" y="158" font-family="Arial, sans-serif" font-size="21" fill="#183247" text-anchor="middle" font-weight="bold">Uncertain side</text>
<text x="820.0" y="190" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Left / right assignment</text>
<text x="820.0" y="217" font-family="Arial, sans-serif" font-size="18" fill="#536777" text-anchor="middle" font-weight="normal">Resolve or report uncertainty</text>
<text x="500" y="332" font-family="Arial, sans-serif" font-size="19" fill="#183247" text-anchor="middle" font-weight="normal">Judge restoration against an independent reference for the named outcome.</text>
</svg>