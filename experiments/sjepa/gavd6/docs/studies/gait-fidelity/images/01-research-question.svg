<title id="title">Can learning movement changes improve pose restoration?</title><desc id="desc">FOLLOW-UP. Two reference-verified movement states feed a residual-coupling pretraining test. A frozen encoder and matched fresh coordinate readout are evaluated for restored movement response and coordinate error. This is a planned comparison, not a result.</desc>
