<svg width="1000" height="560" preserveAspectRatio="xMinYMin meet" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc"><title id="title">03 reflection and time</title><desc id="desc">Four parity classes distinguish anatomical reflection from time reversal. Perfect transformation behavior alone does not prove information retention.</desc>
	<title>...</title>
	<desc>...</desc>
	<clipPath id="clip">
		<rect x="0" y="0" width="1000" height="560"/>
	</clipPath>
	<g id="group" transform="scale(1,-1) translate(0,-560)" style="clip-path: url(#clip)">
		<g transform="">
			<rect x="0" y="0" width="1000" height="560" rx="10" ry="10" style="stroke: none; stroke-linecap: butt; stroke-width: 1.2; fill: rgb(96%,97%,98%); fill-rule: evenodd;"/>
			<text x="35" y="522" style="font-family: Helvetica-Bold; font-size: 25px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,1044) scale(1,-1)">Left-right sensitivity does not establish temporal-order sensitivity</text>
			<text x="35" y="492" style="font-family: Helvetica; font-size: 15px;fill: rgb(32%,40%,45%); stroke:none;" transform="translate(0,984) scale(1,-1)">Schematic observables under anatomical reflection M and time reversal T.</text>
			<text x="306" y="441" style="font-family: Helvetica-Bold; font-size: 19px;fill: rgb(3%,49%,54%); stroke:none;" transform="translate(0,882) scale(1,-1)">Reflection-even</text>
			<text x="640" y="441" style="font-family: Helvetica-Bold; font-size: 19px;fill: rgb(47%,32%,64%); stroke:none;" transform="translate(0,882) scale(1,-1)">Reflection-odd</text>
			<text x="35" y="346" style="font-family: Helvetica-Bold; font-size: 18px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,692) scale(1,-1)">Time-even</text>
			<text x="35" y="186" style="font-family: Helvetica-Bold; font-size: 18px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,372) scale(1,-1)">Time-odd</text>
			<rect x="225" y="283" width="340" height="132" rx="10" ry="10" style="stroke: rgb(80%,85%,89%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(90%,95%,95%); fill-rule: evenodd;"/>
			<text x="243" y="384" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,768) scale(1,-1)">Overall median speed</text>
			<text x="243" y="349" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,698) scale(1,-1)">Keeps its sign under M and T.</text>
			<text x="243" y="322" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,644) scale(1,-1)">Magnitude can ignore ordering.</text>
			<rect x="590" y="283" width="340" height="132" rx="10" ry="10" style="stroke: rgb(80%,85%,89%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(94%,92%,96%); fill-rule: evenodd;"/>
			<text x="608" y="384" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,768) scale(1,-1)">Left-right speed contrast</text>
			<text x="608" y="349" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,698) scale(1,-1)">Changes sign under M.</text>
			<text x="608" y="322" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,644) scale(1,-1)">Unchanged under reversal T.</text>
			<rect x="225" y="123" width="340" height="132" rx="10" ry="10" style="stroke: rgb(80%,85%,89%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(90%,95%,95%); fill-rule: evenodd;"/>
			<text x="243" y="224" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,448) scale(1,-1)">Mean vertical displacement</text>
			<text x="243" y="189" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,378) scale(1,-1)">Unchanged by anatomical M.</text>
			<text x="243" y="162" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,324) scale(1,-1)">Changes sign under reversal T.</text>
			<rect x="590" y="123" width="340" height="132" rx="10" ry="10" style="stroke: rgb(80%,85%,89%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(94%,92%,96%); fill-rule: evenodd;"/>
			<text x="608" y="224" style="font-family: Helvetica-Bold; font-size: 17px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,448) scale(1,-1)">Left-right displacement contrast</text>
			<text x="608" y="189" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,378) scale(1,-1)">Changes sign under M and T.</text>
			<text x="608" y="162" style="font-family: Helvetica; font-size: 15px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,324) scale(1,-1)">A direction-sensitive observable.</text>
			<rect x="35" y="39" width="930" height="52" rx="10" ry="10" style="stroke: rgb(80%,85%,89%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="55" y="59" style="font-family: Helvetica-Bold; font-size: 18px;fill: rgb(9%,16%,22%); stroke:none;" transform="translate(0,118) scale(1,-1)">Exact symmetry can hold for a zero representation. Accuracy must be tested separately.</text>
			<text x="35" y="12" style="font-family: Helvetica; font-size: 13px;fill: rgb(32%,40%,45%); stroke:none;" transform="translate(0,24) scale(1,-1)">T is an analysis operation on a bounded sequence, not a label-preserving forecast augmentation.</text>
		</g>
	</g>
