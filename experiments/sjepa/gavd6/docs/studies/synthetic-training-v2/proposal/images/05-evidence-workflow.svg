<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Advance on evidence; retain useful negative results</title><desc id="desc">Planned stages: a successful software run does not establish a scientific benefit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#53677b"/></marker></defs>
<rect width="1200" height="590" fill="white"/>
<text x="36" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#172b40">Advance on evidence; retain useful negative results</text>
<text x="36" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#53677b">Planned stages: a successful software run does not establish a scientific benefit.</text>
<rect x="36" y="130" width="230" height="116" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="151.0" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Validate pairs</text>
<text x="151.0" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Anatomy, time, splits</text>
<text x="151.0" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Input / target isolation</text>
<rect x="335" y="130" width="250" height="116" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="460.0" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Compare methods</text>
<text x="460.0" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Strong direct baselines</text>
<text x="460.0" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Matched JEPA test</text>
<rect x="655" y="130" width="240" height="116" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="775.0" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Repeat finalists</text>
<text x="775.0" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Three training seeds</text>
<text x="775.0" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Held people / extractor</text>
<rect x="965" y="130" width="199" height="116" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="1064.5" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Real-data check</text>
<text x="1064.5" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Development labels</text>
<text x="1064.5" y="222" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Check preservation</text>
<polyline points="266,188 335,188" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="585,188 655,188" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="895,188 965,188" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="36" y="332" width="360" height="158" rx="14" fill="#fff4e7" stroke="#d5dfe7"/>
<text x="216.0" y="366" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">JEPA does not add value?</text>
<text x="216.0" y="397" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Stop JEPA-specific expansion.</text>
<text x="216.0" y="424" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">A qualifying direct denoiser</text>
<text x="216.0" y="451" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">can still advance.</text>
<polyline points="460,246 460,290 216,290 216,332" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="480" y="366" width="280" height="100" rx="14" fill="#edf3fc" stroke="#d5dfe7"/>
<text x="620.0" y="400" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Freeze the protocol</text>
<text x="620.0" y="431" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Method, metrics and margins</text>
<rect x="850" y="366" width="314" height="100" rx="14" fill="#eaf7f3" stroke="#d5dfe7"/>
<text x="1007.0" y="400" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#172b40">Independent confirmation</text>
<text x="1007.0" y="431" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Previously unexamined recordings</text>
<polyline points="1064,246 1064,303 620,303 620,366" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="760,416 850,416" fill="none" stroke="#53677b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="822" y="540" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#53677b">Evidence missing? Pause that claim and report what remains unresolved.</text>
</svg>