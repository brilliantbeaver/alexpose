<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Paired JEPA: learn features, then restore coordinates</title><desc id="desc">The clean teacher is available during training only; the deployed model receives observed tracks.</desc>
