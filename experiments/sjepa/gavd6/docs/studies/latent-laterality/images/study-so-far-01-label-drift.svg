<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" role="img" aria-labelledby="title desc">
  <title id="title">A label swap flips a claim</title>
  <desc id="desc">Three uncluttered steps show the same two motion tracks, a swap in their left and right labels, and an opposite side-specific conclusion.</desc>
  <defs>
    <style>
      .title { font: 700 27px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .step { font: 700 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .label { font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b53; }
      .note { font: 400 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627d98; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#829ab1"/>
    </marker>
  </defs>
  <rect width="560" height="540" fill="#f7fbff"/>
  <text x="36" y="44" class="title">A label swap flips a claim</text>

  <circle cx="54" cy="92" r="15" fill="#e8f1f8"/>
  <text x="54" y="99" text-anchor="middle" class="label">1</text>
  <text x="84" y="99" class="step">Motion</text>
  <path d="M116 150 C160 122 213 164 263 140 S363 124 414 150 S470 165 499 140" fill="none" stroke="#1f9d8b" stroke-width="8" stroke-linecap="round"/>
  <path d="M116 180 C166 160 214 198 269 175 S367 160 416 180 S471 196 499 173" fill="none" stroke="#e07a3f" stroke-width="8" stroke-linecap="round"/>
  <text x="280" y="210" text-anchor="middle" class="note">same two tracks</text>
  <path d="M280 229 L280 251" fill="none" stroke="#829ab1" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="54" cy="283" r="15" fill="#e8f1f8"/>
  <text x="54" y="290" text-anchor="middle" class="label">2</text>
  <text x="84" y="290" class="step">Names exchange</text>
  <text x="166" y="324" text-anchor="middle" class="note">before</text>
  <text x="394" y="324" text-anchor="middle" class="note">after</text>
  <rect x="111" y="340" width="110" height="35" rx="8" fill="#c9f1eb"/>
  <text x="166" y="365" text-anchor="middle" class="label">left</text>
  <rect x="111" y="384" width="110" height="35" rx="8" fill="#fde0cf"/>
  <text x="166" y="409" text-anchor="middle" class="label">right</text>
  <path d="M245 357 L315 357" fill="none" stroke="#829ab1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M245 401 L315 401" fill="none" stroke="#829ab1" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="339" y="340" width="110" height="35" rx="8" fill="#fde0cf"/>
  <text x="394" y="365" text-anchor="middle" class="label">left</text>
  <rect x="339" y="384" width="110" height="35" rx="8" fill="#c9f1eb"/>
  <text x="394" y="409" text-anchor="middle" class="label">right</text>
  <path d="M280 435 L280 457" fill="none" stroke="#829ab1" stroke-width="3" marker-end="url(#arrow)"/>

  <circle cx="54" cy="490" r="15" fill="#e8f1f8"/>
  <text x="54" y="497" text-anchor="middle" class="label">3</text>
  <text x="84" y="497" class="step">Named result</text>
  <text x="288" y="497" class="label">right − left: +</text>
  <path d="M449 491 L502 491" fill="none" stroke="#829ab1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="524" y="497" text-anchor="end" class="label">−</text>
</svg>
