<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t2 d2">
  <title id="t2">Global ambiguity and conditional evidence for relative switches</title>
  <desc id="d2">Two gauge-symmetric worlds produce the same observed sequence. Their blocks are labeled with zero and one as well as color. The global convention is structurally unidentifiable under the symmetric model. Relative switches are only statistically estimable under declared temporal, corruption, and nondegeneracy assumptions. An exact external anchor plus exact connected edges resolves the path.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
    <style>
      .h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:32px;fill:#0f2440;}
      .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;fill:#0f2440;}
      .b{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#33475e;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#4d6074;}
      .w{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;fill:#ffffff;}
      .ws{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#e3eaf1;}
      .mono{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:14px;fill:#0f2440;letter-spacing:2px;}
      .bit{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:14px;fill:#0f2440;text-anchor:middle;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="62" class="h">Two worlds, one observation</text>
  <text x="48" y="92" class="s">Orange blocks use the swapped naming convention. Flipping the motion and every block label together cancels exactly.</text>

  <!-- ============ WORLD A ============ -->
  <rect x="48" y="140" width="340" height="172" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="176" class="t">World A</text>
  <text x="72" y="200" class="s">true motion z</text>
  <rect x="72" y="216" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <rect x="108" y="216" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <rect x="144" y="216" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <rect x="180" y="216" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="216" y="216" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="252" y="216" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <rect x="288" y="216" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <rect x="324" y="216" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <text x="88" y="242" class="bit">0</text><text x="124" y="242" class="bit">0</text><text x="160" y="242" class="bit">0</text><text x="196" y="242" class="bit">1</text><text x="232" y="242" class="bit">1</text><text x="268" y="242" class="bit">0</text><text x="304" y="242" class="bit">0</text><text x="340" y="242" class="bit">0</text>
  <text x="72" y="286" class="mono">g = 0 0 0 1 1 0 0 0</text>

  <!-- ============ WORLD B ============ -->
  <rect x="48" y="352" width="340" height="172" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="388" class="t">World B</text>
  <text x="72" y="412" class="s">true motion Pz</text>
  <rect x="72" y="428" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="108" y="428" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="144" y="428" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="180" y="428" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <rect x="216" y="428" width="32" height="40" rx="6" fill="#e7f0f8" stroke="#20364e" stroke-width="1.5"/>
  <rect x="252" y="428" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="288" y="428" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="324" y="428" width="32" height="40" rx="6" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <text x="88" y="454" class="bit">1</text><text x="124" y="454" class="bit">1</text><text x="160" y="454" class="bit">1</text><text x="196" y="454" class="bit">0</text><text x="232" y="454" class="bit">0</text><text x="268" y="454" class="bit">1</text><text x="304" y="454" class="bit">1</text><text x="340" y="454" class="bit">1</text>
  <text x="72" y="498" class="mono">g = 1 1 1 0 0 1 1 1</text>

  <!-- ============ FUNNEL ARROWS ============ -->
  <path d="M388 226 L428 300" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M388 438 L428 366" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ OBSERVED ============ -->
  <rect x="444" y="228" width="300" height="208" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text x="468" y="264" class="t">Observed x</text>
  <text x="468" y="288" class="s">bit for bit identical</text>
  <rect x="468" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <rect x="500" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <rect x="532" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <rect x="564" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <rect x="596" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <rect x="628" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <rect x="660" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <rect x="692" y="306" width="28" height="40" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.5"/>
  <text x="468" y="378" class="b">Every model sees only this.</text>
  <text x="468" y="404" class="s">The symmetric model cannot separate them.</text>

  <path d="M744 332 L784 332" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ VERDICTS ============ -->
  <rect x="800" y="190" width="352" height="284" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="824" y="226" class="t">What the data determines</text>

  <circle cx="838" cy="267" r="8" fill="#3f7a60"/>
  <text x="860" y="272" class="b">Relative switches</text>
  <text x="860" y="296" class="s">estimable only under declared assumptions</text>

  <circle cx="838" cy="335" r="8" fill="#e07a4b"/>
  <text x="860" y="340" class="b">The one global bit</text>
  <text x="860" y="364" class="s">unidentifiable under the symmetric model</text>

  <circle cx="838" cy="403" r="8" fill="#2f6f99"/>
  <text x="860" y="408" class="b">Exact anchor plus exact edges</text>
  <text x="860" y="432" class="s">determines each connected block</text>

  <!-- ============ FOOTER BANNER ============ -->
  <rect x="48" y="566" width="1104" height="92" rx="16" fill="#20364e"/>
  <text x="76" y="606" class="w">With equal prior mass on these two worlds, an unanchored hard sign is correct only half the time.</text>
  <text x="76" y="634" class="ws">Confidence cannot resolve structural ambiguity. Absolute evidence must come from an external anchor or an asymmetric data law.</text>
</svg>
