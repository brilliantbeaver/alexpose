   </g>
   <g id="text_14">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="214.00596" y="184.899656" transform="rotate(-0 214.00596 184.899656)">requested margin not fully met</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="311.07006" y="158.708484" transform="rotate(-0 311.07006 158.708484)">Silhouette</text>
   </g>
