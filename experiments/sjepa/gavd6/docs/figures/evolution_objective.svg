    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="116.94186" y="184.899656" transform="rotate(-0 116.94186 184.899656)">substantial drift</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="214.00596" y="158.708484" transform="rotate(-0 214.00596 158.708484)">Margin penalty</text>
   </g>
