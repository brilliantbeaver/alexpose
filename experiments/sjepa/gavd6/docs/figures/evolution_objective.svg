   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="15.1236" y="25.193437" transform="rotate(-0 15.1236 25.193437)">The objective evolved from prediction alone to three explicit jobs</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="20.67012" y="59.600344" transform="rotate(-0 20.67012 59.600344)">Legacy objective</text>
   </g>
   <g id="text_3">
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 75.460027)">L = L_JEPA</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 81.2025)"/>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 89.740766)">Centered and sharpened latent</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 96.802766)">cross-entropy trained prediction.</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 103.864766)">Collapse was monitored,</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 110.926766)">not actively regularized.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="171.21852" y="59.600344" transform="rotate(-0 171.21852 59.600344)">Current objective</text>
   </g>
   <g id="text_5">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(171.21852 75.358156)">L = L_JEPA + 0.05 L_VICReg + 0.25 L_group</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(171.21852 80.9055)"/>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(171.21852 89.204375)">JEPA: predict authorized hidden teacher features</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(171.21852 96.068375)">VICReg: keep variation and reduce redundancy</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(171.21852 102.932375)">Group: compact labels and penalize close centroids</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(171.21852 109.796375)">Group is off during Stage 0</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="19.87776" y="158.708484" transform="rotate(-0 19.87776 158.708484)">Feature std</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #72a66a" x="19.87776" y="173.081391" transform="rotate(-0 19.87776 173.081391)">0.414</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="19.87776" y="184.899656" transform="rotate(-0 19.87776 184.899656)">evidence against total collapse</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="116.94186" y="158.708484" transform="rotate(-0 116.94186 158.708484)">Normal anchor</text>
   </g>
   <g id="text_10">
