   </g>
   <g id="text_17">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="311.07006" y="184.899656" transform="rotate(-0 311.07006 184.899656)">weak canonical geometry</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="15.1236" y="207.8235" transform="rotate(-0 15.1236 207.8235)">The group term reads condition labels. Only Stage 0 is label-free; Stages 1 through 4 are label-informed representation fine-tuning.</text>
   </g>
