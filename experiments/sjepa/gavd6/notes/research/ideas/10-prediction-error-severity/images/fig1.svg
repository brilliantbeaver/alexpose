<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t1 d1">
  <title id="t1">Injection direction test: matched mechanism channel rises with magnitude while the unmatched channel stays flat</title>
  <desc id="d1">Illustrative expected-shape plot of the synthetic-injection direction test for a normal-only gait world model. Two stacked sub-panels share an x axis of injection magnitude. In the top panel a one-sided knee-flexion injection drives the asymmetry-channel relative error (warm) up steeply while the posture-channel error (blue) stays flat. In the bottom panel a symmetric proximal-deficit injection drives the posture channel up while asymmetry stays flat. A grey dashed random-encoder control lane stays near flat in both panels. A dark pass card lists the pre-registered margins over the random-encoder control. All numbers are illustrative and transductive to the single normal source video; folder labels are dataset annotations, not diagnoses.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
    <style>
      .h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:32px;fill:#0f2440;}
      .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;fill:#0f2440;}
      .b{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#33475e;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5c6f84;}
      .w{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;fill:#ffffff;}
      .ws{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#cdd8e4;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="60" class="h">Injection direction test: the matched channel rises, the other stays flat</text>
  <text x="48" y="88" class="s">Illustrative expected shape, not measured results. Relative error, 1.0 is normal surprise. Transductive to the single normal source.</text>

  <!-- ============ LEFT: two stacked sub-panels ============ -->
  <!-- outer plot card: x 48..760 (width 712), y 112..636 (height 524) -->
  <rect x="48" y="112" width="712" height="524" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>

  <!-- TOP sub-panel: one-sided knee-flexion injection -->
  <text x="78" y="150" class="t">One-sided knee-flexion injection (lateralized)</text>
  <!-- plot frame: x 150..712, y 176..332 -->
  <line x1="150" y1="176" x2="150" y2="332" stroke="#20364e" stroke-width="2.5"/>
  <line x1="150" y1="332" x2="712" y2="332" stroke="#20364e" stroke-width="2.5"/>
  <!-- y baseline tick at rel=1.0 -->
  <line x1="150" y1="316" x2="144" y2="316" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="321" class="s" text-anchor="end">1.0</text>
  <line x1="150" y1="200" x2="144" y2="200" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="205" class="s" text-anchor="end">2.0</text>

  <!-- asymmetry channel rises steeply (warm) -->
  <polyline points="164,314 274,296 384,262 494,220 604,190 700,182" fill="none" stroke="#e07a4b" stroke-width="2.5"/>
  <g fill="#e07a4b" stroke="#a44c26" stroke-width="1.25">
    <circle cx="164" cy="314" r="6"/>
    <circle cx="274" cy="296" r="6"/>
    <circle cx="384" cy="262" r="6"/>
    <circle cx="494" cy="220" r="6"/>
    <circle cx="604" cy="190" r="6"/>
    <circle cx="700" cy="182" r="6"/>
  </g>
  <text x="678" y="176" class="s" fill="#a44c26" text-anchor="end">asymmetry channel</text>

  <!-- posture channel flat (blue) -->
  <polyline points="164,316 274,315 384,314 494,315 604,313 700,314" fill="none" stroke="#2f6f99" stroke-width="2.5"/>
  <g fill="#2f6f99" stroke="#20364e" stroke-width="1">
    <circle cx="164" cy="316" r="5"/>
    <circle cx="384" cy="314" r="5"/>
    <circle cx="604" cy="313" r="5"/>
  </g>
  <text x="500" y="303" class="s" fill="#2f6f99">posture channel (flat)</text>

  <!-- random-encoder control, grey dashed flat -->
  <polyline points="164,320 700,319" fill="none" stroke="#8a9bab" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- BOTTOM sub-panel: symmetric proximal-deficit injection -->
  <text x="78" y="392" class="t">Symmetric proximal-deficit injection (posture)</text>
  <!-- plot frame: x 150..712, y 418..574 -->
  <line x1="150" y1="418" x2="150" y2="574" stroke="#20364e" stroke-width="2.5"/>
  <line x1="150" y1="574" x2="712" y2="574" stroke="#20364e" stroke-width="2.5"/>
  <line x1="150" y1="558" x2="144" y2="558" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="563" class="s" text-anchor="end">1.0</text>
  <line x1="150" y1="442" x2="144" y2="442" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="447" class="s" text-anchor="end">2.0</text>

  <!-- posture channel rises (blue) -->
  <polyline points="164,556 274,538 384,506 494,466 604,436 700,428" fill="none" stroke="#2f6f99" stroke-width="2.5"/>
  <g fill="#2f6f99" stroke="#20364e" stroke-width="1">
    <circle cx="164" cy="556" r="6"/>
    <circle cx="274" cy="538" r="6"/>
    <circle cx="384" cy="506" r="6"/>
    <circle cx="494" cy="466" r="6"/>
    <circle cx="604" cy="436" r="6"/>
    <circle cx="700" cy="428" r="6"/>
  </g>
  <text x="678" y="420" class="s" fill="#2f6f99" text-anchor="end">posture channel</text>

  <!-- asymmetry channel flat (warm) -->
  <polyline points="164,558 274,557 384,556 494,557 604,555 700,556" fill="none" stroke="#e07a4b" stroke-width="2.5"/>
  <g fill="#e07a4b" stroke="#a44c26" stroke-width="1">
    <circle cx="164" cy="558" r="5"/>
    <circle cx="384" cy="556" r="5"/>
    <circle cx="604" cy="555" r="5"/>
  </g>
  <text x="470" y="545" class="s" fill="#a44c26">asymmetry channel (flat)</text>

  <!-- random-encoder control, grey dashed flat -->
  <polyline points="164,562 700,561" fill="none" stroke="#8a9bab" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="360" y="586" class="s" fill="#8a9bab" text-anchor="start"> </text>

  <!-- shared x axis label + control label, inside card bottom -->
  <text x="431" y="606" class="b" text-anchor="middle">Injection magnitude  (small to large)</text>
  <text x="431" y="626" class="s" text-anchor="middle">Grey dashed lane: random-encoder control (flat in both panels)</text>

  <!-- ============ RIGHT: legend card + pass card ============ -->

  <!-- legend card: x 816..1152 (width 336), y 112..344 (height 232) -->
  <rect x="816" y="112" width="336" height="232" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="846" y="148" class="t">Reading the curves</text>

  <line x1="846" y1="178" x2="874" y2="178" stroke="#e07a4b" stroke-width="2.5"/>
  <text x="886" y="183" class="b">Asymmetry channel (signed L-R)</text>

  <line x1="846" y1="212" x2="874" y2="212" stroke="#2f6f99" stroke-width="2.5"/>
  <text x="886" y="217" class="b">Posture channel (pelvis, trunk)</text>

  <line x1="846" y1="246" x2="874" y2="246" stroke="#8a9bab" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="886" y="251" class="b">Random-encoder floor (Lane B)</text>

  <text x="846" y="288" class="s">Matched channel tracks magnitude;</text>
  <text x="846" y="310" class="s">the other channel stays near 1.0.</text>

  <!-- pass card (dark banner): x 816..1152 (width 336), y 400..636 (height 236), gap 344->400 = 56 -->
  <rect x="816" y="400" width="336" height="236" rx="16" fill="#20364e" stroke="#20364e" stroke-width="1.75"/>
  <text x="846" y="436" class="w" font-size="20">Pre-registered pass margin</text>

  <text x="846" y="472" class="w">Matched rise &#8805; floor + 0.05</text>
  <text x="846" y="504" class="w">Selectivity &#8805; 0.05 over other</text>
  <text x="846" y="536" class="w">Reaches &#8805; 80% raw-coord ceiling</text>

  <line x1="846" y1="558" x2="1122" y2="558" stroke="#5f9e7e" stroke-width="1.5"/>
  <text x="846" y="586" class="ws">Monotone across &#8805; 3 magnitudes.</text>
  <text x="846" y="608" class="ws">Miss any one: informative null.</text>

  <!-- Footer note: baseline y=666, >=24px below cards -->
  <text x="48" y="666" class="s">Illustrative expected shape, not measured results. Random-encoder control is the floor; the raw-coordinate ceiling is the decisive bar. Labels are dataset annotations.</text>
</svg>
