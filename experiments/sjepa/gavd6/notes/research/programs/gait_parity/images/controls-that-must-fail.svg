<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Controls that should fail on purpose</title>
  <desc id="desc">Each control removes one possible source of a real result. A control should collapse as expected. If any of them still works, the model has found a shortcut and the result must be investigated.</desc>
  <defs>
    <marker id="open-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#b91c1c" stroke-width="2"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .body { font: 18px Arial, sans-serif; fill: #1e293b; }
      .small { font: 16px Arial, sans-serif; fill: #475569; }
      .mini { font: 15px Arial, sans-serif; fill: #475569; }
      .bar { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .check { font: 700 26px Arial, sans-serif; fill: #15803d; }
      .cross { font: 700 26px Arial, sans-serif; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="48" text-anchor="middle" class="title">Try to break the result before you believe it</text>
  <text x="500" y="79" text-anchor="middle" class="body">Each control removes one route the model could use to score well.</text>

  <rect x="24" y="113" width="284" height="356" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="165" y="149" text-anchor="middle" class="heading">START WITH THE REAL TEST</text>
  <rect x="74" y="180" width="182" height="62" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="165" y="207" text-anchor="middle" class="body">movement sequence</text>
  <text x="165" y="230" text-anchor="middle" class="mini">left and right joints</text>
  <path d="M165 243 V282" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="74" y="282" width="182" height="62" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="165" y="309" text-anchor="middle" class="body">independent target</text>
  <text x="165" y="332" text-anchor="middle" class="mini">force measurement</text>
  <path d="M165 344 V383" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <text x="165" y="420" text-anchor="middle" class="heading">does the score hold?</text>
  <text x="165" y="446" text-anchor="middle" class="mini">Now remove one route at a time.</text>

  <path d="M310 170 H338" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <path d="M310 300 H338" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <path d="M310 430 H338" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>

  <rect x="350" y="119" width="400" height="102" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="372" y="154" class="cross">×</text>
  <text x="408" y="151" class="heading">SHUFFLE TARGETS</text>
  <text x="408" y="179" class="body">Break the movement-to-force link.</text>
  <text x="408" y="203" class="small">Expected: collapses.</text>

  <rect x="350" y="249" width="400" height="102" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="372" y="284" class="cross">×</text>
  <text x="408" y="281" class="heading">REMOVE SIDE INFORMATION</text>
  <text x="408" y="309" class="body">Average left and right branches.</text>
  <text x="408" y="333" class="small">Expected: collapses.</text>

  <rect x="350" y="379" width="400" height="102" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="372" y="414" class="cross">×</text>
  <text x="408" y="411" class="heading">KEEP ONLY NUISANCES</text>
  <text x="408" y="439" class="body">Use view, speed, source, missingness.</text>
  <text x="408" y="463" class="small">Expected: collapses.</text>

  <path d="M750 170 H772 M750 430 H772 M772 170 V430 M750 300 H772" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M772 300 H791" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <rect x="798" y="216" width="172" height="169" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="884" y="255" text-anchor="middle" class="cross">×</text>
  <text x="884" y="289" text-anchor="middle" class="heading">STILL WORKED</text>
  <text x="884" y="319" text-anchor="middle" class="body">Investigate:</text>
  <text x="884" y="345" text-anchor="middle" class="small">a shortcut may</text>
  <text x="884" y="367" text-anchor="middle" class="small">be making the score.</text>

  <text x="352" y="516" class="check">✓</text>
  <text x="386" y="512" class="small">A failed control is the expected healthy outcome.</text>
  <rect x="130" y="548" width="740" height="54" rx="14" fill="#0f172a"/>
  <text x="500" y="582" text-anchor="middle" class="bar">If a broken control still works, the score needs an explanation.</text>
</svg>
