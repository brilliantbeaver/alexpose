<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="gp-title gp-desc">
  <title id="gp-title">GaitParity reflection-equivariant skeleton JEPA architecture</title>
  <desc id="gp-desc">A publication-style architecture diagram showing skeleton input, anatomical reflection, a paired C2-equivariant student encoder and EMA teacher, masked latent prediction, parity decomposition, and signed propulsion readout.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#24364B"/></marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563A9"/></marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16877C"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#D97732"/></marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#24364B" flood-opacity="0.10"/></filter>
    <style>
      .t { font-family: Inter, "Helvetica Neue", Arial, sans-serif; fill: #172437; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -0.4px; }
      .subtitle { font-size: 16px; fill: #536578; }
      .panel { font-size: 15px; font-weight: 700; fill: #2563A9; }
      .head { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #536578; }
      .tiny { font-size: 11px; fill: #607286; }
      .math { font-family: "STIX Two Text", "Times New Roman", serif; font-size: 16px; fill: #172437; }
      .math-small { font-family: "STIX Two Text", "Times New Roman", serif; font-size: 13px; fill: #172437; }
      .node { fill: #FFFFFF; stroke: #AEBBC8; stroke-width: 1.4; rx: 7; }
      .blue-node { fill: #F4F8FD; stroke: #6C9BCB; stroke-width: 1.5; rx: 7; }
      .teal-node { fill: #F2FAF8; stroke: #53A99F; stroke-width: 1.5; rx: 7; }
      .orange-node { fill: #FFF7F0; stroke: #E2A071; stroke-width: 1.5; rx: 7; }
      .gray-node { fill: #F7F9FB; stroke: #CBD4DE; stroke-width: 1.3; rx: 7; }
      .flow { fill: none; stroke: #24364B; stroke-width: 2; marker-end: url(#arrow-navy); }
      .flow-blue { fill: none; stroke: #2563A9; stroke-width: 2; marker-end: url(#arrow-blue); }
      .flow-teal { fill: none; stroke: #16877C; stroke-width: 2; marker-end: url(#arrow-teal); }
      .flow-orange { fill: none; stroke: #D97732; stroke-width: 2; marker-end: url(#arrow-orange); }
      .dash { stroke-dasharray: 6 5; }
      .hair { fill: none; stroke: #AEBBC8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1800" height="1040" fill="#FFFFFF"/>
  <text x="52" y="54" class="t title">GaitParity: a reflection-equivariant skeleton JEPA</text>
  <text x="52" y="82" class="t subtitle">The model preserves the left–right group action throughout self-supervised pretraining, then exposes explicit even and odd latent channels.</text>
  <line x1="52" y1="103" x2="1748" y2="103" stroke="#D8E0E8" stroke-width="1.3"/>

  <!-- panel labels -->
  <text x="52" y="139" class="t panel">(a) PAIRED INPUT ORBIT</text>
  <text x="542" y="139" class="t panel">(b) REFLECTION-EQUIVARIANT JEPA PRETRAINING</text>
  <text x="1330" y="139" class="t panel">(c) PARITY READOUT</text>

  <!-- input skeleton -->
  <rect x="52" y="174" width="208" height="426" class="node" filter="url(#soft-shadow)"/>
  <text x="156" y="207" text-anchor="middle" class="t head">Skeleton window</text>
  <text x="156" y="231" text-anchor="middle" class="t small">64 frames × 11 joints × 3</text>
  <text x="156" y="251" text-anchor="middle" class="t small">+ visibility/confidence</text>

  <g transform="translate(63 273)">
    <rect width="78" height="188" rx="5" fill="#F4F8FD" stroke="#C3D5E8"/>
    <line x1="39" y1="32" x2="39" y2="96" stroke="#24364B" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="39" y1="50" x2="19" y2="72" stroke="#24364B" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="39" y1="50" x2="61" y2="75" stroke="#24364B" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="39" y1="96" x2="22" y2="136" stroke="#2563A9" stroke-width="4" stroke-linecap="round"/>
    <line x1="39" y1="96" x2="59" y2="133" stroke="#D97732" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="136" x2="16" y2="166" stroke="#2563A9" stroke-width="4" stroke-linecap="round"/>
    <line x1="59" y1="133" x2="67" y2="164" stroke="#D97732" stroke-width="4" stroke-linecap="round"/>
    <circle cx="39" cy="20" r="10" fill="#FFFFFF" stroke="#24364B" stroke-width="2.5"/>
    <g fill="#FFFFFF" stroke-width="2"><circle cx="39" cy="96" r="4.5" stroke="#24364B"/><circle cx="22" cy="136" r="4.5" stroke="#2563A9"/><circle cx="59" cy="133" r="4.5" stroke="#D97732"/></g>
    <text x="15" y="181" class="t tiny" fill="#2563A9">L</text><text x="64" y="181" class="t tiny" fill="#D97732">R</text>
  </g>
  <g transform="translate(151 273)" opacity="0.68">
    <rect width="78" height="188" rx="5" fill="#F7F9FB" stroke="#D6DEE7"/>
    <line x1="39" y1="32" x2="39" y2="96" stroke="#536578" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="39" y1="50" x2="19" y2="72" stroke="#536578" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="39" y1="50" x2="61" y2="75" stroke="#536578" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="39" y1="96" x2="20" y2="133" stroke="#2563A9" stroke-width="4" stroke-linecap="round"/>
    <line x1="39" y1="96" x2="61" y2="136" stroke="#D97732" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="133" x2="13" y2="164" stroke="#2563A9" stroke-width="4" stroke-linecap="round"/>
    <line x1="61" y1="136" x2="69" y2="166" stroke="#D97732" stroke-width="4" stroke-linecap="round"/>
    <circle cx="39" cy="20" r="10" fill="#FFFFFF" stroke="#536578" stroke-width="2.5"/>
  </g>
  <text x="156" y="491" text-anchor="middle" class="t small">body-frame coordinates</text>
  <rect x="78" y="516" width="156" height="48" class="gray-node"/>
  <text x="156" y="538" text-anchor="middle" class="t body">as-recorded input</text>
  <text x="156" y="557" text-anchor="middle" class="math-small">x ∈ ℝ<tspan baseline-shift="super" font-size="10">64×11×3</tspan></text>

  <!-- reflection operator and orbit -->
  <path d="M260 385 H298" class="flow"/>
  <circle cx="331" cy="385" r="31" fill="#FFF7F0" stroke="#D97732" stroke-width="1.7"/>
  <text x="331" y="380" text-anchor="middle" class="math" font-weight="700">M</text>
  <text x="331" y="399" text-anchor="middle" class="t tiny">reflect</text>
  <path d="M362 385 H397" class="flow-orange"/>

  <rect x="400" y="174" width="112" height="426" class="orange-node"/>
  <text x="456" y="207" text-anchor="middle" class="t head">Orbit</text>
  <text x="456" y="230" text-anchor="middle" class="math-small">{x, Mx}</text>
  <rect x="421" y="265" width="70" height="110" rx="5" fill="#FFFFFF" stroke="#6C9BCB" stroke-width="1.5"/>
  <text x="456" y="288" text-anchor="middle" class="t small">original</text>
  <path d="M456 306 V343 M456 315 L442 328 M456 315 L470 328 M456 343 L446 361 M456 343 L468 361" fill="none" stroke="#2563A9" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="456" cy="297" r="6.5" fill="#FFFFFF" stroke="#2563A9" stroke-width="2"/>
  <rect x="421" y="397" width="70" height="110" rx="5" fill="#FFFFFF" stroke="#E2A071" stroke-width="1.5"/>
  <text x="456" y="420" text-anchor="middle" class="t small">mirrored</text>
  <g transform="translate(912 0) scale(-1 1)"><path d="M456 438 V475 M456 447 L442 460 M456 447 L470 460 M456 475 L446 493 M456 475 L468 493" fill="none" stroke="#D97732" stroke-width="3.2" stroke-linecap="round"/><circle cx="456" cy="429" r="6.5" fill="#FFFFFF" stroke="#D97732" stroke-width="2"/></g>
  <path d="M428 529 C438 546 474 546 484 529" fill="none" stroke="#D97732" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="456" y="572" text-anchor="middle" class="math-small">M²x = x</text>

  <!-- tokenization -->
  <path d="M512 385 H545" class="flow"/>
  <rect x="548" y="245" width="126" height="280" class="blue-node"/>
  <text x="611" y="277" text-anchor="middle" class="t head">Shared</text>
  <text x="611" y="299" text-anchor="middle" class="t head">tokenizer φ</text>
  <g transform="translate(572 330)">
    <g fill="#D9E8F6" stroke="#6C9BCB"><rect width="18" height="18"/><rect x="24" width="18" height="18"/><rect x="48" width="18" height="18"/><rect y="24" width="18" height="18"/><rect x="24" y="24" width="18" height="18" fill="#FFFFFF"/><rect x="48" y="24" width="18" height="18"/><rect y="48" width="18" height="18"/><rect x="24" y="48" width="18" height="18"/><rect x="48" y="48" width="18" height="18" fill="#FFFFFF"/></g>
    <text x="33" y="90" text-anchor="middle" class="t tiny">space–time</text>
    <text x="33" y="106" text-anchor="middle" class="t tiny">tokens</text>
  </g>
  <line x1="565" y1="459" x2="657" y2="459" stroke="#C3D5E8"/>
  <text x="611" y="482" text-anchor="middle" class="t small">paired training mask</text>
  <text x="611" y="502" text-anchor="middle" class="math-small">H⁰=[φ(x), φ(Mx)]</text>

  <!-- online paired encoder -->
  <path d="M674 385 H711" class="flow-blue"/>
  <rect x="714" y="174" width="402" height="426" class="blue-node" filter="url(#soft-shadow)"/>
  <text x="736" y="205" class="t head">Online encoder E<tspan baseline-shift="sub" font-size="12">θ</tspan></text>
  <text x="1092" y="205" text-anchor="end" class="t small">student</text>
  <rect x="738" y="225" width="354" height="306" rx="6" fill="#FFFFFF" stroke="#C3D5E8"/>
  <text x="915" y="251" text-anchor="middle" class="t small" font-weight="700">L × C₂-EQUIVARIANT SPATIOTEMPORAL BLOCK</text>

  <rect x="762" y="282" width="117" height="68" class="blue-node"/>
  <text x="820" y="309" text-anchor="middle" class="t body" font-weight="700">branch 0</text>
  <text x="820" y="330" text-anchor="middle" class="math-small">h<tspan baseline-shift="sub" font-size="10">orig</tspan><tspan baseline-shift="super" font-size="10">ℓ</tspan></text>
  <rect x="951" y="282" width="117" height="68" class="orange-node"/>
  <text x="1009" y="309" text-anchor="middle" class="t body" font-weight="700">branch 1</text>
  <text x="1009" y="330" text-anchor="middle" class="math-small">h<tspan baseline-shift="sub" font-size="10">mirr</tspan><tspan baseline-shift="super" font-size="10">ℓ</tspan></text>

  <rect x="762" y="407" width="117" height="72" class="blue-node"/>
  <text x="820" y="432" text-anchor="middle" class="t body" font-weight="700">g<tspan baseline-shift="sub" font-size="10">θ</tspan>(a; a,b)</text>
  <text x="820" y="454" text-anchor="middle" class="t small">shared weights</text>
  <rect x="951" y="407" width="117" height="72" class="orange-node"/>
  <text x="1009" y="432" text-anchor="middle" class="t body" font-weight="700">g<tspan baseline-shift="sub" font-size="10">θ</tspan>(b; b,a)</text>
  <text x="1009" y="454" text-anchor="middle" class="t small">shared weights</text>

  <path d="M820 350 V399" class="flow-blue"/>
  <path d="M1009 350 V399" class="flow-orange"/>
  <path d="M878 333 C910 352 920 369 951 392" class="flow-teal"/>
  <path d="M951 333 C920 352 910 369 879 392" class="flow-teal"/>
  <text x="915" y="376" text-anchor="middle" class="t tiny" fill="#16877C">symmetric cross-branch interaction</text>

  <text x="915" y="558" text-anchor="middle" class="math">F<tspan baseline-shift="sub" font-size="12">ℓ</tspan>(S H) = S F<tspan baseline-shift="sub" font-size="12">ℓ</tspan>(H) ∀ℓ</text>
  <text x="915" y="581" text-anchor="middle" class="t small">shared positional rules • paired masks/dropout • symmetric normalization</text>

  <!-- EMA teacher and JEPA objective -->
  <rect x="718" y="650" width="394" height="205" class="teal-node"/>
  <text x="740" y="681" class="t head">EMA target encoder E<tspan baseline-shift="sub" font-size="12">ξ</tspan></text>
  <text x="1088" y="681" text-anchor="end" class="t small">stop-gradient</text>
  <rect x="741" y="702" width="348" height="68" rx="6" fill="#FFFFFF" stroke="#8DC5BE"/>
  <text x="915" y="728" text-anchor="middle" class="t body" font-weight="700">same equivariant architecture</text>
  <text x="915" y="750" text-anchor="middle" class="t small">full target tokens → latent targets z<tspan baseline-shift="sub" font-size="9">t</tspan></text>
  <text x="915" y="806" text-anchor="middle" class="math-small">ξ ← mξ + (1−m)θ</text>
  <text x="915" y="832" text-anchor="middle" class="t tiny">teacher weights follow the student; no force labels</text>
  <path d="M779 600 V638" class="flow-teal dash"/>
  <text x="790" y="625" class="t tiny" fill="#16877C">EMA</text>

  <!-- JEPA predictor -->
  <path d="M1116 363 H1150" class="flow-blue"/>
  <rect x="1153" y="296" width="142" height="134" class="blue-node"/>
  <text x="1224" y="328" text-anchor="middle" class="t head">Predictor P<tspan baseline-shift="sub" font-size="12">ψ</tspan></text>
  <text x="1224" y="354" text-anchor="middle" class="t small">context latents</text>
  <text x="1224" y="375" text-anchor="middle" class="t small">+ target positions</text>
  <rect x="1181" y="393" width="86" height="24" rx="3" fill="#FFFFFF" stroke="#6C9BCB"/>
  <text x="1224" y="410" text-anchor="middle" class="math-small">ẑ<tspan baseline-shift="sub" font-size="9">t</tspan></text>
  <path d="M1295 363 H1320" class="flow-blue"/>
  <circle cx="1355" cy="363" r="31" fill="#F7F9FB" stroke="#8798A9" stroke-width="1.5"/>
  <text x="1355" y="358" text-anchor="middle" class="math" font-weight="700">ℒ<tspan baseline-shift="sub" font-size="11">JEPA</tspan></text>
  <text x="1355" y="379" text-anchor="middle" class="t tiny">latent loss</text>
  <path d="M1112 736 H1355 V401" class="flow-teal dash"/>
  <text x="1190" y="724" class="math-small" fill="#16877C">target z<tspan baseline-shift="sub" font-size="9">t</tspan></text>

  <!-- Representation output -->
  <path d="M1116 525 H1152 V548 H1200" class="flow"/>
  <rect x="1203" y="483" width="164" height="130" class="node"/>
  <text x="1285" y="514" text-anchor="middle" class="t head">Paired state</text>
  <text x="1285" y="542" text-anchor="middle" class="math">H<tspan baseline-shift="super" font-size="11">L</tspan>(x)</text>
  <rect x="1222" y="560" width="58" height="28" rx="3" fill="#E7F0FA" stroke="#6C9BCB"/>
  <rect x="1290" y="560" width="58" height="28" rx="3" fill="#FFF0E5" stroke="#E2A071"/>
  <text x="1251" y="579" text-anchor="middle" class="math-small">h<tspan baseline-shift="sub" font-size="9">o</tspan></text>
  <text x="1319" y="579" text-anchor="middle" class="math-small">h<tspan baseline-shift="sub" font-size="9">m</tspan></text>
  <text x="1285" y="604" text-anchor="middle" class="t tiny">branches swap under M</text>

  <!-- parity projectors -->
  <path d="M1367 548 H1400" class="flow"/>
  <rect x="1403" y="449" width="186" height="198" class="node" filter="url(#soft-shadow)"/>
  <text x="1496" y="480" text-anchor="middle" class="t head">Parity projectors</text>
  <rect x="1425" y="502" width="142" height="50" class="teal-node"/>
  <text x="1496" y="523" text-anchor="middle" class="math-small">h<tspan baseline-shift="sub" font-size="9">even</tspan>=(h<tspan baseline-shift="sub" font-size="9">o</tspan>+h<tspan baseline-shift="sub" font-size="9">m</tspan>)/2</text>
  <text x="1496" y="542" text-anchor="middle" class="t tiny">invariant under reflection</text>
  <rect x="1425" y="569" width="142" height="50" class="orange-node"/>
  <text x="1496" y="590" text-anchor="middle" class="math-small">h<tspan baseline-shift="sub" font-size="9">odd</tspan>=(h<tspan baseline-shift="sub" font-size="9">o</tspan>−h<tspan baseline-shift="sub" font-size="9">m</tspan>)/2</text>
  <text x="1496" y="609" text-anchor="middle" class="t tiny">sign flips under reflection</text>

  <!-- output heads -->
  <path d="M1589 527 H1620" class="flow-teal"/>
  <rect x="1623" y="468" width="125" height="113" class="teal-node"/>
  <text x="1686" y="498" text-anchor="middle" class="t body" font-weight="700">even controls</text>
  <text x="1686" y="523" text-anchor="middle" class="t small">speed, cadence,</text>
  <text x="1686" y="542" text-anchor="middle" class="t small">nuisance probes</text>
  <text x="1686" y="567" text-anchor="middle" class="math-small">r(Mx)=r(x)</text>

  <path d="M1589 594 H1620" class="flow-orange"/>
  <rect x="1623" y="603" width="125" height="151" class="orange-node"/>
  <text x="1686" y="633" text-anchor="middle" class="t body" font-weight="700">zero-bias head</text>
  <text x="1686" y="658" text-anchor="middle" class="math-small">s(x)=wᵀh<tspan baseline-shift="sub" font-size="9">odd</tspan></text>
  <line x1="1643" y1="674" x2="1729" y2="674" stroke="#EDC4A6"/>
  <text x="1686" y="697" text-anchor="middle" class="t small">signed propulsion</text>
  <text x="1686" y="718" text-anchor="middle" class="math-small">ln(J<tspan baseline-shift="sub" font-size="9">R</tspan>/J<tspan baseline-shift="sub" font-size="9">L</tspan>)</text>
  <text x="1686" y="743" text-anchor="middle" class="math-small" fill="#C65F1E">s(Mx)=−s(x)</text>

  <!-- training boundary and notes -->
  <line x1="52" y1="892" x2="1748" y2="892" stroke="#AEBBC8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <rect x="52" y="871" width="176" height="40" rx="4" fill="#FFFFFF" stroke="#AEBBC8"/>
  <text x="140" y="896" text-anchor="middle" class="t small" font-weight="700">TRAINING BOUNDARY</text>

  <g transform="translate(266 930)">
    <circle cx="0" cy="0" r="6" fill="#2563A9"/><text x="15" y="5" class="t body"><tspan font-weight="700">Pretraining:</tspan> unlabelled skeletons only; masked latent prediction updates E<tspan baseline-shift="sub" font-size="10">θ</tspan> and P<tspan baseline-shift="sub" font-size="10">ψ</tspan>.</text>
  </g>
  <g transform="translate(920 930)">
    <circle cx="0" cy="0" r="6" fill="#D97732"/><text x="15" y="5" class="t body"><tspan font-weight="700">Downstream:</tspan> freeze E<tspan baseline-shift="sub" font-size="10">θ</tspan>; fit only the small force-labelled readout.</text>
  </g>
  <rect x="266" y="967" width="1284" height="42" rx="5" fill="#F7F9FB" stroke="#D8E0E8"/>
  <text x="908" y="993" text-anchor="middle" class="t body"><tspan font-weight="700">Architectural guarantee:</tspan> anatomical reflection swaps every paired hidden state; the odd channel changes sign without learning this rule from labels.</text>
</svg>
