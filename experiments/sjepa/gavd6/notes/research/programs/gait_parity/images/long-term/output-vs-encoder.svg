<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Output repair and encoder parity both end with an odd score</title>
  <desc id="desc">Output repair runs the same ordinary encoder twice and subtracts only at the end. Encoder parity keeps an original and mirrored branch paired through every layer, testing their swap rule along the way. Both paths end with an exactly odd score.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}.head{font:700 20px Arial,sans-serif;fill:#0f172a}
      .body{font:18px Arial,sans-serif;fill:#1e293b}.note{font:17px Arial,sans-serif;fill:#334155}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}.bar{font:700 20px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="45" text-anchor="middle" class="title">Where does the mirror rule live?</text>
  <text x="500" y="73" text-anchor="middle" class="note">Both paths end with a sign flip. Only one checks the rule inside every layer.</text>

  <text x="48" y="116" class="head">OUTPUT REPAIR</text>
  <rect x="48" y="133" width="120" height="47" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="108" y="163" text-anchor="middle" class="strong">x</text>
  <rect x="48" y="205" width="120" height="47" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/><text x="108" y="235" text-anchor="middle" class="strong">Mx</text>
  <path d="M168 156 H220" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M168 228 H220" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <rect x="225" y="126" width="166" height="58" rx="12" fill="#fff" stroke="#334155" stroke-width="2"/><text x="308" y="151" text-anchor="middle" class="head">ENCODER E</text><text x="308" y="173" text-anchor="middle" class="note">run once</text>
  <rect x="225" y="198" width="166" height="58" rx="12" fill="#fff" stroke="#334155" stroke-width="2"/><text x="308" y="223" text-anchor="middle" class="head">ENCODER E</text><text x="308" y="245" text-anchor="middle" class="note">run again</text>
  <path d="M407 147 v82" fill="none" stroke="#334155" stroke-width="2"/><path d="M400 147 h14 M400 229 h14" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="425" y="198" class="note">same weights</text>
  <path d="M391 156 H488" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M391 228 H488" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <rect x="493" y="133" width="96" height="47" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/><text x="541" y="163" text-anchor="middle" class="strong">q</text>
  <rect x="493" y="205" width="96" height="47" rx="10" fill="#fff" stroke="#334155" stroke-width="2"/><text x="541" y="235" text-anchor="middle" class="strong">q</text>
  <path d="M589 156 H658" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M589 228 H658" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <circle cx="710" cy="192" r="46" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="710" y="188" text-anchor="middle" class="strong">subtract</text><text x="710" y="210" text-anchor="middle" class="strong">then ÷2</text>
  <path d="M756 192 H789" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="794" y="160" width="154" height="64" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="871" y="187" text-anchor="middle" class="head">ODD SCORE</text><text x="871" y="210" text-anchor="middle" class="note">exact at exit</text>

  <text x="48" y="326" class="head">ENCODER PARITY</text>
  <rect x="48" y="346" width="120" height="47" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="108" y="376" text-anchor="middle" class="strong">x</text>
  <rect x="48" y="455" width="120" height="47" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/><text x="108" y="485" text-anchor="middle" class="strong">Mx</text>
  <path d="M168 370 H205" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M168 479 H205" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <g>
    <rect x="210" y="340" width="125" height="172" rx="12" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="272" y="365" text-anchor="middle" class="head">LAYER 1</text>
    <path d="M226 398 H318" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M226 458 H318" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3"/>
    <path d="M251 389 L293 467 M251 467 L293 389" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="272" y="496" text-anchor="middle" class="note">swap checked</text>
  </g>
  <path d="M335 370 H365" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M335 479 H365" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <g>
    <rect x="370" y="340" width="125" height="172" rx="12" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="432" y="365" text-anchor="middle" class="head">LAYER 2</text>
    <path d="M386 398 H478" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M386 458 H478" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3"/>
    <path d="M411 389 L453 467 M411 467 L453 389" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="432" y="496" text-anchor="middle" class="note">swap checked</text>
  </g>
  <path d="M495 370 H525" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M495 479 H525" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <g>
    <rect x="530" y="340" width="125" height="172" rx="12" fill="#fff" stroke="#334155" stroke-width="2"/>
    <text x="592" y="365" text-anchor="middle" class="head">LAYER 3</text>
    <path d="M546 398 H638" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M546 458 H638" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3"/>
    <path d="M571 389 L613 467 M571 467 L613 389" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="592" y="496" text-anchor="middle" class="note">swap checked</text>
  </g>
  <path d="M655 370 H678 V398 H684" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 479 H678 V458 H684" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <circle cx="730" cy="428" r="46" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="730" y="424" text-anchor="middle" class="strong">subtract</text><text x="730" y="446" text-anchor="middle" class="strong">then ÷2</text>
  <path d="M776 428 H790" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="795" y="396" width="153" height="64" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/><text x="871" y="423" text-anchor="middle" class="head">ODD SCORE</text><text x="871" y="446" text-anchor="middle" class="note">exact at every test</text>

  <rect x="130" y="555" width="740" height="44" rx="14" fill="#0f172a"/>
  <text x="500" y="584" text-anchor="middle" class="bar">The full encoder must beat output repair to earn its extra complexity.</text>
</svg>
