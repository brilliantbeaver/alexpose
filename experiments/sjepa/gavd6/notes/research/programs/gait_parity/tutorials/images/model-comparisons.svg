  <g transform="translate(500 232)"><rect width="220" height="62" rx="14" fill="#f8f2fb" stroke="#b9a1ca"/><text x="110" y="27" text-anchor="middle" class="box">two interacting branches</text><text x="110" y="49" text-anchor="middle" class="note">no swap-preserving ties</text></g>
