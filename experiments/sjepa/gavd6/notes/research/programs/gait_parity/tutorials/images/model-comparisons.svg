<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Matched GaitParity model comparisons</title>
  <desc id="desc">Three lanes isolate exact output repair, unconstrained two-branch fusion, and encoder-wide mirror structure.</desc>
  <defs><style>.title{font:700 28px Arial,sans-serif;fill:#17324d}.lane{font:700 19px Arial,sans-serif;fill:#17324d}.box{font:17px Arial,sans-serif;fill:#263f52}.note{font:16px Arial,sans-serif;fill:#53697a}.arrow{stroke:#8295a5;stroke-width:3;fill:none}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#8295a5"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="#fff"/>
  <text x="55" y="58" class="title">Three models, one input pair, one exact signed output</text>
  <text x="55" y="103" class="lane">Output repair</text><text x="55" y="259" class="lane">Paired control</text><text x="55" y="415" class="lane">Equivariant encoder</text>
  <g transform="translate(260 76)"><rect width="150" height="62" rx="14" fill="#eef4f8" stroke="#a9bccb"/><text x="75" y="28" text-anchor="middle" class="box">walk x</text><text x="75" y="49" text-anchor="middle" class="note">and mirror Mx</text></g>
  <g transform="translate(260 232)"><rect width="150" height="62" rx="14" fill="#eef4f8" stroke="#a9bccb"/><text x="75" y="28" text-anchor="middle" class="box">walk x</text><text x="75" y="49" text-anchor="middle" class="note">and mirror Mx</text></g>
  <g transform="translate(260 388)"><rect width="150" height="62" rx="14" fill="#eef4f8" stroke="#a9bccb"/><text x="75" y="28" text-anchor="middle" class="box">walk x</text><text x="75" y="49" text-anchor="middle" class="note">and mirror Mx</text></g>
