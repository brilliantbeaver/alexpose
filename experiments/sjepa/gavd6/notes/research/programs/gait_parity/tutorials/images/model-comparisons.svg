  <g transform="translate(810 76)"><rect width="220" height="62" rx="14" fill="#eef8f6" stroke="#7ab7b0"/><text x="110" y="27" text-anchor="middle" class="box">exact odd wrapper</text><text x="110" y="49" text-anchor="middle" class="note">final sign rule</text></g>
