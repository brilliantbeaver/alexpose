<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Seven alternatives. Select one flagship.</title>
<desc id="desc">Ranked by the current evidence, novelty boundary and one-week execution risk. Design schematic. No experimental outcomes are shown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker></defs>
<rect width="1440" height="800" fill="#ffffff"/>
<text x="48" y="63" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#182b43" text-anchor="start">Seven alternatives. Select one flagship.</text>
<text x="48" y="104" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="start">Ranked by the current evidence, novelty boundary and one-week execution risk.</text>
<rect x="48" y="140" width="1344" height="62" rx="12" fill="#f1f6fa"/>
<circle cx="78" cy="171" r="19" fill="#087f78"/>
<text x="78" y="178" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="white" text-anchor="middle">1</text>
<text x="113" y="179" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182b43" text-anchor="start">Preserve real movement</text>
<text x="604" y="178" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Use pixel motion to preserve events during repair</text>
<text x="1366" y="178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#087f78" text-anchor="end">P1</text>
<rect x="48" y="213" width="1344" height="62" rx="12" fill="#f1f6fa"/>
<circle cx="78" cy="244" r="19" fill="#087f78"/>
<text x="78" y="251" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="white" text-anchor="middle">2</text>
<text x="113" y="252" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182b43" text-anchor="start">Keep motion beyond keypoints</text>
<text x="604" y="251" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Add the surface motion a skeleton state is missing</text>
<text x="1366" y="251" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#087f78" text-anchor="end">P7</text>
<rect x="48" y="286" width="1344" height="62" rx="12" fill="#f1f6fa"/>
<circle cx="78" cy="317" r="19" fill="#2767b2"/>
<text x="78" y="324" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="white" text-anchor="middle">3</text>
<text x="113" y="325" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182b43" text-anchor="start">Show competing explanations</text>
<text x="604" y="324" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Find checked motions that reverse a 3D conclusion</text>
<text x="1366" y="324" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#2767b2" text-anchor="end">P2</text>
<rect x="48" y="359" width="1344" height="62" rx="12" fill="#f1f6fa"/>
<circle cx="78" cy="390" r="19" fill="#2767b2"/>
<text x="78" y="397" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="white" text-anchor="middle">4</text>
<text x="113" y="398" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182b43" text-anchor="start">Cross-activity motor memory</text>
<text x="604" y="397" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Test whether a short walk helps forecast another action</text>
<text x="1366" y="397" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#2767b2" text-anchor="end">P6</text>
<rect x="48" y="432" width="1344" height="62" rx="12" fill="#f1f6fa"/>
<circle cx="78" cy="463" r="19" fill="#2767b2"/>
<text x="78" y="470" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="white" text-anchor="middle">5</text>
<text x="113" y="471" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182b43" text-anchor="start">Transfer responses</text>
<text x="604" y="470" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Teach how features change, then measure student benefit</text>
<text x="1366" y="470" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#2767b2" text-anchor="end">P5</text>
<rect x="48" y="505" width="1344" height="62" rx="12" fill="#f1f6fa"/>
<circle cx="78" cy="536" r="19" fill="#64748b"/>
<text x="78" y="543" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="white" text-anchor="middle">6</text>
<text x="113" y="544" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182b43" text-anchor="start">Predict distillation value</text>
<text x="604" y="543" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Choose a target, a rank, or no teacher</text>
<text x="1366" y="543" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="end">P3</text>
<rect x="48" y="578" width="1344" height="62" rx="12" fill="#f1f6fa"/>
<circle cx="78" cy="609" r="19" fill="#64748b"/>
<text x="78" y="616" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="white" text-anchor="middle">7</text>
<text x="113" y="617" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182b43" text-anchor="start">Teach uncertain futures</text>
<text x="604" y="616" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Test useful temporal information beyond the mean</text>
<text x="1366" y="616" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="end">P4</text>
<rect x="48" y="680" width="1344" height="56" rx="20" fill="#e8f5f1"/>
<text x="72" y="715" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#087f78" text-anchor="start">Start with P1 and P7&#x27;s small flow assays. Keep P6&#x27;s data audit as a fallback.</text>
<text x="48" y="774" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Research ranking, not an acceptance probability. No proposed result has been measured.</text>
</svg>