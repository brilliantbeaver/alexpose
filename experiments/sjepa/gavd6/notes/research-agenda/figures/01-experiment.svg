<text x="72" y="546" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182b43" text-anchor="start">48-hour development gate: +15 points in retention at matched error; remove at least 25% of injected error.</text>
<rect x="48" y="660" width="1344" height="78" rx="20" fill="#edf7f5"/>
<text x="72" y="692" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#087f78" text-anchor="start">Stop if a simple evidence gate matches the result.</text>
<text x="48" y="774" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Design schematic. No experimental outcomes are shown.</text>
