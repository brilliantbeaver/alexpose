<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Proposal 1: the experiment that can change the decision</title>
<desc id="desc">A short mechanism test comes before the full one-week study. Design schematic. No experimental outcomes are shown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker></defs>
<rect width="1440" height="800" fill="#ffffff"/>
