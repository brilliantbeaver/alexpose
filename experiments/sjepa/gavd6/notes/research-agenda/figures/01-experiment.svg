<text x="556" y="389" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#64748b" text-anchor="start">Calibration-locked repair</text>
<line x1="937" y1="317" x2="959" y2="317" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="966" y="163" width="426" height="309" rx="20" fill="#eef4fa"/>
