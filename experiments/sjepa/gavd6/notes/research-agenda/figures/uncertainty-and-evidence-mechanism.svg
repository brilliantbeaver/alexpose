<text x="548.5" y="508" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">Duplicate, overlap or reveal</text>
<text x="548.5" y="540" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">Same extra input for all</text>
<line x1="711" y1="371" x2="728" y2="371" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
