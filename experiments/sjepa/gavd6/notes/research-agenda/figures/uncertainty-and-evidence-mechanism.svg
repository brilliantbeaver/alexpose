<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Check what added evidence really changes.</title>
<desc id="desc">A repeated observation is not an independent measurement. More evidence can also reveal uncertainty. Design schematic. No experimental outcomes are shown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker></defs>
