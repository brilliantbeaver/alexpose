<text x="72" y="715" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#087f78" text-anchor="start">Pilot P1 and P2. Check P3&#x27;s oracle cheaply. Commit the remaining week to one surviving claim.</text>
