<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>From pose prediction to causal contact prediction</title>
  <desc>A four-step flow from video observations through a typed physical state and bidirectional prediction to force and intervention tests.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker>
    <style>
      .h{font:700 32px Arial,sans-serif;fill:#0f2440}.t{font:700 20px Arial,sans-serif;fill:#0f2440}.b{font:16px Arial,sans-serif;fill:#33475e}.s{font:14px Arial,sans-serif;fill:#5c6f84}.w{font:700 16px Arial,sans-serif;fill:#fff}.ws{font:14px Arial,sans-serif;fill:#cdd8e4}.card{stroke:#20364e;stroke-width:1.75}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text class="h" x="48" y="70">From skeleton appearance to physical mechanism</text>
  <text class="s" x="48" y="104">The strongest claim requires state, contact, force, intervention, and measurement.</text>

  <rect class="card" x="60" y="190" width="220" height="230" rx="16" fill="#e7f0f8"/>
  <text class="t" x="84" y="232">Observe</text>
  <text class="b" x="84" y="278">RGB video</text>
  <text class="b" x="84" y="308">2D skeleton</text>
  <text class="b" x="84" y="338">Masks and depth</text>
  <text class="s" x="84" y="382">Camera and estimator</text>
  <text class="s" x="84" y="406">uncertainty stay visible</text>

  <path class="a" d="M296 305 H324"/>

  <rect class="card" x="340" y="190" width="260" height="230" rx="16" fill="#e6f2ea"/>
  <text class="t" x="364" y="232">Represent state</text>
  <text class="b" x="364" y="278">Human and object</text>
  <text class="b" x="364" y="308">Contact graph</text>
  <text class="b" x="364" y="338">Wrench or impulse</text>
  <text class="s" x="364" y="382">Camera gauge and physical</text>
  <text class="s" x="364" y="406">state stay distinct</text>

  <path class="a" d="M616 305 H644"/>

  <rect class="card" x="660" y="190" width="230" height="230" rx="16" fill="#ece6f6"/>
  <text class="t" x="684" y="232">Ask both ways</text>
  <text class="b" x="684" y="278">Human to object</text>
  <text class="b" x="684" y="308">Object goal to human</text>
  <text class="b" x="684" y="338">Parameter to future</text>
  <text class="s" x="684" y="382">One latent state</text>
  <text class="s" x="684" y="406">supports every query</text>

  <path class="a" d="M906 305 H934"/>

  <rect class="card" x="950" y="190" width="190" height="230" rx="16" fill="#f7e7d8"/>
  <text class="t" x="974" y="232">Falsify</text>
  <text class="b" x="974" y="278">Force plates</text>
  <text class="b" x="974" y="308">Held-out objects</text>
  <text class="b" x="974" y="338">New interventions</text>
  <text class="s" x="974" y="382">Execution, not visual</text>
  <text class="s" x="974" y="406">plausibility, decides</text>

  <rect x="120" y="510" width="960" height="110" rx="16" fill="#20364e"/>
  <text class="w" x="152" y="552">Central hypothesis</text>
  <text class="ws" x="152" y="584">Wrenches quantify momentum exchange. They constrain, but do not uniquely explain, the mechanism.</text>
</svg>
