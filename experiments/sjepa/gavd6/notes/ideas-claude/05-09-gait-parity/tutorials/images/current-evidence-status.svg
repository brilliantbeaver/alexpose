<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Current GaitParity evidence status</title>
  <desc id="desc">A four-stage evidence path shows completed local results and open clinical questions.</desc>
  <defs><style>.title{font:700 28px Arial,sans-serif;fill:#17324d}.num{font:700 17px Arial,sans-serif;fill:#fff}.head{font:700 19px Arial,sans-serif;fill:#17324d}.body{font:17px Arial,sans-serif;fill:#3e5366}.result{font:700 16px Arial,sans-serif}.line{stroke:#9eb0bf;stroke-width:5}</style></defs>
  <rect width="1200" height="500" rx="24" fill="#fff"/>
  <text x="55" y="58" class="title">What has been learned, and where the evidence stops</text>
  <line x1="160" y1="151" x2="1040" y2="151" class="line"/>
  <g transform="translate(115 110)"><circle cx="45" cy="41" r="36" fill="#9c4f17"/><text x="45" y="47" text-anchor="middle" class="num">05a</text><rect x="0" y="95" width="240" height="205" rx="16" fill="#fff5eb" stroke="#dfad78" stroke-width="2"/><text x="18" y="130" class="head">Existing encoder probe</text><text x="18" y="162" class="body"><tspan x="18">Learned R² = −0.068</tspan><tspan x="18" dy="23">Mirror slope = −0.337</tspan><tspan x="18" dy="23">Sign correct on 44%</tspan></text><text x="18" y="257" class="result" fill="#9c4f17">INFORMATIVE NULL</text><text x="18" y="281" class="body">Linear probe did not recover it.</text></g>
  <g transform="translate(390 110)"><circle cx="45" cy="41" r="36" fill="#197a74"/><text x="45" y="47" text-anchor="middle" class="num">09a</text><rect x="0" y="95" width="240" height="205" rx="16" fill="#eef8f6" stroke="#7ab7b0" stroke-width="2"/><text x="18" y="130" class="head">Contract test</text><text x="18" y="162" class="body"><tspan x="18">Exact geometry works</tspan><tspan x="18" dy="23">Broken control is caught</tspan><tspan x="18" dy="23">First odd channel collapses</tspan></text><text x="18" y="257" class="result" fill="#197a74">AUDIT DETECTS FAILURE</text><text x="18" y="281" class="body">Geometry alone is not enough.</text></g>
  <g transform="translate(665 110)"><circle cx="45" cy="41" r="36" fill="#197a74"/><text x="45" y="47" text-anchor="middle" class="num">09f</text><rect x="0" y="95" width="240" height="205" rx="16" fill="#eef8f6" stroke="#7ab7b0" stroke-width="2"/><text x="18" y="130" class="head">Full GAVD CPU run</text><text x="18" y="162" class="body"><tspan x="18">18 controlled runs</tspan><tspan x="18" dy="23">Equivariant residual = 0</tspan><tspan x="18" dy="23">Local health thresholds pass</tspan></text><text x="18" y="257" class="result" fill="#197a74">LOCAL FEASIBILITY</text><text x="18" y="281" class="body">Still transductive evidence.</text></g>
  <g transform="translate(940 110)"><circle cx="45" cy="41" r="36" fill="#607485"/><text x="45" y="47" text-anchor="middle" class="num">NEXT</text><rect x="0" y="95" width="205" height="205" rx="16" fill="#f2f5f7" stroke="#b7c6d3" stroke-width="2"/><text x="18" y="130" class="head">Clinical test</text><text x="18" y="162" class="body"><tspan x="18">Separate force target</tspan><tspan x="18" dy="23">Held-out people</tspan><tspan x="18" dy="23">Matched baselines</tspan></text><text x="18" y="257" class="result" fill="#607485">OPEN</text><text x="18" y="281" class="body">No clinical result yet.</text></g>
  <rect x="230" y="442" width="740" height="38" rx="19" fill="#eef4f8"/>
  <text x="600" y="467" text-anchor="middle" class="body">Claim ceiling today: local representation and geometry feasibility on known GAVD recordings</text>
</svg>
