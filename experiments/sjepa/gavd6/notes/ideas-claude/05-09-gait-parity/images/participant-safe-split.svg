<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Why every record from one participant must stay together</title>
  <desc id="desc">Putting cycles from the same participant in both training and testing produces a deceptively small error of 0.09. Keeping people, their cycles, and their reflected copies together gives the honest held-out error of 0.31, and each person contributes one vote.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <marker id="open-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#b91c1c" stroke-width="2"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .body { font: 19px Arial, sans-serif; fill: #1e293b; }
      .small { font: 17px Arial, sans-serif; fill: #334155; }
      .bar { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .cross { font: 700 28px Arial, sans-serif; fill: #b91c1c; }
      .check { font: 700 26px Arial, sans-serif; fill: #15803d; }
    </style>
  </defs>
  <rect width="1000" height="640" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="639" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="48" text-anchor="middle" class="title">One person’s records must not cross the outer split</text>
  <text x="500" y="78" text-anchor="middle" class="body">Many cycles are useful measurements. They are not many independent people.</text>

  <rect x="40" y="102" width="920" height="142" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="68" y="138" class="cross">×</text>
  <text x="107" y="137" class="heading">WRONG: P1 APPEARS IN BOTH OUTER GROUPS</text>
  <circle cx="110" cy="190" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <text x="110" y="197" text-anchor="middle" class="small">P1</text>
  <text x="150" y="183" class="small">six cycles from one walk</text>
  <rect x="345" y="164" width="236" height="55" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="463" y="186" text-anchor="middle" class="heading">TRAIN</text>
  <text x="463" y="210" text-anchor="middle" class="small">P1: c1 c2 c3 c4</text>
  <rect x="622" y="164" width="236" height="55" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="740" y="186" text-anchor="middle" class="heading">TEST</text>
  <text x="740" y="210" text-anchor="middle" class="small">P1: c5 c6</text>
  <path d="M254 190 H333" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <path d="M584 190 H610" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <text x="895" y="181" text-anchor="middle" class="small">looks better:</text>
  <text x="895" y="211" text-anchor="middle" class="heading">error 0.09</text>

  <rect x="40" y="278" width="305" height="233" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="192" y="314" text-anchor="middle" class="heading">COLLAPSE THE REPEATS</text>
  <circle cx="90" cy="356" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <text x="90" y="363" text-anchor="middle" class="small">P1</text>
  <rect x="126" y="337" width="24" height="24" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="158" y="337" width="24" height="24" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="190" y="337" width="24" height="24" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="126" y="369" width="24" height="24" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="158" y="369" width="24" height="24" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="190" y="369" width="24" height="24" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="420" text-anchor="middle" class="small">6 cycles, plus Mx copies</text>
  <path d="M225 365 H258" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M270 339 L300 365 L270 391 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="270" y="371" text-anchor="middle" class="small">trial</text>
  <path d="M300 365 H320" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="192" y="456" text-anchor="middle" class="body">1 trial summary → 1 participant vote</text>
  <text x="192" y="483" text-anchor="middle" class="small">Cycles increase precision, not sample size.</text>

  <rect x="372" y="278" width="588" height="233" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="400" y="314" class="check">✓</text>
  <text x="434" y="314" class="heading">RIGHT: SPLIT WHOLE PEOPLE</text>
  <rect x="400" y="338" width="292" height="140" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="546" y="369" text-anchor="middle" class="heading">OUTER TRAIN</text>
  <circle cx="445" cy="405" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/><text x="445" y="411" text-anchor="middle" class="small">P1</text>
  <rect x="486" y="391" width="28" height="28" fill="#ffffff" stroke="#1e293b" stroke-width="3"/><text x="500" y="411" text-anchor="middle" class="small">P2</text>
  <text x="570" y="410" class="small">all cycles and Mx</text>
  <rect x="421" y="431" width="250" height="31" rx="8" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="546" y="453" text-anchor="middle" class="small">inner validation rotates here</text>
  <rect x="724" y="338" width="202" height="140" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="825" y="369" text-anchor="middle" class="heading">OUTER TEST</text>
  <path d="M804 390 L820 418 L788 418 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <text x="804" y="410" text-anchor="middle" class="small">P3</text>
  <text x="825" y="449" text-anchor="middle" class="small">all cycles and Mx</text>
  <path d="M692 407 H710" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="702" y="397" text-anchor="middle" class="small">⊘</text>
  <text x="666" y="497" text-anchor="middle" class="body">honest held-out error 0.31</text>
  <rect x="130" y="548" width="740" height="54" rx="14" fill="#0f172a"/>
  <text x="500" y="582" text-anchor="middle" class="bar">People, not cycles, are the independent observations.</text>
</svg>
