<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">How a learning curve tests whether a mirror rule saves labels</title>
  <desc id="desc">The exact odd output has lower average error at each label budget, but its bootstrap bands overlap the free two-view model. The shaded area under each error curve summarizes label efficiency, and smaller is better.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .body { font: 19px Arial, sans-serif; fill: #1e293b; }
      .small { font: 17px Arial, sans-serif; fill: #334155; }
      .number { font: 700 22px Arial, sans-serif; }
      .bar { font: 700 20px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="48" text-anchor="middle" class="title">Does the mirror rule help when labels are scarce?</text>

  <rect x="78" y="92" width="712" height="380" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="434" y="124" text-anchor="middle" class="heading">Held-out error by number of labelled people</text>
  <line x1="150" y1="160" x2="150" y2="414" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="414" x2="740" y2="414" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="184" x2="740" y2="184" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="150" y1="250" x2="740" y2="250" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="150" y1="316" x2="740" y2="316" stroke="#cbd5e1" stroke-width="1"/>
  <text x="132" y="190" text-anchor="end" class="small">0.70</text>
  <text x="132" y="256" text-anchor="end" class="small">0.50</text>
  <text x="132" y="322" text-anchor="end" class="small">0.30</text>
  <text x="132" y="420" text-anchor="end" class="small">0.00</text>
  <text x="42" y="294" text-anchor="middle" transform="rotate(-90 42 294)" class="body">error, lower is better</text>
  <text x="220" y="447" text-anchor="middle" class="body">4 people</text>
  <text x="385" y="447" text-anchor="middle" class="body">8 people</text>
  <text x="550" y="447" text-anchor="middle" class="body">16 people</text>
  <text x="715" y="447" text-anchor="middle" class="body">all eligible</text>

  <path d="M220 210 L385 246 L550 273 L715 292 L715 414 L220 414 Z" fill="#1d4ed8" fill-opacity="0.07"/>
  <path d="M220 269 L385 283 L550 289 L715 296 L715 414 L220 414 Z" fill="#b45309" fill-opacity="0.09"/>
  <g stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M213 180 V241 M207 180 H219 M207 241 H219" stroke="#1d4ed8"/>
    <path d="M378 218 V276 M372 218 H384 M372 276 H384" stroke="#1d4ed8"/>
    <path d="M543 247 V302 M537 247 H549 M537 302 H549" stroke="#1d4ed8"/>
    <path d="M708 266 V315 M702 266 H714 M702 315 H714" stroke="#1d4ed8"/>
    <path d="M227 233 V306 M221 233 H233 M221 306 H233" stroke="#b45309"/>
    <path d="M392 250 V315 M386 250 H398 M386 315 H398" stroke="#b45309"/>
    <path d="M557 263 V319 M551 263 H563 M551 319 H563" stroke="#b45309"/>
    <path d="M722 273 V325 M716 273 H728 M716 325 H728" stroke="#b45309"/>
  </g>
  <path d="M220 210 L385 246 L550 273 L715 292" fill="none" stroke="#1d4ed8" stroke-width="3.5"/>
  <path d="M220 269 L385 283 L550 289 L715 296" fill="none" stroke="#b45309" stroke-width="3.5" stroke-dasharray="6 3"/>
  <circle cx="220" cy="210" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="385" cy="246" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="550" cy="273" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="715" cy="292" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="214" y="263" width="12" height="12" fill="#ffffff" stroke="#b45309" stroke-width="3" transform="rotate(45 220 269)"/>
  <rect x="379" y="277" width="12" height="12" fill="#ffffff" stroke="#b45309" stroke-width="3" transform="rotate(45 385 283)"/>
  <rect x="544" y="283" width="12" height="12" fill="#ffffff" stroke="#b45309" stroke-width="3" transform="rotate(45 550 289)"/>
  <rect x="709" y="290" width="12" height="12" fill="#ffffff" stroke="#b45309" stroke-width="3" transform="rotate(45 715 296)"/>
  <text x="198" y="197" text-anchor="end" class="small">0.62</text>
  <text x="365" y="233" text-anchor="end" class="small">0.51</text>
  <text x="530" y="260" text-anchor="end" class="small">0.43</text>
  <text x="696" y="279" text-anchor="end" class="small">0.37</text>
  <text x="242" y="287" class="small">0.44</text>
  <text x="407" y="301" class="small">0.40</text>
  <text x="572" y="307" class="small">0.38</text>
  <text x="737" y="314" class="small">0.36</text>

  <line x1="812" y1="187" x2="844" y2="187" stroke="#1d4ed8" stroke-width="3.5"/>
  <circle cx="828" cy="187" r="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="846" y="193" class="body">free two-view</text>
  <line x1="812" y1="226" x2="844" y2="226" stroke="#b45309" stroke-width="3.5" stroke-dasharray="6 3"/>
  <rect x="822" y="220" width="12" height="12" fill="#ffffff" stroke="#b45309" stroke-width="3" transform="rotate(45 828 226)"/>
  <text x="846" y="232" class="body">exact odd output</text>
  <rect x="806" y="277" width="156" height="92" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="884" y="306" text-anchor="middle" class="heading">WAIT</text>
  <text x="884" y="334" text-anchor="middle" class="small">Average is lower,</text>
  <text x="884" y="357" text-anchor="middle" class="small">but bands overlap.</text>
  <text x="500" y="497" text-anchor="middle" class="small">Bars show the bootstrap interval. Shading runs down to the zero-error baseline.</text>
  <text x="500" y="520" text-anchor="middle" class="small">A smaller area means lower error across all label budgets.</text>
  <rect x="130" y="540" width="740" height="54" rx="14" fill="#0f172a"/>
  <text x="500" y="574" text-anchor="middle" class="bar">Smaller area means fewer labelled people were needed.</text>
</svg>
