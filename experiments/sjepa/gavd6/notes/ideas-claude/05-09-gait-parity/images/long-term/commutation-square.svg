<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">The swap rule must work in either order</title>
  <desc id="desc">A paired model passes only when swapping its two branches before a layer gives the same result as processing first and swapping afterward. Shared processing passes this test; using different dropout masks does not.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .head{font:700 21px Arial,sans-serif;fill:#0f172a}
      .body{font:19px Arial,sans-serif;fill:#1e293b}
      .note{font:17px Arial,sans-serif;fill:#334155}
      .small{font:700 17px Arial,sans-serif;fill:#0f172a}
      .bar{font:700 20px Arial,sans-serif;fill:#fff}
    </style>
  </defs>

  <rect width="1000" height="620" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="45" text-anchor="middle" class="title">Does the swap rule work in either order?</text>
  <text x="500" y="74" text-anchor="middle" class="note">Every claimed layer must make these two routes agree.</text>

  <rect x="92" y="116" width="255" height="92" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="219" y="151" text-anchor="middle" class="head">START: PAIRED STATE</text>
  <line x1="148" y1="180" x2="194" y2="180" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="244" y1="180" x2="290" y2="180" stroke="#334155" stroke-width="3" stroke-dasharray="6 3" stroke-linecap="round"/>
  <text x="219" y="197" text-anchor="middle" class="note">solid branch + dashed branch</text>

  <rect x="653" y="116" width="255" height="92" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="780" y="151" text-anchor="middle" class="head">PROCESS FIRST</text>
  <text x="780" y="181" text-anchor="middle" class="body">F(H)</text>

  <rect x="92" y="304" width="255" height="92" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text x="219" y="336" text-anchor="middle" class="head">SWAP FIRST</text>
  <text x="219" y="366" text-anchor="middle" class="body">S(H)</text>
  <path d="M155 380 L283 349 M155 349 L283 380" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <text x="219" y="389" text-anchor="middle" class="note">the two branches trade places</text>

  <rect x="653" y="304" width="255" height="92" rx="14" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="780" y="336" text-anchor="middle" class="head">SAME FINAL STATE</text>
  <text x="780" y="366" text-anchor="middle" class="body">S(F(H))</text>
  <text x="780" y="389" text-anchor="middle" class="small" fill="#15803d">✓ numbers agree within tolerance</text>

  <path d="M347 162 H635" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="491" y="147" text-anchor="middle" class="small">1. PROCESS</text>
  <path d="M219 208 V284" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="244" y="256" class="small">2. SWAP</text>
  <path d="M347 350 H635" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="491" y="335" text-anchor="middle" class="small">1. PROCESS</text>
  <path d="M780 208 V284" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="805" y="256" class="small">2. SWAP</text>

  <rect x="390" y="222" width="220" height="82" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="251" text-anchor="middle" class="head">THE REQUIRED TEST</text>
  <text x="500" y="279" text-anchor="middle" class="body">swap then process</text>
  <text x="500" y="299" text-anchor="middle" class="body">= process then swap</text>

  <rect x="55" y="438" width="890" height="103" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="471" class="head">LAYER CHECKS</text>
  <rect x="272" y="457" width="275" height="63" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
  <text x="409" y="484" text-anchor="middle" class="small" fill="#15803d">✓ shared layer settings</text>
  <text x="409" y="507" text-anchor="middle" class="note">both branches get the same rule</text>
  <rect x="588" y="457" width="320" height="63" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="748" y="484" text-anchor="middle" class="small" fill="#b91c1c">✗ different dropout masks</text>
  <text x="748" y="507" text-anchor="middle" class="note">branches roll different dice</text>

  <rect x="130" y="559" width="740" height="44" rx="14" fill="#0f172a"/>
  <text x="500" y="588" text-anchor="middle" class="bar">Mirror then process must equal process then mirror, layer by layer.</text>
</svg>
