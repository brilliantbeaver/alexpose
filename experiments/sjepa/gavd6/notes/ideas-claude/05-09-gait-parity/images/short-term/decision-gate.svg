<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">The prototype can end in four honest decisions</title>
  <desc id="desc">The GaitParity Prototype advances to the full study only when its instrument works and the exact odd output has a credible benefit. Revise, stop, and inconclusive are equally legitimate evidence-based exits. Each outcome box states the condition that selects it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <marker id="go-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#15803d"/></marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .body { font: 19px Arial, sans-serif; fill: #1e293b; }
      .small { font: 16px Arial, sans-serif; fill: #1e293b; }
      .cond { font: italic 16px Arial, sans-serif; fill: #64748b; }
      .note { font: 15px Arial, sans-serif; fill: #64748b; }
      .bar { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .check { font: 700 24px Arial, sans-serif; fill: #15803d; }
    </style>
  </defs>
  <rect width="1000" height="640" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="639" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="48" text-anchor="middle" class="title">The prototype ends when its evidence earns a decision</text>
  <text x="500" y="79" text-anchor="middle" class="body">It is not a calendar deadline. It is a test of whether the harder study is justified.</text>

  <rect x="36" y="150" width="280" height="180" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="176" y="187" text-anchor="middle" class="heading">PROTOTYPE EVIDENCE</text>
  <text x="176" y="220" text-anchor="middle" class="small">Mirror, target, and split</text>
  <text x="176" y="244" text-anchor="middle" class="small">checks pass. Then compare</text>
  <text x="176" y="268" text-anchor="middle" class="small">free two-view with exact odd.</text>
  <text x="176" y="302" text-anchor="middle" class="note">Held-out participants decide.</text>
  <path d="M316 240 H352" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="500" y="124" text-anchor="middle" class="note">pre-set checks, not hope</text>
  <path d="M500 140 L640 240 L500 340 L360 240 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="500" y="232" text-anchor="middle" class="heading">WHAT DID THE</text>
  <text x="500" y="258" text-anchor="middle" class="heading">EVIDENCE EARN?</text>

  <path d="M572 188 C634 152 662 156 692 172" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#go-arrow)"/>
  <rect x="700" y="112" width="264" height="152" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="796" y="152" class="check">✓</text>
  <text x="846" y="151" text-anchor="middle" class="heading">GO</text>
  <text x="832" y="184" text-anchor="middle" class="cond">when: sound target and</text>
  <text x="832" y="205" text-anchor="middle" class="cond">clear held-out benefit</text>
  <text x="832" y="232" text-anchor="middle" class="small">Build a predictive or</text>
  <text x="832" y="253" text-anchor="middle" class="small">structure-only encoder study.</text>

  <path d="M572 292 C634 330 662 348 692 366" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#amber-arrow)"/>
  <rect x="700" y="300" width="264" height="152" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="832" y="339" text-anchor="middle" class="heading">REVISE</text>
  <text x="832" y="372" text-anchor="middle" class="cond">when: the target or the</text>
  <text x="832" y="393" text-anchor="middle" class="cond">data is too noisy</text>
  <text x="832" y="420" text-anchor="middle" class="small">Repair it, then rerun</text>
  <text x="832" y="441" text-anchor="middle" class="small">the frozen plan.</text>

  <path d="M428 292 C374 330 300 362 186 380" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="36" y="386" width="280" height="150" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="176" y="424" text-anchor="middle" class="heading">STOP</text>
  <text x="176" y="456" text-anchor="middle" class="cond">when: no benefit and</text>
  <text x="176" y="477" text-anchor="middle" class="cond">the interval is narrow</text>
  <text x="176" y="504" text-anchor="middle" class="small">Report it. A clean null</text>
  <text x="176" y="525" text-anchor="middle" class="small">is a real result.</text>

  <path d="M500 340 V382" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="360" y="386" width="280" height="150" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="500" y="424" text-anchor="middle" class="heading">INCONCLUSIVE</text>
  <text x="500" y="456" text-anchor="middle" class="cond">when: the interval is wider</text>
  <text x="500" y="477" text-anchor="middle" class="cond">than the practical margin</text>
  <text x="500" y="504" text-anchor="middle" class="small">Report the width. Do not</text>
  <text x="500" y="525" text-anchor="middle" class="small">call it a null.</text>

  <rect x="130" y="560" width="740" height="54" rx="14" fill="#0f172a"/>
  <text x="500" y="594" text-anchor="middle" class="bar">GO, REVISE, STOP, and INCONCLUSIVE are honest decisions.</text>
</svg>
