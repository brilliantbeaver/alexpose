<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t1 d1">
  <title id="t1">Per-mechanism recovery R-squared by target family against the raw-input ceiling and untrained-encoder floor</title>
  <desc id="d1">Illustrative expected-shape grouped bar chart. Three column groups, one per validated gait mechanism (left-right symmetry ratio, stride-time CV, anterior pelvic tilt). Within each group, four bars show held-out-source R-squared for the four target families T1 raw coordinates, T2 one-frame motion, T3 centered-sharpened latent, T4 normalized latent regression. Per group a green dashed line marks the raw-input ceiling, a lower grey dashed line marks the untrained-encoder floor, and a shaded band spans the pre-registered plus 0.05 R-squared margin above the ceiling. A target family is credited on a mechanism only if its bar clears both the ceiling by 0.05 and the floor by 0.05. All numbers are illustrative and transductive; folder labels are dataset annotations, not diagnoses.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
    <style>
      .h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:32px;fill:#0f2440;}
      .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;fill:#0f2440;}
      .b{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#33475e;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5c6f84;}
      .w{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;fill:#ffffff;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="60" class="h">Which target family clears the raw-input ceiling on each mechanism</text>
  <text x="48" y="88" class="s">Illustrative expected shape, not measured results. Held-out-source R-squared, pooled across conditions. All numbers transductive.</text>

  <!-- ============ LEFT: grouped-bar plot card ============ -->
  <!-- card: x 48..832, y 112..612 -->
  <rect x="48" y="112" width="784" height="500" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="78" y="148" class="t">Mechanism recovery R-squared by target family</text>

  <!-- plot frame: x 150..808, y 176..528. y=528 is R2=0.0, y=176 is R2=1.0. scale 352px per 1.0 -->
  <!-- y-axis gridline labels and ticks -->
  <line x1="150" y1="176" x2="150" y2="528" stroke="#20364e" stroke-width="2.5"/>
  <line x1="150" y1="528" x2="808" y2="528" stroke="#20364e" stroke-width="2.5"/>

  <!-- y ticks at 0, 0.25, 0.5, 0.75, 1.0 (528, 440, 352, 264, 176) -->
  <line x1="150" y1="528" x2="144" y2="528" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="533" class="s" text-anchor="end">0.0</text>
  <line x1="150" y1="440" x2="144" y2="440" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="445" class="s" text-anchor="end">0.25</text>
  <line x1="150" y1="352" x2="144" y2="352" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="357" class="s" text-anchor="end">0.5</text>
  <line x1="150" y1="264" x2="144" y2="264" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="269" class="s" text-anchor="end">0.75</text>
  <line x1="150" y1="176" x2="144" y2="176" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="181" class="s" text-anchor="end">1.0</text>

  <!-- y axis label -->
  <text x="104" y="352" class="b" text-anchor="middle" transform="rotate(-90 104 352)">Held-out-source R-squared</text>

  <!-- ==== GROUP 1: symmetry ratio. center x=280, bars from x=214. floor R2=0.10 (y=493), ceiling R2=0.18 (y=464.6) ==== -->
  <!-- margin band: ceiling+0.05 => 0.18 to 0.23 (y 464.6 to 447.0) -->
  <rect x="214" y="447.0" width="132" height="17.6" fill="#e6f2ea" stroke="none"/>
  <!-- bars: T1 blue .16, T2 warm .13, T3 violet .21, T4 green .17 -->
  <rect x="216" y="471.7" width="26" height="56.3" fill="#2f6f99" stroke="#20364e" stroke-width="1.25"/>
  <rect x="248" y="482.2" width="26" height="45.8" fill="#e07a4b" stroke="#a44c26" stroke-width="1.25"/>
  <rect x="280" y="454.1" width="26" height="73.9" fill="#8a6fb3" stroke="#20364e" stroke-width="1.25"/>
  <rect x="312" y="468.2" width="26" height="59.8" fill="#5f9e7e" stroke="#20364e" stroke-width="1.25"/>
  <!-- floor line R2=0.10 y=492.8, ceiling line R2=0.18 y=464.6 -->
  <line x1="210" y1="492.8" x2="350" y2="492.8" stroke="#8a9bab" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="210" y1="464.6" x2="350" y2="464.6" stroke="#5f9e7e" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="280" y="552" class="s" text-anchor="middle">Symmetry ratio</text>

  <!-- ==== GROUP 2: stride-time CV. center x=479. floor R2=0.03 (y=517.4), ceiling R2=0.08 (y=499.8) ==== -->
  <rect x="413" y="482.2" width="132" height="17.6" fill="#e6f2ea" stroke="none"/>
  <!-- bars: T1 .04, T2 .06, T3 .05, T4 .07 (all below ceiling+margin => informative null) -->
  <rect x="415" y="513.9" width="26" height="14.1" fill="#2f6f99" stroke="#20364e" stroke-width="1.25"/>
  <rect x="447" y="506.9" width="26" height="21.1" fill="#e07a4b" stroke="#a44c26" stroke-width="1.25"/>
  <rect x="479" y="510.4" width="26" height="17.6" fill="#8a6fb3" stroke="#20364e" stroke-width="1.25"/>
  <rect x="511" y="503.4" width="26" height="24.6" fill="#5f9e7e" stroke="#20364e" stroke-width="1.25"/>
  <line x1="409" y1="517.4" x2="549" y2="517.4" stroke="#8a9bab" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="409" y1="499.8" x2="549" y2="499.8" stroke="#5f9e7e" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="479" y="552" class="s" text-anchor="middle">Stride-time CV</text>

  <!-- ==== GROUP 3: anterior pelvic tilt. center x=678. floor R2=0.22 (y=450.6), ceiling R2=0.62 (y=309.8) ==== -->
  <rect x="612" y="292.2" width="132" height="17.6" fill="#e6f2ea" stroke="none"/>
  <!-- bars: T1 .58, T2 .55, T3 .69, T4 .64 (T3 and T4 clear ceiling+margin) -->
  <rect x="614" y="323.9" width="26" height="204.1" fill="#2f6f99" stroke="#20364e" stroke-width="1.25"/>
  <rect x="646" y="330.4" width="26" height="197.6" fill="#e07a4b" stroke="#a44c26" stroke-width="1.25"/>
  <rect x="678" y="285.2" width="26" height="242.8" fill="#8a6fb3" stroke="#20364e" stroke-width="1.25"/>
  <rect x="710" y="302.6" width="26" height="225.4" fill="#5f9e7e" stroke="#20364e" stroke-width="1.25"/>
  <line x1="608" y1="450.6" x2="748" y2="450.6" stroke="#8a9bab" stroke-width="2" stroke-dasharray="4 5"/>
  <line x1="608" y1="309.8" x2="748" y2="309.8" stroke="#5f9e7e" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="678" y="552" class="s" text-anchor="middle">Anterior pelvic tilt</text>

  <!-- annotation: ceiling / floor labels in clear space at right of plot -->
  <text x="770" y="313" class="s" fill="#5f9e7e">ceiling</text>
  <text x="770" y="454" class="s" fill="#8a9bab">floor</text>

  <!-- footer inside card: axis caption -->
  <text x="479" y="590" class="s" text-anchor="middle">Green dashed = raw-input ceiling. Grey dashed = untrained floor. Band = +0.05 margin.</text>

  <!-- ============ RIGHT: legend + verdict cards stacked ============ -->

  <!-- Target-family legend card: x 888..1152, y 112..372 -->
  <rect x="888" y="112" width="264" height="260" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="918" y="148" class="t">Four target families</text>

  <rect x="918" y="170" width="18" height="18" fill="#2f6f99" stroke="#20364e" stroke-width="1.25"/>
  <text x="946" y="185" class="b">T1 raw coordinates</text>

  <rect x="918" y="206" width="18" height="18" fill="#e07a4b" stroke="#a44c26" stroke-width="1.25"/>
  <text x="946" y="221" class="b">T2 one-frame motion</text>

  <rect x="918" y="242" width="18" height="18" fill="#8a6fb3" stroke="#20364e" stroke-width="1.25"/>
  <text x="946" y="257" class="b">T3 centered-sharpened</text>
  <text x="946" y="279" class="s">latent (current S-JEPA)</text>

  <rect x="918" y="300" width="18" height="18" fill="#5f9e7e" stroke="#20364e" stroke-width="1.25"/>
  <text x="946" y="315" class="b">T4 normalized latent</text>
  <text x="946" y="337" class="s">regression (V-JEPA)</text>

  <!-- Verdict card (dark banner): x 888..1152, y 428..612, gap 372->428 = 56 -->
  <rect x="888" y="428" width="264" height="184" rx="16" fill="#20364e" stroke="#20364e" stroke-width="1.75"/>
  <text x="918" y="464" class="w" font-size="20">Reading the bars</text>
  <text x="918" y="490" class="w">Credit needs BOTH:</text>
  <text x="918" y="512" class="s" fill="#cdd8e4">bar above ceiling by 0.05</text>
  <text x="918" y="534" class="s" fill="#cdd8e4">and above floor by 0.05.</text>
  <line x1="918" y1="550" x2="1122" y2="550" stroke="#5f9e7e" stroke-width="1.5"/>
  <text x="918" y="568" class="s" fill="#cdd8e4">No clear bar on a mechanism</text>
  <text x="918" y="590" class="s" fill="#cdd8e4">scored an informative null.</text>

  <!-- Footer note: baseline y=672 -->
  <text x="48" y="672" class="s">Illustrative expected shape, not measured results. Asymmetry weakest-decoded (R-squared ~0.154). Labels are dataset annotations.</text>
</svg>
