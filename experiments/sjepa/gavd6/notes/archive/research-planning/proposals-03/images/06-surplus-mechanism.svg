<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Nonlocal predictive surplus mechanism</title>
  <desc>A strong lower-body model and an equal-capacity whole-body model predict future foot placement; matched upper-body shuffles test whether the gain reflects coordinated motion.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker></defs>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 20px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <text class="h" x="48" y="64">Does upper-body history add nonlocal predictive information?</text><text class="b" x="48" y="98">Speed, phase, heading, pelvis, legs, model size, and training budget are already matched</text>
  <rect x="60" y="164" width="300" height="360" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/><text class="t" x="84" y="204">Strong lower-body model</text><text class="b" x="84" y="248">Pelvis and both legs</text><text class="b" x="84" y="282">Speed • phase • cadence</text><text class="b" x="84" y="316">Heading • contact</text><text class="b" x="84" y="350">Stride summaries</text><line x1="84" y1="390" x2="330" y2="390" stroke="#c4cdd8"/><text class="s" x="84" y="430">Widened to match capacity</text>
  <rect x="450" y="164" width="300" height="360" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/><text class="t" x="474" y="204">Whole-body model</text><text class="b" x="474" y="248">Everything at left</text><text class="b" x="474" y="282">plus trunk and arms</text><text class="b" x="474" y="316">Same parameters</text><text class="b" x="474" y="350">Same optimizer updates</text><line x1="474" y1="390" x2="720" y2="390" stroke="#c4cdd8"/><text class="s" x="474" y="430">Only body scope changes</text>
  <rect x="840" y="164" width="300" height="360" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text class="t" x="864" y="204">Future foot placement</text><text class="b" x="864" y="248">Landing location</text><text class="b" x="864" y="282">Contact time</text><text class="b" x="864" y="316">0.25 • 0.5 • 0.75 s</text><line x1="864" y1="360" x2="1110" y2="360" stroke="#c4cdd8"/><text class="t" x="864" y="406">Surplus</text><text class="b" x="864" y="444">Relative error reduction</text><text class="s" x="864" y="482">Must vanish when shuffled</text>
  <path class="a" d="M360 300 H432"/><path class="a" d="M750 344 H822"/>
  <rect x="60" y="594" width="1080" height="72" rx="16" fill="#20364e"/><text class="w" x="84" y="624">Do not call the gain compensation unless it changes after a known perturbation.</text><text x="84" y="650" style="font:14px Arial;fill:#cdd8e4">Predictability is not causality.</text>
</svg>
