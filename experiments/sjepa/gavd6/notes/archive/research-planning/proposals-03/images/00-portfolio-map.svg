<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Seven S-JEPA research proposals ranked by decision value</title>
  <desc>Seven cards show the portfolio from cross-protocol response prediction through transition intent, with the top three highlighted as immediate gates.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 18px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.n{font:700 18px Arial;fill:#fff}</style>
  <text class="h" x="48" y="64">Seven falsifiable S-JEPA extensions</text>
  <text class="b" x="48" y="96">Ranked by novelty, significance, feasibility, and a result that simple shortcuts cannot produce</text>
  <g stroke="#20364e" stroke-width="1.75">
    <rect x="48" y="136" width="252" height="200" rx="16" fill="#e6f2ea"/>
    <rect x="332" y="136" width="252" height="200" rx="16" fill="#e6f2ea"/>
    <rect x="616" y="136" width="252" height="200" rx="16" fill="#e6f2ea"/>
    <rect x="900" y="136" width="252" height="200" rx="16" fill="#e7f0f8"/>
    <rect x="190" y="382" width="252" height="200" rx="16" fill="#ece6f6"/>
    <rect x="474" y="382" width="252" height="200" rx="16" fill="#fff"/>
    <rect x="758" y="382" width="252" height="200" rx="16" fill="#fff"/>
  </g>
  <g>
    <circle cx="78" cy="166" r="18" fill="#2f6f99"/><text class="n" x="73" y="172">1</text>
    <text class="t" x="108" y="170">Response envelope</text><text class="b" x="70" y="212">Known perturbation</text><text class="b" x="70" y="240">Predict recovery range</text><text class="b" x="70" y="268">Transfer protocols</text><text class="s" x="70" y="310">Flagship bet</text>
    <circle cx="362" cy="166" r="18" fill="#2f6f99"/><text class="n" x="357" y="172">2</text>
    <text class="t" x="392" y="170">Pose auditor</text><text class="b" x="354" y="212">Video surprise</text><text class="b" x="354" y="240">versus skeleton surprise</text><text class="b" x="354" y="268">Localize failures</text><text class="s" x="354" y="310">Fast fallback</text>
    <circle cx="646" cy="166" r="18" fill="#2f6f99"/><text class="n" x="641" y="172">3</text>
    <text class="t" x="676" y="170">Future distillation</text><text class="b" x="638" y="212">Remove current RGB</text><text class="b" x="638" y="240">Predict future innovation</text><text class="b" x="638" y="268">Measure sufficiency</text><text class="s" x="638" y="310">Two-day checkpoint</text>
    <circle cx="930" cy="166" r="18" fill="#8a6fb3"/><text class="n" x="925" y="172">4</text>
    <text class="t" x="960" y="170">Recovery horizon</text><text class="b" x="922" y="212">Cut before descent</text><text class="b" x="922" y="240">Match look-alikes</text><text class="b" x="922" y="268">Find earliest signal</text><text class="s" x="922" y="310">Gated dataset</text>
    <circle cx="220" cy="412" r="18" fill="#8a6fb3"/><text class="n" x="215" y="418">5</text>
    <text class="t" x="250" y="416">Sparse anchors</text><text class="b" x="212" y="458">Temporary swaps</text><text class="b" x="212" y="486">Noisy outside evidence</text><text class="b" x="212" y="514">Minimum budget</text><text class="s" x="212" y="556">Safest local study</text>
    <circle cx="504" cy="412" r="18" fill="#5f9e7e"/><text class="n" x="499" y="418">6</text>
    <text class="t" x="534" y="416">Nonlocal surplus</text><text class="b" x="496" y="458">Leg state held fixed</text><text class="b" x="496" y="486">Add trunk and arms</text><text class="b" x="496" y="514">Predict foot landing</text><text class="s" x="496" y="556">Mechanistic audit</text>
    <circle cx="788" cy="412" r="18" fill="#5f9e7e"/><text class="n" x="783" y="418">7</text>
    <text class="t" x="818" y="416">Intent frontier</text><text class="b" x="780" y="458">Less time</text><text class="b" x="780" y="486">Fewer body regions</text><text class="b" x="780" y="514">Same reliability</text><text class="s" x="780" y="556">Compact external study</text>
  </g>
  <rect x="48" y="628" width="1104" height="48" rx="16" fill="#20364e"/>
  <text x="70" y="658" style="font:700 16px Arial;fill:#fff">Selection rule: advance the study with the largest mechanism margin over its strongest prespecified baseline.</text>
</svg>
