<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Wrench-JEPA bidirectional prediction</title>
  <desc>A shared typed latent state answers forward human-to-object and inverse object-goal-to-human queries.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker>
    <style>
      .h{font:700 32px Arial,sans-serif;fill:#0f2440}.t{font:700 20px Arial,sans-serif;fill:#0f2440}.b{font:16px Arial,sans-serif;fill:#33475e}.s{font:14px Arial,sans-serif;fill:#5c6f84}.w{font:700 16px Arial,sans-serif;fill:#fff}.card{stroke:#20364e;stroke-width:1.75}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.d{stroke:#5f9e7e;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text class="h" x="48" y="70">Wrench-JEPA asks forward and inverse questions of one state</text>
  <text class="s" x="48" y="104">Typed tokens prevent contact mechanics from disappearing inside an undifferentiated embedding.</text>

  <rect class="card" x="60" y="215" width="245" height="250" rx="16" fill="#e7f0f8"/>
  <text class="t" x="84" y="257">Visible evidence</text>
  <text class="b" x="84" y="303">Current 4D scene</text>
  <text class="b" x="84" y="333">Human future or</text>
  <text class="b" x="84" y="359">desired object path</text>
  <text class="s" x="84" y="405">Every estimate carries</text>
  <text class="s" x="84" y="431">uncertainty and source</text>

  <path class="a" d="M321 340 H369"/>

  <rect class="card" x="385" y="175" width="350" height="330" rx="16" fill="#fff"/>
  <text class="t" x="409" y="217">Shared typed latent state</text>
  <rect x="409" y="245" width="302" height="46" rx="10" fill="#e7f0f8"/><text class="b" x="429" y="274">Human joints and body</text>
  <rect x="409" y="305" width="302" height="46" rx="10" fill="#e6f2ea"/><text class="b" x="429" y="334">Object pose and keypoints</text>
  <rect x="409" y="365" width="302" height="46" rx="10" fill="#f7e7d8"/><text class="b" x="429" y="394">Contact graph and phase</text>
  <rect x="409" y="425" width="302" height="46" rx="10" fill="#ece6f6"/><text class="b" x="429" y="454">6D wrench and impulse</text>

  <path class="a" d="M751 282 H799"/>
  <path class="a" d="M751 428 H799"/>

  <rect class="card" x="815" y="185" width="325" height="185" rx="16" fill="#e6f2ea"/>
  <text class="t" x="839" y="227">Forward query</text>
  <text class="b" x="839" y="273">Human action to object future</text>
  <text class="b" x="839" y="303">plus contact and force</text>
  <text class="s" x="839" y="343">Hide passive-entity tokens</text>

  <rect class="card" x="815" y="390" width="325" height="185" rx="16" fill="#ece6f6"/>
  <text class="t" x="839" y="432">Inverse query</text>
  <text class="b" x="839" y="478">Object goal to contact modes</text>
  <text class="b" x="839" y="508">plus human motion and force</text>
  <text class="s" x="839" y="548">Hide active-entity tokens</text>

  <rect x="240" y="610" width="720" height="62" rx="16" fill="#20364e"/>
  <text class="w" x="600" y="648" text-anchor="middle">Force calibration and simulator execution decide whether the latent mechanics state is useful.</text>
</svg>
