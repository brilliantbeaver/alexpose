<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Gated 10-day GPU research roadmap</title>
  <desc>Eight H100 GPUs compress the core program into six GPU-gated phases: evidence, feasibility and counterfactuals, Wrench-JEPA, hard holdouts, and sealed evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker>
    <style>
      .h{font:700 32px Arial,sans-serif;fill:#0f2440}.t{font:700 20px Arial,sans-serif;fill:#0f2440}.b{font:16px Arial,sans-serif;fill:#33475e}.s{font:14px Arial,sans-serif;fill:#5c6f84}.w{font:700 16px Arial,sans-serif;fill:#fff}.card{stroke:#20364e;stroke-width:1.75}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text class="h" x="48" y="70">A 10-day GPU plan with evidence gates</text>
  <text class="s" x="48" y="104">Eight H100s turn 3-hour baseline runs into parallel experiment waves.</text>

  <rect class="card" x="55" y="220" width="155" height="230" rx="16" fill="#fff"/>
  <text class="t" x="79" y="262">Day 1</text>
  <text class="b" x="79" y="308">Repair evidence</text>
  <text class="b" x="79" y="338">Freeze splits</text>
  <text class="s" x="79" y="398">Gate: no leakage</text>
  <text class="s" x="79" y="424">and bound artifacts</text>

  <path class="a" d="M226 335 H234"/>
  <rect class="card" x="250" y="220" width="155" height="230" rx="16" fill="#e6f2ea"/>
  <text class="t" x="274" y="262">Days 2-3</text>
  <text class="b" x="274" y="308">Calibrate and pair</text>
  <text class="b" x="274" y="338">counterfactuals</text>
  <text class="s" x="274" y="398">Gate: projection</text>
  <text class="s" x="274" y="424">converges</text>

  <path class="a" d="M421 335 H429"/>
  <rect class="card" x="445" y="220" width="155" height="230" rx="16" fill="#f7e7d8"/>
  <text class="t" x="469" y="262">Day 4</text>
  <text class="b" x="469" y="308">Test paired</text>
  <text class="b" x="469" y="338">counterfactuals</text>
  <text class="s" x="469" y="398">Gate: strict OOD</text>
  <text class="s" x="469" y="424">gain</text>

  <path class="a" d="M616 335 H624"/>
  <rect class="card" x="640" y="220" width="155" height="230" rx="16" fill="#ece6f6"/>
  <text class="t" x="664" y="262">Days 5-7</text>
  <text class="b" x="664" y="308">Train matched</text>
  <text class="b" x="664" y="338">Wrench-JEPA</text>
  <text class="s" x="664" y="398">Gate: contact and</text>
  <text class="s" x="664" y="424">trajectory gain</text>

  <path class="a" d="M811 335 H819"/>
  <rect class="card" x="835" y="220" width="155" height="230" rx="16" fill="#e7f0f8"/>
  <text class="t" x="859" y="262">Days 8-9</text>
  <text class="b" x="859" y="308">Hard object and</text>
  <text class="b" x="859" y="338">parameter tests</text>
  <text class="s" x="859" y="398">Gate: execution</text>
  <text class="s" x="859" y="424">improves</text>

  <path class="a" d="M1006 335 H1014"/>
  <rect class="card" x="1030" y="220" width="115" height="230" rx="16" fill="#e6f2ea"/>
  <text class="t" x="1054" y="262">Day 10</text>
  <text class="b" x="1054" y="308">Sealed</text>
  <text class="b" x="1054" y="338">external</text>
  <text class="b" x="1054" y="368">test</text>
  <text class="s" x="1054" y="398">Gate: claim</text>
  <text class="s" x="1054" y="424">from data</text>

  <line x1="80" y1="535" x2="1120" y2="535" stroke="#c4cdd8" stroke-width="1.5"/>
  <circle cx="133" cy="535" r="8" fill="#2f6f99"/><circle cx="328" cy="535" r="8" fill="#5f9e7e"/><circle cx="523" cy="535" r="8" fill="#e07a4b"/><circle cx="718" cy="535" r="8" fill="#8a6fb3"/><circle cx="913" cy="535" r="8" fill="#2f6f99"/><circle cx="1088" cy="535" r="8" fill="#5f9e7e"/>
  <text class="s" x="600" y="582" text-anchor="middle">A failed gate produces a bounded null result, not a hidden retry.</text>
  <rect x="265" y="620" width="670" height="52" rx="16" fill="#20364e"/>
  <text class="w" x="600" y="652" text-anchor="middle">The 10-day core uses 8 H100 GPUs. The full seven-idea program uses 33 GPU days.</text>
</svg>
