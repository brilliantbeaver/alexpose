<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Seven predictive gait proposals in three decision stages</title>
  <desc id="desc">The portfolio first proves prediction, then interrogates motion, then measures which motion structure supports each result. All branches end in conditional source-pooled evaluation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20364e"/></marker>
    <style>.h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}.sub{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}.head{font:700 17px Arial,Helvetica,sans-serif;fill:#fff;letter-spacing:.8px}.t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}.b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}.w{font:700 16px Arial,Helvetica,sans-serif;fill:#fff}.card{stroke:#20364e;stroke-width:1.75}.arrow{fill:none;stroke:#20364e;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text class="h" x="48" y="62">Predictive Gait Evidence</text>
  <text class="sub" x="48" y="94">Seven model diagnostics in three stages; cards within a column are alternatives.</text>

  <rect x="60" y="145" width="300" height="60" rx="16" fill="#20364e"/>
  <text class="head" x="210" y="182" text-anchor="middle">PROVE PREDICTION</text>
  <rect x="450" y="145" width="300" height="60" rx="16" fill="#20364e"/>
  <text class="head" x="600" y="182" text-anchor="middle">INTERROGATE MOTION</text>
  <rect x="840" y="145" width="300" height="60" rx="16" fill="#20364e"/>
  <text class="head" x="990" y="182" text-anchor="middle">MEASURE STRUCTURE</text>
  <path class="arrow" d="M360 175H434"/>
  <path class="arrow" d="M750 175H824"/>

  <rect class="card" x="60" y="230" width="300" height="105" rx="16" fill="#e7f0f8"/>
  <text class="t" x="82" y="267">1. SourceSwap</text>
  <text class="b" x="82" y="296">same motion, new source profile</text>
  <rect class="card" x="60" y="380" width="300" height="105" rx="16" fill="#e7f0f8"/>
  <text class="t" x="82" y="417">2. Past-only surplus</text>
  <text class="b" x="82" y="446">future gain beyond raw predictors</text>

  <rect class="card" x="450" y="230" width="300" height="95" rx="16" fill="#f7e7d8"/>
  <text class="t" x="472" y="265">3. Adaptive examination</text>
  <text class="b" x="472" y="294">choose the next useful block</text>
  <rect class="card" x="450" y="365" width="300" height="95" rx="16" fill="#f7e7d8"/>
  <text class="t" x="472" y="400">4. Dose axes</text>
  <text class="b" x="472" y="429">measure named motion expression</text>
  <rect class="card" x="450" y="500" width="300" height="95" rx="16" fill="#f7e7d8"/>
  <text class="t" x="472" y="535">5. Cycle innovation</text>
  <text class="b" x="472" y="564">find what changed in the next cycle</text>

  <rect class="card" x="840" y="230" width="300" height="105" rx="16" fill="#ece6f6"/>
  <text class="t" x="862" y="267">6. Predictive asymmetry</text>
  <text class="b" x="862" y="296">source-standardized odd map</text>
  <rect class="card" x="840" y="380" width="300" height="105" rx="16" fill="#ece6f6"/>
  <text class="t" x="862" y="417">7. Structure ladder</text>
  <text class="b" x="862" y="446">restore one relation per rung</text>

  <rect class="card" x="180" y="620" width="840" height="50" rx="16" fill="#20364e"/>
  <text class="w" x="600" y="651" text-anchor="middle">Common downstream label metric: source-pooled macro average precision</text>
</svg>
