<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Data pipeline for the Latent Laterality experiments</title>
  <desc id="desc">A sequence-level pipeline starts with AMASS motion, applies a gauge-neutral coordinate contract, samples one persistent semantic path per sequence, adds declared nuisance corruptions and anchors, then slices windows. All model arms receive the same corruption draw. Predictions are stitched back to sequence blocks before identity-level inference.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#20364e"/></marker>
    <style>.head{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}.label{font:700 21px Arial,Helvetica,sans-serif;fill:#0f2440}.body{font:18px Arial,Helvetica,sans-serif;fill:#33475e}.small{font:18px Arial,Helvetica,sans-serif;fill:#4d6074}.white{font:700 18px Arial,Helvetica,sans-serif;fill:#ffffff}.num{font:700 18px Arial,Helvetica,sans-serif;fill:#ffffff}</style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="50" y="60" class="head">Build corruption once per sequence, then share it across arms</text>
  <text x="50" y="94" class="small">This order prevents contradictory labels in overlapping windows and preserves paired comparisons.</text>

  <g>
    <rect x="50" y="165" width="180" height="145" rx="15" fill="#eef4f8" stroke="#8aa0b5" stroke-width="2"/><circle cx="82" cy="195" r="18" fill="#2f6f99"/><text x="82" y="202" text-anchor="middle" class="num">1</text><text x="80" y="240" class="label">AMASS motion</text><text x="80" y="273" class="body">full source sequence</text>
    <path d="M230 237 L270 237" stroke="#20364e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="280" y="165" width="200" height="145" rx="15" fill="#eaf4ee" stroke="#8aa0b5" stroke-width="2"/><circle cx="312" cy="195" r="18" fill="#3f7a60"/><text x="312" y="202" text-anchor="middle" class="num">2</text><text x="310" y="240" class="label">Neutral frame</text><text x="310" y="273" class="body">no named-side fallback</text>
    <path d="M480 237 L520 237" stroke="#20364e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="530" y="145" width="250" height="185" rx="15" fill="#fff7ed" stroke="#a44c26" stroke-width="3"/><circle cx="562" cy="175" r="18" fill="#a44c26"/><text x="562" y="182" text-anchor="middle" class="num">3</text><text x="560" y="220" class="label">Sequence-level draw</text><text x="560" y="253" class="body">one gauge path g</text><text x="560" y="284" class="body">sensor, noise, occlusion</text><text x="560" y="315" class="body">anchors + immutable seeds</text>
    <path d="M780 237 L820 237" stroke="#20364e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="830" y="165" width="140" height="145" rx="15" fill="#f5f1fa" stroke="#8aa0b5" stroke-width="2"/><circle cx="862" cy="195" r="18" fill="#6f4f93"/><text x="862" y="202" text-anchor="middle" class="num">4</text><text x="860" y="240" class="label">Windows</text><text x="860" y="273" class="body">inherit path</text>
    <path d="M970 237 L1010 237" stroke="#20364e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1020" y="165" width="130" height="145" rx="15" fill="#eef4f8" stroke="#8aa0b5" stroke-width="2"/><circle cx="1052" cy="195" r="18" fill="#2f6f99"/><text x="1052" y="202" text-anchor="middle" class="num">5</text><text x="1050" y="240" class="label">Loader</text><text x="1050" y="273" class="body">typed fields</text>
  </g>

  <path d="M1085 310 L1085 365 L600 365 L600 395" stroke="#20364e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="140" y="410" width="920" height="110" rx="16" fill="#eef4f8" stroke="#8aa0b5" stroke-width="2"/>
  <text x="180" y="448" class="label">Identical draw enters every arm</text>
  <text x="180" y="485" class="body">raw/HMM</text><text x="335" y="485" class="body">standard</text><text x="475" y="485" class="body">fixed reflection</text><text x="665" y="485" class="body">generic paired</text><text x="840" y="485" class="body">SG-JEPA</text>

  <path d="M600 520 L600 565" stroke="#20364e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="250" y="580" width="700" height="80" rx="15" fill="#0f2440"/>
  <text x="290" y="615" class="white">Stitch predictions to unique sequence blocks</text>
  <text x="290" y="646" class="small" style="fill:#dbe7f1">Then aggregate sequences within identity and resample identities.</text>
</svg>
