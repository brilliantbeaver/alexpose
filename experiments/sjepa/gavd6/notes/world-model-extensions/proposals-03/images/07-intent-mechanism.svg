<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Transition intent time-by-body frontier</title>
  <desc>Increasing temporal prefixes and body regions form a grid whose frontier shows the earliest, smallest input that reliably predicts the next terrain mode.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 20px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}</style>
  <text class="h" x="48" y="64">Intent emerges along two axes</text><text class="b" x="48" y="98">Move up for more body information; move right for more time</text>
  <rect x="60" y="150" width="760" height="440" rx="16" fill="#fff" stroke="#20364e" stroke-width="1.75"/>
  <text class="t" x="88" y="190">Reliability frontier</text>
  <text class="s" x="82" y="260">Full body</text><text class="s" x="82" y="326">Pelvis + limb</text><text class="s" x="82" y="392">Sound limb</text><text class="s" x="82" y="458">Foot + shank</text><text class="s" x="82" y="524">Foot only</text>
  <g stroke="#f7f5ef" stroke-width="4"><rect x="200" y="222" width="94" height="52" fill="#f7e7d8"/><rect x="294" y="222" width="94" height="52" fill="#e7f0f8"/><rect x="388" y="222" width="94" height="52" fill="#c9dfd1"/><rect x="482" y="222" width="94" height="52" fill="#8fbea2"/><rect x="576" y="222" width="94" height="52" fill="#5f9e7e"/><rect x="200" y="288" width="94" height="52" fill="#f7e7d8"/><rect x="294" y="288" width="94" height="52" fill="#f7e7d8"/><rect x="388" y="288" width="94" height="52" fill="#e7f0f8"/><rect x="482" y="288" width="94" height="52" fill="#b8d7c4"/><rect x="576" y="288" width="94" height="52" fill="#76aa8e"/><rect x="200" y="354" width="94" height="52" fill="#f7e7d8"/><rect x="294" y="354" width="94" height="52" fill="#f7e7d8"/><rect x="388" y="354" width="94" height="52" fill="#f7e7d8"/><rect x="482" y="354" width="94" height="52" fill="#c9dfd1"/><rect x="576" y="354" width="94" height="52" fill="#8fbea2"/><rect x="200" y="420" width="94" height="52" fill="#f7e7d8"/><rect x="294" y="420" width="94" height="52" fill="#f7e7d8"/><rect x="388" y="420" width="94" height="52" fill="#f7e7d8"/><rect x="482" y="420" width="94" height="52" fill="#e7f0f8"/><rect x="576" y="420" width="94" height="52" fill="#c9dfd1"/><rect x="200" y="486" width="94" height="52" fill="#f7e7d8"/><rect x="294" y="486" width="94" height="52" fill="#f7e7d8"/><rect x="388" y="486" width="94" height="52" fill="#f7e7d8"/><rect x="482" y="486" width="94" height="52" fill="#f7e7d8"/><rect x="576" y="486" width="94" height="52" fill="#e7f0f8"/></g>
  <polyline points="341,222 435,288 529,354 623,420" fill="none" stroke="#2f6f99" stroke-width="5"/>
  <text class="s" x="220" y="568">12</text><text class="s" x="314" y="568">18</text><text class="s" x="408" y="568">24</text><text class="s" x="502" y="568">30</text><text class="s" x="596" y="568">36 frames</text>
  <rect x="870" y="180" width="270" height="330" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text class="t" x="894" y="220">Winning point</text><text class="b" x="894" y="262">Earliest prefix</text><text class="b" x="894" y="294">Smallest body set</text><text class="b" x="894" y="326">80% coverage</text><text class="b" x="894" y="358">10% error</text><line x1="894" y1="398" x2="1116" y2="398" stroke="#c4cdd8"/><text class="s" x="894" y="438">Contact code excluded</text><text class="s" x="894" y="466">Same model at every prefix</text>
  <rect x="60" y="624" width="1080" height="42" rx="16" fill="#20364e"/><text class="w" x="84" y="651">The goal is earlier or smaller at the same reliability, not a higher late-window accuracy.</text>
</svg>
