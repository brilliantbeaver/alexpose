<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Transition intent evaluation gates</title>
  <desc>Event timing, leakage removal, early signal, representation value, and amputee case transfer form the evaluation sequence.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker></defs>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 19px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <text class="h" x="48" y="64">Earlier intent must survive the contact-leakage test</text><text class="b" x="48" y="98">Each gate uses held-out people before the one amputee case is opened</text>
  <g stroke="#20364e" stroke-width="1.75"><rect x="48" y="170" width="200" height="320" rx="16" fill="#e7f0f8"/><rect x="274" y="170" width="200" height="320" rx="16" fill="#f7e7d8"/><rect x="500" y="170" width="200" height="320" rx="16" fill="#ece6f6"/><rect x="726" y="170" width="200" height="320" rx="16" fill="#e6f2ea"/><rect x="952" y="170" width="200" height="320" rx="16" fill="#fff"/></g>
  <text class="t" x="70" y="210">Event timing</text><text class="b" x="70" y="252">Prefixes stop</text><text class="b" x="70" y="280">before transition</text><text class="s" x="70" y="336">One verified rule</text>
  <text class="t" x="296" y="210">Leakage</text><text class="b" x="296" y="252">No contact code</text><text class="b" x="296" y="280">No file tokens</text><text class="s" x="296" y="336">Duration audited</text>
  <text class="t" x="522" y="210">Early signal</text><text class="b" x="522" y="252">Before 45 frames</text><text class="b" x="522" y="280">Most people pass</text><text class="s" x="522" y="336">Raw gate first</text>
  <text class="t" x="748" y="210">S-JEPA value</text><text class="b" x="748" y="252">Earlier by 100 ms</text><text class="b" x="748" y="280">or fewer sensors</text><text class="s" x="748" y="336">Same reliability</text>
  <text class="t" x="974" y="210">Case transfer</text><text class="b" x="974" y="252">One amputee</text><text class="b" x="974" y="280">No adaptation</text><text class="s" x="974" y="336">No population claim</text>
  <path class="a" d="M248 330 H256"/><path class="a" d="M474 330 H482"/><path class="a" d="M700 330 H708"/><path class="a" d="M926 330 H934"/>
  <rect x="48" y="550" width="1104" height="88" rx="16" fill="#20364e"/><text class="w" x="72" y="586">Stop adaptation if raw motion contains no signal before the full 45-frame window.</text><text x="72" y="614" style="font:14px Arial;fill:#cdd8e4">A correct null identifies when transition intent first becomes observable.</text>
</svg>
