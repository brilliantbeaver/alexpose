<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Sparse anchor mechanism for temporary correspondence</title>
  <desc>A time-varying left-right correspondence path contains temporary swaps; sparse independent anchors constrain the uncertain path without revealing every boundary.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker></defs>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 20px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <text class="h" x="48" y="64">Occasional outside evidence constrains a temporary swap path</text><text class="b" x="48" y="98">The model does not claim that motion supplies an absolute side name</text>
  <rect x="60" y="170" width="310" height="330" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/><text class="t" x="84" y="210">Ambiguous pose track</text><text class="b" x="84" y="252">Smooth crossing swaps</text><text class="b" x="84" y="280">Occlusion bridges</text><text class="b" x="84" y="308">No coordinate jump</text><line x1="84" y1="350" x2="346" y2="350" stroke="#c4cdd8"/><path d="M96 416 C150 360, 204 464, 260 398 S318 382,340 420" fill="none" stroke="#2f6f99" stroke-width="5"/><path d="M96 390 C150 446, 204 342, 260 408 S318 424,340 386" fill="none" stroke="#e07a4b" stroke-width="5"/>
  <rect x="460" y="170" width="280" height="330" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text class="t" x="484" y="210">Sparse anchors</text><text class="b" x="484" y="252">1% • 2% • 5% • 10%</text><text class="b" x="484" y="280">Uniform or active placement</text><text class="b" x="484" y="308">Controlled label noise</text><line x1="484" y1="350" x2="716" y2="350" stroke="#c4cdd8"/><circle cx="520" cy="408" r="10" fill="#5f9e7e"/><circle cx="610" cy="408" r="10" fill="#5f9e7e"/><circle cx="690" cy="408" r="10" fill="#5f9e7e"/><text class="s" x="484" y="464">Independent observations</text>
  <rect x="830" y="170" width="310" height="330" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text class="t" x="854" y="210">Recovered path</text><text class="b" x="854" y="252">Block identity</text><text class="b" x="854" y="280">Switch boundaries</text><text class="b" x="854" y="308">Calibrated uncertainty</text><line x1="854" y1="350" x2="1116" y2="350" stroke="#c4cdd8"/><rect x="866" y="390" width="48" height="34" rx="8" fill="#e7f0f8"/><rect x="920" y="390" width="48" height="34" rx="8" fill="#e7f0f8"/><rect x="974" y="390" width="48" height="34" rx="8" fill="#f7e7d8"/><rect x="1028" y="390" width="48" height="34" rx="8" fill="#f7e7d8"/><rect x="1082" y="390" width="34" height="34" rx="8" fill="#e7f0f8"/>
  <path class="a" d="M370 335 H442"/><path class="a" d="M740 335 H812"/>
  <rect x="60" y="580" width="1080" height="86" rx="16" fill="#20364e"/><text class="w" x="84" y="614">Primary result: path error as a function of anchor budget and anchor noise.</text><text x="84" y="642" style="font:14px Arial;fill:#cdd8e4">A perfect global anchor is excluded because it solves only a tautological global flip.</text>
</svg>
