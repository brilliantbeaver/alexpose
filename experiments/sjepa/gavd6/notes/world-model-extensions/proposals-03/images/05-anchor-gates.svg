<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Sparse anchor budget evaluation</title>
  <desc>A conceptual phase diagram compares path error across anchor budgets and noise, with continuity, usefulness, and replication gates.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 20px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}</style>
  <text class="h" x="48" y="64">Find the minimum reliable anchor budget</text><text class="b" x="48" y="98">Conceptual phase diagram: darker cells mean lower correspondence error</text>
  <rect x="60" y="154" width="650" height="400" rx="16" fill="#fff" stroke="#20364e" stroke-width="1.75"/><text class="t" x="88" y="194">Path error by budget and label noise</text>
  <text class="s" x="90" y="260">0% noise</text><text class="s" x="90" y="330">5% noise</text><text class="s" x="82" y="400">10% noise</text><text class="s" x="82" y="470">20% noise</text>
  <g stroke="#fff" stroke-width="4"><rect x="190" y="224" width="82" height="54" fill="#f7e7d8"/><rect x="272" y="224" width="82" height="54" fill="#dcebdc"/><rect x="354" y="224" width="82" height="54" fill="#b8d7c4"/><rect x="436" y="224" width="82" height="54" fill="#88b69d"/><rect x="518" y="224" width="82" height="54" fill="#5f9e7e"/><rect x="190" y="294" width="82" height="54" fill="#f7e7d8"/><rect x="272" y="294" width="82" height="54" fill="#e7f0f8"/><rect x="354" y="294" width="82" height="54" fill="#c9dfd1"/><rect x="436" y="294" width="82" height="54" fill="#9fc8af"/><rect x="518" y="294" width="82" height="54" fill="#76aa8e"/><rect x="190" y="364" width="82" height="54" fill="#f7e7d8"/><rect x="272" y="364" width="82" height="54" fill="#f7e7d8"/><rect x="354" y="364" width="82" height="54" fill="#e7f0f8"/><rect x="436" y="364" width="82" height="54" fill="#c9dfd1"/><rect x="518" y="364" width="82" height="54" fill="#9fc8af"/><rect x="190" y="434" width="82" height="54" fill="#f7e7d8"/><rect x="272" y="434" width="82" height="54" fill="#f7e7d8"/><rect x="354" y="434" width="82" height="54" fill="#f7e7d8"/><rect x="436" y="434" width="82" height="54" fill="#e7f0f8"/><rect x="518" y="434" width="82" height="54" fill="#c9dfd1"/></g>
  <text class="s" x="208" y="522">0%</text><text class="s" x="288" y="522">2%</text><text class="s" x="368" y="522">5%</text><text class="s" x="446" y="522">10%</text><text class="s" x="530" y="522">20%</text><text class="s" x="300" y="546">Anchor budget</text>
  <g stroke="#20364e" stroke-width="1.75"><rect x="770" y="154" width="370" height="112" rx="16" fill="#e7f0f8"/><rect x="770" y="288" width="370" height="112" rx="16" fill="#ece6f6"/><rect x="770" y="422" width="370" height="132" rx="16" fill="#e6f2ea"/></g>
  <text class="t" x="794" y="190">Hard benchmark</text><text class="b" x="794" y="226">Continuity AUROC &lt; 0.60</text>
  <text class="t" x="794" y="324">Sparse gain</text><text class="b" x="794" y="360">+10 points at ≤10% budget</text>
  <text class="t" x="794" y="458">Noisy and replicated</text><text class="b" x="794" y="494">Gain at 5% noise</text><text class="s" x="794" y="524">Same sign for three seeds</text>
  <rect x="60" y="604" width="1080" height="62" rx="16" fill="#20364e"/><text class="w" x="84" y="642">Stop if anchors work only when placed at every true swap boundary.</text>
</svg>
