<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Pre-impact recoverability horizon</title>
  <desc>Video contexts are cut at increasing lead times before a labeled event, matched to safe look-alikes, and evaluated for the earliest reliable prediction.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker></defs>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 20px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <text class="h" x="48" y="64">Cut the clip before the obvious fall cues</text><text class="b" x="48" y="98">The result is an earliest reliable horizon, not post-impact detection accuracy</text>
  <rect x="60" y="164" width="300" height="360" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/><text class="t" x="84" y="204">Context prefixes</text><text class="b" x="84" y="248">2.0 s before onset</text><text class="b" x="84" y="284">1.5 s before onset</text><text class="b" x="84" y="320">1.0 s before onset</text><text class="b" x="84" y="356">0.5 s before onset</text><line x1="84" y1="390" x2="330" y2="390" stroke="#c4cdd8"/><text class="s" x="84" y="428">No descent or impact frames</text><text class="s" x="84" y="458">One model for every prefix</text>
  <rect x="450" y="164" width="300" height="360" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text class="t" x="474" y="204">Matched alternatives</text><text class="b" x="474" y="248">Scripted fall</text><text class="b" x="474" y="284">Sit or lie down</text><text class="b" x="474" y="320">Bend or kneel</text><text class="b" x="474" y="356">Similar height and speed</text><line x1="474" y1="390" x2="720" y2="390" stroke="#c4cdd8"/><text class="s" x="474" y="428">Match obvious geometry</text><text class="s" x="474" y="458">Hold out people and views</text>
  <rect x="840" y="164" width="300" height="360" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text class="t" x="864" y="204">Reliable horizon</text><text class="b" x="864" y="248">Positive log-loss gain</text><text class="b" x="864" y="284">Two adjacent lead times</text><text class="b" x="864" y="320">Calibrated abstention</text><text class="b" x="864" y="356">OOD reported separately</text><line x1="864" y1="390" x2="1110" y2="390" stroke="#c4cdd8"/><text class="s" x="864" y="428">Earlier is useful</text><text class="s" x="864" y="458">Late cues do not count</text>
  <path class="a" d="M360 344 H432"/><path class="a" d="M750 344 H822"/>
  <rect x="60" y="594" width="1080" height="72" rx="16" fill="#20364e"/><text class="w" x="84" y="624">Primary subset: simple body height, velocity, and box geometry stay below AUROC 0.65.</text><text x="84" y="650" style="font:14px Arial;fill:#cdd8e4">Scripted fall anticipation is not prospective clinical fall-risk prediction.</text>
</svg>
