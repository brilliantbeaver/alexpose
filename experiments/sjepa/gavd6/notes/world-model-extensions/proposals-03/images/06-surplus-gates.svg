<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Nonlocal predictive surplus gates</title>
  <desc>Whole-body improvement must survive capacity matching, disappear under matched shuffles, and replicate on held identities before transfer.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker></defs>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 20px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <text class="h" x="48" y="64">Whole-body value must be specific, not merely larger</text><text class="b" x="48" y="98">Four sequential gates protect the foot-placement claim</text>
  <g stroke="#20364e" stroke-width="1.75"><rect x="48" y="170" width="240" height="320" rx="16" fill="#e7f0f8"/><rect x="336" y="170" width="240" height="320" rx="16" fill="#ece6f6"/><rect x="624" y="170" width="240" height="320" rx="16" fill="#f7e7d8"/><rect x="912" y="170" width="240" height="320" rx="16" fill="#e6f2ea"/></g>
  <text class="t" x="72" y="210">Raw signal</text><text class="b" x="72" y="252">10% lower error</text><text class="b" x="72" y="280">at 0.5 seconds</text><text class="s" x="72" y="336">Most identities improve</text>
  <text class="t" x="360" y="210">Capacity match</text><text class="b" x="360" y="252">Same parameters</text><text class="b" x="360" y="280">Same updates</text><text class="s" x="360" y="336">Lower body stays strong</text>
  <text class="t" x="648" y="210">Shuffle removal</text><text class="b" x="648" y="252">Match speed • phase</text><text class="b" x="648" y="280">heading • action</text><text class="s" x="648" y="336">Half the gain vanishes</text>
  <text class="t" x="936" y="210">Representation</text><text class="b" x="936" y="252">S-JEPA beats raw</text><text class="b" x="936" y="280">or claim stays kinematic</text><text class="s" x="936" y="336">Then stress on GAVD</text>
  <path class="a" d="M288 330 H318"/><path class="a" d="M576 330 H606"/><path class="a" d="M864 330 H894"/>
  <rect x="48" y="550" width="1104" height="88" rx="16" fill="#20364e"/><text class="w" x="72" y="586">Stop before S-JEPA adaptation if the raw whole-body gate fails.</text><text x="72" y="614" style="font:14px Arial;fill:#cdd8e4">A null result supports retaining the smaller Core11 representation.</text>
</svg>
