<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Four gates for perturbation response prediction</title>
  <desc>The study advances through availability, identifiability, representation, and transfer gates, with a stop rule at every stage.</desc>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker></defs>
  <style>.h{font:700 32px Arial;fill:#0f2440}.t{font:700 20px Arial;fill:#0f2440}.b{font:16px Arial;fill:#33475e}.s{font:14px Arial;fill:#5c6f84}.w{font:700 16px Arial;fill:#fff}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  <text class="h" x="48" y="64">One high score cannot rescue a failed mechanism</text><text class="b" x="48" y="98">Advance only when every earlier gate passes</text>
  <g stroke="#20364e" stroke-width="1.75">
    <rect x="48" y="170" width="240" height="320" rx="16" fill="#e7f0f8"/><rect x="336" y="170" width="240" height="320" rx="16" fill="#f7e7d8"/><rect x="624" y="170" width="240" height="320" rx="16" fill="#ece6f6"/><rect x="912" y="170" width="240" height="320" rx="16" fill="#e6f2ea"/>
  </g>
  <text class="t" x="72" y="210">1. Availability</text><text class="b" x="72" y="252">Same four outcomes</text><text class="b" x="72" y="280">in both protocols</text><text class="s" x="72" y="336">Pass: 90% valid trials</text><text class="s" x="72" y="380">Stop: incompatible signals</text>
  <text class="t" x="360" y="210">2. Identifiability</text><text class="b" x="360" y="252">Pre-state beats</text><text class="b" x="360" y="280">intervention mean</text><text class="s" x="360" y="336">Pass: 10% lower error</text><text class="s" x="360" y="380">Stop: no personal signal</text>
  <text class="t" x="648" y="210">3. Representation</text><text class="b" x="648" y="252">S-JEPA beats raw</text><text class="b" x="648" y="280">and random features</text><text class="s" x="648" y="336">Pass: positive interval</text><text class="s" x="648" y="380">Stop: no JEPA claim</text>
  <text class="t" x="936" y="210">4. Transfer</text><text class="b" x="936" y="252">Calibrated recovery</text><text class="b" x="936" y="280">across apparatus</text><text class="s" x="936" y="336">Pass: positive log gain</text><text class="s" x="936" y="380">Stop: protocol-specific</text>
  <path class="a" d="M288 330 H318"/><path class="a" d="M576 330 H606"/><path class="a" d="M864 330 H894"/>
  <rect x="48" y="550" width="1104" height="88" rx="16" fill="#20364e"/>
  <text class="w" x="72" y="586">Flagship only if all four gates pass.</text><text x="72" y="614" style="font:14px Arial;fill:#cdd8e4">A within-protocol result is still useful, but it is not cross-protocol evidence.</text>
</svg>
