<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Four increasingly strong tests of physics understanding</title>
  <desc>A ladder from kinematic regularity to metric state, dynamic compatibility, and counterfactual competence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker>
    <style>
      .h{font:700 32px Arial,sans-serif;fill:#0f2440}.t{font:700 20px Arial,sans-serif;fill:#0f2440}.b{font:16px Arial,sans-serif;fill:#33475e}.s{font:14px Arial,sans-serif;fill:#5c6f84}.n{font:700 20px Arial,sans-serif;fill:#fff;text-anchor:middle}.card{stroke:#20364e;stroke-width:1.75}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text class="h" x="48" y="70">A ladder of evidence for physics understanding</text>
  <text class="s" x="48" y="104">Each level contains the earlier one and adds a harder falsification test.</text>

  <rect class="card" x="120" y="145" width="960" height="92" rx="16" fill="#fff"/>
  <circle cx="170" cy="191" r="25" fill="#2f6f99"/><text class="n" x="170" y="198">1</text>
  <text class="t" x="218" y="181">Kinematic regularity</text>
  <text class="b" x="218" y="211">Are joints smooth, coordinated, and anatomically consistent?</text>

  <path class="a" d="M600 253 V273"/>
  <rect class="card" x="120" y="289" width="960" height="92" rx="16" fill="#e7f0f8"/>
  <circle cx="170" cy="335" r="25" fill="#2f6f99"/><text class="n" x="170" y="342">2</text>
  <text class="t" x="218" y="325">Metric scene state</text>
  <text class="b" x="218" y="355">Are depth, scale, camera, ground, and object geometry calibrated?</text>

  <path class="a" d="M600 397 V417"/>
  <rect class="card" x="120" y="433" width="960" height="92" rx="16" fill="#e6f2ea"/>
  <circle cx="170" cy="479" r="25" fill="#5f9e7e"/><text class="n" x="170" y="486">3</text>
  <text class="t" x="218" y="469">Dynamic compatibility</text>
  <text class="b" x="218" y="499">Can contacts, forces, torques, and momentum explain the motion?</text>

  <path class="a" d="M600 541 V561"/>
  <rect class="card" x="120" y="577" width="960" height="92" rx="16" fill="#f7e7d8"/>
  <circle cx="170" cy="623" r="25" fill="#e07a4b"/><text class="n" x="170" y="630">4</text>
  <text class="t" x="218" y="613">Counterfactual competence</text>
  <text class="b" x="218" y="643">Does the future change correctly when mass, friction, support, or strength changes?</text>
</svg>
