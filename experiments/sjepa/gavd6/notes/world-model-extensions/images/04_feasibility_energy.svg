<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Force-calibrated feasibility energy</title>
  <desc>Video-only motion evidence produces named physical residuals. Disjoint measured-force labels calibrate the score without becoming score inputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#20364e"/></marker>
    <style>
      .h{font:700 32px Arial,sans-serif;fill:#0f2440}.t{font:700 20px Arial,sans-serif;fill:#0f2440}.b{font:16px Arial,sans-serif;fill:#33475e}.s{font:14px Arial,sans-serif;fill:#5c6f84}.w{font:700 16px Arial,sans-serif;fill:#fff}.card{stroke:#20364e;stroke-width:1.75}.a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.d{stroke:#5f9e7e;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text class="h" x="48" y="70">A groundedness score must be calibrated and explainable</text>
  <text class="s" x="48" y="104">The output is compatibility with a stated model, not an aesthetic judgment or diagnosis.</text>

  <rect class="card" x="60" y="200" width="220" height="250" rx="16" fill="#e7f0f8"/>
  <text class="t" x="84" y="242">Video-only evidence</text>
  <text class="b" x="84" y="288">Joints and depth</text>
  <text class="b" x="84" y="318">Body and ground</text>
  <text class="b" x="84" y="348">Contacts and task</text>
  <text class="s" x="84" y="398">Scale and estimator</text>
  <text class="s" x="84" y="424">uncertainty included</text>

  <path class="a" d="M296 325 H344"/>

  <rect class="card" x="360" y="170" width="280" height="310" rx="16" fill="#fff"/>
  <text class="t" x="384" y="212">Named residual vector</text>
  <text class="b" x="384" y="258">Observation fit</text>
  <text class="b" x="384" y="288">Joint and bone limits</text>
  <text class="b" x="384" y="318">Contact and balance</text>
  <text class="b" x="384" y="348">Penetration and skate</text>
  <text class="b" x="384" y="378">Dynamics surrogate, energy</text>
  <text class="s" x="384" y="428">Simulator fit is one</text>
  <text class="s" x="384" y="454">feature, not the answer</text>

  <path class="a" d="M656 325 H704"/>

  <rect class="card" x="720" y="200" width="210" height="250" rx="16" fill="#e6f2ea"/>
  <text class="t" x="744" y="242">Calibrate</text>
  <text class="b" x="744" y="288">Likelihood ratio</text>
  <text class="b" x="744" y="318">Disjoint calibration split</text>
  <text class="b" x="744" y="348">Unseen corruptions</text>
  <text class="s" x="744" y="398">Brier score and ECE</text>

  <path class="a" d="M946 325 H984"/>

  <rect class="card" x="1000" y="200" width="140" height="250" rx="16" fill="#f7e7d8"/>
  <text class="t" x="1024" y="242">Return</text>
  <text class="b" x="1024" y="288">Probability</text>
  <text class="b" x="1024" y="318">Subscores</text>
  <text class="b" x="1024" y="348">Uncertainty</text>
  <text class="s" x="1024" y="398">Why it failed</text>

  <rect class="card" x="400" y="545" width="400" height="100" rx="16" fill="#e6f2ea"/>
  <text class="t" x="424" y="587">Measured labels, never inputs</text>
  <text class="b" x="424" y="621">Separate fit, calibration, and sealed test sets</text>
  <path class="d" d="M600 545 V496 H825 V466"/>
</svg>
