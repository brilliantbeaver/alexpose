<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Readout-conditioned representation quality</title>
  <desc id="desc">The same learned motion features can support a clip summary or moment-to-moment changes, and those views may prefer different saved models.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.card{fill:#fff;stroke:#cad4dc;stroke-width:2}.p{fill:#edf4f8;stroke:#2f6f99;stroke-width:3}.c{fill:#f1edf7;stroke:#8a6fb3;stroke-width:3}.rem{fill:#eaf4ee;stroke:#5f9e7e;stroke-width:3}.h{font:bold 34px Arial,sans-serif;fill:#20364e}.t{font:bold 21px Arial,sans-serif;fill:#20364e}.b{font:18px Arial,sans-serif;fill:#20364e}.s{font:18px Arial,sans-serif;fill:#607284}.math{font:bold 20px Arial,sans-serif;fill:#2f6f99}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2f6f99"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="h" x="60" y="60">Representation quality depends on what the readout can see</text>
  <text class="s" x="60" y="91">Two reasonable views of the same motion may prefer different saved models.</text>

  <rect class="card" x="60" y="210" rx="16" width="230" height="220"/>
  <text class="t" x="85" y="248">Motion over time</text>
  <g fill="#2f6f99">
    <rect x="88" y="280" width="25" height="25"/><rect x="120" y="280" width="25" height="25" opacity=".6"/><rect x="152" y="280" width="25" height="25" opacity=".8"/><rect x="184" y="280" width="25" height="25" opacity=".5"/>
    <rect x="88" y="312" width="25" height="25" opacity=".5"/><rect x="120" y="312" width="25" height="25" opacity=".9"/><rect x="152" y="312" width="25" height="25" opacity=".4"/><rect x="184" y="312" width="25" height="25" opacity=".7"/>
    <rect x="88" y="344" width="25" height="25" opacity=".8"/><rect x="120" y="344" width="25" height="25" opacity=".4"/><rect x="152" y="344" width="25" height="25" opacity=".9"/><rect x="184" y="344" width="25" height="25" opacity=".6"/>
  </g>
  <text class="s" x="85" y="402">one feature vector per moment</text>

  <path d="M290 285 L390 220" stroke="#2f6f99" stroke-width="3" marker-end="url(#a)"/>
  <path d="M290 355 L390 425" stroke="#2f6f99" stroke-width="3" marker-end="url(#a)"/>

  <rect class="p" x="400" y="135" rx="16" width="300" height="175"/>
  <text class="math" x="425" y="173">Clip summary</text>
  <text class="b" x="425" y="211">Overall motion pattern</text>
  <text class="b" x="425" y="239">seen after averaging the clip</text>
  <text class="s" x="425" y="276">test: summary prefers A</text>

  <rect class="c" x="400" y="365" rx="16" width="300" height="175"/>
  <text class="math" x="425" y="403">Changes within the clip</text>
  <text class="b" x="425" y="441">Moment-to-moment motion</text>
  <text class="b" x="425" y="469">seen by a detailed readout</text>
  <text class="s" x="425" y="506">test: changes prefer B</text>

  <path d="M700 220 L790 270" stroke="#2f6f99" stroke-width="3" marker-end="url(#a)"/>
  <path d="M700 450 L790 350" stroke="#2f6f99" stroke-width="3" marker-end="url(#a)"/>
  <rect class="card" x="800" y="225" rx="16" width="330" height="175"/>
  <text class="t" x="825" y="263">Decisive test</text>
  <text class="b" x="825" y="300">Both views consistently prefer</text>
  <text class="b" x="825" y="328">different saved models</text>
  <text class="s" x="825" y="365">across new training runs</text>

  <rect class="rem" x="250" y="600" rx="14" width="700" height="78"/>
  <text class="t" x="275" y="632">Simple remedy</text>
  <text class="b" x="450" y="632">Choose or train models that work well for both views</text>
  <text class="s" x="275" y="660">Also test missing joints, camera view, and time position.</text>
</svg>
