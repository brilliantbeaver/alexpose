[project]
name = "gavd6-synthetic-training-environment"
version = "0.1.0"
description = "Dedicated Linux HAIC environment for the synthetic-training study"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0+cu124",
  "torchvision==0.21.0+cu124",
  "numpy==1.26.4",
  "scipy==1.14.1",
  "mmcv==2.1.0",
  "mmengine==0.10.7",
  "mmdet==3.3.0",
  "mmpretrain==1.2.0",
  "mmpose==1.3.2",
  "opencv-python==4.9.0.80",
  "chumpy==0.71",
  "human-body-prior==2.2.2.0",
  # MMEngine uses pkg_resources, removed in newer setuptools releases.
  "setuptools==80.9.0",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "ipykernel>=6.29,<7",
  "ipython>=8.20,<9",
  "jupyter-client>=8.6,<9",
  "jupyterlab>=4.2,<5",
  "pandas>=2.2,<2.3",
  "scikit-learn>=1.5,<1.6",
  "matplotlib>=3.8,<3.10",
  "joblib>=1.4,<2",
  "Pillow>=10,<12",
  "tqdm>=4.66,<5",
  "pyrender==0.1.45",
  "trimesh>=4.4,<5",
  "pyglet>=1.5,<2",
  "einops==0.8.1",
  "timm==1.0.15",
  "iopath==0.1.10",
  "PyYAML>=6,<7",
]

[tool.uv]
package = false
required-version = ">=0.12.15,<0.13"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
build-constraint-dependencies = ["setuptools==80.9.0", "wheel==0.48.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
# MMDetection 3.3 requires MMCV <2.2. Build 2.1.0 against this Torch for H100.
mmcv = { git = "https://github.com/open-mmlab/mmcv.git", rev = "57c4e25e06e2d4f8a9357c84bcd24089a284dc88" }
mmpose = { git = "https://github.com/open-mmlab/mmpose.git", rev = "5408bc76f5b848cf925a0d1857899011d8c5b497" }
chumpy = { git = "https://github.com/mattloper/chumpy.git", rev = "580566eafc9ac68b2614b64d6f7aaa84eebb70da" }
human-body-prior = { git = "https://github.com/nghorbani/human_body_prior.git", rev = "4c246d8a83ce16d3cff9c79dcf04d81fa440a6bc" }

[tool.uv.extra-build-dependencies]
mmcv = ["torch==2.6.0+cu124", "numpy==1.26.4", "setuptools==80.9.0", "wheel==0.48.0", "ninja==1.13.0"]
chumpy = ["pip==26.2.1", "setuptools==80.9.0", "wheel==0.48.0"]
mmpose = ["setuptools==80.9.0"]
human-body-prior = ["setuptools==80.9.0"]

[tool.uv.extra-build-variables]
mmcv = { MMCV_WITH_OPS = "1", FORCE_CUDA = "1", TORCH_CUDA_ARCH_LIST = "9.0+PTX" }

# Exact Linux build metadata avoids running CUDA setup during lock resolution.
[[tool.uv.dependency-metadata]]
name = "mmcv"
version = "2.1.0"
requires-dist = ["addict", "mmengine>=0.3.0", "numpy", "packaging", "Pillow", "pyyaml", "yapf", "opencv-python>=3", "regex; sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
