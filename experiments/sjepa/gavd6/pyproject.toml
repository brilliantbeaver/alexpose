[project]
name = "gavd6-sjepa"
version = "0.1.0"
description = "GAVD6 S-JEPA gait research workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "torch==2.6.0+cu124",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "ezc3d>=1.5",
  "yt-dlp[default]>=2025.1.1",
  "opencv-python>=4.9",
  "mediapipe>=0.10.20,<1",
  "joblib>=1.4",
  "pyarrow>=15.0",
  "human-body-prior>=0.8.5.0",
]

[project.scripts]
train-amass-core11 = "gavd6_sjepa.train_amass:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
override-dependencies = [
  "torch==2.6.0+cu124",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
human-body-prior = { git = "https://github.com/nghorbani/human_body_prior.git", rev = "78c86eae5ed518ae22bf197fd74211bbfa45551a" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
