<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Anatomical mirror versus camera move</title>
  <desc id="desc">An anatomy swap reverses an illustrative signed body-frame score. A camera change should preserve its sign after normalization, while real-view magnitude stability remains an open test.</desc>
  <defs>
    <style>.title{font:700 28px Arial,sans-serif;fill:#17324d}.row{font:700 20px Arial,sans-serif;fill:#17324d}.label{font:17px Arial,sans-serif;fill:#3e5366}.score{font:700 24px Arial,sans-serif}.arrow{stroke:#7b91a5;stroke-width:3;fill:none}.person{stroke:#315b78;stroke-width:7;stroke-linecap:round;fill:none}</style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#7b91a5"/></marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#fff"/>
  <text x="55" y="58" class="title">Mirror changes anatomy. Camera changes observation.</text>
  <text x="600" y="88" text-anchor="middle" class="label">Illustrative body-frame score</text>
  <line x1="55" y1="267" x2="1145" y2="267" stroke="#d9e2e8" stroke-width="2"/>
  <text x="60" y="115" class="row">Anatomical mirror</text>
  <g transform="translate(260 105)" class="person"><circle cx="0" cy="0" r="18"/><path d="M0 20 V95 M-48 48 L0 42 L48 62 M0 95 L-42 158 M0 95 L50 148"/></g>
  <text x="165" y="225" text-anchor="middle" class="score" fill="#76558b">−0.41</text>
  <path d="M390 170 H650" class="arrow" marker-end="url(#arr)"/>
  <rect x="475" y="130" width="100" height="50" rx="25" fill="#fff5eb" stroke="#dfad78"/>
  <text x="525" y="161" text-anchor="middle" class="label">swap sides</text>
  <g transform="translate(790 105) scale(-1 1)" class="person"><circle cx="0" cy="0" r="18"/><path d="M0 20 V95 M-48 48 L0 42 L48 62 M0 95 L-42 158 M0 95 L50 148"/></g>
  <text x="695" y="225" text-anchor="middle" class="score" fill="#76558b">+0.41</text>
  <rect x="930" y="126" width="190" height="90" rx="16" fill="#eef8f6" stroke="#7ab7b0"/>
  <text x="1025" y="163" text-anchor="middle" class="row">Odd quantity</text><text x="1025" y="192" text-anchor="middle" class="label">sign must flip</text>
  <text x="60" y="325" class="row">Camera move</text>
  <g transform="translate(260 350)" class="person"><circle cx="0" cy="0" r="18"/><path d="M0 20 V95 M-48 48 L0 42 L48 62 M0 95 L-42 158 M0 95 L50 148"/></g>
  <text x="165" y="472" text-anchor="middle" class="score" fill="#76558b">−0.41</text>
  <path d="M390 414 H650" class="arrow" marker-end="url(#arr)"/>
  <rect x="458" y="374" width="134" height="50" rx="25" fill="#eef4f8" stroke="#a9bccb"/>
  <text x="525" y="405" text-anchor="middle" class="label">move camera</text>
  <g transform="translate(790 350)" class="person"><circle cx="0" cy="0" r="18"/><path d="M0 20 V95 M-48 48 L0 42 L48 62 M0 95 L-42 158 M0 95 L50 148"/></g>
  <path d="M850 365 l40 -20 v40 z" fill="#7b91a5"/><rect x="890" y="350" width="35" height="30" rx="4" fill="#7b91a5"/>
  <text x="695" y="472" text-anchor="middle" class="score" fill="#76558b">−0.41</text>
  <rect x="930" y="370" width="190" height="90" rx="16" fill="#eef4f8" stroke="#a9bccb"/>
  <text x="1025" y="407" text-anchor="middle" class="row">Same anatomy</text><text x="1025" y="436" text-anchor="middle" class="label">sign should stay</text>
  <text x="1025" y="490" text-anchor="middle" class="label">Real-view magnitude must be tested.</text>
</svg>
