<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Planned GaitParity research ladder</title>
  <desc id="desc">Four dependent stages move from instrument audit to locked clinical replication.</desc>
  <defs><style>.title{font:700 28px Arial,sans-serif;fill:#17324d}.n{font:700 22px Arial,sans-serif;fill:#fff}.head{font:700 20px Arial,sans-serif;fill:#17324d}.body{font:17px Arial,sans-serif;fill:#3e5366}.tag{font:700 14px Arial,sans-serif}.arrow{stroke:#8295a5;stroke-width:4;fill:none}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#8295a5"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="#fff"/>
  <text x="55" y="58" class="title">A stronger claim requires a stronger gate</text>
  <path d="M295 235 H327" class="arrow" marker-end="url(#a)"/>
  <path d="M575 235 H607" class="arrow" marker-end="url(#a)"/>
  <path d="M855 235 H887" class="arrow" marker-end="url(#a)"/>
  <g transform="translate(55 115)"><rect width="240" height="290" rx="18" fill="#eef8f6" stroke="#7ab7b0" stroke-width="2"/><circle cx="40" cy="42" r="25" fill="#197a74"/><text x="40" y="50" text-anchor="middle" class="n">1</text><text x="28" y="97" class="head">Audit the instrument</text><text x="28" y="132" class="body"><tspan x="28">Reflection code</tspan><tspan x="28" dy="24">Layer geometry</tspan><tspan x="28" dy="24">Anti-collapse health</tspan></text><rect x="28" y="225" width="160" height="29" rx="14" fill="#d6eee9"/><text x="108" y="244" text-anchor="middle" class="tag" fill="#197a74">GAVD · LOCAL DONE</text><text x="28" y="275" class="body">Claim: local feasibility</text></g>
  <g transform="translate(335 115)"><rect width="240" height="290" rx="18" fill="#fff5eb" stroke="#dfad78" stroke-width="2"/><circle cx="40" cy="42" r="25" fill="#b96824"/><text x="40" y="50" text-anchor="middle" class="n">2</text><text x="28" y="97" class="head">Test output repair</text><text x="28" y="132" class="body"><tspan x="28">Reliable force target</tspan><tspan x="28" dy="24">Held-out people</tspan><tspan x="28" dy="24">Odd rule vs two views</tspan></text><rect x="28" y="225" width="160" height="29" rx="14" fill="#f8dfc5"/><text x="108" y="244" text-anchor="middle" class="tag" fill="#9c4f17">STROKE · PLANNED</text><text x="28" y="275" class="body">Claim: output rule value</text></g>
  <g transform="translate(615 115)"><rect width="240" height="290" rx="18" fill="#f8f2fb" stroke="#b9a1ca" stroke-width="2"/><circle cx="40" cy="42" r="25" fill="#76558b"/><text x="40" y="50" text-anchor="middle" class="n">3</text><text x="28" y="97" class="head">Test the encoder</text><text x="28" y="132" class="body"><tspan x="28">Matched architectures</tspan><tspan x="28" dy="24">Few-label curves</tspan><tspan x="28" dy="24">Robustness + MoVi views</tspan></text><rect x="28" y="225" width="204" height="29" rx="14" fill="#eadff0"/><text x="130" y="244" text-anchor="middle" class="tag" fill="#76558b">AMASS + STROKE · PLANNED</text><text x="28" y="275" class="body">Claim: architecture value</text></g>
  <g transform="translate(895 115)"><rect width="250" height="290" rx="18" fill="#eef4f8" stroke="#a9bccb" stroke-width="2"/><circle cx="40" cy="42" r="25" fill="#315b78"/><text x="40" y="50" text-anchor="middle" class="n">4</text><text x="28" y="97" class="head">Lock and replicate</text><text x="28" y="132" class="body"><tspan x="28">Freeze stroke decisions</tspan><tspan x="28" dy="24">Open second cohort</tspan><tspan x="28" dy="24">Separate transfer test</tspan></text><rect x="28" y="225" width="195" height="29" rx="14" fill="#dce7ee"/><text x="125" y="244" text-anchor="middle" class="tag" fill="#315b78">PARKINSON'S · PLANNED</text><text x="28" y="275" class="body">Claim: replication</text></g>
  <rect x="188" y="458" width="824" height="55" rx="27" fill="#fff4e8" stroke="#e4b37f"/>
  <text x="600" y="481" text-anchor="middle" class="head">Do not advance the same claim when a gate fails</text><text x="600" y="502" text-anchor="middle" class="body">A failed gate may stop, narrow, rename, or defer the next claim.</text>
</svg>
