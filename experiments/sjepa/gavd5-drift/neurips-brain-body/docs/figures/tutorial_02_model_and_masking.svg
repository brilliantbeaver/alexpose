   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183247" x="7.2" y="16.318125" transform="rotate(-0 7.2 16.318125)">The current fold-local model</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(20.583231 44.81321)">64 frames × 33 joints</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(36.05345 59.51321)">Normalized xyz</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(23.981841 74.21321)">Retain validity mask</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(180.974762 44.81321)">Average each 4 frames</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(191.969903 59.51321)">Within-patch order</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(210.597559 75.162585)">is removed</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(347.726341 45.762585)">16 × 33 = 528 tokens</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(362.6767 59.51321)">Project xyz; add</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(351.724434 74.21321)">time and joint codes</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(79.730809 108.7592)">At most 12 eligible joints × 16 segments = 192 target positions.</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(106.731341 123.4592)">Mask 60% of the batch-minimum valid-eligible count.</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(112.549325 138.1592)">Fully valid case: 115 targets / 528 tokens = 21.8%.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526575" x="238.752" y="163.467971" transform="rotate(-0 238.752 163.467971)">Both encoders receive the same prepared sequence.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(25.842603 190.937265)">Online encoder</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(24.765369 204.68789)">Replace targets</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(20.228275 220.337265)">with mask tokens</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(149.875372 189.98789)">Average tokens</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(145.994419 204.68789)">Only valid-visible</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(165.849372 219.38789)">positions</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(269.969024 189.98789)">Target position</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(263.811103 204.68789)">+ pooled context</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #183247" transform="translate(266.829962 219.38789)">→ MLP predictor</text>
   </g>
   <g id="text_10">
