[project]
name = "sjepa"
version = "0.3.0"
description = "Paper-aligned S-JEPA core tutorials for GAVD gait sequences"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ipykernel>=6.29",
  "joblib>=1.4",
  "jupyterlab>=4.2",
  "matplotlib>=3.8",
  "mediapipe>=0.10.20,<1",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "python-dotenv>=1.0",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
  "torch>=2.2",
  "tqdm>=4.66",
  "yt-dlp[default]>=2025.1.1",
]

[tool.uv]
package = false

# PyPI distributes CPU-only Torch wheels on Windows and macOS. Use the
# accelerator-specific PyTorch index by default on Windows and Linux.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
