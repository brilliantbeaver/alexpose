<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Gradients train the student; EMA moves the teacher</title>
  <desc id="desc">Loss gradients pass through the predictor to the view encoder. After the optimizer call, an EMA update is applied from the view encoder down to the target encoder.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; }
    .t { font-size: 20px; font-weight: 700; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .strong { font-weight: 700; fill: #20364e; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 15px; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="48" y="58" class="h" text-anchor="start"><tspan x="48" dy="0">Gradients train the student; EMA moves the teacher</tspan></text>
  <rect x="48" y="118" width="250" height="170" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/><text x="72" y="154" class="t" text-anchor="start"><tspan x="72" dy="0">JEPA loss</tspan></text><text x="72" y="190" class="b" text-anchor="start"><tspan x="72" dy="0">backpropagates through</tspan><tspan x="72" dy="26">predictions only</tspan></text><rect x="388" y="118" width="250" height="170" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/><text x="412" y="154" class="t" text-anchor="start"><tspan x="412" dy="0">Predictor</tspan></text><text x="412" y="190" class="b" text-anchor="start"><tspan x="412" dy="0">has gradients</tspan><tspan x="412" dy="26">optimizer updates</tspan></text><rect x="728" y="118" width="250" height="170" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text x="752" y="154" class="t" text-anchor="start"><tspan x="752" dy="0">View encoder</tspan></text><text x="752" y="190" class="b" text-anchor="start"><tspan x="752" dy="0">has gradients</tspan><tspan x="752" dy="26">optimizer updates</tspan></text><path d="M 298 203 L 372 203" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335.0" y="193" class="s" text-anchor="middle"><tspan x="335.0" dy="0">gradient</tspan></text><path d="M 638 203 L 712 203" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="675.0" y="193" class="s" text-anchor="middle"><tspan x="675.0" dy="0">gradient</tspan></text><rect x="728" y="416" width="250" height="170" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="752" y="452" class="t" text-anchor="start"><tspan x="752" dy="0">Target encoder</tspan></text><text x="752" y="488" class="b" text-anchor="start"><tspan x="752" dy="0">requires_grad=False</tspan><tspan x="752" dy="26">updated in no_grad</tspan></text><path d="M 853 304 L 853 400" fill="none" stroke="#5f9e7e" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="861" y="390" class="s" text-anchor="start"><tspan x="861" dy="0">EMA</tspan></text><rect x="48" y="416" width="590" height="170" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/><text x="72" y="452" class="t" text-anchor="start"><tspan x="72" dy="0">EMA rule</tspan></text><text x="72" y="488" class="b" text-anchor="start"><tspan x="72" dy="0">target = m x target + (1-m) x view</tspan><tspan x="72" dy="26">m rises toward 1 on a cosine schedule</tspan><tspan x="72" dy="26">the teacher changes more slowly over time</tspan></text><rect x="156" y="620" width="888" height="36" rx="18" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.5"/><text x="600.0" y="644" class="s strong" text-anchor="middle"><tspan x="600.0" dy="0">No target gradient does not mean frozen state: EMA still mutates its parameters</tspan></text>
</svg>
