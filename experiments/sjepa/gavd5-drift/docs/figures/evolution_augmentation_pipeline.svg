   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="15.1236" y="26.163637" transform="rotate(-0 15.1236 26.163637)">Added-normal diversity came from a separate, auditable extraction path</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="15.1236" y="40.476" transform="rotate(-0 15.1236 40.476)">The windows overlap within a video. The scientific gain is 17 additional source videos, not 63 independent people.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="20.67012" y="67.75248" transform="rotate(-0 20.67012 67.75248)">1. Added videos</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 86.496066)">17 YouTube videos</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 92.917472)">project-labeled normal</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 99.847472)">kept outside canonical GAVD</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="119.71512" y="67.75248" transform="rotate(-0 119.71512 67.75248)">2. Select walker</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(119.71512 85.987472)">up to 3 pose candidates</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(119.71512 92.917472)">visibility + area +</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(119.71512 99.847472)">temporal continuity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="218.76012" y="67.75248" transform="rotate(-0 218.76012 67.75248)">3. Track a box</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 85.987472)">pad, fill short gaps,</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 92.917472)">smooth, then clamp</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 100.356066)">to the video frame</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="317.80512" y="67.75248" transform="rotate(-0 317.80512 67.75248)">4. Estimate cycle</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(317.80512 85.987472)">ankle-separation signal</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(317.80512 93.426066)">uses autocorrelation</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(317.80512 99.847472)">to estimate stride timing</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="317.80512" y="154.128" transform="rotate(-0 317.80512 154.128)">5. Cut windows</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(317.80512 172.362992)">about two cycles</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(317.80512 179.292992)">50 percent overlap</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(317.80512 186.463754)">24-frame minimum; max 8</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="218.76012" y="154.1275" transform="rotate(-0 218.76012 154.1275)">6. Extract poses</text>
   </g>
   <g id="text_14">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 172.362992)">MediaPipe landmarks</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 179.292992)">separate provenance and</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 186.149984)">poses_augmented storage</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="119.71512" y="154.128" transform="rotate(-0 119.71512 154.128)">7. Apply gate</text>
   </g>
   <g id="text_16">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(119.71512 172.871586)">64 candidates</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(119.71512 179.292992)">neurologic coverage</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(119.71512 186.731586)">must be at least 0.45</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="20.67012" y="154.128" transform="rotate(-0 20.67012 154.128)">8. Freeze cohort</text>
   </g>
   <g id="text_18">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 172.362992)">63 accepted</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 179.292992)">1 rejected at 0.027</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 186.731586)">17 videos retained</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="15.1236" y="224.27532" transform="rotate(-0 15.1236 224.27532)">Selection improves reproducibility, but it cannot remove the acquisition-path difference between added normal and canonical abnormal rows.</text>
   </g>
  </g>
 </g>
