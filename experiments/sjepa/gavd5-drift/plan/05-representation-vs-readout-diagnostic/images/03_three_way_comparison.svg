<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three probes isolate representation vs. pooling</title>
  <desc id="desc">Three parallel lanes each feed a linear probe that predicts asymmetry_index: the 384-dimensional embedding alone, the embedding plus the new signed-asymmetry feature, and the feature alone. Comparing the three R-squared values diagnoses whether the deficit is pooling or representation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; fill: #0f2440; }
    .t { font-size: 20px; font-weight: 700; fill: #0f2440; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .num { font-family: Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; fill: #20364e; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="58" class="h" text-anchor="start">Three probes isolate representation vs. pooling</text>

  <!-- Column A: embedding alone -->
  <rect x="48" y="110" width="330" height="110" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="146" class="t" text-anchor="start">384-d embedding alone</text>
  <text x="72" y="172" class="b" text-anchor="start">existing global + authorized</text>
  <text x="72" y="198" class="b" text-anchor="start">mean/std (no timing)</text>

  <rect x="48" y="276" width="330" height="110" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="312" class="t" text-anchor="start">Ridge regression probe</text>
  <text x="72" y="338" class="b" text-anchor="start">predicts asymmetry_index</text>

  <rect x="48" y="442" width="330" height="110" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="478" class="t" text-anchor="start">R&#178; &#8212; documented</text>
  <text x="72" y="512" class="num" text-anchor="start">0.154</text>

  <!-- Column B: embedding + feature -->
  <rect x="434" y="110" width="330" height="110" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/>
  <text x="458" y="146" class="t" text-anchor="start">Embedding + feature</text>
  <text x="458" y="172" class="b" text-anchor="start">384-d + 18-d signed-</text>
  <text x="458" y="198" class="b" text-anchor="start">asymmetry (402-d)</text>

  <rect x="434" y="276" width="330" height="110" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/>
  <text x="458" y="312" class="t" text-anchor="start">Ridge regression probe</text>
  <text x="458" y="338" class="b" text-anchor="start">predicts asymmetry_index</text>

  <rect x="434" y="442" width="330" height="110" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="458" y="478" class="t" text-anchor="start">R&#178; &#8212; primary question</text>
  <text x="458" y="512" class="num" text-anchor="start">?</text>

  <!-- Column C: feature alone -->
  <rect x="820" y="110" width="330" height="110" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="844" y="146" class="t" text-anchor="start">Signed feature alone</text>
  <text x="844" y="172" class="b" text-anchor="start">18-d, no S-JEPA</text>
  <text x="844" y="198" class="b" text-anchor="start">embedding used</text>

  <rect x="820" y="276" width="330" height="110" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="844" y="312" class="t" text-anchor="start">Ridge regression probe</text>
  <text x="844" y="338" class="b" text-anchor="start">predicts asymmetry_index</text>

  <rect x="820" y="442" width="330" height="110" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="844" y="478" class="t" text-anchor="start">R&#178; &#8212; diagnostic key</text>
  <text x="844" y="512" class="num" text-anchor="start">?</text>

  <!-- Vertical connectors within each lane -->
  <path d="M213,220 L213,260" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M213,386 L213,426" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M213,552 L213,592" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M599,220 L599,260" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M599,386 L599,426" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M599,552 L599,592" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M985,220 L985,260" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M985,386 L985,426" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M985,552 L985,592" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Synthesis banner -->
  <rect x="48" y="608" width="1104" height="64" rx="16" fill="#20364e" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="646" class="w" text-anchor="start">If R&#178;_c matches or beats R&#178;_a, the deficit lives in pooling, not in what the encoder learned.</text>
</svg>
