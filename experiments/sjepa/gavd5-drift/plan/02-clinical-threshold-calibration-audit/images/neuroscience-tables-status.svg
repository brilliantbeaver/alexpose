<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Two of four clinical-threshold tables are empty</title>
  <desc id="desc">Parkinson's and stroke feature tables are already graded from literature. Cerebral palsy and myopathic tables are header-only templates. Filling them in closes the gap for 63 of the 96 canonical sequences.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .sub{font:16px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .tag{font:700 14px Arial,Helvetica,sans-serif;fill:#2f6f99}
      .tagWarn{font:700 14px Arial,Helvetica,sans-serif;fill:#a44c26}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .m{font:700 24px Arial,Helvetica,sans-serif;fill:#0f2440}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .rule{stroke:#c4cdd8;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#20364e"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="h" x="60" y="62">Two of four clinical-threshold tables are empty</text>
  <text class="sub" x="60" y="90">PD and stroke are graded from literature. Cerebral palsy and myopathic are header-only templates covering 63 of 96 canonical sequences.</text>

  <!-- Card 1: PD, graded (top=130, height=220, bottom=350) -->
  <rect x="60" y="130" rx="16" width="292" height="220" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text class="t" x="82" y="160">Parkinson&#8217;s disease</text>
  <line class="rule" x1="82" y1="178" x2="330" y2="178"/>
  <text class="tag" x="82" y="202">GRADED FROM LITERATURE</text>
  <text class="b" x="82" y="230">H  stride_length_si &gt; 16% SI</text>
  <text class="b" x="82" y="256">H  stride_time_cv &gt; 0.06&#8211;0.08</text>
  <text class="b" x="82" y="282">H  com_movement &#8212; elevated sway</text>
  <text class="s" x="82" y="322">9 sequences &#183; 2 source videos</text>

  <!-- Card 2: Stroke, graded -->
  <rect x="408" y="130" rx="16" width="292" height="220" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text class="t" x="430" y="160">Stroke</text>
  <line class="rule" x1="430" y1="178" x2="678" y2="178"/>
  <text class="tag" x="430" y="202">GRADED FROM LITERATURE</text>
  <text class="b" x="430" y="230">H  walking_speed &#8776; 0.5 m/s marker</text>
  <text class="b" x="430" y="256">H  knee_asymmetry &#8805; 17&#176; flagged</text>
  <text class="b" x="430" y="282">H  double_support 30&#8211;40% flagged</text>
  <text class="s" x="430" y="322">12 sequences &#183; 3 source videos</text>

  <!-- Card 3: Cerebral palsy, blank (top=406, height=220, bottom=626) -->
  <rect x="60" y="406" rx="16" width="292" height="220" fill="#f6e2df" stroke="#c0483a" stroke-width="1.75"/>
  <text class="t" x="82" y="436">Cerebral palsy</text>
  <line class="rule" x1="82" y1="454" x2="330" y2="454"/>
  <text class="tagWarn" x="82" y="478">TEMPLATE ONLY, 0 GRADED</text>
  <text class="b" x="82" y="506">Priority, reason, threshold,</text>
  <text class="b" x="82" y="532">and source columns are blank</text>
  <text class="s" x="82" y="598">16 sequences &#183; 2 source videos</text>

  <!-- Card 4: Myopathic, blank -->
  <rect x="408" y="406" rx="16" width="292" height="220" fill="#f6e2df" stroke="#c0483a" stroke-width="1.75"/>
  <text class="t" x="430" y="436">Myopathic</text>
  <line class="rule" x1="430" y1="454" x2="678" y2="454"/>
  <text class="tagWarn" x="430" y="478">TEMPLATE ONLY, 0 GRADED</text>
  <text class="b" x="430" y="506">Priority, reason, threshold,</text>
  <text class="b" x="430" y="532">and source columns are blank</text>
  <text class="s" x="430" y="598">47 sequences &#183; 10 source videos</text>

  <!-- Arrow from grid to result panel, vertically centered on the 130-626 span -->
  <path d="M708 378 H756" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Result panel, matches grid vertical span 130-626 -->
  <rect x="772" y="130" rx="16" width="368" height="496" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/>
  <text class="t" x="794" y="160">What this study adds</text>
  <line class="rule" x1="794" y1="178" x2="1112" y2="178"/>
  <text class="b" x="794" y="212">Grade CP + myopathic from</text>
  <text class="b" x="794" y="238">real literature, same H/M/L</text>
  <text class="b" x="794" y="264">format used for PD &amp; stroke</text>
  <text class="s" x="794" y="306">Result</text>
  <text class="m" x="794" y="344">63 of 96 sequences</text>
  <text class="b" x="794" y="372">(47 myopathic + 16 CP) now</text>
  <text class="s" x="794" y="398">gain literature-grounded thresholds</text>

  <rect x="794" y="530" rx="14" width="324" height="52" fill="#20364e"/>
  <text class="w" x="956" y="562" text-anchor="middle">All 5 conditions gain thresholds</text>

  <text class="s" x="60" y="658">Source: neuroscience/pd-features.csv, stroke-features.csv, cerebral-palsy-features.csv, myopathic-features.csv</text>
</svg>
