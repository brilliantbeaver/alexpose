<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three-week plan with a Day 5 go or no-go gate</title>
  <desc id="desc">Week 1 builds the corrected split and scores held-out sequences. A Day 5 checkpoint asks whether the ROC-AUC trend is already clearly above chance on partial data, branching to continue into Weeks 2 and 3 or to pivot. Weeks 2 and 3 add the leave-one-source-out check, the missingness baseline, and the write-up.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .ws{font:14px Arial,Helvetica,sans-serif;fill:#cdd8e4}
</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" fill="#20364e"/>
    </marker>

  </defs>
  <rect class="bg" width="1200" height="720"/>
<text class="h" x="48" y="76">Three weeks, with a Day 5 reality check</text>
<text class="s" x="48" y="100">If the trend is not visible by Day 5, pivot before spending two more weeks on it.</text>
<rect x="48" y="122" width="300" height="220" rx="16" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.75"/>
<text class="t" x="70" y="160">Week 1: the split</text>
<text class="b" x="70" y="190">Assign videos to train</text>
<text class="b" x="70" y="218">or held-out, before prep</text>
<text class="b" x="70" y="246">Reuse frozen checkpoint</text>
<text class="b" x="70" y="274">no retraining needed</text>
<rect x="450" y="122" width="300" height="220" rx="16" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.75"/>
<text class="t" x="472" y="160">Week 2: score it</text>
<text class="b" x="472" y="190">Run masked prediction</text>
<text class="b" x="472" y="218">on held-out sequences</text>
<text class="b" x="472" y="246">Compute anomaly scores</text>
<text class="b" x="472" y="274">Fit primary ROC-AUC</text>
<rect x="852" y="122" width="300" height="220" rx="16" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.75"/>
<text class="t" x="874" y="160">Week 3: stress-test</text>
<text class="b" x="874" y="190">Leave-one-source-out</text>
<text class="b" x="874" y="218">check for small classes</text>
<text class="b" x="874" y="246">Missingness baseline</text>
<text class="b" x="874" y="274">Write up honest result</text>
<line x1="348" y1="232" x2="434" y2="232" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<line x1="750" y1="232" x2="836" y2="232" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<line x1="198" y1="342" x2="198" y2="356" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="372" width="300" height="120" rx="16" fill="#ece6f6" stroke="#8a6fb3" stroke-width="1.75"/>
<text class="t" x="70" y="410">Day 5 go/no-go</text>
<text class="b" x="70" y="440">AUC trending above 0.5</text>
<text class="b" x="70" y="468">on partial held-out data?</text>
<line x1="140" y1="492" x2="158" y2="524" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<line x1="280" y1="492" x2="438" y2="524" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="540" width="220" height="90" rx="16" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.75"/>
<text class="t" x="70" y="576">Continue</text>
<text class="s" x="70" y="602">to Week 2 scoring</text>
<rect x="328" y="540" width="220" height="90" rx="16" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.75"/>
<text class="t" x="350" y="576">Pivot</text>
<text class="s" x="350" y="602">adjust scope or stop</text>
<text class="s" x="48" y="658">Even a pivot leaves a reusable split and checkpoint for ideas 2 to 7.</text>
</svg>
