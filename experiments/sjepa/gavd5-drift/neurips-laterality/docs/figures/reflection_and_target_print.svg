<title id="title">Anatomical reflection reverses a signed contrast</title><desc id="desc">Print schematic with original and mirrored anatomy, dimensionless mean paired-speed target, token equivariance, algebraic output oddness, and a constant-feature control. Drawings and target values are illustrative.</desc>
