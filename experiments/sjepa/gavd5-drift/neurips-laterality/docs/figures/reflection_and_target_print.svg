<text x="490" y="175" font-size="22" font-weight="400" text-anchor="middle" style="fill:#203846">
<tspan x="490" dy="0">x → −x</tspan>
<tspan x="490" dy="29.92">left ↔ right</tspan>
</text>
<text x="490" y="273" font-size="20" font-weight="400" text-anchor="middle" style="fill:#546675">
<tspan x="490" dy="0">Time order stays fixed.</tspan>
<tspan x="490" dy="27.200000000000003">Validity and masks swap.</tspan>
</text>
<text x="230" y="414" font-size="24" font-weight="700" text-anchor="middle" style="fill:#137E8A">
<tspan x="230" dy="0">y(X) = +0.20</tspan>
</text>
<text x="745" y="414" font-size="24" font-weight="700" text-anchor="middle" style="fill:#7857A6">
<tspan x="745" dy="0">y(MX) = −0.20</tspan>
</text>
<rect x="20" y="456" width="950" height="138" rx="16" fill="white" stroke="#D7E1E7" stroke-width="1.5"/>
<text x="40" y="488" font-size="23" font-weight="700" text-anchor="start" style="fill:#203846">
<tspan x="40" dy="0">Target: average five paired speed contrasts</tspan>
</text>
<text x="40" y="524" font-size="23" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="40" dy="0">Each pair: c = (mL − mR) / (mL + mR + ε)</tspan>
</text>
<text x="40" y="555" font-size="20" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="40" dy="0">Use median speeds over at least eight common valid transitions per pair.</tspan>
</text>
<text x="40" y="582" font-size="20" font-weight="400" text-anchor="start" style="fill:#546675">
<tspan x="40" dy="0">Positive y means a positive average left-minus-right speed contrast.</tspan>
</text>
<rect x="20" y="615" width="298" height="154" rx="16" fill="#EAF5F5" stroke="#A9CED0" stroke-width="1.5"/>
<text x="38" y="647" font-size="22" font-weight="700" text-anchor="start" style="fill:#137E8A">
<tspan x="38" dy="0">Token equivariance</tspan>
</text>
<text x="38" y="679" font-size="20" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="38" dy="0">Z(MX) ≈ P Z(X)</tspan>
<tspan x="38" dy="26.0">Exchange joint positions;</tspan>
<tspan x="38" dy="26.0">keep channel axes.</tspan>
</text>
<rect x="346" y="615" width="298" height="154" rx="16" fill="#F1EDF7" stroke="#CBBEDD" stroke-width="1.5"/>
<text x="364" y="647" font-size="22" font-weight="700" text-anchor="start" style="fill:#7857A6">
<tspan x="364" dy="0">Oddness by algebra</tspan>
</text>
<text x="364" y="679" font-size="20" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="364" dy="0">g = [h(X) − h(MX)] / 2</tspan>
<tspan x="364" dy="26.0">Then g(MX) = −g(X).</tspan>
<tspan x="364" dy="26.0">Test learning separately.</tspan>
</text>
<rect x="672" y="615" width="298" height="154" rx="16" fill="#FFF8ED" stroke="#E5D2AD" stroke-width="1.5"/>
<text x="690" y="647" font-size="22" font-weight="700" text-anchor="start" style="fill:#A46B1C">
<tspan x="690" dy="0">Constant-feature test</tspan>
</text>
<text x="690" y="679" font-size="20" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="690" dy="0">Perfect agreement can</tspan>
<tspan x="690" dy="26.0">lose between-clip signal.</tspan>
<tspan x="690" dy="26.0">Check useful prediction.</tspan>
</text>
