<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="795" viewBox="0 0 1440 795" role="img" aria-labelledby="title desc">
<title id="title">Anatomical reflection reverses a signed movement target</title><desc id="desc">A schematic body and its reflection illustrate a sign reversal in the horizontal coordinate, exchange of anatomical left/right landmark identities, and the corresponding sign reversal in a signed motion target. Equivariance of tokens is distinguished from invariance of pooled features and from an algebraically odd readout. All displayed motion values are illustrative.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546675"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203846}.muted{fill:#546675}</style>
<rect width="1440" height="795" fill="white"/>
<text x="40" y="45" font-size="30" font-weight="700" text-anchor="start" style="fill:#203846">
<tspan x="40" dy="0">A known geometric transformation gives a testable prediction</tspan>
</text>
<text x="40" y="78" font-size="20" font-weight="400" text-anchor="start" style="fill:#546675">
<tspan x="40" dy="0">The body may walk asymmetrically; reflecting its measurement should still exchange left and right.</tspan>
</text>
<rect x="40" y="112" width="800" height="478" rx="16" fill="#F4F7F9" stroke="#D7E1E7" stroke-width="1.5"/>
<text x="62" y="144" font-size="15" font-weight="700" text-anchor="start" style="fill:#137E8A">
<tspan x="62" dy="0">A  ANATOMICAL REFLECTION</tspan>
</text>
<text x="62" y="175" font-size="23" font-weight="700" text-anchor="start" style="fill:#203846">
<tspan x="62" dy="0">Coordinate sign, joint identities, and masks transform together</tspan>
</text>
