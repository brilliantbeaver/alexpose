<text x="143" y="305" font-size="17" font-weight="700" text-anchor="start" style="fill:#137E8A">
<tspan x="143" dy="0">L</tspan>
</text>
<text x="285" y="305" font-size="17" font-weight="700" text-anchor="start" style="fill:#7857A6">
<tspan x="285" dy="0">R</tspan>
</text>
<text x="578" y="305" font-size="17" font-weight="700" text-anchor="start" style="fill:#137E8A">
<tspan x="578" dy="0">L</tspan>
</text>
<text x="724" y="305" font-size="17" font-weight="700" text-anchor="start" style="fill:#7857A6">
<tspan x="724" dy="0">R</tspan>
</text>
<text x="220" y="211" font-size="23" font-weight="700" text-anchor="middle" style="fill:#203846">
<tspan x="220" dy="0">Original X</tspan>
</text>
<text x="655" y="211" font-size="23" font-weight="700" text-anchor="middle" style="fill:#203846">
<tspan x="655" dy="0">Reflected MX</tspan>
</text>
<path d="M 335 331 H 537" fill="none" stroke="#546675" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="436" y="291" font-size="19" font-weight="400" text-anchor="middle" style="fill:#203846">
<tspan x="436" dy="0">x → −x</tspan>
<tspan x="436" dy="25.840000000000003">left ↔ right</tspan>
</text>
<text x="436" y="375" font-size="15.5" font-weight="400" text-anchor="middle" style="fill:#546675">
<tspan x="436" dy="0">time order stays fixed</tspan>
<tspan x="436" dy="21.080000000000002">validity + hidden masks swap</tspan>
</text>
<text x="220" y="511" font-size="24" font-weight="700" text-anchor="middle" style="fill:#137E8A">
<tspan x="220" dy="0">y(X) = +0.20</tspan>
</text>
<text x="655" y="511" font-size="24" font-weight="700" text-anchor="middle" style="fill:#7857A6">
<tspan x="655" dy="0">y(MX) = −0.20</tspan>
</text>
<text x="440" y="558" font-size="16" font-weight="400" text-anchor="middle" style="fill:#546675">
<tspan x="440" dy="0">Illustrative body and values; the implemented schema contains 33 landmarks.</tspan>
</text>
<rect x="868" y="112" width="532" height="478" rx="16" fill="#F4F7F9" stroke="#D7E1E7" stroke-width="1.5"/>
<text x="890" y="144" font-size="15" font-weight="700" text-anchor="start" style="fill:#137E8A">
<tspan x="890" dy="0">B  WHAT THE TARGET MEASURES</tspan>
</text>
<text x="890" y="175" font-size="23" font-weight="700" text-anchor="start" style="fill:#203846">
<tspan x="890" dy="0">Paired motion from observed coordinates</tspan>
</text>
<text x="890" y="210" font-size="19" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="890" dy="0">For each left/right landmark pair:</tspan>
<tspan x="890" dy="25.840000000000003">uL and uR are median movement speeds</tspan>
<tspan x="890" dy="25.840000000000003">over the same valid time transitions.</tspan>
</text>
<rect x="890" y="296" width="488" height="70" rx="16" fill="white" stroke="#D7E1E7" stroke-width="1.5"/>
<text x="1134" y="340" font-size="22" font-weight="400" text-anchor="middle" style="fill:#203846">
<tspan x="1134" dy="0">pair contrast = (uL − uR) / (uL + uR + ε)</tspan>
</text>
<text x="890" y="404" font-size="18" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="890" dy="0">Average the five accepted pair contrasts.</tspan>
<tspan x="890" dy="24.48">Use shoulder, knee, ankle, heel, and toe pairs.</tspan>
<tspan x="890" dy="24.48">Each pair needs at least eight valid transitions.</tspan>
<tspan x="890" dy="24.48">All five pairs must be usable.</tspan>
</text>
<text x="890" y="543" font-size="18" font-weight="400" text-anchor="start" style="fill:#546675">
<tspan x="890" dy="0">Positive y: positive mean left-minus-right contrast.</tspan>
<tspan x="890" dy="24.48">Opposing differences between pairs can cancel.</tspan>
</text>
<rect x="40" y="616" width="435" height="143" rx="16" fill="#EAF5F5" stroke="#A9CED0" stroke-width="1.5"/>
<text x="62" y="650" font-size="21" font-weight="700" text-anchor="start" style="fill:#137E8A">
<tspan x="62" dy="0">Token equivariance</tspan>
</text>
<text x="62" y="681" font-size="17" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="62" dy="0">Z(MX) ≈ P Z(X) exchanges joint positions.</tspan>
<tspan x="62" dy="23.12">Feature channels are assumed to stay fixed.</tspan>
<tspan x="62" dy="23.12">The explicit loss has synthetic evidence only.</tspan>
</text>
<rect x="502" y="616" width="435" height="143" rx="16" fill="#F1EDF7" stroke="#CBBEDD" stroke-width="1.5"/>
<text x="524" y="650" font-size="21" font-weight="700" text-anchor="start" style="fill:#7857A6">
<tspan x="524" dy="0">Exact oddness at the readout</tspan>
</text>
<text x="524" y="681" font-size="17" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="524" dy="0">g(X) = [h(X) − h(MX)] / 2</tspan>
<tspan x="524" dy="23.12">Then g(MX) = −g(X), even before training.</tspan>
<tspan x="524" dy="23.12">Predictive benefit requires a separate test.</tspan>
</text>
<rect x="964" y="616" width="436" height="143" rx="16" fill="#FFF8ED" stroke="#E5D2AD" stroke-width="1.5"/>
<text x="986" y="650" font-size="21" font-weight="700" text-anchor="start" style="fill:#A46B1C">
<tspan x="986" dy="0">Constant-feature control</tspan>
</text>
<text x="986" y="681" font-size="17" font-weight="400" text-anchor="start" style="fill:#203846">
<tspan x="986" dy="0">Constant nonzero tokens can match perfectly.</tspan>
<tspan x="986" dy="23.12">They cannot distinguish clips, so we also</tspan>
<tspan x="986" dy="23.12">measure feature variation and held-out R².</tspan>
</text>
</svg>
