<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1035" viewBox="0 0 1540 1035" role="img" aria-labelledby="title desc">
<title id="title">Learned correspondence and laterality readout diverge</title><desc id="desc">Saved results from 625 clips in 93 source videos. Trained predictors consistently favor correct-clip hidden teacher targets, but every trained encoder arm has lower motion-sensitive laterality R squared than the paired initial encoder. All three alternative-mask contrasts have source-bootstrap confidence intervals crossing zero. Individual seed scores and uncertainty interpretation are shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546675"/></marker></defs>
