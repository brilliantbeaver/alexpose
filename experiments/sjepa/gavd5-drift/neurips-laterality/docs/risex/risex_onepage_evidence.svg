<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Study design and primary result">
  <style>text{font-family:Arial,sans-serif;fill:#182432}.h{font-weight:700;font-size:19px}.s{font-size:15px}.n{font-size:14px}.box{fill:#f6f8fa;stroke:#9aabba;stroke-width:2}.good{fill:#dff3e7;stroke:#277a55;stroke-width:2}.bad{fill:#fbe4e2;stroke:#b4473d;stroke-width:2}.line{stroke:#536b7b;stroke-width:2.5;fill:none}</style>
  <rect x="18" y="38" width="205" height="115" rx="12" class="box"/><text x="120" y="70" text-anchor="middle" class="h">Articulated motion</text><text x="120" y="98" text-anchor="middle" class="s">625 clips, 93 sources</text><text x="120" y="123" text-anchor="middle" class="s">64 × 33 × 3 poses</text>
  <path d="M225 95H275" class="line"/><path d="M270 89l10 6-10 6" class="line"/>
  <rect x="280" y="38" width="205" height="115" rx="12" class="box"/><text x="382" y="70" text-anchor="middle" class="h">Masked JEPA</text><text x="382" y="98" text-anchor="middle" class="s">16 × 33 token grid</text><text x="382" y="123" text-anchor="middle" class="s">five source-held-out folds</text>
  <path d="M487 95H537" class="line"/><path d="M532 89l10 6-10 6" class="line"/>
  <rect x="542" y="38" width="340" height="115" rx="12" class="box"/><text x="712" y="70" text-anchor="middle" class="h">Frozen bilateral readout</text><text x="712" y="98" text-anchor="middle" class="s">same source splits, five seeds</text><text x="712" y="123" text-anchor="middle" class="s">predict left–right speed contrast</text>
  <text x="18" y="200" class="h">Feature matching improves</text><rect x="300" y="181" width="420" height="26" rx="6" class="good"/><text x="510" y="200" text-anchor="middle" class="s">correct clip preferred in 375 / 375 trained checks</text>
  <text x="18" y="253" class="h">Movement readout worsens</text><rect x="300" y="234" width="300" height="26" rx="6" class="bad"/><text x="450" y="253" text-anchor="middle" class="s">initial: R² 0.223</text><rect x="610" y="234" width="250" height="26" rx="6" class="bad"/><text x="735" y="253" text-anchor="middle" class="s">trained: 0.101–0.114</text>
</svg>
