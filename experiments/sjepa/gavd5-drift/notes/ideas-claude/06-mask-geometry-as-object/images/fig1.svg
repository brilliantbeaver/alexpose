<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Held-out-source decodability for uniform vs structured mask, with a provenance kill gate</title>
  <desc id="desc">Illustrative expected shape. Left panel: grouped bars of held-out-source normalized mean absolute error on the timing and laterality targets for the uniform mask (arm U) versus the structured mask (arm S), lower is better, with per-source paired dots. Right panel: provenance balanced accuracy for the two arms with a hard kill-gate band; arm S must not rise above arm U by more than 0.02.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; fill: #0f2440; }
    .t { font-size: 20px; font-weight: 700; fill: #0f2440; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .axis { stroke: #20364e; stroke-width: 2; }
    .grid { stroke: #c4cdd8; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="56" class="h" text-anchor="start">Does gait-shaped masking help without a shortcut?</text>
  <text x="48" y="84" class="s" text-anchor="start">Illustrative expected shape. Not measured results. Every number is on held-out source videos the Stage-0 encoder never saw. Lower MAE is better.</text>

  <!-- ============ LEFT PANEL: grouped MAE bars ============ -->
  <rect x="48" y="112" width="620" height="500" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="146" class="t" text-anchor="start">Held-out-source normalized MAE</text>
  <text x="72" y="170" class="s" text-anchor="start">grouped by target family; each dot is one held-out source video</text>

  <!-- plot frame -->
  <!-- y axis from y=560 (MAE 0) up to y=210 (MAE high) -->
  <line x1="150" y1="210" x2="150" y2="560" class="axis"/>
  <line x1="150" y1="560" x2="628" y2="560" class="axis"/>
  <!-- gridlines -->
  <line x1="150" y1="502" x2="628" y2="502" class="grid"/>
  <line x1="150" y1="444" x2="628" y2="444" class="grid"/>
  <line x1="150" y1="386" x2="628" y2="386" class="grid"/>
  <line x1="150" y1="328" x2="628" y2="328" class="grid"/>
  <line x1="150" y1="270" x2="628" y2="270" class="grid"/>
  <!-- y label -->
  <text x="112" y="390" class="s" text-anchor="middle" transform="rotate(-90 112 390)">normalized MAE (lower better)</text>
  <text x="140" y="565" class="s" text-anchor="end">low</text>
  <text x="140" y="215" class="s" text-anchor="end">high</text>

  <!-- Group 1: TIMING target. Bars centered ~ x=270 -->
  <!-- Uniform bar (orange, taller = worse) -->
  <rect x="212" y="300" width="52" height="260" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <!-- Structured bar (green, shorter = better) -->
  <rect x="286" y="378" width="52" height="182" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.75"/>
  <text x="275" y="586" class="b" text-anchor="middle">Timing</text>

  <!-- per-source paired dots for timing -->
  <circle cx="238" cy="312" r="4" fill="#e07a4b"/>
  <circle cx="238" cy="296" r="4" fill="#e07a4b"/>
  <circle cx="238" cy="330" r="4" fill="#e07a4b"/>
  <circle cx="238" cy="352" r="4" fill="#e07a4b"/>
  <circle cx="312" cy="388" r="4" fill="#5f9e7e"/>
  <circle cx="312" cy="372" r="4" fill="#5f9e7e"/>
  <circle cx="312" cy="404" r="4" fill="#5f9e7e"/>
  <circle cx="312" cy="420" r="4" fill="#5f9e7e"/>

  <!-- Group 2: LATERALITY / ASYMMETRY target. Bars centered ~ x=470 -->
  <rect x="410" y="270" width="52" height="290" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <rect x="484" y="360" width="52" height="200" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.75"/>
  <text x="473" y="586" class="b" text-anchor="middle">Laterality</text>

  <circle cx="436" cy="284" r="4" fill="#e07a4b"/>
  <circle cx="436" cy="268" r="4" fill="#e07a4b"/>
  <circle cx="436" cy="300" r="4" fill="#e07a4b"/>
  <circle cx="436" cy="320" r="4" fill="#e07a4b"/>
  <circle cx="510" cy="372" r="4" fill="#5f9e7e"/>
  <circle cx="510" cy="356" r="4" fill="#5f9e7e"/>
  <circle cx="510" cy="390" r="4" fill="#5f9e7e"/>
  <circle cx="510" cy="408" r="4" fill="#5f9e7e"/>

  <!-- legend inside left panel, in clear space to the right of the bars -->
  <rect x="558" y="466" width="18" height="18" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.5"/>
  <text x="584" y="481" class="s" text-anchor="start">U uniform</text>
  <rect x="558" y="500" width="18" height="18" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.5"/>
  <text x="584" y="515" class="s" text-anchor="start">S structured</text>

  <!-- improvement note + arrow for the laterality group, in clear space to the right of the S bar -->
  <text x="558" y="392" class="s" text-anchor="start">arrow shows</text>
  <text x="558" y="414" class="s" text-anchor="start">the &#8805;10%</text>
  <text x="558" y="436" class="s" text-anchor="start">expected drop</text>
  <!-- straight vertical arrow from top of U (worse) down to top of S (better) for laterality -->
  <path d="M552,278 L552,354" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ RIGHT PANEL: provenance kill gate ============ -->
  <rect x="724" y="112" width="428" height="500" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="748" y="146" class="t" text-anchor="start">Provenance kill gate</text>
  <text x="748" y="170" class="s" text-anchor="start">balanced accuracy predicting extraction pathway</text>

  <line x1="820" y1="210" x2="820" y2="560" class="axis"/>
  <line x1="820" y1="560" x2="1120" y2="560" class="axis"/>
  <text x="786" y="390" class="s" text-anchor="middle" transform="rotate(-90 786 390)">provenance balanced accuracy</text>

  <!-- chance reference line at accuracy 0.5 (y=470); drawn BEFORE the bars so it sits behind them -->
  <line x1="820" y1="470" x2="1120" y2="470" stroke="#5f9e7e" stroke-dasharray="7 6" stroke-width="2"/>
  <text x="826" y="234" class="s" text-anchor="start">green dashed line = chance (0.50)</text>

  <!-- expected-shape note, in clear space, left of the bars -->
  <text x="826" y="512" class="s" text-anchor="start">expected:</text>
  <text x="826" y="534" class="s" text-anchor="start">S &#8776; U,</text>
  <text x="826" y="556" class="s" text-anchor="start">low</text>

  <!-- kill band: U level + 0.02, above => study killed. Put U at y=420 -->
  <rect x="880" y="404" width="240" height="16" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.5"/>
  <text x="880" y="396" class="s" text-anchor="start">kill band: S above here = study stops</text>

  <!-- U bar (drawn after the chance line so the bar face is unbroken) -->
  <rect x="900" y="420" width="70" height="140" fill="#f7e7d8" stroke="#a44c26" stroke-width="1.75"/>
  <text x="935" y="586" class="b" text-anchor="middle">U</text>
  <!-- S bar (must stay at/below U) -->
  <rect x="1010" y="422" width="70" height="138" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.75"/>
  <text x="1045" y="586" class="b" text-anchor="middle">S</text>

  <!-- chance-line value label, drawn last so it stays legible over bars and band -->
  <text x="1096" y="464" class="s" text-anchor="start">0.50</text>

  <!-- Footer -->
  <text x="48" y="644" class="s" text-anchor="start">Pass rule: S cuts MAE &#8805;10% over both U and the marginal-matched scrambled control, sign holds on &#8805;75% of sources, and S provenance stays within 0.02 of U.</text>
  <text x="48" y="670" class="s" text-anchor="start">Folder labels (normal, Parkinson's, stroke, myopathic, cerebral palsy) are dataset annotations, not diagnoses. Bars and dots are placeholders for expected ordering only.</text>
</svg>
