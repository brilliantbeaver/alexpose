<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="fig4title fig4desc">
  <title id="fig4title">fps is the key that turns frame numbers into real seconds, and the resize throws that key away</title>
  <desc id="fig4desc">A beginner how-to-read picture with two paths. On the left path, a frame number is multiplied by one divided by fps to give real seconds, so cadence in steps per minute is readable. On the right path, the 64-frame resize has deleted fps, so the same frame numbers give only cycles per clip with no clock attached, and steps per minute cannot be recovered. The picture shows fps as the missing key.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
    <style>
      .h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:32px;fill:#0f2440;}
      .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;fill:#0f2440;}
      .b{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#33475e;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5c6f84;}
      .w{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;fill:#ffffff;}
      .ws{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#cdd8e4;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="60" class="h">fps is the key that unlocks real seconds</text>
  <text x="48" y="90" class="s">One key, fps (frames per second), decides whether frame numbers can become real time. The resize deletes it. Illustrative example.</text>

  <!-- Shared starting card (y 116..214) -->
  <rect x="418" y="116" width="364" height="98" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="600" y="148" text-anchor="middle" class="t">You start with frame numbers</text>
  <text x="600" y="178" text-anchor="middle" class="b">Frame 0, 1, 2, 3, ... just counting</text>
  <text x="600" y="200" text-anchor="middle" class="b">still pictures. No clock attached yet.</text>

  <!-- split arrows down to each path (single right-angle bend each) -->
  <path d="M600 214 L600 244 L330 244 L330 292" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 214 L600 244 L870 244 L870 292" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ LEFT PATH: fps KEPT ============ -->
  <rect x="88" y="294" width="484" height="82" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text x="110" y="326" class="t">Keep fps (native-rate view)</text>
  <text x="110" y="356" class="b">You still know how many frames per second.</text>

  <path d="M330 376 L330 406" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="88" y="406" width="484" height="92" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="110" y="438" class="t">Multiply by 1 / fps</text>
  <text x="110" y="468" class="b">frame number x (1 / fps) = real seconds.</text>
  <text x="110" y="490" class="s">At 30 fps, one frame is about 0.0333 seconds.</text>

  <path d="M330 498 L330 518" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="88" y="518" width="484" height="112" rx="16" fill="#ffffff" stroke="#5f9e7e" stroke-width="1.75"/>
  <text x="110" y="550" class="t">Steps per minute: readable</text>
  <text x="110" y="580" class="b">Count foot cycles per real second, times 60.</text>
  <text x="110" y="608" class="b">Now cadence in steps per minute exists.</text>

  <!-- ============ RIGHT PATH: fps DELETED ============ -->
  <rect x="628" y="294" width="484" height="82" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="650" y="326" class="t">Resize deletes fps (resized view)</text>
  <text x="650" y="356" class="b">The 64-frame warp throws the clock away.</text>

  <path d="M870 376 L870 406" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="628" y="406" width="484" height="92" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="650" y="438" class="t">No 1 / fps to multiply by</text>
  <text x="650" y="468" class="b">Without fps you cannot form 1 / fps at all,</text>
  <text x="650" y="490" class="s">so real seconds cannot be rebuilt.</text>

  <path d="M870 498 L870 518" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="628" y="518" width="484" height="112" rx="16" fill="#ffffff" stroke="#a44c26" stroke-width="1.75"/>
  <text x="650" y="550" class="t">Steps per minute: gone</text>
  <text x="650" y="580" class="b">You can only say cycles per clip, the same</text>
  <text x="650" y="608" class="b">for a fast walk and a slow walk.</text>

  <text x="48" y="672" class="s">This lost real-time information is the resize tax. Cadence = peak foot-cycle rate (cycles per second) x 60. Folder labels are dataset annotations, not diagnoses.</text>
</svg>
