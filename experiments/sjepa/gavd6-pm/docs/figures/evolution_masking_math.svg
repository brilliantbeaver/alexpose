   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="26.617237" transform="rotate(-0 17.260416 26.617237)">The current masking rule is constrained, uniform, and batch-safe</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="17.260416" y="41.61" transform="rotate(-0 17.260416 41.61)">The numbers in the middle card are a teaching example. Saved run values appear in the final card.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="70.658979" transform="rotate(-0 17.260416 70.658979)">1. Build joint-time tokens</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 85.809467)">64 normalized frames</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 93.148217)">÷ 4 frames per patch</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 101.068217)">= 16 time patches</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 107.332592)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 116.908217)">16 x 33 joints</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 124.828217)">= 528 possible tokens</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 131.092592)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 140.668217)">All 33 identities may provide context.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 148.588217)">Only 12 may become targets.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="192.311654" y="70.658979" transform="rotate(-0 192.311654 70.658979)">2. Worked batch example</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 85.228217)">Valid eligible counts:</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 93.370405)">180, 160, 150, 175</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 99.412592)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 108.815248)">common target count</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 117.136498)">= floor(0.60 x 150)</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 124.828217)">= 90 tokens per sample</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 131.092592)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 141.249467)">realized fractions:</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.311654 148.810405)">0.500, 0.562, 0.600, 0.514</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="367.362893" y="70.658979" transform="rotate(-0 367.362893 70.658979)">3. What the run recorded</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 85.228217)">Stage 0 endpoint mean: 0.549</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 93.148217)">Stage 4 endpoint mean: 0.421</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 99.412592)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 108.988217)">A sample with more eligible tokens</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 116.908217)">gets a lower realized fraction.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 123.172592)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 132.748217)">Targets are drawn uniformly.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 140.668217)">No velocity, displacement, or</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(367.362893 149.169467)">learned motion score is consulted.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="17.260416" y="224.66592" transform="rotate(-0 17.260416 224.66592)">This corrects the misleading shortcut phrase '60% of each sample.' The setting is applied once to the smallest eligible count in the batch.</text>
   </g>
  </g>
 </g>
