   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="29.263237" transform="rotate(-0 17.260416 29.263237)">Added-normal diversity came from a separate, auditable extraction path</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="17.260416" y="48.225" transform="rotate(-0 17.260416 48.225)">The windows overlap within a video. The scientific gain is 17 additional source videos, not 63 independent people.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="82.94052" transform="rotate(-0 17.260416 82.94052)">1. Added videos</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 98.017898)">17 YouTube videos</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 104.439304)">project-labeled normal</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 111.369304)">kept outside canonical GAVD</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="148.548845" y="82.94052" transform="rotate(-0 148.548845 82.94052)">2. Select walker</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(148.548845 97.509304)">up to 3 pose candidates</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(148.548845 104.439304)">visibility + area +</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(148.548845 111.369304)">temporal continuity</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="279.837274" y="82.94052" transform="rotate(-0 279.837274 82.94052)">3. Track a box</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(279.837274 97.509304)">pad, fill short gaps,</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(279.837274 104.439304)">smooth, then clamp</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(279.837274 111.877898)">to the video frame</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="411.125702" y="82.94052" transform="rotate(-0 411.125702 82.94052)">4. Estimate cycle</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(411.125702 97.509304)">ankle-separation signal</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(411.125702 104.947898)">uses autocorrelation</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(411.125702 111.369304)">to estimate stride timing</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="411.125702" y="192.873" transform="rotate(-0 411.125702 192.873)">5. Cut windows</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(411.125702 207.441784)">about two cycles</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(411.125702 214.371784)">50 percent overlap</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(411.125702 221.542546)">24-frame minimum; max 8</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="279.837274" y="192.8725" transform="rotate(-0 279.837274 192.8725)">6. Extract poses</text>
   </g>
   <g id="text_14">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(279.837274 207.441784)">MediaPipe landmarks</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(279.837274 214.371784)">separate provenance and</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(279.837274 221.228776)">poses_augmented storage</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="148.548845" y="192.873" transform="rotate(-0 148.548845 192.873)">7. Apply gate</text>
   </g>
   <g id="text_16">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(148.548845 207.950378)">64 candidates</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(148.548845 214.371784)">neurologic coverage</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(148.548845 221.810378)">must be at least 0.45</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="192.873" transform="rotate(-0 17.260416 192.873)">8. Freeze cohort</text>
   </g>
   <g id="text_18">
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 207.441784)">63 accepted</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 214.371784)">1 rejected at 0.027</text>
    <text style="font-size: 5.25px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 221.810378)">17 videos retained</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="17.260416" y="283.47768" transform="rotate(-0 17.260416 283.47768)">Selection improves reproducibility, but it cannot remove the acquisition-path difference between added normal and canonical abnormal rows.</text>
   </g>
  </g>
 </g>
