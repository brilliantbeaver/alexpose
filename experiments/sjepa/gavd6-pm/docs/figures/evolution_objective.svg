   </g>
   <g id="text_18">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="17.260416" y="262.539" transform="rotate(-0 17.260416 262.539)">The group term reads condition labels. Only Stage 0 is label-free; Stages 1 through 4 are label-informed representation fine-tuning.</text>
