   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="28.028437" transform="rotate(-0 17.260416 28.028437)">The objective evolved from prediction alone to three explicit jobs</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="72.357844" transform="rotate(-0 17.260416 72.357844)">Legacy objective</text>
   </g>
   <g id="text_3">
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 86.834327)">L = L_JEPA</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 92.5768)"/>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 101.115066)">Centered and sharpened latent</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 108.177066)">cross-entropy trained prediction.</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 115.239066)">Collapse was monitored,</text>
    <text style="font-size: 5.35px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 122.301066)">not actively regularized.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="191.305613" y="72.357844" transform="rotate(-0 191.305613 72.357844)">Current objective</text>
   </g>
   <g id="text_5">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(191.305613 86.732456)">L = L_JEPA + 0.05 L_VICReg + 0.25 L_group</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(191.305613 92.2798)"/>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(191.305613 100.578675)">JEPA: predict authorized hidden teacher features</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(191.305613 107.442675)">VICReg: keep variation and reduce redundancy</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(191.305613 114.306675)">Group: compact labels and penalize close centroids</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(191.305613 121.170675)">Group is off during Stage 0</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="16.254374" y="198.681984" transform="rotate(-0 16.254374 198.681984)">Feature std</text>
   </g>
   <g id="text_7">
