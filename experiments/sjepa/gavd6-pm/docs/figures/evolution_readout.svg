   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="27.852037" transform="rotate(-0 17.260416 27.852037)">The current 384-D readout is simple, but it compresses away temporal order</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="17.260416" y="44.697" transform="rotate(-0 17.260416 44.697)">The right side is a proposed controlled ablation. It has not produced a saved result in this repository.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="65.550413" y="73.870826" transform="rotate(-0 65.550413 73.870826)">Encoded token grid</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(41.169788 88.829129)">16 time patches</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(49.907757 96.749129)">x 33 joints</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(38.568225 105.250379)">x 96 latent values</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(65.550413 110.933504)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(40.1601 120.509129)">valid tokens only</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="219.474778" y="73.870826" transform="rotate(-0 219.474778 73.870826)">Current pooling</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(195.895059 88.641942)">global mean: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(199.630621 96.297942)">global std: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(186.268418 104.515816)">12-landmark mean: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(190.003981 112.171817)">12-landmark std: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(219.474778 117.665504)"/>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.539215 127.483816)">Total = 384 values</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="412.634765" y="73.870826" transform="rotate(-0 412.634765 73.870826)">Planned dynamics ablation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(382.643327 88.641942)">per-segment profiles</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(382.660999 96.297942)">left-right trajectories</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(371.457937 104.515816)">raw duration and frame rate</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(373.523734 112.171817)">cadence or autocorrelation</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(377.237546 119.827816)">fit inside each outer fold</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="412.634765" y="165.324517" transform="rotate(-0 412.634765 165.324517)">PROPOSED</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="201.3402" transform="rotate(-0 17.260416 201.3402)">Why the current design is useful</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 215.241259)">No trainable sequence head.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 222.105259)">Low variance at tiny sample size.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 228.969259)">Easy-to-audit frozen feature probe.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="272.794982" y="201.3402" transform="rotate(-0 272.794982 201.3402)">What it cannot retain</text>
   </g>
   <g id="text_13">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(272.794982 215.241259)">Order of the 16 time patches.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(272.794982 222.105259)">Absolute walking rate after resizing.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(272.794982 228.969259)">When left-right asymmetry occurs.</text>
   </g>
  </g>
