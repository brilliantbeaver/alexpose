   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="28.028437" transform="rotate(-0 17.260416 28.028437)">Lane C improved because its evaluation definition was repaired</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="17.260416" y="45.138" transform="rotate(-0 17.260416 45.138)">The S-JEPA checkpoint and all 159 saved embeddings stayed fixed.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="72.281859" transform="rotate(-0 17.260416 72.281859)">Superseded: 5 ordinary group folds</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 87.326345)">accuracy 0.604</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 95.166431)">balanced accuracy 0.595</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 103.473908)">macro-F1 0.407</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 109.1144)"/>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 118.530431)">One training fold had no cerebral-palsy rows.</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(17.260416 126.318431)">Macro-F1 label sets varied by fold.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #3977a8" transform="translate(238.794087 106.91675)">same encoder</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; fill: #3977a8" transform="translate(245.320275 115.03675)">new folds</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="313.036646" y="72.281859" transform="rotate(-0 313.036646 72.281859)">Corrected: 2 stratified group folds</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(313.036646 87.238041)">accuracy 0.614   (change +0.009)</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(313.036646 94.828041)">balanced accuracy 0.615   (change +0.020)</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(313.036646 102.418041)">macro-F1 0.615   (change +0.207)</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(313.036646 108.4214)"/>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(313.036646 117.598041)">Every train and test fold contains all five labels.</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(313.036646 125.188041)">Macro-F1 always uses one fixed label order.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(10.218125 214.451625)">Why only two folds? Parkinson's and cerebral palsy have two source videos each.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(10.218125 223.451625)">Two is the largest fold count that keeps every class on both sides.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #b94e48" transform="translate(10.218125 248.849625)">What did not improve: the encoder was trained once on all 159 rows.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #b94e48" transform="translate(10.218125 257.849625)">Classifier-level video grouping does not create an independent encoder test.</text>
   </g>
  </g>
 </g>
