   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="26.970037" transform="rotate(-0 17.260416 26.970037)">The project evolved in layers, not through one isolated model change</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="17.260416" y="42.492" transform="rotate(-0 17.260416 42.492)">Completed changes are green or blue. The final card is required work, not a reported result.</text>
   </g>
