   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="17.260416" y="29.968838" transform="rotate(-0 17.260416 29.968838)">Legacy and current methods differ at six layers</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="16.254374" y="52.327774" transform="rotate(-0 16.254374 52.327774)">Layer</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="72.089683" y="52.327774" transform="rotate(-0 72.089683 52.327774)">Legacy prototype</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="188.287488" y="52.328035" transform="rotate(-0 188.287488 52.328035)">Current completed run</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="352.272269" y="52.328035" transform="rotate(-0 352.272269 52.328035)">Impact and remaining limit</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="16.254374" y="87.472091" transform="rotate(-0 16.254374 87.472091)">Data</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 83.512435)">12 normal sequences</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 90.516185)">1 source video</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 83.512435)">Stage 0: 75 sequences / 18 videos</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 90.012435)">Stage 4: 159 sequences / 35 videos</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 83.512435)">Broader support, but added-normal</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 90.012435)">provenance can still be a shortcut</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="16.254374" y="121.759324" transform="rotate(-0 16.254374 121.759324)">Targets</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 118.404355)">10 eligible</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 125.408105)">landmark identities</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 118.404355)">12 identities from shoulders through feet</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 125.142824)">uniform batch-safe draw; no motion score</text>
   </g>
   <g id="text_13">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 118.404355)">Heels restored; rule is explicit</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 125.408105)">realized fraction is not fixed at 0.60</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="16.254374" y="156.743587" transform="rotate(-0 16.254374 156.743587)">Objective</text>
   </g>
   <g id="text_15">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 153.296275)">Centered, sharpened</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 159.796275)">latent cross-entropy</text>
   </g>
   <g id="text_16">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 153.250369)">JEPA + 0.05 VICReg + 0.25 group</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 159.796275)">group term starts after Stage 0</text>
   </g>
   <g id="text_17">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 153.296275)">Active anti-collapse pressure added</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 159.796275)">later stages are label-informed</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="16.254374" y="191.635507" transform="rotate(-0 16.254374 191.635507)">Training</text>
   </g>
   <g id="text_19">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="72.089683" y="191.438195" transform="rotate(-0 72.089683 191.438195)">Normal-only checkpoint</text>
   </g>
   <g id="text_20">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 188.188195)">Normal first, then four condition stages</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 194.688195)">with condition-balanced replay</text>
   </g>
   <g id="text_21">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 188.188195)">One continuing 600-epoch model</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 195.191945)">normal anchor still drifted to 0.617</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="16.254374" y="227.132115" transform="rotate(-0 16.254374 227.132115)">Artifacts</text>
   </g>
   <g id="text_23">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="72.089683" y="226.833865" transform="rotate(-0 72.089683 226.833865)">Loose filename-based reuse</text>
   </g>
   <g id="text_24">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 223.080115)">Lineage, cohort, configuration, and</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 229.580115)">fingerprint are recorded</text>
   </g>
   <g id="text_25">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 223.080115)">Reject incomplete, stale, wrong-mode,</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 229.580115)">or mixed-fingerprint artifacts</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="16.254374" y="262.024035" transform="rotate(-0 16.254374 262.024035)">Evaluation</text>
   </g>
   <g id="text_27">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 257.972035)">Single video-confounded</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(72.089683 264.472035)">47/21 comparison</text>
   </g>
   <g id="text_28">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 257.972035)">A1, A2, grouped-RF Lane C, plus</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(188.287488 264.472035)">missingness and exposure audits</text>
   </g>
   <g id="text_29">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 257.972035)">Claims are narrower; no lane yet retrains</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(352.272269 264.975785)">the encoder outside test videos</text>
   </g>
   <g id="text_30">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="17.260416" y="296.95464" transform="rotate(-0 17.260416 296.95464)">The rows must be interpreted together. The accuracy change cannot be assigned to any single row without a controlled ablation.</text>
   </g>
  </g>
 </g>
