<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Annotated frame and pose extraction</title>
  <desc>The GAVD bbox is scaled to the downloaded video, padded, used for one-person pose detection, and then mapped back to full-frame normalized coordinates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#20364e"/>
    </marker>
    <style>
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .step{font:700 15px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .arrow{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f7f5ef"/>

  <text x="60" y="72" class="h">Use the annotation to isolate the intended walker</text>

  <!-- Step 1: Scale bbox (warm card, video frame with orange bbox + white stick figure) -->
  <rect x="60" y="176" width="300" height="330" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="82" y="216" class="step">STEP 1</text>
  <text x="82" y="244" class="t">Scale bbox</text>
  <!-- inner video frame -->
  <rect x="112" y="270" width="196" height="176" rx="6" fill="#20364e"/>
  <!-- orange bounding box -->
  <rect x="176" y="298" width="68" height="126" fill="none" stroke="#e07a4b" stroke-width="5"/>
  <!-- white stick figure inside bbox -->
  <g stroke="#ffffff" fill="#ffffff" stroke-linecap="round">
    <circle cx="210" cy="318" r="11" stroke="none"/>
    <line x1="210" y1="329" x2="210" y2="376" stroke-width="7"/>
    <line x1="210" y1="342" x2="188" y2="360" stroke-width="6"/>
    <line x1="210" y1="342" x2="232" y2="360" stroke-width="6"/>
    <line x1="210" y1="376" x2="194" y2="410" stroke-width="6"/>
    <line x1="210" y1="376" x2="226" y2="410" stroke-width="6"/>
  </g>
  <text x="82" y="480" class="b">Annotation size to MP4 size</text>

  <!-- arrow 1 -> 2 -->
  <path d="M376 341H452" class="arrow"/>

  <!-- Step 2: Detect pose (neutral card, violet stick figure in padded crop) -->
  <rect x="468" y="176" width="300" height="330" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="490" y="216" class="step">STEP 2</text>
  <text x="490" y="244" class="t">Detect pose</text>
  <!-- padded crop frame -->
  <rect x="520" y="270" width="196" height="176" rx="6" fill="#ece6f6" stroke="#8a6fb3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- violet stick figure -->
  <g stroke="#8a6fb3" fill="#8a6fb3" stroke-linecap="round">
    <circle cx="618" cy="316" r="12" stroke="none"/>
    <line x1="618" y1="328" x2="618" y2="378" stroke-width="8"/>
    <line x1="618" y1="342" x2="592" y2="362" stroke-width="6"/>
    <line x1="618" y1="342" x2="644" y2="362" stroke-width="6"/>
    <line x1="618" y1="378" x2="600" y2="414" stroke-width="6"/>
    <line x1="618" y1="378" x2="636" y2="414" stroke-width="6"/>
  </g>
  <text x="490" y="480" class="b">One person inside padded crop</text>

  <!-- arrow 2 -> 3 -->
  <path d="M784 341H860" class="arrow"/>

  <!-- Step 3: Preserve the timeline (green card, list) -->
  <rect x="876" y="176" width="264" height="330" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text x="898" y="216" class="step">STEP 3</text>
  <text x="898" y="244" class="t">Preserve the timeline</text>
  <text x="898" y="290" class="b">x, y, z, visibility per landmark</text>
  <text x="898" y="326" class="b">Absolute frame numbers</text>
  <text x="898" y="362" class="b">NaN row when detection fails</text>
  <text x="898" y="398" class="b">Actual FPS from the MP4</text>

  <!-- footer note -->
  <text x="60" y="590" class="s">Failed frames stay in place so gait timing is not compressed.</text>
</svg>
