<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t1 d1">
  <title id="t1">Illustrative expected shape: source-level AUC by scoring target and condition contrast</title>
  <desc id="d1">A grid of three scoring targets (position energy, motion energy, fixed mix) across four x-groups: the primary mechanism-matched Parkinson's-versus-canonical-myopathic contrast plus three secondary lanes (stroke versus myopathic, the pooled Parkinson's-plus-stroke versus myopathic-plus-cerebral-palsy broad-abnormality lane, and one confounded normal-versus-abnormal lane). Each cell shows a source-level ROC-AUC point with a bootstrap confidence interval over held-out sources, a chance reference line at 0.5, and a separate shuffled-motion control lane that must not beat motion. Values are an illustrative expected shape, not measured results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#20364e"/>
    </marker>
    <style>
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .ws{font:14px Arial,Helvetica,sans-serif;fill:#cdd8e4}
      .a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .axis{stroke:#20364e;stroke-width:1.75}
      .grid{stroke:#c4cdd8;stroke-width:1}
      .chance{stroke:#c0483a;stroke-width:1.75;stroke-dasharray:6 5}
      .ci{stroke-width:2.5}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="66" class="h">Does motion separate walks better than position?</text>
  <text x="48" y="96" class="s">Illustrative expected shape, not measured results. Source-level ROC-AUC per held-out source, bootstrap CI over sources. All numbers transductive, checkpoint ea59fea0.</text>

  <!-- ================= MAIN AUC PANEL ================= -->
  <!-- plot box: x 152..760 , y 150..540 ; y axis AUC 0.4 .. 0.9 -->
  <!-- map: y = 540 - (auc-0.4)/0.5*390 -->
  <text x="152" y="134" class="t">Source-level AUC grid</text>

  <line x1="152" y1="150" x2="152" y2="540" class="axis"/>
  <line x1="152" y1="540" x2="760" y2="540" class="grid"/>
  <text x="140" y="545" class="s" text-anchor="end">0.4</text>
  <line x1="152" y1="462" x2="760" y2="462" class="chance"/>
  <text x="140" y="467" class="s" text-anchor="end">0.5</text>
  <text x="768" y="467" class="s">chance</text>
  <line x1="152" y1="384" x2="760" y2="384" class="grid"/>
  <text x="140" y="389" class="s" text-anchor="end">0.6</text>
  <line x1="152" y1="306" x2="760" y2="306" class="grid"/>
  <text x="140" y="311" class="s" text-anchor="end">0.7</text>
  <line x1="152" y1="228" x2="760" y2="228" class="grid"/>
  <text x="140" y="233" class="s" text-anchor="end">0.8</text>
  <line x1="152" y1="150" x2="760" y2="150" class="grid"/>
  <text x="140" y="155" class="s" text-anchor="end">0.9</text>

  <text x="72" y="345" class="b" transform="rotate(-90 72 345)" text-anchor="middle">ROC-AUC</text>

  <!-- four condition groups; centers 260, 420, 580, 700 -->
  <!-- within each group three markers offset -32,0,+32 for position(blue) motion(orange) mix(violet) -->

  <!-- ===== Group 1: PD vs myo (PRIMARY) center 260 ===== -->
  <line x1="228" y1="423" x2="228" y2="314" class="ci" stroke="#2f6f99"/>
  <circle cx="228" cy="368" r="6" fill="#2f6f99"/>
  <line x1="260" y1="329" x2="260" y2="228" class="ci" stroke="#e07a4b"/>
  <circle cx="260" cy="275" r="6" fill="#e07a4b"/>
  <line x1="292" y1="314" x2="292" y2="222" class="ci" stroke="#8a6fb3"/>
  <circle cx="292" cy="267" r="6" fill="#8a6fb3"/>

  <!-- ===== Group 2: Stroke vs myo center 420 ===== -->
  <line x1="388" y1="437" x2="388" y2="361" class="ci" stroke="#2f6f99"/>
  <circle cx="388" cy="384" r="6" fill="#2f6f99"/>
  <line x1="420" y1="361" x2="420" y2="243" class="ci" stroke="#e07a4b"/>
  <circle cx="420" cy="298" r="6" fill="#e07a4b"/>
  <line x1="452" y1="353" x2="452" y2="235" class="ci" stroke="#8a6fb3"/>
  <circle cx="452" cy="298" r="6" fill="#8a6fb3"/>

  <!-- ===== Group 3: PD+stroke pooled center 580 ===== -->
  <line x1="548" y1="399" x2="548" y2="322" class="ci" stroke="#2f6f99"/>
  <circle cx="548" cy="361" r="6" fill="#2f6f99"/>
  <line x1="580" y1="314" x2="580" y2="222" class="ci" stroke="#e07a4b"/>
  <circle cx="580" cy="259" r="6" fill="#e07a4b"/>
  <line x1="612" y1="306" x2="612" y2="214" class="ci" stroke="#8a6fb3"/>
  <circle cx="612" cy="251" r="6" fill="#8a6fb3"/>

  <!-- ===== Group 4: normal vs abnormal (confounded) center 700 ===== -->
  <line x1="668" y1="423" x2="668" y2="243" class="ci" stroke="#2f6f99"/>
  <circle cx="668" cy="337" r="6" fill="#2f6f99"/>
  <line x1="700" y1="415" x2="700" y2="235" class="ci" stroke="#e07a4b"/>
  <circle cx="700" cy="322" r="6" fill="#e07a4b"/>
  <line x1="732" y1="408" x2="732" y2="235" class="ci" stroke="#8a6fb3"/>
  <circle cx="732" cy="322" r="6" fill="#8a6fb3"/>

  <!-- group labels below axis -->
  <text x="260" y="562" class="s" text-anchor="middle">PD vs myo</text>
  <text x="260" y="584" class="s" text-anchor="middle">(primary)</text>
  <text x="420" y="562" class="s" text-anchor="middle">stroke vs</text>
  <text x="420" y="584" class="s" text-anchor="middle">myo</text>
  <text x="580" y="562" class="s" text-anchor="middle">PD+stroke</text>
  <text x="580" y="584" class="s" text-anchor="middle">vs myo+CP</text>
  <text x="700" y="562" class="s" text-anchor="middle">normal vs</text>
  <text x="700" y="584" class="s" text-anchor="middle">abnormal*</text>

  <!-- ================= LEGEND (empty lower area of plot, below chance line) ================= -->
  <rect x="176" y="472" width="470" height="60" rx="16" fill="#ffffff" class="axis" stroke-width="1.75"/>
  <circle cx="200" cy="494" r="6" fill="#2f6f99"/>
  <text x="218" y="499" class="s">Position energy: where a joint is</text>
  <circle cx="200" cy="516" r="6" fill="#e07a4b"/>
  <text x="218" y="521" class="s">Motion energy: how it changes slot to slot</text>
  <circle cx="470" cy="494" r="6" fill="#8a6fb3"/>
  <text x="488" y="499" class="s">Fixed mix: a</text>
  <text x="488" y="521" class="s">blend of both</text>

  <!-- ================= SHUFFLED-MOTION CONTROL LANE ================= -->
  <text x="856" y="134" class="t">Control lane</text>
  <line x1="912" y1="150" x2="912" y2="540" class="axis"/>
  <line x1="912" y1="540" x2="1080" y2="540" class="grid"/>
  <text x="900" y="545" class="s" text-anchor="end">0.4</text>
  <line x1="912" y1="462" x2="1080" y2="462" class="chance"/>
  <text x="900" y="467" class="s" text-anchor="end">0.5</text>
  <line x1="912" y1="306" x2="1080" y2="306" class="grid"/>
  <text x="900" y="311" class="s" text-anchor="end">0.7</text>
  <line x1="912" y1="150" x2="1080" y2="150" class="grid"/>
  <text x="900" y="155" class="s" text-anchor="end">0.9</text>

  <!-- real motion reference (faint) high above chance -->
  <circle cx="996" cy="259" r="6" fill="#e07a4b" opacity="0.35"/>
  <text x="1016" y="255" class="s">real motion</text>
  <text x="1016" y="277" class="s">(for contrast)</text>

  <!-- reading arrow: control must fall back to chance -->
  <path d="M996 300V430" class="a"/>
  <text x="1016" y="360" class="s">must drop</text>
  <text x="1016" y="382" class="s">to chance</text>

  <!-- shuffled-motion energy hugs chance ~0.51 -->
  <line x1="996" y1="493" x2="996" y2="450" class="ci" stroke="#e07a4b"/>
  <circle cx="996" cy="470" r="6" fill="#e07a4b"/>
  <text x="1016" y="500" class="s">shuffled</text>
  <text x="1016" y="522" class="s">motion</text>

  <text x="996" y="562" class="s" text-anchor="middle">time-permuted</text>
  <text x="996" y="584" class="s" text-anchor="middle">slots</text>

  <!-- expected ordering call-out banner (own full-width row) -->
  <rect x="152" y="594" width="1000" height="50" rx="16" fill="#20364e"/>
  <text x="176" y="618" class="w">Expected ordering: motion and mix sit above position on the matched contrasts</text>
  <text x="176" y="638" class="ws">Primary endpoint: motion AUC minus position AUC, sign-consistent across a majority of sources</text>

  <!-- footer -->
  <text x="48" y="668" class="s">*normal-vs-abnormal is secondary and confounded: 1 normal source (3KnFt8bH3tE), augmented-vs-canonical pathway. Folder labels are dataset annotations, not diagnoses.</text>
</svg>
