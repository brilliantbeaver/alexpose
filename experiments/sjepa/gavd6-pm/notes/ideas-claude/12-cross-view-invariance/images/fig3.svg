<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t3 d3">
  <title id="t3">The whole idea: turning the camera is fine, mirroring the walker is not</title>
  <desc id="d3">A beginner concept diagram. A single walker stands in the middle while a camera moves around an arc. A small label view_delta marks how far the camera turned. One green path says the model is told how far the camera moved and predicts the walk from the new angle, which is allowed. A second path shows a left-right mirror image with a red no-flip stamp, because a mirror swaps the weak side and is forbidden. The one rule: view can rotate, left and right must never swap.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
    <style>
      .h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:32px;fill:#0f2440;}
      .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;fill:#0f2440;}
      .b{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#33475e;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5c6f84;}
      .w{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;fill:#ffffff;}
      .ws{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#cdd8e4;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="60" class="h">The one rule: turn the camera, never mirror the walker</text>
  <text x="48" y="88" class="s">A gentle picture of the whole idea. Moving the camera is allowed; swapping left and right is not.</text>

  <!-- ============ LEFT: the scene card (camera arc around a walker) ============ -->
  <!-- card: x 48..584, y 120..556 (height 436) -->
  <rect x="48" y="120" width="536" height="436" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text x="78" y="156" class="t">Same walk, different camera angle</text>

  <!-- walker in the middle: simple stick figure, LEFT leg marked -->
  <!-- center of walker at (316, 360) -->
  <g stroke="#20364e" stroke-width="3.5" fill="none" stroke-linecap="round">
    <!-- head -->
    <circle cx="316" cy="300" r="16" fill="#ffffff"/>
    <!-- torso -->
    <line x1="316" y1="316" x2="316" y2="378"/>
    <!-- arms -->
    <line x1="316" y1="332" x2="292" y2="360"/>
    <line x1="316" y1="332" x2="340" y2="360"/>
    <!-- right leg (walker's right, on our left) -->
    <line x1="316" y1="378" x2="300" y2="424"/>
    <!-- left leg (walker's left, on our right) marked warm -->
  </g>
  <!-- left leg drawn warm to show the weak side -->
  <line x1="316" y1="378" x2="332" y2="424" stroke="#e07a4b" stroke-width="4" stroke-linecap="round"/>
  <text x="316" y="452" class="s" text-anchor="middle">walker (left leg shown in orange)</text>

  <!-- camera arc around the walker -->
  <path d="M 150 360 A 166 166 0 0 1 482 360" fill="none" stroke="#5f9e7e" stroke-width="2.5" stroke-dasharray="7 6"/>
  <!-- camera at start (left) -->
  <rect x="132" y="346" width="34" height="26" rx="5" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <circle cx="149" cy="359" r="6" fill="#2f6f99" stroke="#20364e" stroke-width="1.25"/>
  <text x="149" y="392" class="s" text-anchor="middle">front</text>
  <!-- camera at end (right) -->
  <rect x="466" y="346" width="34" height="26" rx="5" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <circle cx="483" cy="359" r="6" fill="#2f6f99" stroke="#20364e" stroke-width="1.25"/>
  <text x="483" y="392" class="s" text-anchor="middle">side</text>

  <!-- view_delta label on the arc, in clear space above the walker's head -->
  <text x="316" y="228" class="b" text-anchor="middle" fill="#2f6f99">view_delta = how far</text>
  <text x="316" y="252" class="b" text-anchor="middle" fill="#2f6f99">the camera turned</text>

  <!-- ============ RIGHT COLUMN: two paths ============ -->

  <!-- allowed path card (green): x 640..1152, y 120..332 (height 212) -->
  <rect x="640" y="120" width="512" height="212" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/>
  <text x="670" y="156" class="t">Allowed: turn the camera</text>
  <text x="670" y="192" class="b">Tell the model how far the camera turned</text>
  <text x="670" y="216" class="b">(the view_delta). Ask it to predict the same</text>
  <text x="670" y="240" class="b">walk from the new angle. Left and right stay</text>
  <text x="670" y="264" class="b">put, so the weak side is still the weak side.</text>
  <!-- green OK stamp -->
  <circle cx="1096" cy="300" r="20" fill="#5f9e7e" stroke="#20364e" stroke-width="1.75"/>
  <path d="M 1086 300 L 1093 308 L 1107 292" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="670" y="304" class="s">Camera angle should not change the walk.</text>

  <!-- forbidden path card (warm sand): x 640..1152, y 388..556 (height 168), gap 332->388 = 56 -->
  <rect x="640" y="388" width="512" height="168" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="670" y="424" class="t">Forbidden: mirror the walker</text>
  <text x="670" y="460" class="b">A left-right mirror swaps the legs, so a</text>
  <text x="670" y="484" class="b">left-weak walker looks right-weak. That</text>
  <text x="670" y="508" class="b">erases the exact clue doctors care about.</text>
  <!-- red no-flip stamp -->
  <circle cx="1096" cy="470" r="22" fill="none" stroke="#a44c26" stroke-width="4"/>
  <line x1="1081" y1="455" x2="1111" y2="485" stroke="#a44c26" stroke-width="4" stroke-linecap="round"/>
  <text x="1096" y="530" class="s" text-anchor="middle" fill="#a44c26">no flip</text>

  <!-- arrow from scene card to allowed path (clear horizontal run in the gap) -->
  <line x1="600" y1="226" x2="628" y2="226" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- arrow from scene card to forbidden path -->
  <line x1="600" y1="460" x2="628" y2="460" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Footer note -->
  <text x="48" y="600" class="s">The model treats the camera angle like an instruction it can follow. Mirroring is banned because it swaps the affected side.</text>
  <text x="48" y="628" class="s">Folder labels are dataset annotations, not diagnoses. Skeletons hide the face and clothing.</text>
</svg>
