<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#fbfcfe"/>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #10233f; }
    .big { font: 700 58px Arial, sans-serif; fill: #10233f; }
    .head { font: 700 24px Arial, sans-serif; fill: #10233f; }
    .body { font: 20px Arial, sans-serif; fill: #334e68; }
    .small { font: 17px Arial, sans-serif; fill: #526575; }
  </style>
  <text x="600" y="54" text-anchor="middle" class="title">Two cohorts reached the final curriculum</text>

  <rect x="45" y="105" width="390" height="400" rx="24" fill="#e8f1fa" stroke="#40566d" stroke-width="3"/>
  <text x="240" y="155" text-anchor="middle" class="head">Canonical GAVD cohort</text>
  <text x="240" y="235" text-anchor="middle" class="big">96</text>
  <text x="240" y="268" text-anchor="middle" class="body">annotated sequences</text>
  <text x="240" y="326" text-anchor="middle" class="big">18</text>
  <text x="240" y="359" text-anchor="middle" class="body">source videos</text>
  <text x="80" y="410" class="small">12 normal, 9 Parkinson's</text>
  <text x="80" y="440" class="small">12 stroke, 47 myopathic</text>
  <text x="80" y="470" class="small">16 cerebral palsy</text>

  <text x="476" y="320" text-anchor="middle" class="big">+</text>

  <rect x="515" y="105" width="300" height="400" rx="24" fill="#fff2cc" stroke="#40566d" stroke-width="3"/>
  <text x="665" y="155" text-anchor="middle" class="head">Added normal cohort</text>
  <text x="665" y="235" text-anchor="middle" class="big">63</text>
  <text x="665" y="268" text-anchor="middle" class="body">usable sequences</text>
  <text x="665" y="326" text-anchor="middle" class="big">17</text>
  <text x="665" y="359" text-anchor="middle" class="body">additional videos</text>
  <text x="665" y="412" text-anchor="middle" class="small">Self-annotated windows</text>
  <text x="665" y="442" text-anchor="middle" class="small">Automatic MediaPipe boxes</text>
  <text x="665" y="472" text-anchor="middle" class="small">1 low-coverage window excluded</text>

  <text x="858" y="320" text-anchor="middle" class="big">=</text>

  <rect x="900" y="105" width="255" height="400" rx="24" fill="#e2f0d9" stroke="#40566d" stroke-width="3"/>
  <text x="1028" y="155" text-anchor="middle" class="head">Final curriculum</text>
  <text x="1028" y="235" text-anchor="middle" class="big">159</text>
  <text x="1028" y="268" text-anchor="middle" class="body">sequences</text>
  <text x="1028" y="326" text-anchor="middle" class="big">35</text>
  <text x="1028" y="359" text-anchor="middle" class="body">source videos</text>
  <text x="1028" y="412" text-anchor="middle" class="small">75 normal / 18 videos</text>
  <text x="1028" y="442" text-anchor="middle" class="small">84 abnormal / 17 videos</text>
  <text x="1028" y="472" text-anchor="middle" class="small">Five folder labels</text>

  <rect x="180" y="555" width="840" height="70" rx="18" fill="#fde9d9" stroke="#b55a30" stroke-width="2"/>
  <text x="600" y="584" text-anchor="middle" class="head">A sequence count is not an independence count.</text>
  <text x="600" y="611" text-anchor="middle" class="small">Several windows can come from one upload, person, camera, and background.</text>
</svg>
