<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#fbfcfe"/>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #10233f; }
    .head { font: 700 24px Arial, sans-serif; fill: #10233f; }
    .big { font: 700 48px Arial, sans-serif; fill: #10233f; }
    .body { font: 18px Arial, sans-serif; fill: #334e68; }
    .small { font: 16px Arial, sans-serif; fill: #334e68; }
    .warn { font: 700 18px Arial, sans-serif; fill: #a33a2b; }
  </style>
  <text x="600" y="52" text-anchor="middle" class="title">The scores are useful readouts, not held-out clinical performance</text>
  <g>
    <rect x="40" y="105" width="350" height="430" rx="24" fill="#e8f1fa" stroke="#40566d" stroke-width="3"/>
    <text x="215" y="152" text-anchor="middle" class="head">All-96 stratified</text>
    <text x="135" y="235" text-anchor="middle" class="big">75.9%</text>
    <text x="135" y="268" text-anchor="middle" class="body">accuracy</text>
    <text x="295" y="235" text-anchor="middle" class="big">80.3%</text>
    <text x="295" y="268" text-anchor="middle" class="body">macro-F1</text>
    <text x="215" y="332" text-anchor="middle" class="body">Missingness only: 48.3%</text>
    <text x="215" y="380" text-anchor="middle" class="warn">16 videos cross the split</text>
    <text x="215" y="416" text-anchor="middle" class="warn">29 / 29 test rows exposed</text>
    <text x="215" y="480" text-anchor="middle" class="body">Five-class descriptive readout</text>
  </g>
  <g>
    <rect x="425" y="105" width="350" height="430" rx="24" fill="#fff2cc" stroke="#40566d" stroke-width="3"/>
    <text x="600" y="152" text-anchor="middle" class="head">Exact exp5 comparison</text>
    <text x="520" y="225" text-anchor="middle" class="big">85.7%</text>
    <text x="520" y="258" text-anchor="middle" class="body">accuracy</text>
    <text x="680" y="225" text-anchor="middle" class="big">88.1%</text>
    <text x="680" y="258" text-anchor="middle" class="body">macro-F1</text>
    <text x="600" y="322" text-anchor="middle" class="body">Handcrafted reference: 76.2% accuracy</text>
    <text x="600" y="352" text-anchor="middle" class="body">Handcrafted macro-F1: 72.8%</text>
    <text x="600" y="404" text-anchor="middle" class="warn">9 videos cross the split</text>
    <text x="600" y="440" text-anchor="middle" class="warn">21 / 21 test rows exposed</text>
    <text x="600" y="490" text-anchor="middle" class="body">Different pose and feature systems</text>
  </g>
  <g>
    <rect x="810" y="105" width="350" height="430" rx="24" fill="#fce4d6" stroke="#40566d" stroke-width="3"/>
    <text x="985" y="152" text-anchor="middle" class="head">Video-group RF stress test</text>
    <text x="905" y="225" text-anchor="middle" class="big">78.0%</text>
    <text x="905" y="258" text-anchor="middle" class="body">binary accuracy</text>
    <text x="1065" y="225" text-anchor="middle" class="big">74.9%</text>
    <text x="1065" y="258" text-anchor="middle" class="body">binary macro-F1</text>
    <text x="985" y="306" text-anchor="middle" class="body">Five-class 2-fold mean</text>
    <text x="985" y="334" text-anchor="middle" class="small">61.4% acc / 61.5% balanced</text>
    <text x="985" y="360" text-anchor="middle" class="small">61.5% fixed-label macro-F1</text>
    <text x="985" y="390" text-anchor="middle" class="small">Pooled OOF: 61.6% acc / 61.3% balanced</text>
    <text x="985" y="416" text-anchor="middle" class="small">61.0% fixed-label macro-F1</text>
    <text x="985" y="454" text-anchor="middle" class="warn">Full-corpus encoder reused</text>
    <text x="985" y="482" text-anchor="middle" class="warn">159 / 159 rows exposed</text>
    <text x="985" y="516" text-anchor="middle" class="small">Not an independent-video estimate</text>
  </g>
  <text x="600" y="605" text-anchor="middle" class="head">The next experiment must retrain the encoder inside each outer video fold.</text>
</svg>
