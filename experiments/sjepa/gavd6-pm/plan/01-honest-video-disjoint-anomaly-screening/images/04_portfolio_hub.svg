<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One split and checkpoint reused by six other ideas</title>
  <desc id="desc">This proposal, Idea 1, is the only one of seven that builds the source-video-disjoint split and reuses the frozen Stage 0 checkpoint from scratch. Ideas 2 through 7 each cite this split instead of deriving their own.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .ws{font:14px Arial,Helvetica,sans-serif;fill:#cdd8e4}
</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" fill="#20364e"/>
    </marker>

  </defs>
  <rect class="bg" width="1200" height="720"/>
<text class="h" x="48" y="76">One split and checkpoint, reused by six other ideas</text>
<text class="s" x="48" y="100">This proposal is Idea 1: the only one that builds the video-disjoint split from scratch.</text>
<rect x="48" y="260" width="260" height="200" rx="16" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.75"/>
<text class="t" x="70" y="298">Reusable artifact</text>
<text class="b" x="70" y="328">Video-disjoint split</text>
<text class="b" x="70" y="356">Reused frozen checkpoint</text>
<text class="b" x="70" y="384">Cited by ideas 2 to 7</text>
<rect x="420" y="150" width="206" height="140" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
<text class="t" x="442" y="188">Idea 2</text>
<text class="b" x="442" y="218">Threshold audit</text>
<line x1="308" y1="289" x2="404" y2="220" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="682" y="150" width="206" height="140" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
<text class="t" x="704" y="188">Idea 3</text>
<text class="b" x="704" y="218">Effective rank</text>
<line x1="308" y1="317" x2="666" y2="220" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="944" y="150" width="206" height="140" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
<text class="t" x="966" y="188">Idea 4</text>
<text class="b" x="966" y="218">Motion vs position</text>
<line x1="308" y1="346" x2="928" y2="220" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="420" y="390" width="206" height="140" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
<text class="t" x="442" y="428">Idea 5</text>
<text class="b" x="442" y="458">Readout diagnostic</text>
<line x1="308" y1="374" x2="404" y2="460" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="682" y="390" width="206" height="140" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
<text class="t" x="704" y="428">Idea 6</text>
<text class="b" x="704" y="458">Visibility confound</text>
<line x1="308" y1="403" x2="666" y2="460" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="944" y="390" width="206" height="140" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
<text class="t" x="966" y="428">Idea 7</text>
<text class="b" x="966" y="458">Viewpoint audit</text>
<line x1="308" y1="431" x2="928" y2="460" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text class="s" x="48" y="630">Ideas 2 to 7 each cite plan/_shared/evaluation-contract.md and this split rather than deriving their own.</text>
</svg>
