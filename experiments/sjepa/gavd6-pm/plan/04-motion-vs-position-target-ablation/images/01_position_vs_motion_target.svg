<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Two ways to ask what a hidden joint did</title>
  <desc>Side by side comparison of the current S-JEPA prediction target, a position-patch latent describing where a joint was, against the proposed ablation target, a motion-patch latent describing how the joint moved between frames. Only the target encoder's input changes; the rest of the pipeline is identical.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#20364e"/>
    </marker>
    <style>
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .box{stroke:#20364e;stroke-width:1.75}
      .a{stroke:#20364e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="64" y="58" class="h">Two ways to ask what a hidden joint did</text>
  <text x="64" y="88" class="s">Same input, same encoder family; only the answer key changes from a pose to a movement.</text>

  <!-- Column A: current, position target -->
  <text x="88" y="128" class="t">Current S-JEPA: predict WHERE</text>

  <rect x="88" y="150" width="472" height="84" rx="16" fill="#e7f0f8" class="box"/>
  <text x="112" y="182" class="t">Raw joint coordinates</text>
  <text x="112" y="209" class="b">(x, y, z) for every frame, every joint</text>

  <path d="M324 234V259" class="a"/>

  <rect x="88" y="259" width="472" height="84" rx="16" fill="#f7e7d8" class="box"/>
  <text x="112" y="291" class="t">Position patch</text>
  <text x="112" y="318" class="b">one joint across 4 frames, coordinates only</text>

  <path d="M324 343V368" class="a"/>

  <rect x="88" y="368" width="472" height="84" rx="16" fill="#e6f2ea" class="box"/>
  <text x="112" y="400" class="t">Target encoder latent</text>
  <text x="112" y="427" class="b">summarizes a static pose window</text>

  <path d="M324 452V477" class="a"/>

  <rect x="88" y="477" width="472" height="84" rx="16" fill="#ece6f6" class="box"/>
  <text x="112" y="509" class="t">Predictor's guess</text>
  <text x="112" y="536" class="b">rewards memorizing plausible poses</text>

  <!-- Divider -->
  <line x1="600" y1="130" x2="600" y2="561" stroke="#c4cdd8" stroke-width="1.5"/>

  <!-- Column B: proposed, motion target -->
  <text x="648" y="128" class="t">Proposed: predict HOW IT MOVED</text>

  <rect x="648" y="150" width="472" height="84" rx="16" fill="#e7f0f8" class="box"/>
  <text x="672" y="182" class="t">Raw joint coordinates</text>
  <text x="672" y="209" class="b">the same (x, y, z) input, same joints</text>

  <path d="M884 234V259" class="a"/>

  <rect x="648" y="259" width="472" height="84" rx="16" fill="#f7e7d8" class="box"/>
  <text x="672" y="291" class="t">Motion patch</text>
  <text x="672" y="318" class="b">frame-to-frame difference within the patch</text>

  <path d="M884 343V368" class="a"/>

  <rect x="648" y="368" width="472" height="84" rx="16" fill="#e6f2ea" class="box"/>
  <text x="672" y="400" class="t">Target encoder latent</text>
  <text x="672" y="427" class="b">summarizes a movement window</text>

  <path d="M884 452V477" class="a"/>

  <rect x="648" y="477" width="472" height="84" rx="16" fill="#ece6f6" class="box"/>
  <text x="672" y="509" class="t">Predictor's guess</text>
  <text x="672" y="536" class="b">rewards tracking real dynamics</text>

  <!-- Bottom banner -->
  <rect x="88" y="601" width="1032" height="56" rx="16" fill="#20364e"/>
  <text x="112" y="624" class="w">Only the target encoder's input changes.</text>
  <text x="112" y="646" class="w" style="font:400 14px Arial,Helvetica,sans-serif;fill:#cdd8e4">View encoder, masking rule, VICReg weight, and the five-stage curriculum stay identical.</text>
</svg>
