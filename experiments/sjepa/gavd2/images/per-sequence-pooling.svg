<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="sans-serif">
  <defs>
    <marker id="psArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="460" fill="#ffffff"/>
  <text x="470" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Per-sequence pooling: one vector per sequence, then the probe</text>
  <text x="470" y="57" font-size="12.5" text-anchor="middle" fill="#475569">Average the per-window embeddings of a sequence into a single D-dim vector. This is exp5's unit and the honest evaluation unit.</text>

  <!-- ============ Left: 7 window embeddings ============ -->
  <text x="180" y="106" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">7 window embeddings</text>
  <text x="180" y="124" font-size="11" text-anchor="middle" fill="#475569">one per overlapping window</text>

  <!-- Stack of blue squares, each with a "D" label -->
  <g>
    <rect x="130" y="150" width="100" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="180" y="167" font-size="11" text-anchor="middle" fill="#1e3a8a">e_1 in R^D</text>
    <rect x="130" y="180" width="100" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="180" y="197" font-size="11" text-anchor="middle" fill="#1e3a8a">e_2 in R^D</text>
    <rect x="130" y="210" width="100" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="180" y="227" font-size="11" text-anchor="middle" fill="#1e3a8a">e_3 in R^D</text>
    <rect x="130" y="240" width="100" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="180" y="257" font-size="11" text-anchor="middle" fill="#1e3a8a">e_4 in R^D</text>
    <rect x="130" y="270" width="100" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="180" y="287" font-size="11" text-anchor="middle" fill="#1e3a8a">e_5 in R^D</text>
    <rect x="130" y="300" width="100" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="180" y="317" font-size="11" text-anchor="middle" fill="#1e3a8a">e_6 in R^D</text>
    <rect x="130" y="330" width="100" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="180" y="347" font-size="11" text-anchor="middle" fill="#1e3a8a">e_7 in R^D</text>
  </g>

  <!-- Bracket / brace connecting the 7 to the mean node -->
  <line x1="240" y1="252" x2="290" y2="252" stroke="#334155" stroke-width="1.5" marker-end="url(#psArrow)"/>

  <!-- ============ Middle: mean node ============ -->
  <rect x="295" y="216" width="140" height="72" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="365" y="244" font-size="14" font-weight="bold" text-anchor="middle" fill="#5b21b6">mean-pool</text>
  <text x="365" y="264" font-size="11" text-anchor="middle" fill="#334155">average over the</text>
  <text x="365" y="280" font-size="11" text-anchor="middle" fill="#334155">7 window vectors</text>

  <!-- arrow to the pooled vector -->
  <line x1="435" y1="252" x2="485" y2="252" stroke="#334155" stroke-width="1.5" marker-end="url(#psArrow)"/>

  <!-- ============ Middle right: pooled vector ============ -->
  <rect x="490" y="228" width="150" height="50" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="565" y="250" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">e_seq in R^D</text>
  <text x="565" y="266" font-size="10.5" text-anchor="middle" fill="#475569">one vector per sequence</text>

  <!-- arrow to probe -->
  <line x1="640" y1="252" x2="690" y2="252" stroke="#334155" stroke-width="1.5" marker-end="url(#psArrow)"/>

  <!-- ============ Right: probe ============ -->
  <rect x="695" y="216" width="140" height="72" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="765" y="244" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">linear probe</text>
  <text x="765" y="264" font-size="11" text-anchor="middle" fill="#334155">5-class softmax</text>
  <text x="765" y="280" font-size="11" text-anchor="middle" fill="#334155">on e_seq</text>

  <!-- ============ Bottom caption ============ -->
  <rect x="90" y="380" width="760" height="52" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="470" y="404" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">mean-pool windows within a sequence -&gt; one D-dim vector per sequence (exp5's unit)</text>
  <text x="470" y="422" font-size="11" text-anchor="middle" fill="#475569">The Random Forest baseline also predicts once per sequence; matching this unit makes the two systems directly comparable.</text>
</svg>
