<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <!-- Title + subtitle -->
  <text x="480" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">RQ3: does the frozen embedding preserve the axes clinicians care about?</text>
  <text x="480" y="57" font-size="13" text-anchor="middle" fill="#475569">A good encoder should separate conditions along asymmetry and step amplitude, the directions a linear probe can read out.</text>

  <!-- ================= representation-space panel (left) ================= -->
  <!-- plot frame -->
  <rect x="70" y="86" width="470" height="290" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="305" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Representation space (2D view of the frozen embedding)</text>

  <!-- axes: origin near lower-left -->
  <!-- x axis: step amplitude, y axis: asymmetry -->
  <line x1="110" y1="350" x2="510" y2="350" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="350" x2="110" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- axis labels (each in its own clear space) -->
  <text x="320" y="372" font-size="12.5" text-anchor="middle" fill="#334155">step amplitude axis (mean ankle swing range)</text>
  <text x="96" y="240" font-size="12.5" text-anchor="middle" fill="#334155" transform="rotate(-90 96 240)">asymmetry axis (left vs right leg swing)</text>

  <!-- normal blob: high step amplitude, low asymmetry (lower-right) -->
  <ellipse cx="430" cy="315" rx="46" ry="30" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <circle cx="416" cy="308" r="4" fill="#15803d"/>
  <circle cx="440" cy="320" r="4" fill="#15803d"/>
  <circle cx="428" cy="326" r="4" fill="#15803d"/>
  <circle cx="446" cy="304" r="4" fill="#15803d"/>
  <text x="430" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">normal</text>

  <!-- parkinsons blob: low step amplitude, medium asymmetry (mid-left) -->
  <ellipse cx="200" cy="235" rx="46" ry="30" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="188" cy="228" r="4" fill="#7c3aed"/>
  <circle cx="210" cy="240" r="4" fill="#7c3aed"/>
  <circle cx="198" cy="246" r="4" fill="#7c3aed"/>
  <circle cx="216" cy="226" r="4" fill="#7c3aed"/>
  <text x="200" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="#5b21b6">parkinsons</text>

  <!-- stroke blob: medium step amplitude, high asymmetry (upper) -->
  <ellipse cx="320" cy="170" rx="46" ry="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="308" cy="164" r="4" fill="#b91c1c"/>
  <circle cx="330" cy="176" r="4" fill="#b91c1c"/>
  <circle cx="318" cy="182" r="4" fill="#b91c1c"/>
  <circle cx="336" cy="160" r="4" fill="#b91c1c"/>
  <text x="320" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">stroke</text>

  <!-- ================= clinical-fact callouts (right) ================= -->
  <text x="588" y="108" font-size="13" font-weight="bold" text-anchor="start" fill="#0f172a">Verified clinical grounding</text>

  <!-- stroke callout -->
  <rect x="588" y="122" width="330" height="104" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="606" y="146" font-size="13" font-weight="bold" text-anchor="start" fill="#7f1d1d">stroke</text>
  <text x="606" y="168" font-size="11" text-anchor="start" fill="#334155">knee_asymmetry is graded High priority:</text>
  <text x="606" y="185" font-size="11" text-anchor="start" fill="#334155">stiff-knee gait from unilateral weakening,</text>
  <text x="606" y="202" font-size="11" text-anchor="start" fill="#334155">about 17 degrees of knee-flexion difference</text>
  <text x="606" y="219" font-size="11" text-anchor="start" fill="#334155">can signal it.</text>

  <!-- parkinsons callout -->
  <rect x="588" y="238" width="330" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="606" y="262" font-size="13" font-weight="bold" text-anchor="start" fill="#5b21b6">parkinsons</text>
  <text x="606" y="284" font-size="11" text-anchor="start" fill="#334155">hip and ankle asymmetry graded Medium:</text>
  <text x="606" y="301" font-size="11" text-anchor="start" fill="#334155">the disease often begins on one side, so</text>
  <text x="606" y="318" font-size="11" text-anchor="start" fill="#334155">posture turns asymmetric. No single</text>
  <text x="606" y="335" font-size="11" text-anchor="start" fill="#334155">universal numeric threshold.</text>

  <!-- connector arrows from blobs to callouts -->
  <line x1="366" y1="165" x2="588" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="246" y1="235" x2="588" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= footer ================= -->
  <line x1="70" y1="392" x2="918" y2="392" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="412" font-size="11.5" text-anchor="middle" fill="#334155">RQ3 fits tiny LINEAR probes to these linearly-decodable proxies; a positive R-squared means the axis survived pretraining.</text>
  <text x="480" y="430" font-size="11.5" text-anchor="middle" fill="#64748b">Penny Inouye's H/M/L feature mapping is what points the probes at clinically meaningful features.</text>
</svg>
