<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="360" fill="#ffffff"/>
  <text x="460" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">Dedup by video id, then download each unique clip once</text>
  <text x="460" y="54" font-size="12.5" text-anchor="middle" fill="#475569">Many sequences share one video, so the download list is shorter than the sequence list.</text>

  <!-- Left column: many sequences -->
  <text x="150" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Manifest sequences</text>
  <rect x="70" y="106" width="160" height="26" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="150" y="124" font-size="11" text-anchor="middle" fill="#334155">seq A -> video 1</text>
  <rect x="70" y="140" width="160" height="26" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="150" y="158" font-size="11" text-anchor="middle" fill="#334155">seq B -> video 1</text>
  <rect x="70" y="174" width="160" height="26" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="150" y="192" font-size="11" text-anchor="middle" fill="#334155">seq C -> video 2</text>
  <rect x="70" y="208" width="160" height="26" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="150" y="226" font-size="11" text-anchor="middle" fill="#334155">seq D -> video 2</text>
  <rect x="70" y="242" width="160" height="26" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="150" y="260" font-size="11" text-anchor="middle" fill="#334155">seq E -> video 3</text>

  <!-- Middle: dedup -->
  <rect x="360" y="150" width="150" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="435" y="182" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">dedup</text>
  <text x="435" y="202" font-size="11" text-anchor="middle" fill="#475569">by video id</text>

  <!-- Right: unique videos -->
  <text x="690" y="92" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Unique videos to fetch</text>
  <rect x="610" y="120" width="160" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="690" y="140" font-size="11" text-anchor="middle" fill="#334155">video 1  (cached ok)</text>
  <rect x="610" y="160" width="160" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="690" y="180" font-size="11" text-anchor="middle" fill="#334155">video 2  (downloaded)</text>
  <rect x="610" y="200" width="160" height="30" rx="5" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="690" y="220" font-size="11" text-anchor="middle" fill="#334155">video 3  (dead link)</text>

  <!-- arrows -->
  <line x1="230" y1="186" x2="360" y2="186" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="186" x2="610" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="460" y="304" font-size="12" text-anchor="middle" fill="#334155">Already-cached videos are skipped, so re-running resumes cleanly.</text>
  <text x="460" y="326" font-size="11.5" text-anchor="middle" fill="#94a3b8">A few dead or blocked links are expected; windowing with overlap makes up for them.</text>
</svg>
