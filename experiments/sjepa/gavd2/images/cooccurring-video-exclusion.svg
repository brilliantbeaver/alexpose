<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="sans-serif">
  <defs>
    <marker id="cvArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="cvArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
  <text x="470" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Video-level leakage control: exclude any source video that also produced a labelled sequence</text>
  <text x="470" y="57" font-size="12.5" text-anchor="middle" fill="#475569">A single YouTube video often feeds several sequences. If ANY of them is in the labelled holdout, the whole video is banned from pretraining.</text>

  <!-- ============ Source video icon (top center) ============ -->
  <g>
    <!-- video card -->
    <rect x="400" y="90" width="140" height="90" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <!-- play triangle -->
    <polygon points="455,120 455,150 485,135" fill="#334155"/>
    <text x="470" y="162" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">YouTube video</text>
    <text x="470" y="176" font-size="10.5" text-anchor="middle" fill="#64748b">source id: XyZ...</text>
  </g>

  <!-- ============ Two sequences: A (labelled, held-out) and B (unlabelled) ============ -->
  <!-- Sequence A - labelled, red -->
  <rect x="120" y="230" width="260" height="90" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="250" y="256" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">seq A: held-out labelled sequence</text>
  <text x="250" y="278" font-size="11" text-anchor="middle" fill="#334155">one of the 68 the probe will test on</text>
  <!-- mini windows -->
  <g>
    <rect x="150" y="288" width="30" height="14" rx="2" fill="#fecaca" stroke="#b91c1c"/>
    <rect x="184" y="288" width="30" height="14" rx="2" fill="#fecaca" stroke="#b91c1c"/>
    <rect x="218" y="288" width="30" height="14" rx="2" fill="#fecaca" stroke="#b91c1c"/>
    <rect x="252" y="288" width="30" height="14" rx="2" fill="#fecaca" stroke="#b91c1c"/>
    <rect x="286" y="288" width="30" height="14" rx="2" fill="#fecaca" stroke="#b91c1c"/>
    <text x="250" y="315" font-size="10" text-anchor="middle" fill="#64748b">windows of seq A</text>
  </g>

  <!-- Sequence B - unlabelled, grey -->
  <rect x="560" y="230" width="260" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="690" y="256" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">seq B: unlabelled sequence</text>
  <text x="690" y="278" font-size="11" text-anchor="middle" fill="#475569">would-be pretraining sample</text>
  <g>
    <rect x="590" y="288" width="30" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="624" y="288" width="30" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="658" y="288" width="30" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="692" y="288" width="30" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="726" y="288" width="30" height="14" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="690" y="315" font-size="10" text-anchor="middle" fill="#64748b">windows of seq B</text>
  </g>

  <!-- arrows from source video to both sequences -->
  <line x1="440" y1="180" x2="280" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#cvArrow)"/>
  <line x1="500" y1="180" x2="660" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#cvArrow)"/>
  <text x="330" y="212" font-size="10.5" text-anchor="middle" fill="#64748b">crop A</text>
  <text x="610" y="212" font-size="10.5" text-anchor="middle" fill="#64748b">crop B</text>

  <!-- ============ Pretraining bank (bottom) ============ -->
  <rect x="120" y="380" width="700" height="90" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="470" y="406" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">JEPA pretraining bank (unlabelled windows)</text>
  <text x="470" y="424" font-size="11" text-anchor="middle" fill="#475569">the encoder learns here; never sees a label</text>

  <!-- ok arrow from an unrelated sequence (implicit) -->
  <text x="180" y="452" font-size="10.5" fill="#15803d">included: sequences whose source video is NOT in the held-out labelled set</text>

  <!-- Crossed-out arrow from seq B into the bank -->
  <line x1="690" y1="330" x2="620" y2="380" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#cvArrowRed)" opacity="0.85"/>
  <!-- red X across the arrow -->
  <line x1="632" y1="342" x2="672" y2="378" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
  <line x1="672" y1="342" x2="632" y2="378" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>

  <!-- exclusion label -->
  <rect x="700" y="336" width="220" height="42" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="810" y="354" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">excluded: same source video</text>
  <text x="810" y="370" font-size="11" text-anchor="middle" fill="#334155">as a held-out labelled sequence</text>

  <!-- Footer caption -->
  <text x="470" y="500" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">video-level leakage control, not just sequence-level.</text>
</svg>
