<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="sans-serif">
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>
  <text x="450" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">The honest gap: per-clip accuracy is inflated by window leakage</text>
  <text x="450" y="57" font-size="13" text-anchor="middle" fill="#475569">Same frozen encoder, same 42 labeled sequences, two ways of splitting. The rigorous split is the sequence-level one.</text>

  <!-- axes -->
  <line x1="120" y1="360" x2="820" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="120" y1="90" x2="120" y2="360" stroke="#334155" stroke-width="1.5"/>
  <!-- y ticks 0..1 -->
  <g font-size="11" fill="#475569" text-anchor="end">
    <text x="112" y="364">0.0</text><line x1="116" y1="360" x2="120" y2="360" stroke="#334155"/>
    <text x="112" y="297">0.25</text><line x1="116" y1="293" x2="120" y2="293" stroke="#94a3b8"/>
    <text x="112" y="230">0.50</text><line x1="116" y1="226" x2="120" y2="226" stroke="#94a3b8"/>
    <text x="112" y="163">0.75</text><line x1="116" y1="159" x2="120" y2="159" stroke="#94a3b8"/>
    <text x="112" y="96">1.00</text><line x1="116" y1="92" x2="120" y2="92" stroke="#94a3b8"/>
  </g>
  <text x="60" y="230" font-size="12" text-anchor="middle" fill="#1e3a8a" transform="rotate(-90 60 230)">5-class test accuracy</text>

  <!-- reference lines: chance 0.20 and baseline 0.76. y = 360 - value*268 -->
  <!-- chance 0.20 -> y=306.4 -->
  <line x1="120" y1="306" x2="820" y2="306" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="815" y="301" font-size="11" text-anchor="end" fill="#64748b">chance = 0.20</text>
  <!-- baseline 0.76 -> y=156.3 -->
  <line x1="120" y1="156" x2="820" y2="156" stroke="#b45309" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="815" y="151" font-size="11" text-anchor="end" fill="#b45309">prior baseline = 0.76 (per sequence)</text>

  <!-- Bar 1: per-clip 0.880 -> height 0.880*268=235.8, y=124.2 -->
  <rect x="210" y="124" width="150" height="236" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <!-- error bar +/-0.026 -> 7px -->
  <line x1="285" y1="117" x2="285" y2="131" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="278" y1="117" x2="292" y2="117" stroke="#1e3a8a" stroke-width="2"/>
  <line x1="278" y1="131" x2="292" y2="131" stroke="#1e3a8a" stroke-width="2"/>
  <text x="285" y="110" font-size="17" font-weight="bold" text-anchor="middle" fill="#1e3a8a">0.88</text>
  <text x="285" y="380" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">per-clip split</text>
  <text x="285" y="398" font-size="11.5" text-anchor="middle" fill="#b91c1c">window leakage (inflated)</text>
  <text x="285" y="414" font-size="11" text-anchor="middle" fill="#475569">what the notebook prints</text>

  <!-- Bar 2: per-sequence 0.494 -> height 0.494*268=132.4, y=227.6 -->
  <rect x="560" y="228" width="150" height="132" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <!-- error bar +/-0.172 -> 46px -->
  <line x1="635" y1="182" x2="635" y2="274" stroke="#5b21b6" stroke-width="2"/>
  <line x1="628" y1="182" x2="642" y2="182" stroke="#5b21b6" stroke-width="2"/>
  <line x1="628" y1="274" x2="642" y2="274" stroke="#5b21b6" stroke-width="2"/>
  <text x="635" y="220" font-size="17" font-weight="bold" text-anchor="middle" fill="#5b21b6">0.49</text>
  <text x="635" y="380" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">per-sequence split</text>
  <text x="635" y="398" font-size="11.5" text-anchor="middle" fill="#15803d">leakage-free (honest)</text>
  <text x="635" y="414" font-size="11" text-anchor="middle" fill="#475569">GroupShuffleSplit on 42 seqs</text>

  <!-- gap annotation -->
  <line x1="360" y1="124" x2="560" y2="124" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="360" y1="228" x2="560" y2="228" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="460" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">about 39 points</text>
  <text x="460" y="196" font-size="11" text-anchor="middle" fill="#475569">of the accuracy is leakage</text>
</svg>
