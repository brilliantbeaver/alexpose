<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc" font-family="Inter, Arial, sans-serif">
  <title id="title">Tensor shapes through the enhanced gait encoder</title>
  <desc id="desc">A skeleton clip is flattened into tokens, projected to 128 dimensions, tagged with time and joint positions, processed by four transformer layers, and mean pooled.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">Follow the tensor: from walking clip to one 128-number summary</text>
  <text x="600" y="70" text-anchor="middle" font-size="16" fill="#475569">A shape records how many items live along each axis.</text>

  <g stroke-width="2">
    <rect x="42" y="150" width="170" height="116" rx="14" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="262" y="150" width="170" height="116" rx="14" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="482" y="150" width="185" height="116" rx="14" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="717" y="125" width="205" height="166" rx="14" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="972" y="150" width="185" height="116" rx="14" fill="#dcfce7" stroke="#16a34a"/>
  </g>

  <g text-anchor="middle">
    <text x="127" y="180" font-size="18" font-weight="700" fill="#334155">Skeleton clip</text>
    <text x="127" y="214" font-size="21" font-weight="700" fill="#0f172a">[32, 33, 3]</text>
    <text x="127" y="240" font-size="13" fill="#64748b">frames, joints, xyz</text>

    <text x="347" y="180" font-size="18" font-weight="700" fill="#075985">Flatten tokens</text>
    <text x="347" y="214" font-size="21" font-weight="700" fill="#0c4a6e">[1,056, 3]</text>
    <text x="347" y="240" font-size="13" fill="#64748b">32 × 33 tokens</text>

    <text x="574" y="180" font-size="18" font-weight="700" fill="#1e3a8a">Input projection</text>
    <text x="574" y="214" font-size="21" font-weight="700" fill="#1e3a8a">[1,056, 128]</text>
    <text x="574" y="240" font-size="13" fill="#64748b">each token becomes wider</text>

    <text x="819" y="155" font-size="18" font-weight="700" fill="#5b21b6">Add position tags</text>
    <text x="819" y="184" font-size="13" fill="#6d28d9">time[t] + joint[j]</text>
    <rect x="752" y="203" width="134" height="42" rx="8" fill="#c4b5fd" stroke="#7c3aed"/>
    <text x="819" y="230" font-size="16" font-weight="700" fill="#4c1d95">4 transformer layers</text>
    <text x="819" y="270" font-size="14" fill="#64748b">shape stays [1,056, 128]</text>

    <text x="1064" y="180" font-size="18" font-weight="700" fill="#166534">Mean pool</text>
    <text x="1064" y="214" font-size="21" font-weight="700" fill="#14532d">[128]</text>
    <text x="1064" y="240" font-size="13" fill="#64748b">one clip embedding</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="212" y1="208" x2="252" y2="208"/>
    <line x1="432" y1="208" x2="472" y2="208"/>
    <line x1="667" y1="208" x2="707" y2="208"/>
    <line x1="922" y1="208" x2="962" y2="208"/>
  </g>

  <rect x="128" y="344" width="944" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="600" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">The position tags answer two questions for every token:</text>
  <text x="600" y="399" text-anchor="middle" font-size="15" fill="#475569">“Which frame am I from?” and “Which body joint am I?”</text>
</svg>
