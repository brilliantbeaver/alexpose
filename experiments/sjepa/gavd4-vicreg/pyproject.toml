[project]
name = "sjepa"
version = "0.2.0"
description = "Paper-aligned S-JEPA core tutorials for GAVD gait sequences"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "torch>=2.2",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "yt-dlp[default]>=2025.1.1",
  "opencv-python>=4.9",
  "mediapipe>=0.10.20,<1",
  "joblib>=1.4",
  "pyarrow>=15.0",
]

[tool.uv]
package = false
