   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="15.1236" y="25.193437" transform="rotate(-0 15.1236 25.193437)">Lane C improved because its evaluation definition was repaired</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="15.1236" y="38.0505" transform="rotate(-0 15.1236 38.0505)">The S-JEPA checkpoint and all 159 saved embeddings stayed fixed.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="20.67012" y="59.524359" transform="rotate(-0 20.67012 59.524359)">Superseded: 5 ordinary group folds</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 76.079445)">accuracy 0.604</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 83.919531)">balanced accuracy 0.595</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 92.227008)">macro-F1 0.407</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 97.8675)"/>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 107.283531)">One training fold had no cerebral-palsy rows.</text>
    <text style="font-size: 5.9px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 115.071531)">Macro-F1 label sets varied by fold.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #3977a8" x="203.3091" y="85.1625" transform="rotate(-0 203.3091 85.1625)">same encoder</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #3977a8" x="203.3091" y="93.4785" transform="rotate(-0 203.3091 93.4785)">new folds</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="250.45452" y="59.524359" transform="rotate(-0 250.45452 59.524359)">Corrected: 2 stratified group folds</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(250.45452 75.991141)">accuracy 0.653   (change +0.048)</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(250.45452 83.581141)">balanced accuracy 0.603   (change +0.008)</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(250.45452 91.171141)">macro-F1 0.625   (change +0.218)</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(250.45452 97.1745)"/>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(250.45452 106.351141)">Every train and test fold contains all five labels.</text>
    <text style="font-size: 5.75px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(250.45452 113.941141)">Macro-F1 always uses one fixed label order.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="15.1236" y="177.678" transform="rotate(-0 15.1236 177.678)">Why only two folds? Parkinson's and cerebral palsy have two source videos each. Two is the largest fold count that keeps every class on both sides.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="15.1236" y="195.3495" transform="rotate(-0 15.1236 195.3495)">What did not improve: the encoder was trained once on all 159 rows. Classifier-level video grouping does not create an independent encoder test.</text>
   </g>
  </g>
 </g>
