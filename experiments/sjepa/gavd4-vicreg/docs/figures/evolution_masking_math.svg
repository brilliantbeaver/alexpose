   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="15.1236" y="24.084637" transform="rotate(-0 15.1236 24.084637)">The current masking rule is constrained, uniform, and batch-safe</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="15.1236" y="35.2785" transform="rotate(-0 15.1236 35.2785)">The numbers in the middle card are a teaching example. Saved run values appear in the final card.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="20.67012" y="58.249239" transform="rotate(-0 20.67012 58.249239)">1. Build joint-time tokens</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 73.757175)">64 normalized frames</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 81.095925)">÷ 4 frames per patch</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 89.015925)">= 16 time patches</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 95.2803)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 104.855925)">16 x 33 joints</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 112.775925)">= 528 possible tokens</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 119.0403)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 128.615925)">All 33 identities may provide context.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 136.535925)">Only 12 may become targets.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="155.37132" y="58.249239" transform="rotate(-0 155.37132 58.249239)">2. Worked batch example</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 73.175925)">Valid eligible counts:</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 81.318112)">180, 160, 150, 175</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 87.3603)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 96.762956)">common target count</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 105.084206)">= floor(0.60 x 150)</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 112.775925)">= 90 tokens per sample</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 119.0403)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 129.197175)">realized fractions:</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(155.37132 136.758112)">0.500, 0.562, 0.600, 0.514</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="290.07252" y="58.249239" transform="rotate(-0 290.07252 58.249239)">3. What the run recorded</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 73.175925)">Stage 0 endpoint mean: 0.551</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 81.095925)">Stage 4 endpoint mean: 0.423</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 87.3603)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 96.935925)">A sample with more eligible tokens</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 104.855925)">gets a lower realized fraction.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 111.1203)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 120.695925)">Targets are drawn uniformly.</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 128.615925)">No velocity, displacement, or</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(290.07252 137.117175)">learned motion score is consulted.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="15.1236" y="178.06608" transform="rotate(-0 15.1236 178.06608)">This corrects the misleading shortcut phrase '60% of each sample.' The setting is applied once to the smallest eligible count in the batch.</text>
   </g>
  </g>
 </g>
