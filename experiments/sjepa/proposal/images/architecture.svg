<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">Gait-JEPA architecture</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">Predict hidden pose tokens in latent space, no pixels, no decoder</text>

  <!-- ===== Input pipeline column (left) ===== -->
  <!-- pose tensor -->
  <rect x="30" y="92" width="180" height="52" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Pose tensor</text>
  <text x="120" y="133" font-size="11" text-anchor="middle" fill="#334155">(T, 33, 3)  from BLAZEPOSE_33</text>

  <line x1="120" y1="144" x2="120" y2="168" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- normalize -->
  <rect x="30" y="168" width="180" height="52" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="191" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Normalize</text>
  <text x="120" y="209" font-size="11" text-anchor="middle" fill="#334155">pelvis-center, torso-scale</text>

  <line x1="120" y1="220" x2="120" y2="244" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tokenize -->
  <rect x="30" y="244" width="180" height="66" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="267" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Tokenize</text>
  <text x="120" y="285" font-size="11" text-anchor="middle" fill="#334155">lift 3 coords to width D</text>
  <text x="120" y="301" font-size="11" text-anchor="middle" fill="#334155">+ joint emb + time emb</text>

  <line x1="120" y1="310" x2="120" y2="334" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- block mask -->
  <rect x="30" y="334" width="180" height="66" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="120" y="357" font-size="13" font-weight="bold" text-anchor="middle" fill="#4c1d95">Block-mask</text>
  <text x="120" y="375" font-size="11" text-anchor="middle" fill="#334155">limb-over-time /</text>
  <text x="120" y="391" font-size="11" text-anchor="middle" fill="#334155">time-window blocks</text>

  <!-- split into VISIBLE / HIDDEN -->
  <!-- to visible (up) -->
  <path d="M210 360 L250 360 L250 168 L272 168" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- to hidden (down) -->
  <path d="M210 380 L250 380 L250 520 L272 520" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== TOP path: VISIBLE -> context encoder -> predictor ===== -->
  <!-- visible tokens tag -->
  <rect x="272" y="146" width="118" height="44" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="331" y="168" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">VISIBLE</text>
  <text x="331" y="183" font-size="11" text-anchor="middle" fill="#334155">tokens</text>

  <line x1="390" y1="168" x2="432" y2="168" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- context encoder -->
  <rect x="432" y="138" width="188" height="60" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="526" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Context encoder</text>
  <text x="526" y="178" font-size="10.5" text-anchor="middle" fill="#334155">factorized-attention</text>
  <text x="526" y="192" font-size="10.5" text-anchor="middle" fill="#334155">transformer (2-4 layers)</text>

  <line x1="620" y1="168" x2="662" y2="168" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="641" y="160" font-size="9.5" text-anchor="middle" fill="#64748b">context emb</text>

  <!-- predictor -->
  <rect x="662" y="138" width="150" height="60" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="737" y="163" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">Predictor</text>
  <text x="737" y="182" font-size="10.5" text-anchor="middle" fill="#334155">+ hidden positions</text>

  <!-- predicted target embeddings -> down into loss -->
  <line x1="737" y1="198" x2="737" y2="402" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="752" y="234" font-size="10" text-anchor="start" fill="#7c3aed">predicted</text>
  <text x="752" y="248" font-size="10" text-anchor="start" fill="#7c3aed">target emb</text>

  <!-- ===== BOTTOM path: HIDDEN -> EMA target encoder ===== -->
  <!-- hidden tokens tag -->
  <rect x="272" y="498" width="118" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="331" y="520" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c2d12">HIDDEN</text>
  <text x="331" y="535" font-size="11" text-anchor="middle" fill="#334155">tokens</text>

  <line x1="390" y1="520" x2="432" y2="520" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- target encoder -->
  <rect x="432" y="490" width="188" height="60" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="526" y="512" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">EMA target encoder</text>
  <text x="526" y="530" font-size="10.5" text-anchor="middle" fill="#334155">stop-grad, slow EMA copy</text>
  <text x="526" y="544" font-size="10.5" text-anchor="middle" fill="#334155">of context encoder</text>

  <!-- target emb -> up into loss -->
  <path d="M620 520 L737 520 L737 466" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="512" font-size="10" text-anchor="start" fill="#c2410c">target emb</text>

  <!-- EMA update dashed arrow: context encoder -> target encoder -->
  <path d="M470 198 L470 490" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="437" y="348" font-size="9.5" text-anchor="middle" fill="#6d28d9" transform="rotate(-90 437 348)">EMA update  target = m*target + (1-m)*context</text>

  <!-- ===== Loss box (center-right) ===== -->
  <rect x="620" y="402" width="292" height="64" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="766" y="425" font-size="13" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Loss (masked positions only)</text>
  <text x="766" y="447" font-size="12" text-anchor="middle" fill="#334155">L = L_pred + lambda_v L_var + lambda_c L_cov</text>
  <text x="766" y="461" font-size="10" text-anchor="middle" fill="#64748b">L2 in latent space + VICReg (anti-collapse)</text>

  <!-- legend -->
  <text x="30" y="612" font-size="10.5" fill="#64748b">Solid arrows = forward pass.  Dashed violet = EMA weight copy (no gradient).  Encoder frozen at probe time; only the 68 labels used downstream.</text>
</svg>
