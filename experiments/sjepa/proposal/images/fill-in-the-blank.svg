<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">Fill in the blank: the data labels itself</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">Hide part of a walking clip, predict it back, and score the guess against the clip we already had.</text>

  <!-- Filmstrip label -->
  <text x="60" y="92" font-size="12" font-weight="bold" fill="#475569">A walking clip (6 frames)</text>

  <!-- Filmstrip container -->
  <rect x="40" y="100" width="880" height="140" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>

  <!-- Frame 1 -->
  <rect x="56" y="116" width="120" height="108" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="116" y="132" font-size="10" text-anchor="middle" fill="#64748b">frame 1</text>
  <g stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="116" cy="150" r="7" fill="#14532d" stroke="none"/>
    <line x1="116" y1="157" x2="116" y2="185"/>
    <line x1="116" y1="164" x2="102" y2="178"/>
    <line x1="116" y1="164" x2="130" y2="178"/>
    <line x1="116" y1="185" x2="106" y2="210"/>
    <line x1="116" y1="185" x2="126" y2="210"/>
  </g>

  <!-- Frame 2 -->
  <rect x="192" y="116" width="120" height="108" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="252" y="132" font-size="10" text-anchor="middle" fill="#64748b">frame 2</text>
  <g stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="252" cy="150" r="7" fill="#14532d" stroke="none"/>
    <line x1="252" y1="157" x2="252" y2="185"/>
    <line x1="252" y1="164" x2="238" y2="176"/>
    <line x1="252" y1="164" x2="266" y2="176"/>
    <line x1="252" y1="185" x2="240" y2="208"/>
    <line x1="252" y1="185" x2="264" y2="212"/>
  </g>

  <!-- Frame 3: HIDDEN (whole frame gray patch) -->
  <rect x="328" y="116" width="120" height="108" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="388" y="132" font-size="10" text-anchor="middle" fill="#64748b">frame 3</text>
  <text x="388" y="182" font-size="46" font-weight="bold" text-anchor="middle" fill="#94a3b8">?</text>
  <text x="388" y="212" font-size="10" text-anchor="middle" fill="#475569">hidden</text>

  <!-- Frame 4 -->
  <rect x="464" y="116" width="120" height="108" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="524" y="132" font-size="10" text-anchor="middle" fill="#64748b">frame 4</text>
  <g stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="524" cy="150" r="7" fill="#14532d" stroke="none"/>
    <line x1="524" y1="157" x2="524" y2="185"/>
    <line x1="524" y1="164" x2="510" y2="176"/>
    <line x1="524" y1="164" x2="538" y2="176"/>
    <line x1="524" y1="185" x2="512" y2="212"/>
    <line x1="524" y1="185" x2="536" y2="208"/>
  </g>

  <!-- Frame 5 -->
  <rect x="600" y="116" width="120" height="108" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="660" y="132" font-size="10" text-anchor="middle" fill="#64748b">frame 5</text>
  <g stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="660" cy="150" r="7" fill="#14532d" stroke="none"/>
    <line x1="660" y1="157" x2="660" y2="185"/>
    <line x1="660" y1="164" x2="646" y2="178"/>
    <line x1="660" y1="164" x2="674" y2="178"/>
    <line x1="660" y1="185" x2="648" y2="210"/>
    <line x1="660" y1="185" x2="672" y2="210"/>
  </g>

  <!-- Frame 6 -->
  <rect x="736" y="116" width="120" height="108" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="796" y="132" font-size="10" text-anchor="middle" fill="#64748b">frame 6</text>
  <g stroke="#14532d" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="796" cy="150" r="7" fill="#14532d" stroke="none"/>
    <line x1="796" y1="157" x2="796" y2="185"/>
    <line x1="796" y1="164" x2="782" y2="176"/>
    <line x1="796" y1="164" x2="810" y2="176"/>
    <line x1="796" y1="185" x2="784" y2="208"/>
    <line x1="796" y1="185" x2="808" y2="212"/>
  </g>

  <!-- Arrow: visible frames into model -->
  <line x1="150" y1="290" x2="238" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="105" y="286" font-size="11" text-anchor="middle" fill="#475569">visible</text>
  <text x="105" y="300" font-size="11" text-anchor="middle" fill="#475569">frames</text>

  <!-- Model box -->
  <rect x="250" y="262" width="150" height="56" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="325" y="288" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">model</text>
  <text x="325" y="306" font-size="10" text-anchor="middle" fill="#334155">encode + predict</text>

  <!-- Arrow: model to guess -->
  <line x1="400" y1="290" x2="470" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Guess box -->
  <rect x="482" y="252" width="150" height="76" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="557" y="276" font-size="14" font-weight="bold" text-anchor="middle" fill="#4c1d95">guess</text>
  <text x="557" y="296" font-size="10" text-anchor="middle" fill="#334155">the hidden frame,</text>
  <text x="557" y="311" font-size="10" text-anchor="middle" fill="#334155">rebuilt from motion</text>

  <!-- Arrow: guess to score -->
  <line x1="632" y1="290" x2="700" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="666" y="282" font-size="10" text-anchor="middle" fill="#7c3aed">compare</text>

  <!-- Score note box -->
  <rect x="712" y="252" width="212" height="76" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="818" y="276" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c2d12">score for free</text>
  <text x="818" y="296" font-size="10" text-anchor="middle" fill="#334155">the answer was in the data:</text>
  <text x="818" y="311" font-size="10" text-anchor="middle" fill="#334155">frame 3 was there all along</text>

  <!-- Dashed link from hidden frame down to guess -->
  <line x1="388" y1="224" x2="500" y2="252" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Bottom takeaway -->
  <text x="480" y="392" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">No human labels needed. Every clip becomes its own training example.</text>
  <text x="480" y="420" font-size="12" text-anchor="middle" fill="#475569">Prediction happens in latent space, so the model learns coordinated motion, not exact pixel positions.</text>
  <text x="480" y="442" font-size="12" text-anchor="middle" fill="#64748b">This is what lets us learn from thousands of unlabeled walking clips instead of only the 68 labeled ones.</text>
</svg>
