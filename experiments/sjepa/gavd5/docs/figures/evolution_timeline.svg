   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="330.87906" y="58.619723" transform="rotate(-0 330.87906 58.619723)">5. Independent</text>
   </g>
   <g id="text_16">
    <text style="font-size: 4.95px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(330.87906 73.994991)">split videos first</text>
    <text style="font-size: 4.95px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(330.87906 80.528991)">fit rules on train only</text>
