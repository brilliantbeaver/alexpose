   <g id="text_18">
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="15.1236" y="183.16656" transform="rotate(-0 15.1236 183.16656)">Key lesson: a larger in-corpus score, a repaired fold design, and a truly independent estimate are three different kinds of progress.</text>
