   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="15.1236" y="24.361838" transform="rotate(-0 15.1236 24.361838)">The project evolved in layers, not through one isolated model change</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="15.1236" y="35.9715" transform="rotate(-0 15.1236 35.9715)">Completed changes are green or blue. The final card is required work, not a reported result.</text>
   </g>
