    <text style="font-size: 4.95px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(330.87906 94.076522)">freeze before test</text>
    <text style="font-size: 4.95px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(330.87906 100.130991)">report controls and ranges</text>
