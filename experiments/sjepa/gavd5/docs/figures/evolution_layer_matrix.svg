   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="15.1236" y="26.718037" transform="rotate(-0 15.1236 26.718037)">Legacy and current methods differ at six layers</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="19.87776" y="43.030486" transform="rotate(-0 19.87776 43.030486)">Layer</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="71.38116" y="43.030486" transform="rotate(-0 71.38116 43.030486)">Legacy prototype</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="150.61716" y="43.030747" transform="rotate(-0 150.61716 43.030747)">Current completed run</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="277.39476" y="43.030747" transform="rotate(-0 277.39476 43.030747)">Impact and remaining limit</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="19.87776" y="70.730471" transform="rotate(-0 19.87776 70.730471)">Data</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 66.770815)">12 normal sequences</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 73.774565)">1 source video</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 66.770815)">Stage 0: 75 sequences / 18 videos</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 73.270815)">Stage 4: 159 sequences / 35 videos</text>
   </g>
   <g id="text_9">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 66.770815)">Broader support, but added-normal</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 73.270815)">provenance can still be a shortcut</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="19.87776" y="97.540864" transform="rotate(-0 19.87776 97.540864)">Targets</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 94.185895)">10 eligible</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 101.189645)">landmark identities</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 94.185895)">12 identities from shoulders through feet</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 100.924364)">uniform batch-safe draw; no motion score</text>
   </g>
   <g id="text_13">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 94.185895)">Heels restored; rule is explicit</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 101.189645)">realized fraction is not fixed at 0.60</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="19.87776" y="125.048287" transform="rotate(-0 19.87776 125.048287)">Objective</text>
   </g>
   <g id="text_15">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 121.600975)">Centered, sharpened</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 128.100975)">latent cross-entropy</text>
   </g>
   <g id="text_16">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 121.555069)">JEPA + 0.05 VICReg + 0.25 group</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 128.100975)">group term starts after Stage 0</text>
   </g>
   <g id="text_17">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 121.600975)">Active anti-collapse pressure added</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 128.100975)">later stages are label-informed</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="19.87776" y="152.463367" transform="rotate(-0 19.87776 152.463367)">Training</text>
   </g>
   <g id="text_19">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="71.38116" y="152.266055" transform="rotate(-0 71.38116 152.266055)">Normal-only checkpoint</text>
   </g>
   <g id="text_20">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 149.016055)">Normal first, then four condition stages</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 155.516055)">with condition-balanced replay</text>
   </g>
   <g id="text_21">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 149.016055)">One continuing 600-epoch model</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 156.019805)">normal anchor still drifted to 0.594</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="19.87776" y="180.483135" transform="rotate(-0 19.87776 180.483135)">Artifacts</text>
   </g>
   <g id="text_23">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #25384a" x="71.38116" y="180.184885" transform="rotate(-0 71.38116 180.184885)">Loose filename-based reuse</text>
   </g>
   <g id="text_24">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 176.431135)">Lineage, cohort, configuration, and</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 182.931135)">fingerprint are recorded</text>
   </g>
   <g id="text_25">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 176.431135)">Reject incomplete, stale, wrong-mode,</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 182.931135)">or mixed-fingerprint artifacts</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="19.87776" y="207.898215" transform="rotate(-0 19.87776 207.898215)">Evaluation</text>
   </g>
   <g id="text_27">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 203.846215)">Single video-confounded</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(71.38116 210.346215)">47/21 comparison</text>
   </g>
   <g id="text_28">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 203.846215)">A1, A2, grouped-RF Lane C, plus</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(150.61716 210.346215)">missingness and exposure audits</text>
   </g>
   <g id="text_29">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 203.846215)">Claims are narrower; no lane yet retrains</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(277.39476 210.849965)">the encoder outside test videos</text>
   </g>
   <g id="text_30">
    <text style="font-size: 6.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="15.1236" y="234.86436" transform="rotate(-0 15.1236 234.86436)">The rows must be interpreted together. The accuracy change cannot be assigned to any single row without a controlled ablation.</text>
   </g>
  </g>
 </g>
