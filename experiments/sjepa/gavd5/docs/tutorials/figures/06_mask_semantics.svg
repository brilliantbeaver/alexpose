<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The target mask chooses valid authorized joint-time tokens</title>
  <desc id="desc">The grid uses fill plus symbols: a plain cell is ordinary visible context, an X is a hidden eligible target, a circle is eligible visible context, and a slash is invalid visible context.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; }
    .t { font-size: 20px; font-weight: 700; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .strong { font-weight: 700; fill: #20364e; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 15px; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="48" y="58" class="h" text-anchor="start"><tspan x="48" dy="0">The target mask chooses valid authorized joint-time tokens</tspan></text>
  <rect x="72" y="160" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="136" y="160" width="52" height="52" rx="6" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.5"/><path d="M 154.0 178.0 L 170.0 194.0 M 170.0 178.0 L 154.0 194.0" stroke="#20364e" stroke-width="2.5"/><rect x="200" y="160" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="264" y="160" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="328" y="160" width="52" height="52" rx="6" fill="#d8e0e7" stroke="#8a9bab" stroke-width="1.5"/><path d="M 345.0 195.0 L 363.0 177.0" stroke="#20364e" stroke-width="2.5"/><rect x="392" y="160" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="72" y="224" width="52" height="52" rx="6" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.5"/><circle cx="98.0" cy="250.0" r="7" fill="none" stroke="#20364e" stroke-width="2.5"/><rect x="136" y="224" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="200" y="224" width="52" height="52" rx="6" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.5"/><path d="M 218.0 242.0 L 234.0 258.0 M 234.0 242.0 L 218.0 258.0" stroke="#20364e" stroke-width="2.5"/><rect x="264" y="224" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="328" y="224" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="392" y="224" width="52" height="52" rx="6" fill="#d8e0e7" stroke="#8a9bab" stroke-width="1.5"/><path d="M 409.0 259.0 L 427.0 241.0" stroke="#20364e" stroke-width="2.5"/><rect x="72" y="288" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="136" y="288" width="52" height="52" rx="6" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.5"/><path d="M 154.0 306.0 L 170.0 322.0 M 170.0 306.0 L 154.0 322.0" stroke="#20364e" stroke-width="2.5"/><rect x="200" y="288" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="264" y="288" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="328" y="288" width="52" height="52" rx="6" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.5"/><circle cx="354.0" cy="314.0" r="7" fill="none" stroke="#20364e" stroke-width="2.5"/><rect x="392" y="288" width="52" height="52" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><rect x="520" y="112" width="632" height="252" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/><text x="544" y="148" class="t" text-anchor="start"><tspan x="544" dy="0">Mask rules</tspan></text><text x="544" y="184" class="b" text-anchor="start"><tspan x="544" dy="0">Only 12 authorized joints can become targets.</tspan><tspan x="544" dy="26">All L frames in a patch must be originally valid.</tspan><tspan x="544" dy="26">True in target_mask means hidden and predicted.</tspan><tspan x="544" dy="26">True in keep_mask means sent to the view encoder.</tspan></text><rect x="72" y="398" width="142" height="36" rx="18" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.5"/><text x="143.0" y="422" class="s strong" text-anchor="middle"><tspan x="143.0" dy="0">visible</tspan></text><rect x="230" y="398" width="142" height="36" rx="18" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.5"/><text x="301.0" y="422" class="s strong" text-anchor="middle"><tspan x="301.0" dy="0">target + X</tspan></text><rect x="72" y="450" width="142" height="36" rx="18" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.5"/><text x="143.0" y="474" class="s strong" text-anchor="middle"><tspan x="143.0" dy="0">eligible + O</tspan></text><rect x="230" y="450" width="142" height="36" rx="18" fill="#d8e0e7" stroke="#8a9bab" stroke-width="1.5"/><text x="301.0" y="474" class="s strong" text-anchor="middle"><tspan x="301.0" dy="0">invalid + /</tspan></text><rect x="520" y="408" width="632" height="170" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/><text x="544" y="444" class="t" text-anchor="start"><tspan x="544" dy="0">Common-count example</tspan></text><text x="544" y="480" class="b" text-anchor="start"><tspan x="544" dy="0">Eligible counts: 180, 160, 150, 175</tspan><tspan x="544" dy="26">M = floor(0.60 x 150) = 90 for every sample</tspan><tspan x="544" dy="26">Equal M gives equal K, which dense batching requires.</tspan></text><text x="72" y="628" class="s" text-anchor="start"><tspan x="72" dy="0">Targets are eligible. Eligible and invalid unmasked tokens both remain visible context.</tspan></text>
</svg>
