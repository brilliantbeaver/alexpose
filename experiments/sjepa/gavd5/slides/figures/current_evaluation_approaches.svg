   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #3977a8" transform="translate(31.2264 90.337244)">All 96 examples</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #3977a8" transform="translate(31.2264 100.899651)">divided at random</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(31.2264 129.36897)">Can the features recover labels</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(31.2264 139.08897)">inside the known set?</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(31.2264 146.12472)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(31.2264 157.83147)">Source videos can appear</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(31.2264 168.24897)">on both sides.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #3d8b7d" transform="translate(192.20328 90.337244)">Matched comparison</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #3d8b7d" transform="translate(192.20328 100.899651)">47 training, 21 testing</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.20328 128.67147)">Can we repeat the historical</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.20328 138.39147)">comparison?</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.20328 146.12472)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.20328 157.83147)">Source videos can appear</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(192.20328 168.24897)">on both sides.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #d9a441" transform="translate(353.18016 90.337244)">Source videos</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #d9a441" transform="translate(353.18016 100.899651)">kept separate</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(353.18016 128.67147)">What changes when the final</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(353.18016 139.08897)">classifier cannot share videos?</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(353.18016 146.12472)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(353.18016 157.83147)">Earlier feature learning still</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(353.18016 167.55147)">used every video.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b94e48" x="247.464" y="205.51392" transform="rotate(-0 247.464 205.51392)">Each approach answers a different question; none estimates a completely unseen video from start to finish.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="247.464" y="14.798438" transform="rotate(-0 247.464 14.798438)">Three evaluation approaches, three limited questions</text>
  </g>
 </g>
