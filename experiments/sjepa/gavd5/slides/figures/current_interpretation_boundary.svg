   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3d8b7d" x="40.83696" y="87.596625" transform="rotate(-0 40.83696 87.596625)">What the current results support</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(40.83696 127.50921)">The movement features contain information</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(40.83696 136.53171)">related to the five walking conditions.</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(40.83696 144.26496)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(40.83696 155.97171)">Keeping source videos separate makes the</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(40.83696 166.38921)">classification result more cautious.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94e48" x="281.10096" y="87.596625" transform="rotate(-0 281.10096 87.596625)">What they do not yet support</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(281.10096 126.81171)">They do not estimate performance for a new</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(281.10096 136.53171)">person, clinic, camera, or source video.</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(281.10096 144.26496)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(281.10096 155.97171)">Every example helped shape the movement</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(281.10096 166.38921)">features before the final classifier test.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="247.464" y="201.7944" transform="rotate(-0 247.464 201.7944)">Next valid test: separate complete source videos before any feature learning begins.</text>
   </g>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="247.464" y="14.798438" transform="rotate(-0 247.464 14.798438)">A clear boundary around the current evidence</text>
  </g>
