<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t2 d2">
  <title id="t2">Per-subspace biomarker recovery against the raw-coordinate ceiling and untrained-encoder floor</title>
  <desc id="d2">Illustrative expected-shape scatter. The x axis is the held-out source video; the y axis is recovered biomarker R-squared. One dot per held-out source, three colored series, one per named subspace (z_asym warm, z_rhythm violet, z_posture green). A green dashed line marks the raw-coordinate probe ceiling and a grey dashed line marks the untrained-encoder floor. z_rhythm is flagged as the highest-risk subspace because stride-time CV is not linearly decodable from roughly two-second windows. A lane legend and a pre-registered pass card sit on the right. All numbers are transductive and illustrative; folder labels are dataset annotations, not diagnoses.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
    <style>
      .h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:32px;fill:#0f2440;}
      .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;fill:#0f2440;}
      .b{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#33475e;}
      .s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#5c6f84;}
      .w{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:16px;fill:#ffffff;}
      .ws{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#cdd8e4;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="60" class="h">Per-subspace biomarker recovery vs ceiling and floor</text>
  <text x="48" y="88" class="s">Illustrative expected shape. One dot per held-out source, three subspaces. All numbers transductive.</text>

  <!-- ============ LEFT: scatter card ============ -->
  <!-- card: x 48..716, y 112..628 -->
  <rect x="48" y="112" width="668" height="516" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text x="78" y="148" class="t">Recovered R-squared per held-out source</text>

  <!-- plot frame: x 150..676, y 180..556 ; y 0..1 maps 556..180 -->
  <line x1="150" y1="180" x2="150" y2="556" stroke="#20364e" stroke-width="2.5"/>
  <line x1="150" y1="556" x2="676" y2="556" stroke="#20364e" stroke-width="2.5"/>

  <!-- y ticks: 0, 0.5, 1.0  (y = 556 - 376*val) -->
  <line x1="150" y1="556" x2="144" y2="556" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="561" class="s" text-anchor="end">0.0</text>
  <line x1="150" y1="368" x2="144" y2="368" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="373" class="s" text-anchor="end">0.5</text>
  <line x1="150" y1="180" x2="144" y2="180" stroke="#20364e" stroke-width="2"/>
  <text x="138" y="185" class="s" text-anchor="end">1.0</text>

  <!-- x ticks: held-out sources s1..s6 across 210..616 -->
  <line x1="210" y1="556" x2="210" y2="562" stroke="#20364e" stroke-width="2"/>
  <text x="210" y="580" class="s" text-anchor="middle">s1</text>
  <line x1="291" y1="556" x2="291" y2="562" stroke="#20364e" stroke-width="2"/>
  <text x="291" y="580" class="s" text-anchor="middle">s2</text>
  <line x1="372" y1="556" x2="372" y2="562" stroke="#20364e" stroke-width="2"/>
  <text x="372" y="580" class="s" text-anchor="middle">s3</text>
  <line x1="453" y1="556" x2="453" y2="562" stroke="#20364e" stroke-width="2"/>
  <text x="453" y="580" class="s" text-anchor="middle">s4</text>
  <line x1="534" y1="556" x2="534" y2="562" stroke="#20364e" stroke-width="2"/>
  <text x="534" y="580" class="s" text-anchor="middle">s5</text>
  <line x1="615" y1="556" x2="615" y2="562" stroke="#20364e" stroke-width="2"/>
  <text x="615" y="580" class="s" text-anchor="middle">s6</text>

  <!-- raw-coordinate CEILING (green dashed) at R2 ~0.72 -> y = 556-376*0.72 = 285 -->
  <line x1="158" y1="285" x2="668" y2="285" stroke="#5f9e7e" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="668" y="278" class="s" fill="#5f9e7e" text-anchor="end">raw-coordinate ceiling</text>

  <!-- 80% of ceiling pass line reference at R2 ~0.58 -> y = 556-376*0.58 = 338 (thin green) -->
  <line x1="158" y1="338" x2="668" y2="338" stroke="#5f9e7e" stroke-width="1.25" stroke-dasharray="3 5"/>
  <text x="662" y="356" class="s" fill="#5f9e7e" text-anchor="end">80% of ceiling (pass line)</text>

  <!-- untrained-encoder FLOOR (grey dashed) at R2 ~0.08 -> y = 556-376*0.08 = 526 -->
  <line x1="158" y1="526" x2="668" y2="526" stroke="#c4cdd8" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="662" y="519" class="s" fill="#c4cdd8" text-anchor="end">untrained-encoder floor</text>

  <!-- z_asym series (warm) around R2 0.60..0.66, above pass line -->
  <g fill="#e07a4b" stroke="#a44c26" stroke-width="1.25">
    <circle cx="210" cy="323" r="8"/>
    <circle cx="291" cy="315" r="8"/>
    <circle cx="372" cy="330" r="8"/>
    <circle cx="453" cy="318" r="8"/>
    <circle cx="534" cy="326" r="8"/>
    <circle cx="615" cy="312" r="8"/>
  </g>

  <!-- z_posture series (green) around R2 0.62..0.68, above pass line -->
  <g fill="#5f9e7e" stroke="#20364e" stroke-width="1.25">
    <circle cx="210" cy="308" r="8"/>
    <circle cx="291" cy="300" r="8"/>
    <circle cx="372" cy="314" r="8"/>
    <circle cx="453" cy="304" r="8"/>
    <circle cx="534" cy="296" r="8"/>
    <circle cx="615" cy="310" r="8"/>
  </g>

  <!-- z_rhythm series (violet) LOW, near floor, below pass line -->
  <g fill="#8a6fb3" stroke="#20364e" stroke-width="1.25">
    <circle cx="210" cy="500" r="8"/>
    <circle cx="291" cy="486" r="8"/>
    <circle cx="372" cy="508" r="8"/>
    <circle cx="453" cy="492" r="8"/>
    <circle cx="534" cy="514" r="8"/>
    <circle cx="615" cy="498" r="8"/>
  </g>

  <!-- y axis label -->
  <text x="106" y="368" class="b" text-anchor="middle" transform="rotate(-90 106 368)">Recovered R-squared</text>
  <!-- x axis label below ticks, inside card -->
  <text x="413" y="608" class="b" text-anchor="middle">Held-out source video</text>

  <!-- ============ RIGHT: lane legend + pass card ============ -->

  <!-- Lane legend card: y 112..390 (height 278) -->
  <rect x="772" y="112" width="380" height="278" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="802" y="148" class="t">Three subspaces, one fold</text>

  <circle cx="812" cy="180" r="8" fill="#e07a4b" stroke="#a44c26" stroke-width="1.25"/>
  <text x="832" y="185" class="b">z_asym head (symmetry ratio)</text>

  <circle cx="812" cy="214" r="8" fill="#5f9e7e" stroke="#20364e" stroke-width="1.25"/>
  <text x="832" y="219" class="b">z_posture head (pelvic tilt)</text>

  <circle cx="812" cy="248" r="8" fill="#8a6fb3" stroke="#20364e" stroke-width="1.25"/>
  <text x="832" y="253" class="b">z_rhythm head (stride-time CV)</text>

  <line x1="802" y1="276" x2="1122" y2="276" stroke="#c4cdd8" stroke-width="1.5"/>

  <line x1="802" y1="308" x2="826" y2="308" stroke="#5f9e7e" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="836" y="313" class="s">green dashed: raw-coordinate ceiling</text>

  <line x1="802" y1="340" x2="826" y2="340" stroke="#c4cdd8" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="836" y="345" class="s">grey dashed: untrained-encoder floor</text>

  <text x="802" y="367" class="s">z_rhythm flagged highest-risk (see note).</text>

  <!-- Pass card dark banner: y 446..628 (height 182), gap 390->446 = 56 -->
  <rect x="772" y="446" width="380" height="182" rx="16" fill="#20364e" stroke="#20364e" stroke-width="1.75"/>
  <text x="802" y="482" class="w" font-size="20">Pre-registered pass card</text>

  <text x="802" y="518" class="w">Head R-squared  &#8805; 80% of ceiling</text>
  <text x="802" y="550" class="ws">z_rhythm ceiling may itself be near</text>
  <text x="802" y="572" class="ws">chance, so it cannot pass: a window-</text>
  <text x="802" y="594" class="ws">length limit, not a bottleneck failure.</text>

  <!-- Footer note -->
  <text x="48" y="672" class="s">Illustrative expected shape, not measured results. Asymmetry readout R-squared &#8776; 0.154 today; stride-time CV not linearly decodable from ~2s windows. Labels are dataset annotations.</text>
</svg>
