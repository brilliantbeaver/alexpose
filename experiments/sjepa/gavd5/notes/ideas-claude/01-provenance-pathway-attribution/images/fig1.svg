<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Provenance decodability across four probe lanes under one checkpoint</title>
  <desc id="desc">Illustrative expected shape. A grouped bar chart of balanced accuracy for predicting the extraction pathway from four feature sources: the frozen embedding, a missingness-only feature, an untrained-encoder embedding, and chance. A horizontal source-permutation null band and a chance line are drawn as references. Provenance counts as decodable only if the embedding bar clears the null band and beats the missingness bar by at least 0.05. All numbers are transductive and computed under one checkpoint fingerprint d0acc262.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>

  <text class="h" x="48" y="72">How much of the door can each feature guess?</text>
  <text class="s" x="48" y="98">Illustrative shape only. Balanced accuracy at guessing the augmented-vs-canonical door. Transductive; checkpoint d0acc262.</text>

  <!-- Plot area: y for acc 0 at 560, acc 1 at 150, so y = 560 - acc*410 -->
  <!-- Y axis -->
  <line x1="150" y1="150" x2="150" y2="560" stroke="#20364e" stroke-width="2.5"/>
  <!-- X axis at acc 0 -->
  <line x1="150" y1="560" x2="940" y2="560" stroke="#20364e" stroke-width="2.5"/>

  <!-- Y gridlines and labels -->
  <line x1="150" y1="150" x2="940" y2="150" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="138" y="155" text-anchor="end">1.00</text>
  <line x1="150" y1="252.5" x2="940" y2="252.5" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="138" y="257" text-anchor="end">0.75</text>
  <line x1="150" y1="457.5" x2="940" y2="457.5" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="138" y="462" text-anchor="end">0.25</text>
  <text class="s" x="138" y="565" text-anchor="end">0.00</text>

  <!-- Y axis title -->
  <text class="b" x="72" y="355" transform="rotate(-90 72 355)" text-anchor="middle">Balanced accuracy (door)</text>

  <!-- Source-permutation null band: 0.42 to 0.58, centered on chance 0.5 -->
  <rect x="150" y="322" width="790" height="66" fill="#e6f2ea" opacity="0.75"/>
  <line x1="150" y1="322" x2="940" y2="322" stroke="#5f9e7e" stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="150" y1="388" x2="940" y2="388" stroke="#5f9e7e" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- Chance line at 0.5 -> y=355 -->
  <line x1="150" y1="355" x2="940" y2="355" stroke="#20364e" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text class="s" x="138" y="360" text-anchor="end">0.50</text>

  <!-- Bars centered at 245, 435, 625, 815; width 130 -->
  <!-- Embedding acc ~0.90 -> top y=191 -->
  <rect x="180" y="191" width="130" height="369" rx="6" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.75"/>
  <text class="t" x="245" y="180" text-anchor="middle" fill="#2f6f99">~0.90</text>

  <!-- Missingness-only acc ~0.66 -> top y=289 -->
  <rect x="370" y="289" width="130" height="271" rx="6" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.75"/>
  <text class="t" x="435" y="278" text-anchor="middle" fill="#a44c26">~0.66</text>

  <!-- Untrained encoder acc ~0.55 -> top y=334 -->
  <rect x="560" y="334" width="130" height="226" rx="6" fill="#ece6f6" stroke="#8a6fb3" stroke-width="1.75"/>
  <text class="t" x="625" y="323" text-anchor="middle" fill="#8a6fb3">~0.55</text>

  <!-- Chance acc 0.50 -> top y=355 -->
  <rect x="750" y="355" width="130" height="205" rx="6" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text class="t" x="815" y="344" text-anchor="middle" fill="#0f2440">0.50</text>

  <!-- X labels -->
  <text class="b" x="245" y="586" text-anchor="middle">Frozen embedding</text>
  <text class="s" x="245" y="608" text-anchor="middle">d0acc262</text>

  <text class="b" x="435" y="586" text-anchor="middle">Missingness-only</text>
  <text class="s" x="435" y="608" text-anchor="middle">visibility, no coords</text>

  <text class="b" x="625" y="586" text-anchor="middle">Untrained encoder</text>
  <text class="s" x="625" y="608" text-anchor="middle">input-level bound</text>

  <text class="b" x="815" y="586" text-anchor="middle">Chance</text>
  <text class="s" x="815" y="608" text-anchor="middle">label-shuffled</text>

  <!-- Margin annotation between embedding and missingness bars (gap 310..370) -->
  <line x1="340" y1="191" x2="340" y2="289" stroke="#20364e" stroke-width="1.5"/>
  <line x1="336" y1="191" x2="344" y2="191" stroke="#20364e" stroke-width="1.5"/>
  <line x1="336" y1="289" x2="344" y2="289" stroke="#20364e" stroke-width="1.5"/>

  <!-- Legend card, right side, well clear of the edge -->
  <rect x="1000" y="150" width="152" height="360" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>
  <text class="t" x="1022" y="186">How to read</text>

  <rect x="1022" y="206" width="34" height="18" fill="#e6f2ea" opacity="0.75" stroke="#5f9e7e" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="s" x="1022" y="252">Green band:</text>
  <text class="s" x="1022" y="278">source-shuffle</text>
  <text class="s" x="1022" y="304">null.</text>

  <line x1="1022" y1="332" x2="1056" y2="332" stroke="#20364e" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text class="s" x="1022" y="378">Dotted line:</text>
  <text class="s" x="1022" y="404">chance 0.50.</text>

  <text class="s" x="1022" y="454">Bracket: 0.05 gap.</text>

  <!-- Footer decision rule -->
  <line x1="48" y1="638" x2="1152" y2="638" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="48" y="662">Decision rule: the door is DECODABLE only if the embedding bar clears the null band AND beats missingness-only by at least 0.05 balanced accuracy.</text>
  <text class="s" x="48" y="684">Folder labels are dataset annotations, not diagnoses. Bar heights are illustrative placeholders, not measured results.</text>
</svg>
