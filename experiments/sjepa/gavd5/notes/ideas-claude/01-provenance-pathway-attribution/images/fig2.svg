<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Within-normal provenance separability against the source-identity ceiling</title>
  <desc id="desc">Illustrative expected shape. Two panels. The left panel plots per-source balanced accuracy for telling the 12 canonical-normal sequences from the 63 augmented-normal windows, shown against a source-identity upper bound that the probe cannot beat by design, plus the missingness and chance references. The right panel shows the leave-the-single-normal-video-out diagnostic with augmented-normal subsampled to 12 to match the canonical count. All numbers are transductive and computed under one checkpoint fingerprint d0acc262.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#20364e"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>

  <text class="h" x="48" y="72">Read the door, but against what ceiling?</text>
  <text class="s" x="48" y="98">Illustrative shape only. 12 canonical-normal vs 63 augmented-normal windows, all from 1 normal source, so source id is the ceiling. Transductive; d0acc262.</text>

  <!-- ===================== LEFT PANEL ===================== -->
  <text class="t" x="48" y="150">Panel A: 12 canonical vs 63 augmented</text>
  <rect x="48" y="168" width="524" height="392" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>

  <!-- plot area: x 138..500, y 236..528 ; acc 0->y528, 1->y236 => y=528-acc*292 -->
  <line x1="138" y1="236" x2="138" y2="528" stroke="#20364e" stroke-width="2"/>
  <line x1="138" y1="528" x2="540" y2="528" stroke="#20364e" stroke-width="2"/>

  <!-- gridlines 1.0, 0.75, 0.50 -->
  <line x1="138" y1="236" x2="540" y2="236" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="128" y="241" text-anchor="end">1.00</text>
  <line x1="138" y1="309" x2="540" y2="309" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="128" y="314" text-anchor="end">0.75</text>
  <line x1="138" y1="382" x2="540" y2="382" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="128" y="387" text-anchor="end">0.50</text>
  <text class="s" x="128" y="533" text-anchor="end">0.00</text>

  <!-- source-identity ceiling ~0.98 -> y=528-0.98*292=242 -->
  <line x1="138" y1="242" x2="540" y2="242" stroke="#5f9e7e" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text class="s" x="540" y="230" text-anchor="end" fill="#3e7a5c">source-id ceiling (cannot beat)</text>

  <!-- missingness reference ~0.62 -> y=528-0.62*292=347 -->
  <line x1="138" y1="347" x2="540" y2="347" stroke="#e07a4b" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text class="s" x="540" y="365" text-anchor="end" fill="#a44c26">missingness-only ref</text>

  <!-- chance line 0.5 -> y=382 -->
  <line x1="138" y1="382" x2="540" y2="382" stroke="#20364e" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text class="s" x="540" y="400" text-anchor="end">chance 0.50</text>

  <!-- embedding per-source dots centered ~0.89 (y=528-0.89*292=268) -->
  <line x1="220" y1="270" x2="460" y2="270" stroke="#20364e" stroke-width="2.5"/>
  <circle cx="245" cy="263" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="285" cy="276" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="325" cy="258" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="365" cy="282" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="405" cy="266" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="445" cy="278" r="7" fill="#2f6f99" opacity="0.85"/>
  <text class="b" x="340" y="437" text-anchor="middle" fill="#0f2440">embedding (~0.89)</text>

  <text class="b" x="72" y="382" transform="rotate(-90 72 382)" text-anchor="middle">Balanced accuracy</text>
  <text class="s" x="340" y="548" text-anchor="middle">Each blue dot = one held-out fold (1 normal source)</text>

  <!-- ===================== RIGHT PANEL ===================== -->
  <text class="t" x="628" y="150">Panel B: leave-the-normal-video-out</text>
  <rect x="628" y="168" width="524" height="392" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/>

  <!-- plot area: x 718..1120, y 236..528 -->
  <line x1="718" y1="236" x2="718" y2="528" stroke="#20364e" stroke-width="2"/>
  <line x1="718" y1="528" x2="1120" y2="528" stroke="#20364e" stroke-width="2"/>

  <line x1="718" y1="236" x2="1120" y2="236" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="708" y="241" text-anchor="end">1.00</text>
  <line x1="718" y1="309" x2="1120" y2="309" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="708" y="314" text-anchor="end">0.75</text>
  <line x1="718" y1="382" x2="1120" y2="382" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="708" y="387" text-anchor="end">0.50</text>
  <text class="s" x="708" y="533" text-anchor="end">0.00</text>

  <!-- chance line -->
  <line x1="718" y1="382" x2="1120" y2="382" stroke="#20364e" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text class="s" x="1120" y="400" text-anchor="end">chance 0.50</text>

  <!-- dots collapse toward chance ~0.53 (y=528-0.53*292=373) -->
  <line x1="800" y1="374" x2="1040" y2="374" stroke="#20364e" stroke-width="2.5"/>
  <circle cx="825" cy="377" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="865" cy="366" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="905" cy="384" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="945" cy="370" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="985" cy="360" r="7" fill="#2f6f99" opacity="0.85"/>
  <circle cx="1025" cy="380" r="7" fill="#2f6f99" opacity="0.85"/>
  <text class="b" x="920" y="340" text-anchor="middle" fill="#0f2440">diagnostic (~0.53)</text>

  <text class="b" x="652" y="382" transform="rotate(-90 652 382)" text-anchor="middle">Balanced accuracy</text>
  <text class="s" x="920" y="548" text-anchor="middle">augmented subsampled to 12 to match canonical</text>

  <!-- Footer -->
  <line x1="48" y1="592" x2="1152" y2="592" stroke="#c4cdd8" stroke-width="1.5"/>
  <text class="s" x="48" y="616">Panel A cannot beat the ceiling by design (1 normal source). Panel B removes the count imbalance and asks what survives.</text>
  <text class="s" x="48" y="638">A near-chance Panel B rules out a pure count-imbalance artifact; it is never called provenance inflation without the source-count caveat.</text>
  <text class="s" x="48" y="660">Folder labels are dataset annotations, not diagnoses. Dot positions are illustrative placeholders, not measured results.</text>
</svg>
