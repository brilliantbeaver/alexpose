<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Preprocessing separates coordinates from target eligibility</title>
  <desc id="desc">The pipeline cleans and resizes pose coordinates while preserving an original-observation validity mask for masking and pooling.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; }
    .t { font-size: 20px; font-weight: 700; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .strong { font-weight: 700; fill: #20364e; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 15px; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>
  <text x="48" y="58" class="h" text-anchor="start"><tspan x="48" dy="0">Preprocessing separates coordinates from target eligibility</tspan></text>
  <rect x="48" y="112" width="190" height="180" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/><text x="72" y="148" class="t" text-anchor="start"><tspan x="72" dy="0">Raw pose</tspan></text><text x="72" y="184" class="b" text-anchor="start"><tspan x="72" dy="0">[T,33,4]</tspan><tspan x="72" dy="26">xyz + visibility</tspan></text><rect x="286" y="112" width="220" height="180" rx="16" fill="#e6f2ea" stroke="#20364e" stroke-width="1.75"/><text x="310" y="148" class="t" text-anchor="start"><tspan x="310" dy="0">Short gaps</tspan></text><text x="310" y="184" class="b" text-anchor="start"><tspan x="310" dy="0">interpolate &lt;=4 frames</tspan><tspan x="310" dy="26">keep pre-resize validity</tspan></text><rect x="554" y="112" width="220" height="180" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/><text x="578" y="148" class="t" text-anchor="start"><tspan x="578" dy="0">Normalize</tspan></text><text x="578" y="184" class="b" text-anchor="start"><tspan x="578" dy="0">pelvis center</tspan><tspan x="578" dy="26">body-width scale</tspan></text><rect x="822" y="112" width="330" height="180" rx="16" fill="#ece6f6" stroke="#20364e" stroke-width="1.75"/><text x="846" y="148" class="t" text-anchor="start"><tspan x="846" dy="0">Resize to F frames</tspan></text><text x="846" y="184" class="b" text-anchor="start"><tspan x="846" dy="0">coordinates [F,33,3]</tspan><tspan x="846" dy="26">validity [F,33]</tspan></text><path d="M 238 202 L 270 202" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 506 202 L 538 202" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 774 202 L 806 202" fill="none" stroke="#20364e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="404" width="510" height="170" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/><text x="72" y="440" class="t" text-anchor="start"><tspan x="72" dy="0">Coordinate path</tspan></text><text x="72" y="476" class="b" text-anchor="start"><tspan x="72" dy="0">long gaps and invalid values become zero sentinels</tspan><tspan x="72" dy="26">zero inputs can still gain bias and position embeddings</tspan></text><rect x="642" y="404" width="510" height="170" rx="16" fill="#ffffff" stroke="#20364e" stroke-width="1.75"/><text x="666" y="440" class="t" text-anchor="start"><tspan x="666" dy="0">Validity path</tspan></text><text x="666" y="476" class="b" text-anchor="start"><tspan x="666" dy="0">resample mask, then threshold at 0.5</tspan><tspan x="666" dy="26">all L resampled flags must be true for a target</tspan></text><rect x="276" y="620" width="648" height="36" rx="18" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.5"/><text x="600.0" y="644" class="s strong" text-anchor="middle"><tspan x="600.0" dy="0">The resampled mask controls targets and pooling</tspan></text>
</svg>
