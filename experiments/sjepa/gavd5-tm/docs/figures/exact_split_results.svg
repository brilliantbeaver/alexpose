  <g id="text_33">
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #b94e48" transform="translate(300.476781 216.044)">Different tasks; do not compare bar heights directly.</text>
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #b94e48" transform="translate(293.471266 223.794)">Black interval: percentile bootstrap over five fold scores.</text>
