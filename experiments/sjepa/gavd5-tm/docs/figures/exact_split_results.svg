  <g id="text_31">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="253.6265" y="14.798438" transform="rotate(-0 253.6265 14.798438)">Descriptive results, not independent clinical performance</text>
  </g>
  <g id="text_32">
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #b94e48" transform="translate(65.551656 216.644625)">A1 and A2 share videos across train and test.</text>
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #b94e48" transform="translate(32.598172 223.794)">The historical reference uses a different pose and feature pipeline.</text>
