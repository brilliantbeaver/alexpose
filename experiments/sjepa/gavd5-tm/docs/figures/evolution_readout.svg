   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="15.1236" y="25.054837" transform="rotate(-0 15.1236 25.054837)">The current 384-D readout is simple, but it compresses away temporal order</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64788a" x="15.1236" y="37.704" transform="rotate(-0 15.1236 37.704)">The right side is a proposed controlled ablation. It has not produced a saved result in this repository.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="58.7034" y="60.723986" transform="rotate(-0 58.7034 60.723986)">Encoded token grid</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(34.322775 77.430945)">16 time patches</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(43.060744 85.350945)">x 33 joints</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(31.721213 93.852195)">x 96 latent values</text>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(58.7034 99.53532)"/>
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(33.313088 109.110945)">valid tokens only</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="189.4428" y="60.723986" transform="rotate(-0 189.4428 60.723986)">Current pooling</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(165.863081 77.243757)">global mean: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(169.598644 84.899757)">global std: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(156.236441 93.117632)">12-landmark mean: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(159.972003 100.773632)">12-landmark std: 96</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(189.4428 106.26732)"/>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(162.507238 116.085632)">Total = 384 values</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="336.0294" y="60.723986" transform="rotate(-0 336.0294 60.723986)">Planned dynamics ablation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(306.037962 77.243757)">per-segment profiles</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(306.055634 84.899757)">left-right trajectories</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(294.852572 93.117632)">raw duration and frame rate</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(296.918369 100.773632)">cadence or autocorrelation</text>
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(300.632181 108.429632)">fit inside each outer fold</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 5.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="336.0294" y="122.909641" transform="rotate(-0 336.0294 122.909641)">PROPOSED</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="20.67012" y="160.7808" transform="rotate(-0 20.67012 160.7808)">Why the current design is useful</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 177.194915)">No trainable sequence head.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 184.058915)">Low variance at tiny sample size.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(20.67012 190.922915)">Easy-to-audit frozen feature probe.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17324d" x="218.76012" y="160.7808" transform="rotate(-0 218.76012 160.7808)">What it cannot retain</text>
   </g>
   <g id="text_13">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 177.194915)">Order of the 16 time patches.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 184.058915)">Absolute walking rate after resizing.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'; fill: #25384a" transform="translate(218.76012 190.922915)">When left-right asymmetry occurs.</text>
   </g>
  </g>
