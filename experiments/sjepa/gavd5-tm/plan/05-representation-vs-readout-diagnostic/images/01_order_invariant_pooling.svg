<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Averaging erases order: two walks look the same</title>
  <desc id="desc">A hill-shaped speed curve and a valley-shaped speed curve share the same mean and standard deviation, so mean/std pooling cannot tell them apart, the same trap that hides gait asymmetry timing.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #20364e; }
    .h { font-size: 32px; font-weight: 700; fill: #0f2440; }
    .t { font-size: 20px; font-weight: 700; fill: #0f2440; }
    .b { font-size: 16px; fill: #33475e; }
    .s { font-size: 14px; fill: #5c6f84; }
    .w { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .ws { font-size: 14px; fill: #cdd8e4; }
  </style>
  <rect width="1200" height="720" fill="#f7f5ef"/>

  <text x="48" y="58" class="h" text-anchor="start">Averaging erases order: two walks look the same</text>

  <!-- Card A: hill (fast, then slow) -->
  <rect x="48" y="112" width="520" height="230" rx="16" fill="#e7f0f8" stroke="#20364e" stroke-width="1.75"/>
  <text x="72" y="148" class="t" text-anchor="start">Walk A: fast, then slow</text>
  <line x1="90" y1="230" x2="536" y2="230" stroke="#c4cdd8" stroke-width="1.5"/>
  <path d="M90,230 Q313,170 536,230" stroke="#2f6f99" stroke-width="3" fill="none"/>
  <text x="72" y="314" class="s" text-anchor="start">mean speed = 1.2 m/s     std = 0.30 m/s</text>

  <!-- Card B: valley (slow, then fast) -->
  <rect x="632" y="112" width="520" height="230" rx="16" fill="#f7e7d8" stroke="#20364e" stroke-width="1.75"/>
  <text x="656" y="148" class="t" text-anchor="start">Walk B: slow, then fast</text>
  <line x1="674" y1="230" x2="1120" y2="230" stroke="#c4cdd8" stroke-width="1.5"/>
  <path d="M674,230 Q897,290 1120,230" stroke="#e07a4b" stroke-width="3" fill="none"/>
  <text x="656" y="314" class="s" text-anchor="start">mean speed = 1.2 m/s     std = 0.30 m/s</text>

  <!-- Convergence arrows into the pooled readout -->
  <path d="M308,342 L308,382" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M892,342 L892,382" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Pooled readout banner -->
  <rect x="290" y="398" width="620" height="140" rx="16" fill="#20364e" stroke="#20364e" stroke-width="1.75"/>
  <text x="314" y="436" class="w" text-anchor="start">Pooled readout: mean and std only</text>
  <text x="314" y="464" class="w" text-anchor="start">mean = 1.2 m/s     std = 0.30 m/s</text>
  <text x="314" y="492" class="ws" text-anchor="start">The order of speeding up vs. slowing down is gone.</text>

  <text x="48" y="640" class="s" text-anchor="start">The same trap applies to gait: which side leads first pools to the same numbers as which side leads second.</text>
</svg>
