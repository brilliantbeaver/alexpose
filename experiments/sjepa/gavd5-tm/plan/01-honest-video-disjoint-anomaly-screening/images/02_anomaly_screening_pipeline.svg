<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Prediction error as an anomaly score</title>
  <desc id="desc">A frozen, normal-gait-only encoder from Stage 0 and a held-out sequence both feed a masked-token prediction step. The resulting error becomes a per-sequence anomaly score, which is evaluated by whether abnormal sequences rank higher than normal ones under ROC-AUC.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}
      .h{font:700 32px Arial,Helvetica,sans-serif;fill:#0f2440}
      .t{font:700 20px Arial,Helvetica,sans-serif;fill:#0f2440}
      .b{font:16px Arial,Helvetica,sans-serif;fill:#33475e}
      .s{font:14px Arial,Helvetica,sans-serif;fill:#5c6f84}
      .w{font:700 16px Arial,Helvetica,sans-serif;fill:#ffffff}
      .ws{font:14px Arial,Helvetica,sans-serif;fill:#cdd8e4}
</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0 0L8 3L0 6Z" fill="#20364e"/>
    </marker>

  </defs>
  <rect class="bg" width="1200" height="720"/>
<text class="h" x="48" y="76">Turning prediction error into an anomaly score</text>
<text class="s" x="48" y="100">The Stage 0 checkpoint is reused as-is; only the scoring and evaluation are new.</text>
<rect x="48" y="140" width="230" height="140" rx="16" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.75"/>
<text class="t" x="70" y="178">Frozen Stage 0</text>
<text class="b" x="70" y="208">Normal-gait trained</text>
<text class="b" x="70" y="236">Frozen, reused as-is</text>
<rect x="48" y="380" width="230" height="140" rx="16" fill="#ece6f6" stroke="#8a6fb3" stroke-width="1.75"/>
<text class="t" x="70" y="418">Held-out clip</text>
<text class="b" x="70" y="448">Normal or abnormal</text>
<text class="b" x="70" y="476">New source video</text>
<rect x="348" y="240" width="240" height="180" rx="16" fill="#f7e7d8" stroke="#e07a4b" stroke-width="1.75"/>
<text class="t" x="370" y="278">Masked prediction</text>
<text class="b" x="370" y="308">Hide 12 joint tokens</text>
<text class="b" x="370" y="336">Predictor guesses</text>
<text class="b" x="370" y="364">Error: guess vs. truth</text>
<rect x="658" y="240" width="220" height="180" rx="16" fill="#e7f0f8" stroke="#2f6f99" stroke-width="1.75"/>
<text class="t" x="680" y="278">Anomaly score</text>
<text class="b" x="680" y="308">Avg. relative error</text>
<text class="b" x="680" y="336">High = big surprise</text>
<rect x="948" y="240" width="204" height="180" rx="16" fill="#e6f2ea" stroke="#5f9e7e" stroke-width="1.75"/>
<text class="t" x="970" y="278">ROC-AUC test</text>
<text class="b" x="970" y="308">Abnormal &gt; normal?</text>
<text class="b" x="970" y="336">Primary metric</text>
<text class="b" x="970" y="364">(corrected split)</text>
<line x1="278" y1="210" x2="332" y2="280" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<line x1="278" y1="450" x2="332" y2="380" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<line x1="588" y1="330" x2="642" y2="330" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<line x1="878" y1="330" x2="932" y2="330" stroke="#20364e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text class="t" x="398" y="470">What the ROC-AUC asks</text>
<circle cx="408" cy="500" r="6" fill="#2f6f99"/>
<text class="s" x="422" y="505">Normal (held out)</text>
<circle cx="608" cy="500" r="6" fill="#e07a4b"/>
<text class="s" x="622" y="505">Abnormal (PD, stroke, myopathic, cerebral palsy)</text>
<line x1="398" y1="550" x2="1102" y2="550" stroke="#c4cdd8" stroke-width="1.5"/>
<circle cx="420" cy="540" r="6" fill="#2f6f99"/>
<circle cx="445" cy="540" r="6" fill="#2f6f99"/>
<circle cx="470" cy="540" r="6" fill="#2f6f99"/>
<circle cx="495" cy="540" r="6" fill="#2f6f99"/>
<circle cx="520" cy="540" r="6" fill="#2f6f99"/>
<circle cx="545" cy="540" r="6" fill="#2f6f99"/>
<circle cx="570" cy="540" r="6" fill="#2f6f99"/>
<circle cx="610" cy="540" r="6" fill="#e07a4b"/>
<circle cx="650" cy="540" r="6" fill="#e07a4b"/>
<circle cx="690" cy="540" r="6" fill="#e07a4b"/>
<circle cx="750" cy="540" r="6" fill="#e07a4b"/>
<circle cx="810" cy="540" r="6" fill="#e07a4b"/>
<circle cx="870" cy="540" r="6" fill="#e07a4b"/>
<circle cx="930" cy="540" r="6" fill="#e07a4b"/>
<circle cx="990" cy="540" r="6" fill="#e07a4b"/>
<circle cx="1040" cy="540" r="6" fill="#e07a4b"/>
<text class="s" x="398" y="574">low score</text>
<text class="s" x="1102" y="574" text-anchor="end">high score</text>
<text class="s" x="48" y="630">Even a modest, honest separation counts: the test is whether it beats 0.5 by a margin, not perfection.</text>
</svg>
