<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ranked research portfolio</title>
  <desc id="desc">The primary readout-conditioned direction, a context-capacity backup, and five deadline-ranked alternatives.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.ink{fill:#20364e}.muted{fill:#607284}.card{fill:#fff;stroke:#cad4dc;stroke-width:2}.top{fill:#eaf4ee;stroke:#5f9e7e;stroke-width:3}.alt{fill:#edf4f8;stroke:#2f6f99;stroke-width:3}.small{font:18px Arial,sans-serif;fill:#607284}.body{font:18px Arial,sans-serif;fill:#20364e}.label{font:bold 18px Arial,sans-serif;fill:#2f6f99}.name{font:bold 22px Arial,sans-serif;fill:#20364e}.h{font:bold 34px Arial,sans-serif;fill:#20364e}.sub{font:18px Arial,sans-serif;fill:#607284}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2f6f99"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="h" x="60" y="62">A focused portfolio for ICLR 2027</text>
  <text class="sub" x="60" y="94">Choose one claim. Use the other ideas as controls, analyses, or future work.</text>

  <rect class="top" x="60" y="130" rx="18" width="500" height="170"/>
  <text class="label" x="88" y="165">PRIMARY PAPER</text>
  <text class="name" x="88" y="201">1  Readout-Conditioned Selection</text>
  <text class="body" x="88" y="235">Natural readouts may choose different checkpoints</text>
  <text class="small" x="88" y="269">Recover lineage • same-target reversal plus remedy</text>

  <rect class="alt" x="640" y="130" rx="18" width="500" height="170"/>
  <text class="label" x="668" y="165">CLEAN BACKUP</text>
  <text class="name" x="668" y="201">2  Context-Capacity Frontier</text>
  <text class="body" x="668" y="235">Find the smallest timed state inside an ε-band</text>
  <text class="small" x="668" y="269">Repair timestamps • confidence-bounded elbow</text>

  <text class="label" x="60" y="352">FIVE BOUNDED ALTERNATIVES</text>
  <g>
    <rect class="card" x="60" y="378" rx="14" width="330" height="118"/>
    <text class="name" x="82" y="412">3  Selective symmetry</text>
    <text class="small" x="82" y="444">Ignore camera observation</text>
    <text class="small" x="82" y="470">Preserve anatomical chirality</text>
  </g>
  <g>
    <rect class="card" x="435" y="378" rx="14" width="330" height="118"/>
    <text class="name" x="457" y="412">4  Constraint benchmark</text>
    <text class="small" x="457" y="444">Compare valid motion with an</text>
    <text class="small" x="457" y="470">audited kinematic violation</text>
  </g>
  <g>
    <rect class="card" x="810" y="378" rx="14" width="330" height="118"/>
    <text class="name" x="832" y="412">5  Phase hierarchy</text>
    <text class="small" x="832" y="444">Learn local, step, and</text>
    <text class="small" x="832" y="470">cycle time scales</text>
  </g>
  <g>
    <rect class="card" x="250" y="534" rx="14" width="330" height="118"/>
    <text class="name" x="272" y="568">6  Concept audit</text>
    <text class="small" x="272" y="600">Test measurement reliability,</text>
    <text class="small" x="272" y="626">leakage, and interventions</text>
  </g>
  <g>
    <rect class="card" x="620" y="534" rx="14" width="330" height="118"/>
    <text class="name" x="642" y="568">7  Paired operators</text>
    <text class="small" x="642" y="600">Strong test, but paired data</text>
    <text class="small" x="642" y="626">and approvals are not ready</text>
  </g>
  <text class="small" x="60" y="690">Decision rule: require a stable central effect, a shortcut control, a simple remedy, and one external replication.</text>
</svg>
