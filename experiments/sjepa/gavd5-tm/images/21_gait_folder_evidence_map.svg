<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Evidence map for the complete worldmodels gait folder</title>
  <desc id="desc">The folder contains seven proposal scaffolds, confounded historical results, a corrected but untrained protocol, same-release Phase 3 feasibility, and no independent confirmation cohort. Partial tutorials, literature, and neuroscience tables provide supporting knowledge rather than replications.</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.ink{fill:#20364e}.muted{fill:#607284}.line{stroke:#8aa0af;stroke-width:2;fill:none}.proposal{fill:#fff;stroke:#9eacb7;stroke-width:2}.history{fill:#fff7e8;stroke:#c58a2c;stroke-width:3}.corrected{fill:#edf4f8;stroke:#2f6f99;stroke-width:3}.blocked{fill:#fff1ef;stroke:#b45b4e;stroke-width:3;stroke-dasharray:8 6}.support{fill:#fff;stroke:#cad4dc;stroke-width:2}.verdict{fill:#eaf4ee;stroke:#5f9e7e;stroke-width:3}.h{font:bold 34px Arial,sans-serif;fill:#20364e}.sub{font:18px Arial,sans-serif;fill:#607284}.stage{font:bold 17px Arial,sans-serif;fill:#2f6f99}.name{font:bold 21px Arial,sans-serif;fill:#20364e}.body{font:17px Arial,sans-serif;fill:#20364e}.small{font:16px Arial,sans-serif;fill:#607284}.note{font:bold 17px Arial,sans-serif;fill:#20364e}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8aa0af"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="h" x="60" y="58">What the complete gait folder actually establishes</text>
  <text class="sub" x="60" y="90">Audit progression, not one experiment lineage. Evidence maturity matters more than file count.</text>

  <path class="line" marker-end="url(#arrow)" d="M310 258 H334"/>
  <path class="line" marker-end="url(#arrow)" d="M590 258 H614"/>
  <path class="line" marker-end="url(#arrow)" d="M870 258 H894"/>

  <g>
    <rect class="proposal" x="60" y="128" rx="16" width="250" height="260"/>
    <text class="stage" x="82" y="160">1  PROPOSAL SCAFFOLDS</text>
    <text class="name" x="82" y="196">Seven top-level ideas</text>
    <text class="body" x="82" y="232">Skeleton-JEPA and concept,</text>
    <text class="body" x="82" y="256">multimodal and hierarchical,</text>
    <text class="body" x="82" y="280">anomaly, cross-view, RGB</text>
    <text class="small" x="82" y="328">Executable notebooks</text>
    <text class="small" x="82" y="352">No saved outputs</text>
  </g>

  <g>
    <rect class="history" x="340" y="128" rx="16" width="250" height="260"/>
    <text class="stage" x="362" y="160">2  HISTORICAL EVIDENCE</text>
    <text class="name" x="362" y="196">Three stored studies</text>
    <text class="body" x="362" y="232">Leakage and artifact hazards</text>
    <text class="body" x="362" y="256">Probe-family clue</text>
    <text class="body" x="362" y="280">Locked result inconclusive</text>
    <text class="small" x="362" y="328">Ablations hash-bound</text>
    <text class="small" x="362" y="352">Enhanced identities lost</text>
  </g>

  <g>
    <rect class="corrected" x="620" y="128" rx="16" width="250" height="260"/>
    <text class="stage" x="642" y="160">3  CORRECTED PROTOCOL</text>
    <text class="name" x="642" y="196">gavd3-repr</text>
    <text class="body" x="642" y="232">Full valid observed target</text>
    <text class="body" x="642" y="256">Sample-axis health</text>
    <text class="body" x="642" y="280">Matched controls and hashes</text>
    <text class="small" x="642" y="328">Smoke-tested</text>
    <text class="small" x="642" y="352">REAL model and eval pending</text>
  </g>

  <g>
    <rect class="blocked" x="900" y="128" rx="16" width="240" height="260"/>
    <text class="stage" x="922" y="160">4  FUTURE DATA</text>
    <text class="name" x="922" y="196">Phase 3 and cohort</text>
    <text class="body" x="922" y="232">553 candidates / 85 videos</text>
    <text class="body" x="922" y="256">Five-class bottleneck: 9</text>
    <text class="body" x="922" y="280">Independent cohort absent</text>
    <text class="small" x="922" y="328">Same-release feasibility</text>
    <text class="small" x="922" y="352">Rights and IDs unresolved</text>
  </g>

  <text class="stage" x="60" y="442">SUPPORTING KNOWLEDGE, NOT ADDITIONAL REPLICATIONS</text>
  <g>
    <rect class="support" x="60" y="466" rx="14" width="330" height="112"/>
    <text class="name" x="82" y="500">gavd4 partial runs</text>
    <text class="small" x="82" y="530">666 sequences / 103 video IDs</text>
    <text class="small" x="82" y="554">S-JEPA interrupted; MAMP contaminated</text>
  </g>
  <g>
    <rect class="support" x="435" y="466" rx="14" width="330" height="112"/>
    <text class="name" x="457" y="500">Neuroscience tables</text>
    <text class="small" x="457" y="530">PD and stroke partly graded</text>
    <text class="small" x="457" y="554">CP and myopathic are templates</text>
  </g>
  <g>
    <rect class="support" x="810" y="466" rx="14" width="330" height="112"/>
    <text class="name" x="832" y="500">Literature synthesis</text>
    <text class="small" x="832" y="530">Match targets, masks, time,</text>
    <text class="small" x="832" y="554">compute, and evaluation</text>
  </g>

  <rect class="verdict" x="190" y="620" rx="16" width="820" height="62"/>
  <text class="note" x="600" y="658" text-anchor="middle">No folder result validates a top direction; corrected runs and external evidence remain necessary.</text>
</svg>
