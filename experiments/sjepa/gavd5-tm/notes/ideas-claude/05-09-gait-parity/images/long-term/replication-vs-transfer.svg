<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Replication and transfer ask different questions</title>
  <desc id="desc">Replication carries a locked recipe to a new cohort and refits the model there. Transfer carries trained weights to a new cohort with no refitting. They answer different questions and must not be called the same thing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <marker id="open-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#b45309" stroke-width="2"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .body { font: 19px Arial, sans-serif; fill: #1e293b; }
      .small { font: 17px Arial, sans-serif; fill: #334155; }
      .bar { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .check { font: 700 26px Arial, sans-serif; fill: #15803d; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="48" text-anchor="middle" class="title">Is the recipe repeating, or are the weights travelling?</text>
  <text x="500" y="79" text-anchor="middle" class="body">Both use a new cohort. The crucial difference is what crosses the boundary.</text>

  <rect x="48" y="128" width="218" height="332" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="157" y="166" text-anchor="middle" class="heading">COHORT A</text>
  <text x="157" y="195" text-anchor="middle" class="small">first group of participants</text>
  <rect x="78" y="226" width="158" height="66" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="157" y="254" text-anchor="middle" class="body">locked recipe</text>
  <text x="157" y="278" text-anchor="middle" class="small">target, splits, metrics</text>
  <rect x="78" y="330" width="158" height="66" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="157" y="358" text-anchor="middle" class="body">trained weights</text>
  <text x="157" y="382" text-anchor="middle" class="small">learned on cohort A</text>

  <path d="M266 259 H350" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M236 363 H300 V455 H390" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <text x="307" y="244" text-anchor="middle" class="small">recipe travels</text>
  <text x="319" y="438" text-anchor="middle" class="small">weights travel</text>

  <rect x="370" y="110" width="565" height="181" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="397" y="149" class="check">✓</text>
  <text x="435" y="148" class="heading">REPLICATION: REFIT ON COHORT B</text>
  <text x="405" y="185" class="body">Carry the frozen recipe to new people.</text>
  <rect x="405" y="210" width="148" height="51" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="479" y="241" text-anchor="middle" class="body">same recipe</text>
  <path d="M553 235 H596" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="606" y="210" width="148" height="51" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="680" y="241" text-anchor="middle" class="body">refit on B</text>
  <path d="M754 235 H797" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="807" y="210" width="96" height="51" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="855" y="241" text-anchor="middle" class="body">test B</text>
  <text x="652" y="280" text-anchor="middle" class="small">Question: does the result reappear under the same plan?</text>

  <rect x="370" y="329" width="565" height="181" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="397" y="368" class="heading">TRANSFER: DO NOT REFIT ON COHORT B</text>
  <text x="405" y="405" class="body">Carry the trained weights to new people as they are.</text>
  <rect x="405" y="430" width="148" height="51" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="479" y="461" text-anchor="middle" class="body">old weights</text>
  <path d="M553 455 H596" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="606" y="430" width="148" height="51" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="680" y="461" text-anchor="middle" class="body">no refit ⊘</text>
  <path d="M754 455 H797" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="807" y="430" width="96" height="51" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="855" y="461" text-anchor="middle" class="body">test B</text>
  <text x="652" y="500" text-anchor="middle" class="small">Question: do these learned weights travel to new people?</text>
  <rect x="130" y="548" width="740" height="54" rx="14" fill="#0f172a"/>
  <text x="500" y="582" text-anchor="middle" class="bar">Replication repeats the recipe. Transfer reuses the trained weights.</text>
</svg>
