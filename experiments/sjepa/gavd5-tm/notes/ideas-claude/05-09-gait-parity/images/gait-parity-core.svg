<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">A body mirror and a camera move have different consequences</title>
  <desc id="desc">Starting from the same asymmetric walk, a synthetic anatomical mirror swaps left and right and reverses the signed propulsion score from negative 0.41 to positive 0.41. A new camera view leaves the body labels and score unchanged after body-frame alignment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <marker id="open-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#b45309" stroke-width="2"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .body { font: 19px Arial, sans-serif; fill: #1e293b; }
      .small { font: 17px Arial, sans-serif; fill: #334155; }
      .number { font: 700 22px Arial, sans-serif; }
      .bar { font: 700 20px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="48" text-anchor="middle" class="title">A body mirror and a camera move are different</text>
  <text x="500" y="79" text-anchor="middle" class="body">Both begin with the same walk. Only one exchanges the person’s body sides.</text>

  <rect x="45" y="118" width="270" height="420" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="180" y="154" text-anchor="middle" class="heading">AS-RECORDED WALK</text>
  <line x1="180" y1="174" x2="180" y2="345" stroke="#334155" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="180" y="365" text-anchor="middle" class="small">body midline</text>
  <path d="M180 199 V291 M180 220 L132 248 L108 232 M180 220 L229 258 L242 294 M180 291 L136 344 L122 399 M180 291 L220 347 L244 389" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="184" r="15" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="100" y="414" class="heading">L</text>
  <text x="246" y="404" class="heading">R</text>
  <line x1="100" y1="431" x2="260" y2="431" stroke="#334155" stroke-width="2"/>
  <path d="M100 431 H260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="454" text-anchor="middle" class="small">side-to-side coordinate</text>
  <text x="180" y="493" text-anchor="middle" class="body">J<tspan baseline-shift="sub" font-size="14">R</tspan> = 8, J<tspan baseline-shift="sub" font-size="14">L</tspan> = 12</text>
  <text x="180" y="525" text-anchor="middle" class="number" fill="#1d4ed8">ln(8 / 12) = −0.41</text>

  <path d="M315 255 C350 255 360 255 394 255" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <text x="360" y="210" text-anchor="middle" class="small">mirror body</text>
  <text x="360" y="231" text-anchor="middle" class="small">swap L/R</text>
  <rect x="410" y="110" width="260" height="275" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="540" y="146" text-anchor="middle" class="heading">REFLECTED WALK</text>
  <line x1="540" y1="164" x2="540" y2="255" stroke="#334155" stroke-width="2" stroke-dasharray="6 3"/>
  <path d="M540 182 V241 M540 197 L588 225 L612 209 M540 197 L491 235 L478 271 M540 241 L584 278 L598 303 M540 241 L500 281 L476 293" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="540" cy="169" r="13" fill="#ffffff" stroke="#b45309" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="470" y="306" class="heading">R</text>
  <text x="602" y="316" class="heading">L</text>
  <text x="540" y="342" text-anchor="middle" class="body">J<tspan baseline-shift="sub" font-size="14">R</tspan> = 12, J<tspan baseline-shift="sub" font-size="14">L</tspan> = 8</text>
  <text x="540" y="370" text-anchor="middle" class="number" fill="#b45309">ln(12 / 8) = +0.41</text>

  <path d="M315 354 C355 399 360 420 394 420" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="360" y="390" text-anchor="middle" class="small">new view</text>
  <text x="360" y="411" text-anchor="middle" class="small">same L/R</text>
  <rect x="410" y="400" width="260" height="104" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="440" y="424" class="heading">NEW VIEW</text>
  <path d="M563 421 L593 406 L623 421 L593 436 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="593" cy="421" r="7" fill="#1d4ed8"/>
  <path d="M460 454 V477 M460 461 L442 471 M460 461 L478 471 M460 477 L445 493 M460 477 L476 493" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <text x="438" y="503" class="small">L</text><text x="478" y="503" class="small">R</text>
  <text x="625" y="463" text-anchor="middle" class="body">J<tspan baseline-shift="sub" font-size="14">R</tspan> = 8, J<tspan baseline-shift="sub" font-size="14">L</tspan> = 12</text>
  <text x="625" y="491" text-anchor="middle" class="number" fill="#1d4ed8">about −0.41</text>

  <rect x="730" y="140" width="225" height="315" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="842" y="177" text-anchor="middle" class="heading">KEEP THESE SEPARATE</text>
  <text x="756" y="220" class="body">Body mirror:</text>
  <text x="756" y="247" class="small">swap left and right</text>
  <text x="756" y="270" class="small">score flips exactly</text>
  <line x1="756" y1="293" x2="928" y2="293" stroke="#cbd5e1" stroke-width="1"/>
  <text x="756" y="328" class="body">Camera move:</text>
  <text x="756" y="355" class="small">same anatomy</text>
  <text x="756" y="378" class="small">score stays about the same</text>
  <text x="756" y="421" class="small">After body-frame alignment.</text>
  <rect x="130" y="548" width="740" height="54" rx="14" fill="#0f172a"/>
  <text x="500" y="582" text-anchor="middle" class="bar">A body mirror flips the signed score. A camera move should not.</text>
</svg>
