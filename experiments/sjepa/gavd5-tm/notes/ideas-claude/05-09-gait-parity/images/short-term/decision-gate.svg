<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">The prototype can end in four honest decisions</title>
  <desc id="desc">The GaitParity Prototype advances to the full study only when its instrument works and the exact odd output has a credible benefit. Revise, stop, and inconclusive are equally legitimate evidence-based exits.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <marker id="open-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#b45309" stroke-width="2"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .body { font: 19px Arial, sans-serif; fill: #1e293b; }
      .small { font: 17px Arial, sans-serif; fill: #334155; }
      .bar { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .check { font: 700 26px Arial, sans-serif; fill: #15803d; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="619" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="48" text-anchor="middle" class="title">The prototype ends when its evidence earns a decision</text>
  <text x="500" y="79" text-anchor="middle" class="body">It is not a calendar deadline. It is a test of whether the harder study is justified.</text>

  <rect x="35" y="145" width="285" height="172" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="186" y="181" text-anchor="middle" class="heading">PROTOTYPE EVIDENCE</text>
  <text x="177" y="216" text-anchor="middle" class="body">Mirror, target, and split</text>
  <text x="177" y="242" text-anchor="middle" class="body">checks pass. Then compare</text>
  <text x="177" y="268" text-anchor="middle" class="body">free two-view with exact odd.</text>
  <text x="177" y="296" text-anchor="middle" class="small">Held-out participants decide.</text>
  <path d="M320 231 H379" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M500 130 L620 230 L500 330 L380 230 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="500" y="204" text-anchor="middle" class="heading">WHAT DID THE</text>
  <text x="500" y="230" text-anchor="middle" class="heading">EVIDENCE EARN?</text>
  <text x="500" y="258" text-anchor="middle" class="small">pre-set checks, not hope</text>

  <path d="M585 177 C680 120 741 142 758 170" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="660" y="108" text-anchor="middle" class="small">sound target and clear</text>
  <text x="660" y="129" text-anchor="middle" class="small">benefit or mirror failure</text>
  <rect x="746" y="112" width="205" height="150" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="774" y="151" class="check">✓</text>
  <text x="851" y="151" text-anchor="middle" class="heading">GO</text>
  <text x="851" y="185" text-anchor="middle" class="body">Build a predictive or</text>
  <text x="851" y="209" text-anchor="middle" class="small">structure-only encoder study.</text>
  <text x="851" y="237" text-anchor="middle" class="small">Claim stays at earned tier.</text>

  <path d="M620 230 H710" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <text x="666" y="214" text-anchor="middle" class="small">inconclusive</text>
  <rect x="746" y="302" width="205" height="150" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="851" y="341" text-anchor="middle" class="heading">REVISE</text>
  <text x="851" y="375" text-anchor="middle" class="body">Repair target or data,</text>
  <text x="851" y="399" text-anchor="middle" class="body">then rerun the fixed plan.</text>
  <text x="851" y="427" text-anchor="middle" class="small">Claim stays narrow.</text>
  <path d="M586 285 C683 354 718 372 746 372" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#open-arrow)"/>
  <text x="649" y="341" text-anchor="middle" class="small">target too noisy</text>

  <path d="M432 309 C370 354 304 385 250 405" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="312" y="365" text-anchor="middle" class="small">no benefit, narrow interval</text>
  <rect x="68" y="405" width="305" height="107" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="220" y="443" text-anchor="middle" class="heading">STOP</text>
  <text x="220" y="465" text-anchor="middle" class="small">Report: no added benefit.</text>
  <text x="220" y="487" text-anchor="middle" class="small">That is a real result,</text>
  <text x="220" y="507" text-anchor="middle" class="small">not a failed project.</text>
  <path d="M500 330 V401" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="519" y="370" class="small">interval too wide</text>
  <rect x="409" y="405" width="277" height="107" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="547" y="443" text-anchor="middle" class="heading">INCONCLUSIVE</text>
  <text x="547" y="471" text-anchor="middle" class="body">Interval wider than the pre-set</text>
  <text x="547" y="494" text-anchor="middle" class="body">practical margin.</text>
  <rect x="130" y="548" width="740" height="54" rx="14" fill="#0f172a"/>
  <text x="500" y="582" text-anchor="middle" class="bar">GO, REVISE, STOP, and INCONCLUSIVE are honest decisions.</text>
</svg>
