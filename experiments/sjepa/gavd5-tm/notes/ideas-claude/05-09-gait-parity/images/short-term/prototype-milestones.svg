<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Six evidence gates lead to a prototype decision</title>
  <desc id="desc">The prototype moves through six gates: freeze the plan, prove the instrument, establish a baseline, test held-out participants, try to break the result, and decide. A failure narrows the claim or stops the study rather than changing the question.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}.head{font:700 19px Arial,sans-serif;fill:#0f172a}
      .body{font:17px Arial,sans-serif;fill:#1e293b}.note{font:17px Arial,sans-serif;fill:#334155}
      .tag{font:700 17px Arial,sans-serif;fill:#fff}.gate{font:700 15px Arial,sans-serif;fill:#0f172a}
      .bar{font:700 20px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1000" height="680" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="999" height="679" fill="none" stroke="#cbd5e1"/>
  <text x="500" y="45" text-anchor="middle" class="title">When is the prototype ready to move on?</text>
  <text x="500" y="74" text-anchor="middle" class="note">Evidence gates, not calendar dates, decide the next step.</text>

  <path d="M180 162 H198 M335 162 H353 M490 162 H508 M645 162 H663 M800 162 H818" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g>
    <rect x="45" y="108" width="135" height="108" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="56" y="120" width="42" height="27" rx="10" fill="#334155"/><text x="77" y="139" text-anchor="middle" class="tag">P0</text>
    <text x="112" y="169" text-anchor="middle" class="head">FREEZE</text><text x="112" y="192" text-anchor="middle" class="body">objects and</text><text x="112" y="212" text-anchor="middle" class="body">claims</text>
    <path d="M112 237 L142 267 L112 297 L82 267 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="112" y="272" text-anchor="middle" class="gate">frozen?</text>
  </g>
  <g>
    <rect x="200" y="108" width="135" height="108" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="211" y="120" width="42" height="27" rx="10" fill="#334155"/><text x="232" y="139" text-anchor="middle" class="tag">P1</text>
    <text x="267" y="169" text-anchor="middle" class="head">PROVE</text><text x="267" y="192" text-anchor="middle" class="body">the mirror</text><text x="267" y="212" text-anchor="middle" class="body">instrument</text>
    <path d="M267 237 L297 267 L267 297 L237 267 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="267" y="272" text-anchor="middle" class="gate">pass?</text>
  </g>
  <g>
    <rect x="355" y="108" width="135" height="108" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="366" y="120" width="42" height="27" rx="10" fill="#334155"/><text x="387" y="139" text-anchor="middle" class="tag">P2</text>
    <text x="422" y="169" text-anchor="middle" class="head">BASELINE</text><text x="422" y="192" text-anchor="middle" class="body">same folds,</text><text x="422" y="212" text-anchor="middle" class="body">same seeds</text>
    <path d="M422 237 L452 267 L422 297 L392 267 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="422" y="272" text-anchor="middle" class="gate">matched?</text>
  </g>
  <g>
    <rect x="510" y="108" width="135" height="108" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="521" y="120" width="42" height="27" rx="10" fill="#334155"/><text x="542" y="139" text-anchor="middle" class="tag">P3</text>
    <text x="577" y="169" text-anchor="middle" class="head">TEST</text><text x="577" y="192" text-anchor="middle" class="body">held-out</text><text x="577" y="212" text-anchor="middle" class="body">people</text>
    <path d="M577 237 L607 267 L577 297 L547 267 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="577" y="272" text-anchor="middle" class="gate">one each?</text>
  </g>
  <g>
    <rect x="665" y="108" width="135" height="108" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="676" y="120" width="42" height="27" rx="10" fill="#334155"/><text x="697" y="139" text-anchor="middle" class="tag">P4</text>
    <text x="732" y="169" text-anchor="middle" class="head">BREAK IT</text><text x="732" y="192" text-anchor="middle" class="body">controls and</text><text x="732" y="212" text-anchor="middle" class="body">corruption</text>
    <path d="M732 237 L762 267 L732 297 L702 267 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="732" y="272" text-anchor="middle" class="gate">fail?</text>
  </g>
  <g>
    <rect x="820" y="108" width="135" height="108" rx="14" fill="#fff" stroke="#334155" stroke-width="2"/>
    <rect x="831" y="120" width="42" height="27" rx="10" fill="#334155"/><text x="852" y="139" text-anchor="middle" class="tag">P5</text>
    <text x="887" y="169" text-anchor="middle" class="head">DECIDE</text><text x="887" y="192" text-anchor="middle" class="body">go, revise,</text><text x="887" y="212" text-anchor="middle" class="body">or stop</text>
    <path d="M887 237 L917 267 L887 297 L857 267 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="887" y="272" text-anchor="middle" class="gate">clear?</text>
  </g>

  <text x="500" y="335" text-anchor="middle" class="head">A NO AT ANY GATE</text>
  <path d="M112 297 V405 M267 297 V405 M422 297 V405 M577 297 V405 M732 297 V405 M887 297 V405" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M112 405 H887" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M500 405 V440" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <rect x="160" y="447" width="680" height="86" rx="14" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <text x="500" y="480" text-anchor="middle" class="head">NARROW THE CLAIM, OR STOP</text>
  <text x="500" y="510" text-anchor="middle" class="body">Fix a real error, revise the question, or report a clean null.</text>
  <rect x="130" y="584" width="740" height="44" rx="14" fill="#0f172a"/>
  <text x="500" y="613" text-anchor="middle" class="bar">A failed gate changes the claim, not the story you want to tell.</text>
</svg>
