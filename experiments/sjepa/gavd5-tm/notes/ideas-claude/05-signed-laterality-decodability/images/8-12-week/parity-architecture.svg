<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Parity-aware encoder separates shared gait and signed laterality</title>
  <desc id="desc">A skeleton and its anatomical reflection pass through shared-weight branches. Reflection swaps the branches. Their sum forms an even channel and their difference forms an odd channel.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52677E"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0F2440}
      .sub{font:17px Arial,sans-serif;fill:#52677E}
      .head{font:700 18px Arial,sans-serif;fill:#0F2440}
      .body{font:17px Arial,sans-serif;fill:#33475E}
      .small{font:16px Arial,sans-serif;fill:#52677E}
      .formula{font:700 18px Arial,sans-serif;fill:#0F2440}
      .foot{font:700 16px Arial,sans-serif;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F7F5EF"/>
  <text x="55" y="54" class="title">A parity-aware encoder separates shared gait from signed laterality</text>
  <text x="55" y="84" class="sub">Reflection swaps shared branches. Their sum is even; their difference is odd.</text>

  <line x1="230" y1="205" x2="290" y2="205" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="465" x2="290" y2="465" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="205" x2="520" y2="205" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="465" x2="520" y2="465" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M680 205 H720 V280" fill="none" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M680 465 H720 V390" fill="none" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M880 305 H915 V225 H930" fill="none" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M880 365 H915 V465 H930" fill="none" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="228" x2="248" y2="442" stroke="#755A9F" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="380" y1="245" x2="380" y2="425" stroke="#6F7E8C" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="60" y="170" width="170" height="70" rx="12" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="145" y="212" text-anchor="middle" class="head">Skeleton x</text>
  <rect x="60" y="430" width="170" height="70" rx="12" fill="#ECE6F6" stroke="#755A9F" stroke-width="2"/>
  <text x="145" y="472" text-anchor="middle" class="head">Mirror Mx</text>
  <text x="260" y="341" class="small" transform="rotate(-90 260 341)">M swaps inputs</text>

  <rect x="290" y="170" width="180" height="70" rx="12" fill="#EEF1F4" stroke="#6F7E8C" stroke-width="2"/>
  <text x="380" y="212" text-anchor="middle" class="head">Shared φ</text>
  <rect x="290" y="430" width="180" height="70" rx="12" fill="#EEF1F4" stroke="#6F7E8C" stroke-width="2"/>
  <text x="380" y="472" text-anchor="middle" class="head">Shared φ</text>
  <rect x="319" y="318" width="122" height="34" rx="17" fill="#FFFFFF" stroke="#6F7E8C"/>
  <text x="380" y="340" text-anchor="middle" class="small">same weights</text>

  <rect x="520" y="170" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#2F6F99" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" class="formula">h₀ = φ(x)</text>
  <rect x="520" y="430" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#755A9F" stroke-width="2"/>
  <text x="600" y="472" text-anchor="middle" class="formula">h₁ = φ(Mx)</text>

  <rect x="720" y="260" width="160" height="160" rx="14" fill="#EEF1F4" stroke="#6F7E8C" stroke-width="2"/>
  <text x="800" y="298" text-anchor="middle" class="head">PAIRED STATE</text>
  <text x="800" y="333" text-anchor="middle" class="formula">[h₀, h₁]</text>
  <text x="800" y="367" text-anchor="middle" class="body">Every layer keeps</text>
  <text x="800" y="391" text-anchor="middle" class="body">the swap rule</text>

  <text x="900" y="214" text-anchor="end" class="small">SUM</text>
  <rect x="930" y="150" width="220" height="150" rx="14" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="1040" y="184" text-anchor="middle" class="head">EVEN CHANNEL</text>
  <text x="1040" y="220" text-anchor="middle" class="formula">e = (h₀ + h₁) / 2</text>
  <text x="1040" y="249" text-anchor="middle" class="body">e(Mx) = e(x)</text>
  <text x="1040" y="274" text-anchor="middle" class="body">shared gait</text>

  <text x="900" y="486" text-anchor="end" class="small">DIFF</text>
  <rect x="930" y="390" width="220" height="150" rx="14" fill="#ECE6F6" stroke="#755A9F" stroke-width="2"/>
  <text x="1040" y="424" text-anchor="middle" class="head">ODD CHANNEL</text>
  <text x="1040" y="460" text-anchor="middle" class="formula">o = (h₀ − h₁) / 2</text>
  <text x="1040" y="489" text-anchor="middle" class="body">o(Mx) = −o(x)</text>
  <text x="1040" y="514" text-anchor="middle" class="body">signed laterality</text>

  <rect x="60" y="620" width="1090" height="58" rx="12" fill="#20364E"/>
  <text x="605" y="655" text-anchor="middle" class="foot">Exact parity is a structural guarantee. Predictive and clinical value still require held-out evidence.</text>
</svg>
