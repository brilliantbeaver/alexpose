<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Leakage-safe data flow and twelve-week execution</title>
  <desc id="desc">AMASS pretraining and inner-fold stroke participants feed a frozen protocol. Held-out stroke participants only receive frozen predictions, with no return path. Gated Parkinson disease data open after the stroke protocol is frozen. A six-stage timeline marks week 8 as the minimum complete study.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#52677E"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#47775D"/>
    </marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#926300"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0F2440}
      .sub{font:17px Arial,sans-serif;fill:#52677E}
      .head{font:700 18px Arial,sans-serif;fill:#0F2440}
      .body{font:16px Arial,sans-serif;fill:#33475E}
      .small{font:15px Arial,sans-serif;fill:#52677E}
      .week{font:700 16px Arial,sans-serif;fill:#0F2440}
      .lighthead{font:700 18px Arial,sans-serif;fill:#FFFFFF}
      .lightbody{font:16px Arial,sans-serif;fill:#FFFFFF}
      .foot{font:16px Arial,sans-serif;fill:#52677E}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F7F5EF"/>
  <text x="50" y="52" class="title">Leakage-safe data flow and 8 to 12 week execution</text>
  <text x="50" y="81" class="sub">Training, clinical tuning, outer prediction, and replication use distinct participant roles.</text>

  <line x1="265" y1="161" x2="320" y2="161" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M535 161 H575 V190 H620" fill="none" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M173 272 V210 H575 V225 H620" fill="none" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M805 185 H850 V155 H900" fill="none" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M408 345 V385 H1175 V155 H1150" fill="none" stroke="#47775D" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M805 225 H850 V315 H900" fill="none" stroke="#926300" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowAmber)"/>
  <rect x="915" y="231" width="220" height="26" rx="13" fill="#FFF3D8" stroke="#926300"/>
  <text x="1025" y="249" text-anchor="middle" class="small">PD AFTER FREEZE + GATE</text>

  <rect x="50" y="126" width="215" height="70" rx="12" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="158" y="155" text-anchor="middle" class="head">AMASS participants</text>
  <text x="158" y="178" text-anchor="middle" class="body">Evaluation cohorts excluded</text>

  <rect x="320" y="126" width="215" height="70" rx="12" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="428" y="155" text-anchor="middle" class="head">Pretrain A and F</text>
  <text x="428" y="178" text-anchor="middle" class="body">Attach A-based heads later</text>

  <rect x="50" y="225" width="485" height="140" rx="14" fill="#E6F2EA" stroke="#47775D" stroke-width="2"/>
  <text x="70" y="254" class="head">Each stroke outer fold</text>
  <rect x="70" y="272" width="205" height="73" rx="10" fill="#FFFFFF" stroke="#47775D" stroke-width="1.5"/>
  <text x="173" y="300" text-anchor="middle" class="head">Inner training people</text>
  <text x="173" y="327" text-anchor="middle" class="body">Fit and tune here</text>
  <rect x="305" y="272" width="205" height="73" rx="10" fill="#FFFFFF" stroke="#47775D" stroke-width="2.5"/>
  <text x="408" y="300" text-anchor="middle" class="head">Held-out people</text>
  <text x="408" y="327" text-anchor="middle" class="body">Predict only, no return</text>

  <rect x="620" y="145" width="185" height="110" rx="14" fill="#20364E"/>
  <text x="713" y="180" text-anchor="middle" class="lighthead">FROZEN PROTOCOL</text>
  <text x="713" y="210" text-anchor="middle" class="lightbody">Models, target, splits</text>
  <text x="713" y="235" text-anchor="middle" class="lightbody">metrics, and claims</text>

  <rect x="900" y="110" width="250" height="90" rx="14" fill="#E6F2EA" stroke="#47775D" stroke-width="2.5"/>
  <text x="1025" y="155" text-anchor="middle" class="head">Stroke outer predictions</text>
  <text x="1025" y="181" text-anchor="middle" class="body">One per held-out participant</text>

  <rect x="900" y="270" width="250" height="90" rx="14" fill="#ECE6F6" stroke="#755A9F" stroke-width="2.5"/>
  <text x="1025" y="304" text-anchor="middle" class="head">PD gated replication</text>
  <text x="1025" y="330" text-anchor="middle" class="body">No architecture tuning</text>

  <text x="50" y="413" class="head">EXECUTION</text>
  <text x="1150" y="413" text-anchor="end" class="small">Weeks 9 to 12 add the full replication claim.</text>

  <rect x="50" y="445" width="170" height="130" rx="12" fill="#EEF1F4" stroke="#6F7E8C" stroke-width="2"/>
  <text x="68" y="476" class="week">WEEKS 1 TO 2</text>
  <text x="68" y="508" class="body">
    <tspan x="68" dy="0">Adapters, force QC</tspan>
    <tspan x="68" dy="22">splits, claim freeze</tspan>
  </text>

  <rect x="235" y="445" width="170" height="130" rx="12" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="253" y="476" class="week">WEEKS 3 TO 4</text>
  <text x="253" y="508" class="body">
    <tspan x="253" dy="0">Baselines and</tspan>
    <tspan x="253" dy="22">C₂ implementation</tspan>
  </text>

  <rect x="420" y="445" width="170" height="130" rx="12" fill="#ECE6F6" stroke="#755A9F" stroke-width="2"/>
  <text x="438" y="476" class="week">WEEKS 5 TO 6</text>
  <text x="438" y="508" class="body">
    <tspan x="438" dy="0">Matched five-seed</tspan>
    <tspan x="438" dy="22">AMASS pretraining</tspan>
  </text>

  <rect x="605" y="435" width="170" height="140" rx="12" fill="#E6F2EA" stroke="#20364E" stroke-width="3"/>
  <text x="623" y="466" class="week">WEEKS 7 TO 8</text>
  <text x="623" y="498" class="body">
    <tspan x="623" dy="0">Stroke and MoVi</tspan>
    <tspan x="623" dy="22">robustness tests</tspan>
  </text>
  <rect x="623" y="535" width="135" height="26" rx="13" fill="#20364E"/>
  <text x="690" y="553" text-anchor="middle" class="lightbody">MINIMUM STUDY</text>

  <rect x="790" y="445" width="170" height="130" rx="12" fill="#ECE6F6" stroke="#755A9F" stroke-width="2"/>
  <text x="808" y="476" class="week">WEEKS 9 TO 10</text>
  <text x="808" y="508" class="body">
    <tspan x="808" dy="0">PD gate + test</tspan>
    <tspan x="808" dy="22">GaitRec side check</tspan>
  </text>

  <rect x="975" y="445" width="175" height="130" rx="12" fill="#20364E" stroke="#20364E" stroke-width="2"/>
  <text x="993" y="476" class="lighthead">WEEKS 11 TO 12</text>
  <text x="993" y="508" class="lightbody">
    <tspan x="993" dy="0">Statistics, audit</tspan>
    <tspan x="993" dy="22">paper, release</tspan>
  </text>

  <text x="600" y="629" text-anchor="middle" class="foot">Eight GPUs run paired seeds in parallel. Held-out and PD data never flow back into model selection.</text>
</svg>
