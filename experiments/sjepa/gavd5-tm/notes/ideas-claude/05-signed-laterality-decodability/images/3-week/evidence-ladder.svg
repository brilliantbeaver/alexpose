<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three-week evidence map from pilot retention to concurrent validity</title>
  <desc id="desc">GAVD provides an internal transductive pilot, optional day-three gated MoVi data test geometry on unseen actors, and the stroke cohort provides participant-held-out concurrent evidence with an independent force target.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52677E"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0F2440}
      .sub{font:17px Arial,sans-serif;fill:#52677E}
      .head{font:700 20px Arial,sans-serif;fill:#0F2440}
      .tag{font:700 15px Arial,sans-serif;fill:#0F2440}
      .body{font:17px Arial,sans-serif;fill:#33475E}
      .claim{font:700 17px Arial,sans-serif;fill:#0F2440}
      .arrowlabel{font:15px Arial,sans-serif;fill:#52677E}
      .foot{font:700 16px Arial,sans-serif;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F7F5EF"/>
  <text x="55" y="54" class="title">Three-week evidence map</text>
  <text x="55" y="84" class="sub">Each dataset answers one question and licenses one bounded conclusion.</text>

  <line x1="360" y1="340" x2="435" y2="340" stroke="#52677E" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <line x1="760" y1="340" x2="835" y2="340" stroke="#52677E" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="398" y="317" text-anchor="middle" class="arrowlabel">same M</text>
  <text x="798" y="307" text-anchor="middle" class="arrowlabel">frozen schema</text>
  <text x="798" y="326" text-anchor="middle" class="arrowlabel">and code</text>

  <rect x="50" y="125" width="310" height="430" rx="16" fill="#F7E7D8" stroke="#B85C2F" stroke-width="2"/>
  <text x="76" y="166" class="head">1  GAVD pilot</text>
  <rect x="76" y="186" width="134" height="28" rx="14" fill="#FFF3D8" stroke="#926300"/>
  <text x="143" y="205" text-anchor="middle" class="tag">INTERNAL ONLY</text>
  <text x="76" y="252" class="body">
    <tspan x="76" dy="0">96 local sequences</tspan>
    <tspan x="76" dy="25">18 source videos</tspan>
    <tspan x="76" dy="25">Historical encoder exposure</tspan>
  </text>
  <line x1="76" y1="342" x2="334" y2="342" stroke="#B85C2F" stroke-width="1.5"/>
  <text x="76" y="379" class="body">
    <tspan x="76" dy="0">Target: signed coordinate</tspan>
    <tspan x="76" dy="23">excursion from input</tspan>
  </text>
  <text x="76" y="462" class="claim">
    <tspan x="76" dy="0">Licenses:</tspan>
    <tspan x="76" dy="24">representation retention</tspan>
    <tspan x="76" dy="24">in this checkpoint</tspan>
  </text>

  <rect x="450" y="125" width="310" height="430" rx="16" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="476" y="166" class="head">2  MoVi geometry</text>
  <rect x="476" y="186" width="220" height="30" rx="15" fill="#EEF1F4" stroke="#6F7E8C"/>
  <text x="586" y="207" text-anchor="middle" class="tag">OPTIONAL, DAY-3 GATED</text>
  <text x="476" y="252" class="body">
    <tspan x="476" dy="0">Unseen actors</tspan>
    <tspan x="476" dy="25">Calibrated stationary views</tspan>
    <tspan x="476" dy="25">Mocap geometry reference</tspan>
  </text>
  <line x1="476" y1="342" x2="734" y2="342" stroke="#2F6F99" stroke-width="1.5"/>
  <text x="476" y="379" class="body">
    <tspan x="476" dy="0">Separate anatomical mirror</tspan>
    <tspan x="476" dy="23">from camera view</tspan>
  </text>
  <text x="476" y="462" class="claim">
    <tspan x="476" dy="0">Licenses:</tspan>
    <tspan x="476" dy="24">external geometric</tspan>
    <tspan x="476" dy="24">validity only</tspan>
  </text>

  <rect x="850" y="125" width="300" height="430" rx="16" fill="#E6F2EA" stroke="#47775D" stroke-width="2"/>
  <text x="876" y="166" class="head">3  Stroke cohort</text>
  <rect x="876" y="186" width="165" height="28" rx="14" fill="#D3E8D9" stroke="#47775D"/>
  <text x="959" y="205" text-anchor="middle" class="tag">PRIMARY EXTERNAL</text>
  <text x="876" y="252" class="body">
    <tspan x="876" dy="0">Unseen participants</tspan>
    <tspan x="876" dy="25">Skeleton kinematics in</tspan>
    <tspan x="876" dy="25">Rechecked force target out</tspan>
  </text>
  <line x1="876" y1="342" x2="1124" y2="342" stroke="#47775D" stroke-width="1.5"/>
  <text x="876" y="371" class="body">
    <tspan x="876" dy="0">Five outer folds</tspan>
    <tspan x="876" dy="23">Grouped inner tuning</tspan>
    <tspan x="876" dy="23">30+ stroke participants pass QC</tspan>
  </text>
  <text x="876" y="462" class="claim">
    <tspan x="876" dy="0">Licenses:</tspan>
    <tspan x="876" dy="24">concurrent force evidence</tspan>
    <tspan x="876" dy="24">one clinical cohort</tspan>
  </text>

  <path d="M360 525 H395 V590 H815 V525 H850" fill="none" stroke="#47775D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="605" y="582" text-anchor="middle" class="arrowlabel">MoVi may be skipped</text>

  <rect x="50" y="600" width="1100" height="62" rx="12" fill="#20364E"/>
  <text x="600" y="637" text-anchor="middle" class="foot">Bounded claim: no diagnosis, treatment, or cross-pathology generalization.</text>
</svg>
