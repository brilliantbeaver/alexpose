<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Participant-safe splits and three-week execution plan</title>
  <desc id="desc">GAVD remains an internal source-grouped pilot. Stroke and optional MoVi data are split by participant. Five outer folds with grouped inner tuning prevent held-out participants from tuning decisions. A day-3 data-quality gate precedes model runs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52677E"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0F2440}
      .sub{font:17px Arial,sans-serif;fill:#52677E}
      .head{font:700 18px Arial,sans-serif;fill:#0F2440}
      .body{font:17px Arial,sans-serif;fill:#33475E}
      .tag{font:700 15px Arial,sans-serif;fill:#0F2440}
      .day{font:700 16px Arial,sans-serif;fill:#0F2440}
      .foot{font:16px Arial,sans-serif;fill:#52677E}
      .lightday{font:700 16px Arial,sans-serif;fill:#FFFFFF}
      .lightbody{font:17px Arial,sans-serif;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F7F5EF"/>
  <text x="55" y="54" class="title">Participant-safe splits and a 21-day execution plan</text>
  <text x="55" y="84" class="sub">Held-out people never choose a target, schema, model, or hyperparameter.</text>

  <line x1="570" y1="196" x2="630" y2="196" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="196" x2="790" y2="196" stroke="#52677E" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="55" y="125" width="290" height="225" rx="14" fill="#F7E7D8" stroke="#B85C2F" stroke-width="2"/>
  <text x="80" y="164" class="head">GAVD pilot</text>
  <text x="80" y="205" class="body">
    <tspan x="80" dy="0">Historical encoder exposure</tspan>
    <tspan x="80" dy="25">Group clips by source video</tspan>
    <tspan x="80" dy="25">Plot one dot per source</tspan>
  </text>
  <rect x="80" y="293" width="150" height="32" rx="16" fill="#FFF3D8" stroke="#926300"/>
  <text x="155" y="314" text-anchor="middle" class="tag">INTERNAL ONLY</text>

  <rect x="385" y="125" width="185" height="142" rx="14" fill="#E6F2EA" stroke="#47775D" stroke-width="2"/>
  <text x="408" y="164" class="head">Stroke registry</text>
  <text x="408" y="202" class="body">
    <tspan x="408" dy="0">One row per person</tspan>
    <tspan x="408" dy="24">All trials attached</tspan>
  </text>

  <rect x="630" y="125" width="100" height="142" rx="14" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="680" y="153" text-anchor="middle" class="tag">
    <tspan x="680" dy="0">5 OUTER</tspan>
    <tspan x="680" dy="18">FOLDS</tspan>
  </text>
  <text x="680" y="202" text-anchor="middle" class="body">
    <tspan x="680" dy="0">Grouped</tspan>
    <tspan x="680" dy="23">inner</tspan>
    <tspan x="680" dy="23">tuning</tspan>
  </text>

  <rect x="790" y="125" width="350" height="225" rx="14" fill="#E6F2EA" stroke="#47775D" stroke-width="2"/>
  <text x="815" y="164" class="head">Each outer fold</text>
  <rect x="815" y="188" width="142" height="92" rx="10" fill="#FFFFFF" stroke="#47775D" stroke-width="1.5"/>
  <text x="886" y="216" text-anchor="middle" class="tag">TRAIN SIDE</text>
  <text x="886" y="242" text-anchor="middle" class="body">Inner tuning</text>
  <text x="886" y="264" text-anchor="middle" class="body">and label subsets</text>
  <rect x="974" y="188" width="141" height="92" rx="10" fill="#FFFFFF" stroke="#47775D" stroke-width="2.5"/>
  <text x="1045" y="216" text-anchor="middle" class="tag">HELD OUT</text>
  <text x="1045" y="242" text-anchor="middle" class="body">Predict once</text>
  <text x="1045" y="264" text-anchor="middle" class="body">No return arrow</text>
  <text x="815" y="319" class="body">Aggregate to one prediction per participant.</text>

  <rect x="385" y="287" width="345" height="63" rx="12" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="557" y="313" text-anchor="middle" class="tag">OPTIONAL MOVI</text>
  <text x="557" y="336" text-anchor="middle" class="body">All views grouped by actor</text>

  <rect x="55" y="382" width="1090" height="52" rx="10" fill="#FFF3D8" stroke="#926300" stroke-width="2"/>
  <text x="600" y="414" text-anchor="middle" class="tag">DAY-3 GATE: 30+ stroke participants pass bilateral force and consistency QC, or the headline narrows</text>

  <line x1="255" y1="531" x2="275" y2="531" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="531" x2="495" y2="531" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="695" y1="531" x2="715" y2="531" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="915" y1="531" x2="935" y2="531" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="470" width="200" height="122" rx="12" fill="#EEF1F4" stroke="#6F7E8C" stroke-width="2"/>
  <text x="75" y="500" class="day">DAYS 1 TO 3</text>
  <text x="75" y="532" class="body">
    <tspan x="75" dy="0">Adapters and targets</tspan>
    <tspan x="75" dy="23">Mirror unit tests</tspan>
  </text>

  <rect x="275" y="470" width="200" height="122" rx="12" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="295" y="500" class="day">DAYS 4 TO 7</text>
  <text x="295" y="532" class="body">
    <tspan x="295" dy="0">Freeze protocol</tspan>
    <tspan x="295" dy="23">Reproduce pilot</tspan>
  </text>

  <rect x="495" y="470" width="200" height="122" rx="12" fill="#ECE6F6" stroke="#755A9F" stroke-width="2"/>
  <text x="515" y="500" class="day">DAYS 8 TO 13</text>
  <text x="515" y="532" class="body">
    <tspan x="515" dy="0">Matched runs</tspan>
    <tspan x="515" dy="23">Low-label curves</tspan>
  </text>

  <rect x="715" y="470" width="200" height="122" rx="12" fill="#E6F2EA" stroke="#47775D" stroke-width="2"/>
  <text x="735" y="500" class="day">DAYS 14 TO 17</text>
  <text x="735" y="532" class="body">
    <tspan x="735" dy="0">Corruptions</tspan>
    <tspan x="735" dy="23">Geometry checks</tspan>
  </text>

  <rect x="935" y="470" width="210" height="122" rx="12" fill="#20364E" stroke="#20364E" stroke-width="2"/>
  <text x="955" y="500" class="lightday">DAYS 18 TO 21</text>
  <text x="955" y="532" class="lightbody">
    <tspan x="955" dy="0">Locked inference</tspan>
    <tspan x="955" dy="23">Audit and paper</tspan>
  </text>

  <text x="600" y="647" text-anchor="middle" class="foot">Eight H100s shorten matched runs. They do not shorten data validation or protocol design.</text>
</svg>
