<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three-week matched readout experiment</title>
  <desc id="desc">Four matched arms compare a standard readout, sign-aware training, exact odd projection, and a compute-matched unconstrained two-view readout. Raw kinematics are a reference; random, side-agnostic, and nuisance models are falsification checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52677E"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0F2440}
      .sub{font:17px Arial,sans-serif;fill:#52677E}
      .contract{font:700 17px Arial,sans-serif;fill:#0F2440}
      .head{font:700 18px Arial,sans-serif;fill:#0F2440}
      .body{font:17px Arial,sans-serif;fill:#33475E}
      .control{font:700 16px Arial,sans-serif;fill:#33475E}
      .out{font:700 17px Arial,sans-serif;fill:#FFFFFF}
      .foot{font:16px Arial,sans-serif;fill:#52677E}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#F7F5EF"/>
  <text x="60" y="54" class="title">Three-week comparison: repair the output first</text>
  <text x="60" y="84" class="sub">The rapid study tests parity-aware readouts, not a fully equivariant encoder.</text>

  <line x1="188" y1="191" x2="188" y2="224" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="463" y1="191" x2="463" y2="224" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="738" y1="191" x2="738" y2="224" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1013" y1="191" x2="1013" y2="224" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="188" y1="412" x2="188" y2="525" stroke="#52677E" stroke-width="2"/>
  <line x1="463" y1="412" x2="463" y2="525" stroke="#52677E" stroke-width="2"/>
  <line x1="738" y1="412" x2="738" y2="525" stroke="#52677E" stroke-width="2"/>
  <line x1="1013" y1="412" x2="1013" y2="525" stroke="#52677E" stroke-width="2"/>
  <line x1="188" y1="525" x2="1013" y2="525" stroke="#52677E" stroke-width="2"/>
  <line x1="600" y1="525" x2="600" y2="548" stroke="#52677E" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="120" width="1080" height="72" rx="12" fill="#EEF1F4" stroke="#6F7E8C" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" class="contract">SAME CONTRACT</text>
  <text x="600" y="176" text-anchor="middle" class="body">Participants, targets, folds, seeds, tuning budget, and frozen encoder</text>

  <rect x="60" y="230" width="255" height="182" rx="14" fill="#E7F0F8" stroke="#2F6F99" stroke-width="2"/>
  <text x="82" y="268" class="head">A  Standard</text>
  <text x="82" y="304" class="body">
    <tspan x="82" dy="0">One-view regularized</tspan>
    <tspan x="82" dy="24">signed readout</tspan>
    <tspan x="82" dy="32">Practical baseline</tspan>
  </text>

  <rect x="335" y="230" width="255" height="182" rx="14" fill="#F7E7D8" stroke="#B85C2F" stroke-width="2"/>
  <text x="357" y="268" class="head">B  Sign-aware</text>
  <text x="357" y="304" class="body">
    <tspan x="357" dy="0">Train on (x, y)</tspan>
    <tspan x="357" dy="24">and (Mx, −y)</tspan>
    <tspan x="357" dy="32">No exact guarantee</tspan>
  </text>

  <rect x="610" y="230" width="255" height="182" rx="14" fill="#ECE6F6" stroke="#755A9F" stroke-width="2.5"/>
  <text x="632" y="268" class="head">C  Exact odd</text>
  <text x="632" y="304" class="body">
    <tspan x="632" dy="0">Two-pass odd projection</tspan>
    <tspan x="632" dy="24">q optimized directly</tspan>
    <tspan x="632" dy="32">PRIMARY PARITY ARM</tspan>
  </text>

  <rect x="885" y="230" width="255" height="182" rx="14" fill="#E6F2EA" stroke="#47775D" stroke-width="2"/>
  <text x="907" y="268" class="head">D  Two-view control</text>
  <text x="907" y="304" class="body">
    <tspan x="907" dy="0">Shared q, two passes</tspan>
    <tspan x="907" dy="24">Learn a, b, and c freely</tspan>
    <tspan x="907" dy="32">Compute match for C</tspan>
  </text>

  <rect x="60" y="447" width="1080" height="56" rx="10" fill="#EEF1F4" stroke="#6F7E8C" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="481" text-anchor="middle" class="control">REFERENCES: raw kinematics | random encoder | even-only | side-agnostic | nuisance-only | shuffled target</text>

  <rect x="145" y="550" width="910" height="84" rx="13" fill="#20364E"/>
  <text x="600" y="582" text-anchor="middle" class="out">PRIMARY: C minus D in participant-held-out error AULC</text>
  <text x="600" y="611" text-anchor="middle" class="out">Force nMAE, or balanced error if the force gate fails</text>

  <text x="600" y="674" text-anchor="middle" class="foot">C guarantees only its final scalar. It does not prove encoder-wide equivariance.</text>
</svg>
