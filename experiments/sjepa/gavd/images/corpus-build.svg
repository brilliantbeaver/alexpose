<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="360" fill="#ffffff"/>
  <text x="460" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">Normalize, window, then split off the labeled 68</text>
  <text x="460" y="54" font-size="12.5" text-anchor="middle" fill="#475569">Turn variable-length sequences into many fixed-length clips, and reserve the labels for the probe.</text>

  <!-- Step 1: normalize -->
  <rect x="40" y="110" width="170" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="125" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">normalize</text>
  <text x="125" y="162" font-size="10.5" text-anchor="middle" fill="#475569">pelvis-center,</text>
  <text x="125" y="178" font-size="10.5" text-anchor="middle" fill="#475569">torso-scale</text>

  <!-- Step 2: window -->
  <rect x="270" y="110" width="170" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="355" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">window</text>
  <text x="355" y="162" font-size="10.5" text-anchor="middle" fill="#475569">slide length T,</text>
  <text x="355" y="178" font-size="10.5" text-anchor="middle" fill="#475569">with overlap</text>

  <!-- Step 3: split -->
  <rect x="500" y="110" width="170" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="585" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">split</text>
  <text x="585" y="162" font-size="10.5" text-anchor="middle" fill="#475569">labeled 68 vs</text>
  <text x="585" y="178" font-size="10.5" text-anchor="middle" fill="#475569">everything else</text>

  <line x1="210" y1="153" x2="270" y2="153" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="153" x2="500" y2="153" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Two output bins -->
  <rect x="730" y="96" width="150" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="805" y="118" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">unlabeled bank</text>
  <text x="805" y="136" font-size="10.5" text-anchor="middle" fill="#475569">-> pretraining (04)</text>

  <rect x="730" y="160" width="150" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="805" y="182" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">labeled holdout</text>
  <text x="805" y="200" font-size="10.5" text-anchor="middle" fill="#475569">-> probe only (05)</text>

  <line x1="670" y1="145" x2="730" y2="122" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="162" x2="730" y2="186" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- window illustration -->
  <text x="355" y="248" font-size="11" text-anchor="middle" fill="#334155">one long sequence</text>
  <rect x="200" y="258" width="310" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <rect x="205" y="258" width="90" height="20" rx="3" fill="#bfdbfe" stroke="#1d4ed8"/>
  <rect x="255" y="282" width="90" height="20" rx="3" fill="#bfdbfe" stroke="#1d4ed8"/>
  <rect x="305" y="258" width="90" height="20" rx="3" fill="#bfdbfe" stroke="#1d4ed8" opacity="0.7"/>
  <text x="355" y="322" font-size="11" text-anchor="middle" fill="#94a3b8">overlapping windows multiply the number of training clips</text>
</svg>
