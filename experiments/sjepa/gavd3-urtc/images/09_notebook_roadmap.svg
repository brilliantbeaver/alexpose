<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <title>Seven notebook learning path</title>
  <desc>The tutorials progress from concepts through data, pose extraction, masking, pretraining, latent inspection, and classification.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18324c"/></marker><style>.h{font:700 34px Arial;fill:#10233f}.n{font:700 24px Arial;fill:#10233f}.b{font:15px Arial;fill:#344b62}.a{stroke:#18324c;stroke-width:3;fill:none;marker-end:url(#a)}.box{stroke:#18324c;stroke-width:2}</style></defs>
  <rect width="1200" height="675" fill="#f5f1e8"/><text x="55" y="62" class="h">Build understanding and evidence in seven steps</text>
  <g transform="translate(55,135)">
    <rect x="0" y="0" width="250" height="115" rx="18" fill="#e8f1f8" class="box"/><text x="25" y="42" class="n">00  Understand</text><text x="25" y="78" class="b">S-JEPA, MAMP, MTM</text>
    <path d="M250 58H330" class="a"/><rect x="330" y="0" width="250" height="115" rx="18" fill="#f9e5cf" class="box"/><text x="355" y="42" class="n">01  Discover</text><text x="355" y="78" class="b">CSVs and source videos</text>
    <path d="M580 58H660" class="a"/><rect x="660" y="0" width="250" height="115" rx="18" fill="#e5f4ed" class="box"/><text x="685" y="42" class="n">02  Extract</text><text x="685" y="78" class="b">watch 33-point poses</text>
    <path d="M910 58H1035V175" class="a"/>
    <rect x="785" y="175" width="250" height="115" rx="18" fill="#f3dfd7" class="box"/><text x="810" y="217" class="n">03  Constrain</text><text x="810" y="253" class="b">ten target landmarks</text>
    <path d="M785 233H705" class="a"/><rect x="455" y="175" width="250" height="115" rx="18" fill="#e9e3f5" class="box"/><text x="480" y="217" class="n">04  Pretrain</text><text x="480" y="253" class="b">normal gait only</text>
    <path d="M455 233H375" class="a"/><rect x="125" y="175" width="250" height="115" rx="18" fill="#dceaf4" class="box"/><text x="150" y="217" class="n">05  Inspect</text><text x="150" y="253" class="b">latent motion quality</text>
    <path d="M250 290V370" class="a"/><rect x="125" y="370" width="780" height="120" rx="18" fill="#18324c"/>
    <text x="160" y="418" style="font:700 27px Arial;fill:#fff">06  Classify and compare</text><text x="160" y="458" style="font:17px Arial;fill:#fff">Five-class RF, four binary RFs, exact exp5 lane, and leakage audit</text>
  </g>
</svg>
