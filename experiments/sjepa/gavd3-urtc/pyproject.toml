[project]
name = "gavd3-sjepa-tutorials"
version = "0.1.0"
description = "Paper-aligned S-JEPA core tutorials for GAVD gait sequences"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "torch>=2.2",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "yt-dlp[default]>=2025.1.1",
  "opencv-python>=4.9",
  "mediapipe>=0.10.20,<1",
  "joblib>=1.4",
  "pyarrow>=15.0",
]

[tool.uv]
package = false

# External (non-Python) build tools used by this project.
# Tectonic is the LaTeX engine that compiles the URTC paper in docs/. It is a
# self-contained Rust binary, not a Python package, so it is not listed under
# [project.dependencies]. The PyPI name "tectonic" is an unrelated placeholder
# and must not be installed here. Install the real engine with Homebrew:
#   brew install tectonic
# Then build the paper from docs/ with:
#   tectonic urtc2026_sjepa_gait.tex
# This project was verified against Tectonic 0.17.0.
[tool.gavd3.external-tools]
tectonic = { install = "brew install tectonic", verified = "0.17.0" }
