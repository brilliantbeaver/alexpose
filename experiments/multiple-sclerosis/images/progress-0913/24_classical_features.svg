<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">What the classical baseline receives</title><desc id="desc">The saved Random Forest comparison uses 15 populated core angle feature slots: six means, three absolute left-right mean differences, and six ranges. An upstream code inspection finds the left ankle range assigned from the right ankle statistics, limiting bilateral interpretation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b45} .small{font-size:19px}</style>
<rect x="20" y="48" width="250" height="225" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="40" y="86" font-size="21.604938271604937" style="fill:#142b45" font-weight="bold" text-anchor="start">Angles over a clip</text>
<text x="40" y="128" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">Left/right hip</text>
<text x="40" y="160" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">Left/right knee</text>
<text x="40" y="192" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">Left/right ankle</text>
<rect x="350" y="48" width="355" height="225" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="370" y="86" font-size="22.435897435897434" style="fill:#142b45" font-weight="bold" text-anchor="start">15 populated feature slots</text>
<text x="370" y="128" font-size="18.356643356643357" style="fill:#142b45" font-weight="normal" text-anchor="start">6 mean angles</text>
<text x="370" y="160" font-size="18.356643356643357" style="fill:#142b45" font-weight="normal" text-anchor="start">3 absolute left–right differences</text>
<text x="370" y="192" font-size="18.356643356643357" style="fill:#142b45" font-weight="normal" text-anchor="start">6 angle ranges</text>
<rect x="785" y="48" width="290" height="225" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="805" y="86" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Random Forest</text>
<text x="805" y="128" font-size="17.806267806267805" style="fill:#142b45" font-weight="normal" text-anchor="start">100 decision trees</text>
<text x="805" y="160" font-size="17.806267806267805" style="fill:#142b45" font-weight="normal" text-anchor="start">Depth at most 5</text>
<text x="805" y="192" font-size="17.806267806267805" style="fill:#142b45" font-weight="normal" text-anchor="start">Training-only column filter</text>
<line x1="282" y1="155" x2="337" y2="155" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="717" y1="155" x2="772" y2="155" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<text x="25" y="328" font-size="25" style="fill:#142b45" font-weight="bold" text-anchor="start">No explicit cycle-phase alignment is used in these summary features.</text>
<text x="25" y="382" font-size="20" style="fill:#536779" font-weight="normal" text-anchor="start">Implementation limitation: the left ankle range slot copies the right ankle range; the saved scores are unchanged.</text>
</svg>