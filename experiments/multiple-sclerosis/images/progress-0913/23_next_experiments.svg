<text x="40" y="113" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">1. Verify the input</text>
<text x="40" y="155" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Review pose overlays</text>
<text x="40" y="187" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Keep time / validity masks</text>
<text x="40" y="219" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Check ankle-angle features</text>
<text x="40" y="251" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Complete notebook 05</text>
<rect x="389" y="75" width="325" height="235" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="409" y="113" font-size="25.132275132275133" style="fill:#142b45" font-weight="bold" text-anchor="start">2. Test the mechanism</text>
<text x="409" y="155" font-size="22.83653846153846" style="fill:#142b45" font-weight="normal" text-anchor="start">Temporal-shuffle control</text>
<text x="409" y="187" font-size="22.83653846153846" style="fill:#142b45" font-weight="normal" text-anchor="start">Reflection comparison</text>
<text x="409" y="219" font-size="22.83653846153846" style="fill:#142b45" font-weight="normal" text-anchor="start">Phase-aligned asymmetry</text>
<text x="409" y="251" font-size="22.83653846153846" style="fill:#142b45" font-weight="normal" text-anchor="start">Matched acquisition cues</text>
<rect x="757" y="75" width="325" height="235" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="777" y="113" font-size="22.94685990338164" style="fill:#142b45" font-weight="bold" text-anchor="start">3. Strengthen inference</text>
<text x="777" y="155" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Verify participant IDs</text>
<text x="777" y="187" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Lock model decisions</text>
<text x="777" y="219" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Evaluate fresh sources</text>
<text x="777" y="251" font-size="21.079881656804734" style="fill:#142b45" font-weight="normal" text-anchor="start">Report grouped uncertainty</text>
<text x="25" y="37" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Each next experiment resolves a specific ambiguity in the current evidence.</text>
<text x="25" y="385" font-size="20" style="fill:#536779" font-weight="normal" text-anchor="start">The present study supports an inspectable development workflow; additional data and tests are still needed.</text>
