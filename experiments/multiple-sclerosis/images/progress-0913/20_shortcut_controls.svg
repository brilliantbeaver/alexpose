<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">Simple controls also predict the dataset labels</title><desc id="desc">Pooled macro F1 from five source-grouped folds for both logistic regression and Random Forest control models. Controls use mean-and-spread pose, mean pose, visibility, retained-frame count, and median-pose pixel distances. Both classifiers are retained without selecting a winner. Mean/std pose logistic regression reaches 0.703, and visibility-only Random Forest reaches 0.636. These descriptive controls do not establish a causal explanation.</desc>
