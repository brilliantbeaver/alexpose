<text x="460" y="126" font-size="24" style="fill:#142b45" font-weight="bold" text-anchor="start">Equal total</text>
<text x="459" y="161" font-size="24" style="fill:#142b45" font-weight="bold" text-anchor="start">probability</text>
<line x1="232" y1="236" x2="462" y2="299" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="862" y1="236" x2="640" y2="299" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="377" y="282" width="346" height="66" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="405" y="324" font-size="29" style="fill:#142b45" font-weight="bold" text-anchor="start">Training minibatch</text>
<text x="25" y="389" font-size="21" style="fill:#536779" font-weight="normal" text-anchor="start">The current SSL loop does not read condition labels. Labels enter later when fitting the classifier.</text>
