<rect x="166" y="148" width="30" height="44" rx="3" fill="#087e8b" stroke="#087e8b" stroke-width="2"/>
<rect x="205" y="148" width="30" height="44" rx="3" fill="#087e8b" stroke="#087e8b" stroke-width="2"/>
<rect x="244" y="148" width="30" height="44" rx="3" fill="#087e8b" stroke="#087e8b" stroke-width="2"/>
<rect x="283" y="148" width="30" height="44" rx="3" fill="#087e8b" stroke="#087e8b" stroke-width="2"/>
<rect x="322" y="148" width="30" height="44" rx="3" fill="#087e8b" stroke="#087e8b" stroke-width="2"/>
<rect x="361" y="148" width="30" height="44" rx="3" fill="#087e8b" stroke="#087e8b" stroke-width="2"/>
