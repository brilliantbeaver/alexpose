<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">Freeze the learned representation before fitting a classifier</title><desc id="desc">All tokens from an unaugmented window are encoded by the teacher. A fixed seeded graph-time subset is mean pooled, then window vectors are averaged to one clip vector. A scaler and logistic regression fit on training clip vectors and labels; test clips only undergo transformation and prediction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b45} .small{font-size:19px}</style>
<rect x="20" y="40" width="225" height="150" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="40" y="78" font-size="21.412037037037035" style="fill:#142b45" font-weight="bold" text-anchor="start">Full test window</text>
<text x="40" y="120" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">No augmentation</text>
<text x="40" y="152" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">Teacher encoder</text>
<rect x="295" y="40" width="225" height="150" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="315" y="78" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Token mean</text>
<text x="315" y="120" font-size="17.788461538461537" style="fill:#142b45" font-weight="normal" text-anchor="start">Fixed seeded subset</text>
<text x="315" y="152" font-size="17.788461538461537" style="fill:#142b45" font-weight="normal" text-anchor="start">of joint-time tokens</text>
<rect x="570" y="40" width="225" height="150" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="590" y="78" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Window mean</text>
<text x="590" y="120" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">One 96-value</text>
<text x="590" y="152" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">vector per clip</text>
<rect x="845" y="40" width="235" height="150" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="865" y="78" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Predict label</text>
<text x="865" y="120" font-size="19.736842105263158" style="fill:#142b45" font-weight="normal" text-anchor="start">Frozen train scaler</text>
<text x="865" y="152" font-size="19.736842105263158" style="fill:#142b45" font-weight="normal" text-anchor="start">Fitted linear probe</text>
<line x1="254" y1="115" x2="285" y2="115" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="529" y1="115" x2="560" y2="115" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="804" y1="115" x2="835" y2="115" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="290" y="240" width="788" height="103" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="315" y="277" font-size="26" style="fill:#087e8b" font-weight="bold" text-anchor="start">Fitted using training clips only</text>
<text x="315" y="313" font-size="25" style="fill:#142b45" font-weight="normal" text-anchor="start">Encoder → scaler → class-balanced logistic regression</text>
<text x="20" y="383" font-size="20" style="fill:#536779" font-weight="normal" text-anchor="start">Averaging reduces the representation. Retention of phase timing and left–right differences has not been tested.</text>
</svg>