<title id="title">The next tests should measure geometry and time directly</title><desc id="desc">Three proposed experiments test mirror consistency, time order, and aligned left-right angle differences. Each needs training-only model selection, unchanged source or participant test boundaries, and explicit nuisance controls. None has a retained result in the current notebooks.</desc>
