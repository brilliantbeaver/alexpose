<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">Give each hidden target a joint and time identity</title><desc id="desc">The historical predictor reused indistinguishable hidden mask tokens. The repaired predictor adds a learned position vector so each hidden slot specifies the joint and time block being predicted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b45} .small{font-size:19px}</style>
<text x="20" y="35" font-size="29" style="fill:#142b45" font-weight="bold" text-anchor="start">A target needs a location in the skeleton and in time.</text>
<text x="30" y="93" font-size="26" style="fill:#142b45" font-weight="bold" text-anchor="start">Historical hidden slots</text>
<rect x="30" y="118" width="445" height="55" rx="12" fill="#fff1e4" stroke="#cfdae3" stroke-width="2"/>
<text x="50" y="155" font-size="25" style="fill:#142b45" font-weight="normal" text-anchor="start">mask</text>
<rect x="30" y="188" width="445" height="55" rx="12" fill="#fff1e4" stroke="#cfdae3" stroke-width="2"/>
<text x="50" y="225" font-size="25" style="fill:#142b45" font-weight="normal" text-anchor="start">mask</text>
<rect x="30" y="258" width="445" height="55" rx="12" fill="#fff1e4" stroke="#cfdae3" stroke-width="2"/>
<text x="50" y="295" font-size="25" style="fill:#142b45" font-weight="normal" text-anchor="start">mask</text>
<text x="580" y="93" font-size="26" style="fill:#142b45" font-weight="bold" text-anchor="start">Repaired hidden slots</text>
<rect x="580" y="118" width="445" height="55" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="600" y="155" font-size="25" style="fill:#142b45" font-weight="normal" text-anchor="start">mask + L knee, t₁</text>
<rect x="580" y="188" width="445" height="55" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="600" y="225" font-size="25" style="fill:#142b45" font-weight="normal" text-anchor="start">mask + R ankle, t₂</text>
<rect x="580" y="258" width="445" height="55" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="600" y="295" font-size="25" style="fill:#142b45" font-weight="normal" text-anchor="start">mask + hip, t₃</text>
<text x="28" y="374" font-size="21" style="fill:#536779" font-weight="normal" text-anchor="start">Position vectors distinguish the prediction requests; this structural repair does not establish a score gain.</text>
</svg>