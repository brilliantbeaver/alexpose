<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">Question, comparison, observation, revision</title><desc id="desc">Four connected stages describe the study&#x27;s reasoning: define incremental value, compare on source-held-out clips, inspect failed and successful results, then revise with controls.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b45} .small{font-size:19px}</style>
<rect x="20" y="90" width="220" height="205" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="40" y="128" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">1. Ask</text>
<text x="40" y="170" font-size="15.050167224080267" style="fill:#142b45" font-weight="normal" text-anchor="start">Does learned motion</text>
<text x="40" y="202" font-size="15.050167224080267" style="fill:#142b45" font-weight="normal" text-anchor="start">add useful information</text>
<text x="40" y="234" font-size="15.050167224080267" style="fill:#142b45" font-weight="normal" text-anchor="start">beyond simple features?</text>
<line x1="246" y1="190" x2="289" y2="190" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="300" y="90" width="220" height="205" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="320" y="128" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">2. Compare</text>
<text x="320" y="170" font-size="16.483516483516485" style="fill:#142b45" font-weight="normal" text-anchor="start">Same source folds</text>
<text x="320" y="202" font-size="16.483516483516485" style="fill:#142b45" font-weight="normal" text-anchor="start">Training-only fitting</text>
<text x="320" y="234" font-size="16.483516483516485" style="fill:#142b45" font-weight="normal" text-anchor="start">Held-out clip scores</text>
<line x1="526" y1="190" x2="569" y2="190" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="580" y="90" width="220" height="205" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="600" y="128" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">3. Inspect</text>
<text x="600" y="170" font-size="16.483516483516485" style="fill:#142b45" font-weight="normal" text-anchor="start">Class-specific errors</text>
<text x="600" y="202" font-size="16.483516483516485" style="fill:#142b45" font-weight="normal" text-anchor="start">Pose-only controls</text>
<text x="600" y="234" font-size="16.483516483516485" style="fill:#142b45" font-weight="normal" text-anchor="start">Representation health</text>
<line x1="806" y1="190" x2="849" y2="190" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="860" y="90" width="220" height="205" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="880" y="128" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">4. Revise</text>
<text x="880" y="170" font-size="21.634615384615383" style="fill:#142b45" font-weight="normal" text-anchor="start">Test timing</text>
<text x="880" y="202" font-size="21.634615384615383" style="fill:#142b45" font-weight="normal" text-anchor="start">Measure symmetry</text>
<text x="880" y="234" font-size="21.634615384615383" style="fill:#142b45" font-weight="normal" text-anchor="start">Use new sources</text>
<text x="30" y="42" font-size="25" style="fill:#142b45" font-weight="bold" text-anchor="start">Working null: no added value from the learned representation in this comparison.</text>
<text x="30" y="365" font-size="20" style="fill:#536779" font-weight="normal" text-anchor="start">This organizing hypothesis was not a preregistered significance test; all retained estimates are developmental.</text>
</svg>