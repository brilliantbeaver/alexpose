<title id="title">Notebook 03&#x27;s retained training diagnostics</title><desc id="desc">For the fold-zero 800-update demonstration, first-five-update mean loss is 4.990 and last-five-update mean loss is 1.112. Final effective rank is 9.5, a within-batch representation-spread diagnostic rather than a test accuracy.</desc>
