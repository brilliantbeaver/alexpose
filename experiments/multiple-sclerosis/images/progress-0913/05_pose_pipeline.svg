<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">From walking video to numerical pose</title><desc id="desc">Sampling creates frames; MediaPipe estimates 33 two-dimensional landmarks and visibility. Cleaning interpolates missing data before per-frame normalization. The cached coordinates are estimates rather than ground truth.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142b45} .small{font-size:19px}</style>
<rect x="20" y="95" width="220" height="190" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="40" y="133" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Video</text>
<text x="40" y="175" font-size="21.634615384615383" style="fill:#142b45" font-weight="normal" text-anchor="start">Sample frames</text>
<text x="40" y="207" font-size="21.634615384615383" style="fill:#142b45" font-weight="normal" text-anchor="start">Nominal 15 fps</text>
<text x="40" y="239" font-size="21.634615384615383" style="fill:#142b45" font-weight="normal" text-anchor="start">Whole-frame pose</text>
<rect x="300" y="95" width="220" height="190" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="320" y="133" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">33 landmarks</text>
<text x="320" y="175" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">x: horizontal</text>
<text x="320" y="207" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">y: vertical</text>
<text x="320" y="239" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">v: visibility</text>
<rect x="580" y="95" width="220" height="190" rx="12" fill="#fff1e4" stroke="#cfdae3" stroke-width="2"/>
<text x="600" y="133" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Clean</text>
<text x="600" y="175" font-size="20.361990950226243" style="fill:#142b45" font-weight="normal" text-anchor="start">Trim empty ends</text>
<text x="600" y="207" font-size="20.361990950226243" style="fill:#142b45" font-weight="normal" text-anchor="start">Interpolate gaps</text>
<text x="600" y="239" font-size="20.361990950226243" style="fill:#142b45" font-weight="normal" text-anchor="start">Reject poor clips</text>
<rect x="860" y="95" width="220" height="190" rx="12" fill="#e6f2f3" stroke="#cfdae3" stroke-width="2"/>
<text x="880" y="133" font-size="27" style="fill:#142b45" font-weight="bold" text-anchor="start">Normalize</text>
<text x="880" y="175" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">Center pelvis</text>
<text x="880" y="207" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">Divide by torso</text>
<text x="880" y="239" font-size="23" style="fill:#142b45" font-weight="normal" text-anchor="start">Keep visibility</text>
<line x1="246" y1="190" x2="290" y2="190" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="526" y1="190" x2="570" y2="190" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="806" y1="190" x2="850" y2="190" stroke="#536779" stroke-width="3" marker-end="url(#arrow)"/>
<text x="25" y="40" font-size="26" style="fill:#142b45" font-weight="bold" text-anchor="start">Every retained frame has 33 × 3 values; the third channel is visibility, not depth.</text>
<text x="25" y="363" font-size="21" style="fill:#536779" font-weight="normal" text-anchor="start">Cleaning can invent intermediate coordinates. The cache lacks explicit validity and timestamp channels.</text>
</svg>