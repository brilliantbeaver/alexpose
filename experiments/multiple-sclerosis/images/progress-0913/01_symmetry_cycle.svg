<title id="title">Symmetry is a comparison across a gait cycle</title><desc id="desc">Synthetic angle trajectories illustrate the same unequal-amplitude left and right movements before and after half-cycle phase alignment. The right amplitude stays 41 in both panels and the left stays 74. These are not participant measurements.</desc>
