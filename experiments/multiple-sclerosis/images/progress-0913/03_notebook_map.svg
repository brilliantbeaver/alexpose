<title id="title">Seven notebooks and one retained reference run</title><desc id="desc">Notebook 00 inventories video, 01 extracts pose, 02 makes tokens and tests masks, 03 trains, 04 continues from weights, 05 has an unsuccessful retained visualization run, 06 evaluates and imports frozen results.</desc>
