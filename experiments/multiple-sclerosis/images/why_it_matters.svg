<text x="450.0" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#1a2733" font-weight="700" text-anchor="middle">Why learn gait from video</text>
