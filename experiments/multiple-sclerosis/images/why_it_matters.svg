    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a202c" x="286.2" y="23.832" transform="rotate(-0 286.2 23.832)">Why learn gait from video</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2b6cb0" x="96.48" y="102.682144" transform="rotate(-0 96.48 102.682144)">A phone video</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #718096" transform="translate(48.637266 123.840422)">no wearable sensors,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #718096" transform="translate(54.287578 133.918453)">no lab, no markers</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dd6b20" x="286.2" y="102.682144" transform="rotate(-0 286.2 102.682144)">Skeleton motion</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #718096" transform="translate(240.456094 123.840422)">how the joints move</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #718096" transform="translate(264.567656 133.918453)">over time</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #38a169" x="475.92" y="102.641128" transform="rotate(-0 475.92 102.641128)">Early, cheap signal</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #718096" transform="translate(423.255938 123.840422)">screening and progress</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #718096" transform="translate(424.217109 133.918453)">tracking for MS and PD</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a202c" x="286.2" y="206.784" transform="rotate(-0 286.2 206.784)">Gait changes are among the earliest signs of MS and PD.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #718096" x="286.2" y="231.732" transform="rotate(-0 286.2 231.732)">Making that signal readable from ordinary video could widen access to monitoring.</text>
