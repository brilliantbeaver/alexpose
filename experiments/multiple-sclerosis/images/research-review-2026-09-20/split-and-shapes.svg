   <g id="text_1">
    <text style="font-weight: 600; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.15" y="47.713481" transform="rotate(-0 21.15 47.713481)">91 raw clips → 88 usable clips</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(21.15 70.168806)">41 source IDs stay attached</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(21.15 84.418806)">Each clip: T × 33 × 3</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(21.15 98.668806)">Channels: x, y, visibility</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 600; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="241.56" y="47.713481" transform="rotate(-0 241.56 47.713481)">Split sources before windows</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(241.56 70.168806)">Fold 0 example: 24 / 8 / 9 sources</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(241.56 84.418806)">51 training / 19 validation / 18 test clips</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(241.56 99.10447)">Five outer folds; one inner holdout</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 600; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="481.5" y="47.713481" transform="rotate(-0 481.5 47.713481)">Training windows and tokens</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 70.168806)">32 frames per window; stride 16</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 84.418806)">Short clips repeat their final frame</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 99.589119)">Batch: 32 × 32 × 33 × 3</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 113.839119)">Tokens: 32 × 264 × 96</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 600; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.15" y="200.173481" transform="rotate(-0 21.15 200.173481)">Fit on training sources</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(21.15 222.628806)">800 label-free updates</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(21.15 236.878806)">400 more; training state restarts</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(21.15 251.128806)">Frozen encoders; fit scaler + probe</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(21.15 265.378806)">Source-uniform encoder sampling</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 600; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="241.56" y="200.173481" transform="rotate(-0 241.56 200.173481)">Select on validation sources</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(241.56 222.628806)">Compare validation F1 for two stages</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(241.56 236.878806)">Keep original stage on a tie</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(241.56 252.049119)">No refit on train + validation</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(241.56 265.378806)">Test scores do not select the stage</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 600; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="481.5" y="200.173481" transform="rotate(-0 481.5 200.173481)">Evaluate held-out sources</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 222.628806)">One 96-value vector per test clip</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 236.878806)">One prediction per clip and system</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 251.128806)">88 predictions × five systems</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(481.5 265.378806)">Source IDs retained for scoring</text>
   </g>
