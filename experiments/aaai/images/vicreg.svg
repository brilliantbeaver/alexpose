<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">VICReg discourages collapse and redundancy</title><desc id="desc">Invariance: Two context views, Same walking window, Encourage agreement; Variance: Batch standard deviation, Discourage constant codes, Watch small batches; Covariance: Off-diagonal penalty, Reduce repeated signals, Track effective rank</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#007f82"/></marker></defs><rect width="1200" height="600" fill="#f3f6fa"/><text x="42" y="58" fill="#172e47" font-size="32" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">VICReg discourages collapse and redundancy</text><rect x="42.0" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="64.0" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Invariance</text><text x="64.0" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Two context views</text><text x="64.0" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Same walking window</text><text x="64.0" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Encourage agreement</text><rect x="424.6666666666667" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="446.6666666666667" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Variance</text><text x="446.6666666666667" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Batch standard deviation</text><text x="446.6666666666667" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Discourage constant codes</text><text x="446.6666666666667" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Watch small batches</text><rect x="807.3333333333334" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="829.3333333333334" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Covariance</text><text x="829.3333333333334" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Off-diagonal penalty</text><text x="829.3333333333334" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Reduce repeated signals</text><text x="829.3333333333334" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Track effective rank</text><text x="42" y="492" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">L = latent prediction + λ VICReg. VICReg is label-free and does not repel health-condition classes.</text><text x="42" y="526" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">A supervised probe learns class boundaries after the encoder has learned features.</text></svg>