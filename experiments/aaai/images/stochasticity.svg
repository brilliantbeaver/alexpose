<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Three different uses of randomness</title><desc id="desc">Uniform masks: Choose hidden tokens, Changes observed context, Required in main model; Position noise: Perturb token position, StoP-inspired ablation, Evaluate without noise; Latent variables: Model possible futures, Posterior and prior, Requires separate study</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#007f82"/></marker></defs><rect width="1200" height="600" fill="#f3f6fa"/><text x="42" y="58" fill="#172e47" font-size="32" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Three different uses of randomness</text><rect x="42.0" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="64.0" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Uniform masks</text><text x="64.0" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Choose hidden tokens</text><text x="64.0" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Changes observed context</text><text x="64.0" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Required in main model</text><rect x="424.6666666666667" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="446.6666666666667" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Position noise</text><text x="446.6666666666667" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Perturb token position</text><text x="446.6666666666667" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">StoP-inspired ablation</text><text x="446.6666666666667" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Evaluate without noise</text><rect x="807.3333333333334" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="829.3333333333334" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Latent variables</text><text x="829.3333333333334" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Model possible futures</text><text x="829.3333333333334" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Posterior and prior</text><text x="829.3333333333334" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Requires separate study</text><text x="42" y="492" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Random masking, positional noise, and a stochastic latent variable solve different problems.</text><text x="42" y="526" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">The 2024 skeleton S-JEPA and the 2026 stochastic-latent S-JEPA share a name, not an implementation.</text></svg>