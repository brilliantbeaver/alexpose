<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">More frames do not mean more independent people</title><desc id="desc">Observed coverage: 666 sequences, 140,641 annotation rows, 103 source videos; Unknown variation: Participant overlap, Severity and treatment, Camera and source bias; Needed evidence: Independent cohort, Participant IDs, Site and view stress tests</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#007f82"/></marker></defs><rect width="1200" height="600" fill="#f3f6fa"/><text x="42" y="58" fill="#172e47" font-size="32" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">More frames do not mean more independent people</text><rect x="42.0" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="64.0" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Observed coverage</text><text x="64.0" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">666 sequences</text><text x="64.0" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">140,641 annotation rows</text><text x="64.0" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">103 source videos</text><rect x="424.6666666666667" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="446.6666666666667" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Unknown variation</text><text x="446.6666666666667" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Participant overlap</text><text x="446.6666666666667" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Severity and treatment</text><text x="446.6666666666667" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Camera and source bias</text><rect x="807.3333333333334" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="829.3333333333334" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Needed evidence</text><text x="829.3333333333334" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Independent cohort</text><text x="829.3333333333334" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Participant IDs</text><text x="829.3333333333334" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Site and view stress tests</text><text x="42" y="492" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">The selected GAVD subset supports exploratory source-held-out evaluation.</text><text x="42" y="526" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Clinical generalization remains unproven without independent participant and site evidence.</text></svg>