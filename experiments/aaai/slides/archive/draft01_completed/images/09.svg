<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>The four focal families do not define every abnormal gait.</title><desc>Category analyses complement the all-folder detection question.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">The four focal families do not define every abnormal gait.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Category analyses complement the all-folder detection question.</text><rect x="60" y="218" width="1160" height="61" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Focal family</text><text x="332" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Sequences</text><text x="462" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Sources</text><text x="582" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Observable hypothesis</text><rect x="60" y="279" width="1160" height="61" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Parkinsonian</text><text x="332" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">47</text><text x="462" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">11</text><text x="582" y="313" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Movement size and timing can separate.</text><rect x="60" y="340" width="1160" height="61" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="374" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Stroke</text><text x="332" y="374" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">76</text><text x="462" y="374" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">19</text><text x="582" y="374" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">The two legs may contribute differently.</text><rect x="60" y="401" width="1160" height="61" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="435" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Cerebral palsy</text><text x="332" y="435" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">64</text><text x="462" y="435" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">11</text><text x="582" y="435" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Control and body mechanics can interact.</text><rect x="60" y="462" width="1160" height="61" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="496" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Myopathic</text><text x="332" y="496" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">188</text><text x="462" y="496" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">30</text><text x="582" y="496" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Trunk and leg strategies may change.</text><text x="65" y="575.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">These four families provide interpretation examples. All eleven non-normal folders</text><text x="65" y="608.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">remain in the primary binary endpoint.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">09 / 40</text></svg>