ht="59" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="308" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Exercise</text><text x="737" y="308" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">59</text><text x="1037" y="308" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.815</text><rect x="60" y="333" width="1160" height="59" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="367" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Stroke</text><text x="737" y="367" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">14</text><text x="1037" y="367" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.681</text><rect x="60" y="392" width="1160" height="59" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="426" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Myopathic</text><text x="737" y="426" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">25</text><text x="1037" y="426" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.604</text><rect x="60" y="451" width="1160" height="59" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Parkinsons</text><text x="737" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">9</text><text x="1037" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.565</text><rect x="60" y="510" width="1160" height="59" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="544" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Cerebral palsy</text><text x="737" y="544" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">10</text><text x="1037" y="544" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.486</text><text x="65" y="610.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">These are dependent exploratory category descriptions, not diagnostic sensitivities.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">The all-folder result cannot be presented as neurological disease detection.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">33 / 40</text></svg>