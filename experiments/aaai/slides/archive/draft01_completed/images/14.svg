<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>The teacher supplies features, while VICReg discourages collapse.</title><desc>The online branch sees only permitted observations. The target branch has no gradients.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">The teacher supplies features, while VICReg discourages collapse.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">The online branch sees only permitted observations. The target branch has no gradients.</text><rect x="60" y="212" width="315" height="145" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84" y="250" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Online context</text><text x="84" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Only permitted visible</text><text x="84" y="318.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">tokens enter.</text><rect x="460" y="212" width="315" height="145" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="484" y="250" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Predictor</text><text x="484" y="288.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Context and target</text><text x="484" y="318.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">positions predict</text><text x="484" y="348.72" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">features.</text><rect x="60" y="435" width="315" height="145" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84" y="473" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">EMA teacher</text><text x="84" y="511.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">All observed tokens</text><text x="84" y="541.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">supply detached</text><text x="84" y="571.72" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">targets.</text><rect x="460" y="435" width="315" height="145" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="484" y="473" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">Latent loss</text><text x="484" y="511.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Only valid hidden</text><text x="484" y="541.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">targets contribute.</text><path d="M383,282 L450,282" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M618,365 L618,425" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M383,507 L450,507" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M215,365 L215,425" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><text x="236" y="400" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#315cb5" font-weight="normal" text-anchor="start">EMA after update</text><rect x="835" y="222" width="380" height="300" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="859" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">VICReg regularizes views.</text><text x="859" y="298.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">View agreement, dimension</text><text x="859" y="329.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">variance and covariance</text><text x="859" y="361.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">are monitored. No disease</text><text x="859" y="393.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">labels enter this loss.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Useful disease-class separation is a downstream empirical question, not a property promised by VICReg.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">14 / 40</text></svg>