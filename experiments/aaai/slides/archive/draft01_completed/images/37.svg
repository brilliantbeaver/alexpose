<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Normal predictive adequacy remains unresolved.</title><desc>Validation uses fixed normal development draws. These are coordinate MSE diagnostics.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">MEASURED: LEARNING ADEQUACY</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Normal predictive adequacy remains unresolved.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Validation uses fixed normal development draws. These are coordinate MSE diagnostics.</text><rect x="60" y="235" width="1160" height="65" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="269" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">Fold</text><text x="227" y="269" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">512 updates: own / full MSE</text><text x="732" y="269" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">4,096 updates: own / full MSE</text><rect x="60" y="300" width="1160" height="65" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="334" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">1</text><text x="227" y="334" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0232 / 0.0568</text><text x="732" y="334" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0182 / 0.0211</text><rect x="60" y="365" width="1160" height="65" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="399" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">2</text><text x="227" y="399" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0441 / 0.0631</text><text x="732" y="399" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0385 / 0.0404</text><rect x="60" y="430" width="1160" height="65" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">3</text><text x="227" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0425 / 0.0583</text><text x="732" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0361 / 0.0341</text><rect x="60" y="495" width="1160" height="65" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="529" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">4</text><text x="227" y="529" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0460 / 0.0743</text><text x="732" y="529" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.0403 / 0.0472</text><text x="65" y="595.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">After longer fitting, full context has lower MSE than own context in 1 of four</text><text x="65" y="629.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">folds.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">The study cannot reject the broader value of gait relationships when its predictors may be inadequate.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">37 / 40</text></svg>