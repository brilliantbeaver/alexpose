<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Preserve multiple explanations when the video is ambiguous.</title><desc>Ask which additional measurement would distinguish compatible mechanisms.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">LONGER-TERM PROPOSAL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Preserve multiple explanations when the video is ambiguous.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Ask which additional measurement would distinguish compatible mechanisms.</text><rect x="65" y="210" width="315" height="155" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="89" y="248" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">Mechanism A</text><text x="89" y="286.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">For example, reduced</text><text x="89" y="317.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">push-off capacity.</text><rect x="65" y="415" width="315" height="155" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="89" y="453" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">Mechanism B</text><text x="89" y="491.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">For example,</text><text x="89" y="522.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">restricted joint</text><text x="89" y="554.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">range.</text><rect x="485" y="305" width="330" height="180" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="509" y="343" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Similar projected</text><text x="509" y="372" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">motion</text><text x="509" y="410.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Video alone may not</text><text x="509" y="441.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">distinguish the</text><text x="509" y="473.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">candidates.</text><rect x="920" y="305" width="300" height="180" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="944" y="343" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">Retain uncertainty.</text><text x="944" y="381.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Report compatible</text><text x="944" y="412.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">explanations rather</text><text x="944" y="444.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">than one cause.</text><path d="M385,285 L475,355" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M385,485 L475,430" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M823,395 L911,395" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="550.0" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#087f82" font-weight="bold" text-anchor="start">Then predict which extra measurement would</text><text x="485" y="585.88" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#087f82" font-weight="bold" text-anchor="start">distinguish the explanations.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">The valuable goal is tested ambiguity and measurement selection, not an unsupported diagnosis from pose.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">39 / 40</text></svg>