<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Interventions test model behavior, not virtual diagnoses.</title><desc>Change a sequence in a controlled way, then compare matched targets and observations.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">IMPLEMENTED DEVELOPMENT DIAGNOSTICS</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Interventions test model behavior, not virtual diagnoses.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Change a sequence in a controlled way, then compare matched targets and observations.</text><rect x="60" y="210" width="1160" height="48" rx="14" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="78" y="242" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">Paired intervention</text><text x="460" y="242" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">What changes?</text><text x="855" y="242" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">What is controlled?</text><rect x="60" y="266" width="1160" height="74" rx="8" fill="#f2f6fa" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="297.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087f82" font-weight="bold" text-anchor="start">Shift a complete limb.</text><text x="460" y="297.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Change relative timing.</text><text x="855" y="297.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Match the common interior</text><text x="855" y="328.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">support.</text><rect x="60" y="348" width="1160" height="74" rx="8" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="379.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087f82" font-weight="bold" text-anchor="start">Shift all limbs together.</text><text x="460" y="379.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Change the crop or global</text><text x="460" y="410.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">phase.</text><text x="855" y="379.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Keep the same window</text><text x="855" y="410.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">boundaries.</text><rect x="60" y="430" width="1160" height="74" rx="8" fill="#f2f6fa" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087f82" font-weight="bold" text-anchor="start">Use patch-local context.</text><text x="460" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Restrict other joints to</text><text x="460" y="492.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">the target patch.</text><text x="855" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Separate local from longer</text><text x="855" y="492.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">context.</text><rect x="60" y="512" width="1160" height="74" rx="8" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="543.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087f82" font-weight="bold" text-anchor="start">Damage observations.</text><text x="460" y="543.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Add noise or delete</text><text x="460" y="574.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">observations.</text><text x="855" y="543.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Track both score change</text><text x="855" y="574.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">and coverage.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">A shifted leg is not a simulated stroke. Quality matching alone does not prove causation.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">23 / 40</text></svg>