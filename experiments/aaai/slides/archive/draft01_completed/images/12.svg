<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Quality control must not manufacture motion.</title><desc>Invalid patches are excluded from attention, target loss and pooled features.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">IMPLEMENTED DATA FOUNDATION</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Quality control must not manufacture motion.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Invalid patches are excluded from attention, target loss and pooled features.</text><rect x="60.0" y="215" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84.0" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Preserve real time.</text><text x="84.0" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Use 15 Hz only when</text><text x="84.0" y="322.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">source FPS is at least</text><text x="84.0" y="354.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">15. Never bridge missing</text><text x="84.0" y="386.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">frames.</text><path d="M429.3333333333333,342.5 L452.3333333333333,342.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="457.3333333333333" y="215" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="481.3333333333333" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Keep missing values</text><text x="481.3333333333333" y="282" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">missing.</text><text x="481.3333333333333" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">A four-frame joint patch</text><text x="481.3333333333333" y="351.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">is valid only when every</text><text x="481.3333333333333" y="383.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">XY value is observed.</text><path d="M826.6666666666666,342.5 L849.6666666666666,342.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="854.6666666666666" y="215" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="878.6666666666666" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Apply one shared gate.</text><text x="878.6666666666666" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Keep at least 75% valid</text><text x="878.6666666666666" y="322.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">tokens overall and 50% in</text><text x="878.6666666666666" y="354.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">each temporal half.</text><text x="62" y="528.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Center each frame on the pelvis. Scale with observed torso measurements from the first</text><text x="62" y="561.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">half only.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Quality filtering is a selection process. Report what each class and source loses.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">12 / 40</text></svg>