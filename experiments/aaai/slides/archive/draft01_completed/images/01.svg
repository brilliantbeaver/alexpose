<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Predictable walking can still be abnormal.</title><desc>We test whether the help supplied by other joints differs from a normal reference.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">IMPLEMENTATION, REAL RESULTS AND CLAIM BOUNDARIES</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Predictable walking can still be abnormal.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">We test whether the help supplied by other joints differs from a normal reference.</text><rect x="60.0" y="230" width="365.3333333333333" height="245" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84.0" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Learn from normal gait.</text><text x="84.0" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">A normal-only model</text><text x="84.0" y="337.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">predicts hidden joint</text><text x="84.0" y="369.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">patches.</text><path d="M429.3333333333333,352.5 L452.3333333333333,352.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="457.3333333333333" y="230" width="365.3333333333333" height="245" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="481.3333333333333" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Compare the information.</text><text x="481.3333333333333" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Matched branches see a</text><text x="481.3333333333333" y="337.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">joint alone, local</text><text x="481.3333333333333" y="369.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">context, or the whole</text><text x="481.3333333333333" y="401.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">body.</text><path d="M826.6666666666666,352.5 L849.6666666666666,352.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="854.6666666666666" y="230" width="365.3333333333333" height="245" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="878.6666666666666" y="268" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Test real departures.</text><text x="878.6666666666666" y="306.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">A two-sided profile is</text><text x="878.6666666666666" y="337.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">evaluated on source-held-</text><text x="878.6666666666666" y="369.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">out abnormal gait.</text><text x="62" y="533.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">The completed comparison is exploratory. It does not establish a learned advantage or a</text><text x="62" y="566.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">clinical mechanism.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">01 / 40</text></svg>