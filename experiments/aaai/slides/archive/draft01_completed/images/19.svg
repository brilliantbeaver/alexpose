<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>More overlapping windows do not create independent evidence.</title><desc>A minimum support rule and common cohort are part of the score definition.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">More overlapping windows do not create independent evidence.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">A minimum support rule and common cohort are part of the score definition.</text><rect x="60.0" y="220" width="365.3333333333333" height="260" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Targets become joint</text><text x="84.0" y="287" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">scores.</text><text x="84.0" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Use the same 16 fixed</text><text x="84.0" y="356.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">uniform masks and common</text><text x="84.0" y="388.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">valid target support.</text><path d="M429.3333333333333,350.0 L452.3333333333333,350.0" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="457.3333333333333" y="220" width="365.3333333333333" height="260" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="481.3333333333333" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Windows become source</text><text x="481.3333333333333" y="287" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">profiles.</text><text x="481.3333333333333" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Average within windows,</text><text x="481.3333333333333" y="356.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">within sequences and</text><text x="481.3333333333333" y="388.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">across sequences. Then</text><text x="481.3333333333333" y="420.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">weight joints equally.</text><path d="M826.6666666666666,350.0 L849.6666666666666,350.0" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="854.6666666666666" y="220" width="365.3333333333333" height="260" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="878.6666666666666" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Check observation</text><text x="878.6666666666666" y="287" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">support.</text><text x="878.6666666666666" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Require four distinct</text><text x="878.6666666666666" y="356.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">target patches per</text><text x="878.6666666666666" y="388.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">included joint. Repeat</text><text x="878.6666666666666" y="420.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">with four patches.</text><text x="65" y="550.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">Apply the nonlinear profile distance once, after source aggregation. A missing</text><text x="65" y="584.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">group makes that source unscorable.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Report source coverage, target support, recording span and exclusions beside every detection result.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">19 / 40</text></svg>