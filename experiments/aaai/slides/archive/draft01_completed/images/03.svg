<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Four condition families motivate different hypotheses.</title><desc>Stroke, Parkinson’s, cerebral palsy and myopathic gait have overlapping movement effects.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">RESEARCH MOTIVATION</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Four condition families motivate different hypotheses.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Stroke, Parkinson’s, cerebral palsy and myopathic gait have overlapping movement</text><text x="60" y="180.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">effects.</text><rect x="60" y="205" width="1160" height="48" rx="14" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="78" y="237" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">Condition family</text><text x="365" y="237" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">Origin and limitation</text><text x="820" y="237" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">Possible visible effect</text><rect x="60" y="262" width="1160" height="78" rx="8" fill="#f2f6fa" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="307" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="start">Stroke</text><text x="365" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Brain injury can alter</text><text x="365" y="323.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">selective control.</text><text x="820" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Leg contributions may differ.</text><rect x="60" y="347" width="1160" height="78" rx="8" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="392" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="start">Parkinson’s</text><text x="365" y="377.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Movement scaling and</text><text x="365" y="408.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">automaticity can change.</text><text x="820" y="377.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Amplitude and coordination</text><text x="820" y="408.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">may separate.</text><rect x="60" y="432" width="1160" height="78" rx="8" fill="#f2f6fa" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="477" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="start">Cerebral palsy</text><text x="365" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">An early brain disturbance</text><text x="365" y="493.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">interacts with growth.</text><text x="820" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Knee, foot and trunk patterns</text><text x="820" y="493.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">vary.</text><rect x="60" y="517" width="1160" height="78" rx="8" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="78" y="562" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="start">Myopathic gait</text><text x="365" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Muscle disorders can reduce</text><text x="365" y="578.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">force capacity.</text><text x="820" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Trunk and leg strategies may</text><text x="820" y="578.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">change.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">The inclusive term is neuromusculoskeletal. None of the four labels specifies one gait mechanism.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">03 / 40</text></svg>