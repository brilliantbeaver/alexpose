<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Separate prediction changes from teacher-target changes.</title><desc>Hold the local target patch fixed while editing eligible non-target context.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">IMPLEMENTED AND MEASURED RAW-LOSS DIAGNOSTIC</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Separate prediction changes from teacher-target changes.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Hold the local target patch fixed while editing eligible non-target context.</text><rect x="60" y="240" width="1160" height="73" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="274" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start"></text><text x="467" y="274" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Original target y0</text><text x="852" y="274" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Edited target y1</text><rect x="60" y="313" width="1160" height="73" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="347" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">Original prediction p0</text><text x="467" y="347" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">L00</text><text x="852" y="347" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">L01</text><rect x="60" y="386" width="1160" height="73" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">Edited prediction p1</text><text x="467" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">L10</text><text x="852" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">L11</text><rect x="85" y="497" width="1110" height="74" rx="14" fill="#e7f1f1" stroke="#b6d9da" stroke-width="2"/><text x="640.0" y="544" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="middle">Total change = prediction change + target change + interaction</text><text x="65" y="607.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Eight unchanged arm and right-leg joints enter this raw-KL diagnostic.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Eight unchanged joints do not define the full profile. The raw-loss identity is not a clinical explanation.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">24 / 40</text></svg>