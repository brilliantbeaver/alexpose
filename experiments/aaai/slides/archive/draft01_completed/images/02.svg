<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Biology produces motion before a camera measures it.</title><desc>Several hidden causes can produce similar visible walking patterns.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">RESEARCH MOTIVATION</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Biology produces motion before a camera measures it.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Several hidden causes can produce similar visible walking patterns.</text><rect x="60.0" y="225" width="266.0" height="240" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84.0" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Origin</text><text x="84.0" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">A neural or</text><text x="84.0" y="332.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">muscle change</text><text x="84.0" y="364.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">alters capacity.</text><path d="M330.0,345.0 L353.0,345.0" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="358.0" y="225" width="266.0" height="240" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="382.0" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Movement limits</text><text x="382.0" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Control, force or</text><text x="382.0" y="332.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">joint range can</text><text x="382.0" y="364.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">change.</text><path d="M628.0,345.0 L651.0,345.0" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="656.0" y="225" width="266.0" height="240" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="680.0" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Walking strategy</text><text x="680.0" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">The person adapts</text><text x="680.0" y="332.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">timing and</text><text x="680.0" y="364.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">posture.</text><path d="M926.0,345.0 L949.0,345.0" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="954.0" y="225" width="266.0" height="240" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="978.0" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Observed pose</text><text x="978.0" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Camera projection</text><text x="978.0" y="332.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">and tracking add</text><text x="978.0" y="364.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">variation.</text><rect x="140" y="520" width="1000" height="74" rx="14" fill="#e7f1f1" stroke="#b6d9da" stroke-width="2"/><text x="640.0" y="567" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="middle">The same visible movement can have several hidden explanations.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Observed keypoints constrain an explanation; they do not uniquely identify its cause.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">02 / 40</text></svg>