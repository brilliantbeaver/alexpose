<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>A matched experiment connects the hypothesis to a score.</title><desc>Normal fitting, information restrictions and independent source scoring have separate roles.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY DESIGN</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">A matched experiment connects the hypothesis to a score.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Normal fitting, information restrictions and independent source scoring have separate</text><text x="60" y="180.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">roles.</text><rect x="65" y="215" width="340" height="150" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="89" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Fit normal motion.</text><text x="89" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Use only normal training</text><text x="89" y="321.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">sources.</text><rect x="470" y="215" width="340" height="150" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="494" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Sample uniform masks.</text><text x="494" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Keep the same hidden</text><text x="494" y="321.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">joint patches.</text><rect x="875" y="215" width="340" height="150" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="899" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Compare context.</text><text x="899" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Own, patch-local and</text><text x="899" y="321.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">full branches.</text><rect x="65" y="445" width="340" height="150" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="89" y="483" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Score outer-test</text><text x="89" y="512" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">sources.</text><text x="89" y="550.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Normal versus all other</text><text x="89" y="580.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">folders.</text><rect x="470" y="445" width="340" height="150" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="494" y="483" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Fit a normal</text><text x="494" y="512" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">reference.</text><text x="494" y="550.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Use only inner normal</text><text x="494" y="580.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">sources.</text><rect x="875" y="445" width="340" height="150" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="899" y="483" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Compare target types.</text><text x="899" y="521.0" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Coordinates and frozen</text><text x="899" y="551.36" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">JEPA features.</text><path d="M410,290 L462,290" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M815,290 L867,290" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M1045,372 L1045,434" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M463,520 L413,520" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M868,520 L818,520" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">A completed software path is different from a demonstrated scientific benefit.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">06 / 40</text></svg>