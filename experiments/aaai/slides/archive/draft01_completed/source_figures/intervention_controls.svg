   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="48.672" y="108" transform="rotate(-0 48.672 108)">TEST</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="309.816" y="108" transform="rotate(-0 309.816 108)">WHAT CHANGES</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="637.92" y="108" transform="rotate(-0 637.92 108)">WHAT IT CHECKS</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="155.808" y="161.342991" transform="rotate(-0 155.808 161.342991)">Relative limb timing</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(363.663602 175.892744)">One articulated limb is shifted</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(369.993094 193.142744)">on common interior frames.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(724.076414 174.778681)">Sensitivity to a changed</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(714.015711 192.028681)">relationship between limbs.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="155.808" y="256.382991" transform="rotate(-0 155.808 256.382991)">Whole-body timing</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(385.204539 269.818681)">All limbs shift together</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(374.203172 287.068681)">under matched crop rules.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(728.027742 269.818681)">A crop or global timing</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(697.224812 287.068681)">effect rather than relative timing.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="155.808" y="352.682756" transform="rotate(-0 155.808 352.682756)">Patch-local context</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(349.722547 364.858681)">Keep own-joint history; other joints</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(380.736609 382.108681)">only in the target patch.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(689.408406 364.858681)">Whether local geometry and motion</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(703.145516 382.108681)">explain the full-context benefit.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="155.808" y="446.462991" transform="rotate(-0 155.808 446.462991)">Observation damage</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(374.407117 459.898681)">Specified coordinate noise</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(379.984617 477.148681)">or missing observations.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(722.4745 459.898681)">Sensitivity to the chosen</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(720.217625 477.148681)">measurement corruption.</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203547" x="40.32" y="52.036406" transform="rotate(-0 40.32 52.036406)">Separate movement changes from observation changes</text>
  </g>
  <g id="text_17">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="81.118125" transform="rotate(-0 40.32 81.118125)">Each comparison uses the same masks, body reference, and common valid target support.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="553.317539" transform="rotate(-0 40.32 553.317539)">Coordinate edits are controlled sensitivity tests. They are not clinical interventions or validated simulations of stroke, PD, CP, or myopathy.</text>
  </g>
 </g>
