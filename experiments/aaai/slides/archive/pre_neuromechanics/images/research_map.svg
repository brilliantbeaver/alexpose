<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A gait video supports two research tasks</title><desc id="desc">Observed motion: Video frames, Annotated person, 16 selected joints; Learned features: Normal-only JEPA, Uniform hidden tokens, EMA target features; Measured outcomes: Anomaly ranking, Condition prediction, Source-held-out tests</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#007f82"/></marker></defs><rect width="1200" height="600" fill="#f3f6fa"/><text x="42" y="58" fill="#172e47" font-size="32" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">A gait video supports two research tasks</text><rect x="42.0" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="64.0" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Observed motion</text><text x="64.0" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Video frames</text><text x="64.0" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Annotated person</text><text x="64.0" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">16 selected joints</text><path d="M395.6666666666667,285 L419.6666666666667,285" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="424.6666666666667" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="446.6666666666667" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Learned features</text><text x="446.6666666666667" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Normal-only JEPA</text><text x="446.6666666666667" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Uniform hidden tokens</text><text x="446.6666666666667" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">EMA target features</text><path d="M778.3333333333334,285 L802.3333333333334,285" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="807.3333333333334" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="829.3333333333334" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Measured outcomes</text><text x="829.3333333333334" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Anomaly ranking</text><text x="829.3333333333334" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Condition prediction</text><text x="829.3333333333334" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Source-held-out tests</text><text x="42" y="492" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Anomaly detection uses a frozen normal reference. Condition classification uses labeled training data.</text><text x="42" y="526" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Dataset labels describe this collection. They do not establish a clinical diagnosis.</text></svg>