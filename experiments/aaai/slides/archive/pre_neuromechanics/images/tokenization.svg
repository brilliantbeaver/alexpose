<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">A token describes one joint over four frames</title><desc id="desc">Input window: 32 frames, 16 joints, 2 image coordinates; Patch embedding: 4 frames × 2 values, One linear projection, Time + joint position; Token sequence: 8 time patches, 16 joint positions, 128 tokens per window</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#007f82"/></marker></defs><rect width="1200" height="600" fill="#f3f6fa"/><text x="42" y="58" fill="#172e47" font-size="32" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">A token describes one joint over four frames</text><rect x="42.0" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="64.0" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Input window</text><text x="64.0" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">32 frames</text><text x="64.0" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">16 joints</text><text x="64.0" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">2 image coordinates</text><path d="M395.6666666666667,285 L419.6666666666667,285" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="424.6666666666667" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="446.6666666666667" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Patch embedding</text><text x="446.6666666666667" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">4 frames × 2 values</text><text x="446.6666666666667" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">One linear projection</text><text x="446.6666666666667" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Time + joint position</text><path d="M778.3333333333334,285 L802.3333333333334,285" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="807.3333333333334" y="145" width="350.6666666666667" height="280" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="829.3333333333334" y="187" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Token sequence</text><text x="829.3333333333334" y="230" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">8 time patches</text><text x="829.3333333333334" y="264" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">16 joint positions</text><text x="829.3333333333334" y="298" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">128 tokens per window</text><text x="42" y="492" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Coordinates are pelvis-centered and body-scaled. Camera geometry remains a possible confound.</text><text x="42" y="526" fill="#172e47" font-size="22" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Confidence supports quality control. It is not an encoder input.</text></svg>