   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle" x="80.80794" y="21.57956" transform="rotate(-0 80.80794 21.57956)">1. Prepare the gait window</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle" x="254.36034" y="21.57956" transform="rotate(-0 254.36034 21.57956)">2. Fill the same hidden gaps</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle" x="427.91274" y="21.57956" transform="rotate(-0 427.91274 21.57956)">3. Compare with normal gait</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="80.80794" y="51.526016" transform="rotate(-0 80.80794 51.526016)">Observed walking</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(19.19162 68.068078)">32 samples at 15 Hz; 16 joints</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(36.432596 79.003078)">One token is one joint</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(46.946776 90.722765)">over four frames</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="80.80794" y="134.47358" transform="rotate(-0 80.80794 134.47358)">Training masks</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(56.628807 155.297357)">Random (U)</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(52.329479 165.924178)">Whole joint (J)</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(50.801237 177.167357)">Anatomical (A)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #3d535c" transform="translate(18.689167 207.650194)">Small lower-leg groups include</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #3d535c" transform="translate(15.599143 218.585194)">knee, ankle, heel and toe points</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; fill: #3d535c" transform="translate(14.880268 229.520194)">on one side over nearby frames.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="254.36034" y="52.022708" transform="rotate(-0 254.36034 52.022708)">Own-leg baseline (f)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(209.371168 73.827461)">Use visible movement</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(215.925207 83.977774)">from the target leg</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="254.36034" y="121.062896" transform="rotate(-0 254.36034 121.062896)">Own-leg correction (f+h)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(208.884535 142.082962)">Add a correction using</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(227.922699 153.017962)">the same leg</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="254.36034" y="190.103084" transform="rotate(-0 254.36034 190.103084)">Both-leg correction (f+g)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(208.884535 211.12315)">Add a correction using</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(235.571504 222.05815)">both legs</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="427.91274" y="52.022036" transform="rotate(-0 427.91274 52.022036)">Movement score (M)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(374.093302 73.827461)">How unusual is movement</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(362.474232 83.977774)">measured from observed joints?</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="427.91274" y="121.062896" transform="rotate(-0 427.91274 121.062896)">Cross-leg score (R)</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(373.802842 142.867649)">How unusual is the benefit</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(379.199467 153.017962)">of adding the other leg?</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="427.91274" y="190.103084" transform="rotate(-0 427.91274 190.103084)">Combined score (S)</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(398.185107 211.12315)">Fixed average:</text>
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'" transform="translate(397.421302 222.3619)">S = (M + R) / 2</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: middle" x="254.36034" y="248.256038" transform="rotate(-0 254.36034 248.256038)">Compare f+h with f+g on the same gaps.</text>
   </g>
  </g>
 </g>
