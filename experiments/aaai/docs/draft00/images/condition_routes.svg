   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="48.672" y="104.832" transform="rotate(-0 48.672 104.832)">CONDITION</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="239.508" y="104.832" transform="rotate(-0 239.508 104.832)">ORIGIN AND LIMITATION</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="584.352" y="104.832" transform="rotate(-0 584.352 104.832)">POSSIBLE VISIBLE EFFECT</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="127.35" y="158.045363" transform="rotate(-0 127.35 158.045363)">Stroke</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(329.909109 170.660281)">Acquired brain injury;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(293.702977 189.024344)">weakness or less selective control</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(710.17532 170.660281)">Unequal leg motion;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(673.162391 187.910281)">changes in foot-clearing strategy</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="127.35" y="256.253362" transform="rotate(-0 127.35 256.253362)">Parkinson's</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(282.500359 268.868281)">Degeneration in movement networks;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(287.81282 286.118281)">changes in scaling and automaticity</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(679.912352 268.868281)">Small steps or arm excursions;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(697.222547 286.118281)">task-dependent changes</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="127.35" y="353.151206" transform="rotate(-0 127.35 353.151206)">Cerebral palsy</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(304.636062 367.076281)">Developing-brain disturbance;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(297.217664 384.326281)">control and body growth interact</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(660.061375 367.076281)">Varied knee, foot, and trunk patterns;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(686.749461 385.440344)">unilateral or bilateral effects</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="127.35" y="451.359206" transform="rotate(-0 127.35 451.359206)">Myopathic gait</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(341.607664 465.811664)">Muscle disorders;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(299.481727 482.534281)">reduced capacity or contracture</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(673.279187 465.284281)">Changes in trunk or leg strategy;</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(661.065828 482.534281)">patterns depend on affected muscles</text>
   </g>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203547" x="40.32" y="52.036406" transform="rotate(-0 40.32 52.036406)">Four origins, overlapping movement effects</text>
  </g>
  <g id="text_17">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="81.118125" transform="rotate(-0 40.32 81.118125)">Examples guide hypotheses. They are not a diagnostic lookup table.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="553.317539" transform="rotate(-0 40.32 553.317539)">Myopathic does not name one brain disorder. None of these patterns is present in every person or unique to one condition.</text>
  </g>
 </g>
