[project]
name = "aaai-gait-tutorials"
version = "0.1.0"
description = "Reproducible skeleton JEPA and anomaly detection tutorials for ASTAD4"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alexpose", "torch>=2.6,<3", "numpy>=2.0,<3", "pandas>=2.3,<3",
  "scikit-learn>=1.8,<2", "matplotlib>=3.10,<4", "python-dotenv>=1.2,<2",
  "jupyterlab>=4,<5", "ipykernel>=7,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1",
  "yt-dlp>=2025.12.8", "mediapipe>=0.10.31,<0.11", "opencv-python>=4.12,<5",
  "opencv-contrib-python>=4.12,<5", "imageio-ffmpeg>=0.6,<1", "pytest>=9,<10"
]
[project.optional-dependencies]
external = ["c3d==0.6.0"]
[tool.uv.sources]
alexpose = {path = "../..", editable = true}
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aaai_gait"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

asyncio_default_fixture_loop_scope = "function"
