   <g id="text_1">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(20.377791 32.983156)">Control, muscle,</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(14.685197 42.825398)">and body structure</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(17.901775 52.667641)">shape movement</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(118.597112 32.983156)">Camera and pose</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(122.242269 42.825398)">estimation alter</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(119.816862 52.667641)">what is observed</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(216.842569 32.982836)">Preserve posture,</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(223.09635 42.825078)">amplitude and</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(230.897241 52.66732)">raw timing</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(314.605125 32.983156)">M: local movement</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(325.086391 42.825398)">Distance from</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(323.915328 52.667641)">fitting normals</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(19.398275 106.903156)">Shared answer Y</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(19.322681 116.745398)">and shared body</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(29.64315 126.587641)">reference Q</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(121.478644 106.903156)">Retain own-leg f</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(112.13705 116.745398)">Compare corrections</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(129.497987 126.587641)">f+h and f+g</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(218.345475 106.903156)">Check prediction</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(223.602444 116.745398)">and permitted</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(222.70685 126.587641)">timing support</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(312.460953 106.903477)">R: benefit departure</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(330.912875 116.745719)">Fixed score</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'" transform="translate(322.989625 126.58732)">S = (M + R) / 2</text>
   </g>
