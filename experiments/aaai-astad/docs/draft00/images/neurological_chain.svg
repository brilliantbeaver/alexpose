   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="124.002" y="135.869606" transform="rotate(-0 124.002 135.869606)">Origin</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(89.023133 158.039281)">Brain injury,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(83.714266 175.289281)">degeneration,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(70.350906 193.653344)">or muscle disorder</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="318.186" y="137.179762" transform="rotate(-0 318.186 137.179762)">Movement limits</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(268.32182 158.566664)">Selective control,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(275.776156 175.289281)">force capacity,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(279.317797 192.539281)">or joint range</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="512.37" y="135.920388" transform="rotate(-0 512.37 135.920388)">Motion pattern</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(461.232734 167.778344)">Direct effects and</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(455.860078 183.914281)">possible adaptation</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="706.554" y="135.869606" transform="rotate(-0 706.554 135.869606)">Physical motion</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(659.112008 166.664281)">Body movement</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(650.219273 183.914281)">and ground contact</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="706.554" y="324.416388" transform="rotate(-0 706.554 324.416388)">Observed pose</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(653.444664 352.388281)">Camera projection</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(651.640602 369.638281)">and tracking errors</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="269.64" y="324.365606" transform="rotate(-0 269.64 324.365606)">A reverse inference can have many answers</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(95.3575 353.502344)">The same visible movement can arise from different causes.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(129.34 369.638281)">A folder label does not identify the hidden steps.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #526575" transform="translate(819.255937 140.537437)">Mostly</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #526575" transform="translate(801.218437 154.940719)">unmeasured</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #526575" transform="translate(814.329375 169.344)">in GAVD</text>
   </g>
   <g id="text_14">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #178276" transform="translate(811.640625 337.892719)">Available</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #178276" transform="translate(810.060937 352.296)">2D tracks</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203547" x="40.32" y="47.716406" transform="rotate(-0 40.32 47.716406)">From a biological change to a walking video</text>
  </g>
  <g id="text_16">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="72.118125" transform="rotate(-0 40.32 72.118125)">The forward chain has several hidden steps. GAVD observes the far end of the chain.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="483.837539" transform="rotate(-0 40.32 483.837539)">Conceptual causal chain, not a fitted causal model. Age, task, aids, terrain, and experience can affect several steps.</text>
  </g>
 </g>
