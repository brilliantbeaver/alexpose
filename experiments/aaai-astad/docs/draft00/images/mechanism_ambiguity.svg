   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="170.874" y="264.691763" transform="rotate(-0 170.874 264.691763)">Simulated limitation B</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="170.874" y="286.169281" transform="rotate(-0 170.874 286.169281)">For example, restricted joint range</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="505.674" y="195.391762" transform="rotate(-0 505.674 195.391762)">Matched 2D observations</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(422.237008 216.560281)">Similar projected trajectories</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(421.437398 233.810281)">under explicit matching rules</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="838.8" y="194.132387" transform="rotate(-0 838.8 194.132387)">Compatible explanations</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(754.443008 216.560281)">Report a set and uncertainty,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(783.796758 233.810281)">not a unique cause</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="669.726" y="374.312387" transform="rotate(-0 669.726 374.312387)">Which extra measurement would separate them?</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="669.726" y="399.821281" transform="rotate(-0 669.726 399.821281)">Compare another view, contact timing, strength, or force data in a validated study.</text>
   </g>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203547" x="40.32" y="47.716406" transform="rotate(-0 40.32 47.716406)">When two causes look similar, keep both explanations</text>
  </g>
  <g id="text_12">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="72.118125" transform="rotate(-0 40.32 72.118125)">Proposed simulation benchmark: test what a video can and cannot distinguish.</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="483.837539" transform="rotate(-0 40.32 483.837539)">Illustrative candidate pair, not an established equivalence. First demonstrate matched observations and distinct mechanisms inside a validated simulator.</text>
  </g>
