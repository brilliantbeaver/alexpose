   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526575" x="497.304" y="291.002222" transform="rotate(-0 497.304 291.002222)">Sensory feedback</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="637.92" y="423.13455" transform="rotate(-0 637.92 423.13455)">Camera and tracker</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(577.166758 449.444281)">Projection, occlusion,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(609.981289 467.808344)">and noise</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="868.932" y="422.783222" transform="rotate(-0 868.932 422.783222)">2D pose</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(852.549891 450.45682)">GAVD</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(831.929852 467.808344)">observations</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="251.226" y="421.97205" transform="rotate(-0 251.226 421.97205)">External measurements validate the components</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(146.607445 449.444281)">3D motion, contacts, EMG, strength,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(151.680922 466.694281)">and known participant information</text>
   </g>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203547" x="40.32" y="52.036406" transform="rotate(-0 40.32 52.036406)">A forward world model needs a body and an observation process</text>
  </g>
  <g id="text_15">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="81.118125" transform="rotate(-0 40.32 81.118125)">Longer-term design: predict movement under specified control and physical conditions.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="553.317539" transform="rotate(-0 40.32 553.317539)">A JEPA completion model is one possible representation component. It does not by itself identify a controller, muscle forces, or neural pathology.</text>
  </g>
