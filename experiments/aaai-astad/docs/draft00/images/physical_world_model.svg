   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="155.808" y="167.549363" transform="rotate(-0 155.808 167.549363)">Controller</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(98.379875 197.588281)">Goal, sensory state,</text>
