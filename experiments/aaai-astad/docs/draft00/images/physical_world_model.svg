   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="487.26" y="166.239206" transform="rotate(-0 487.26 166.239206)">Muscles and body</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(438.51168 198.115664)">Activation, force,</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(415.410156 214.838281)">anatomy, and joint limits</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203547" x="828.756" y="166.239206" transform="rotate(-0 828.756 166.239206)">Next physical state</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #203547" transform="translate(771.709711 198.115664)">3D motion, contact,</text>
