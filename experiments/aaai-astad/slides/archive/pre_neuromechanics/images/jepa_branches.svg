<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">The encoder learns by predicting hidden features</title><desc id="desc">Online visible-only encoder feeds predictor. Frozen teacher receives full input. EMA updates teacher only after optimizer.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#007f82"/></marker></defs><rect width="1200" height="600" fill="#f3f6fa"/><text x="42" y="58" fill="#172e47" font-size="32" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">The encoder learns by predicting hidden features</text><rect x="42" y="130" width="285" height="158" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="64" y="172" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Context branch</text><text x="64" y="215" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Visible tokens only</text><text x="64" y="249" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Online encoder θ</text><rect x="435" y="130" width="295" height="158" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="457" y="172" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Predictor</text><text x="457" y="215" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Context + target queries</text><text x="457" y="249" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Predict hidden features</text><path d="M330,210 L428,210" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="350" width="285" height="158" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="64" y="392" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Target branch</text><text x="64" y="435" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">All observed tokens</text><text x="64" y="469" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">EMA encoder ξ</text><rect x="860" y="240" width="298" height="158" rx="14" fill="white" stroke="#007f82" stroke-width="2"/><text x="882" y="282" fill="#007f82" font-size="25" font-weight="bold" text-anchor="start" font-family="Arial, sans-serif">Feature loss</text><text x="882" y="325" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">Predictions vs targets</text><text x="882" y="359" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">No target gradients</text><path d="M734,210 L810,210" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M810,210 L810,275 L852,275" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M330,430 L808,430 L808,355 L852,355" fill="none" stroke="#007f82" stroke-width="3" marker-end="url(#arrow)"/><text x="395" y="483" fill="#172e47" font-size="24" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">After the optimizer step:</text><text x="395" y="517" fill="#172e47" font-size="24" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">ξ ← m ξ + (1 − m) θ</text><text x="42" y="563" fill="#172e47" font-size="21" font-weight="normal" text-anchor="start" font-family="Arial, sans-serif">The teacher supplies targets during training. It never supplies hidden coordinates to the predictor.</text></svg>