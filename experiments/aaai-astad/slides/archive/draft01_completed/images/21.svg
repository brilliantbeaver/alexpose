<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>The interval must estimate the same metric as the point.</title><desc>Weight within-fold AUROC by the number of normal test sources.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">The interval must estimate the same metric as the point.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Weight within-fold AUROC by the number of normal test sources.</text><rect x="75" y="218" width="1130" height="74" rx="14" fill="#e7f1f1" stroke="#b6d9da" stroke-width="2"/><text x="640.0" y="265" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087f82" font-weight="bold" text-anchor="middle">Primary AUROC = Σ(normal test sources × fold AUROC) / Σ normal test sources</text><rect x="65" y="340" width="550" height="235" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="89" y="378" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">Keep ranks within each fitted fold.</text><text x="89" y="416.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Report every fold and its class</text><text x="89" y="449.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">support. Do not pool uncalibrated raw</text><text x="89" y="482.24" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">scores from different models.</text><rect x="670" y="340" width="545" height="235" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="694" y="378" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Pair uncertainty at the source level.</text><text x="694" y="416.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Resample sources within fold and</text><text x="694" y="449.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">binary label. Carry every method</text><text x="694" y="482.24" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">through the same bootstrap draw.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Four folds are not four independent studies. Window-level bootstraps would overstate precision.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">21 / 40</text></svg>