<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Use a small two-sided profile, fixed before scoring.</title><desc>Measure benefit for left-leg, right-leg and arm targets separately.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">ILLUSTRATIVE PROFILE</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Use a small two-sided profile, fixed before scoring.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Measure benefit for left-leg, right-leg and arm targets separately.</text><rect x="632.5" y="230" width="210.0" height="305" rx="0" fill="#e4f4ef" stroke="#e4f4ef" stroke-width="2"/><line x1="737.5" y1="230" x2="737.5" y2="535" stroke="#087f82" stroke-width="2"/><text x="70" y="298" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172e47" font-weight="bold" text-anchor="start">Left-leg targets</text><line x1="737.5" y1="290" x2="467.5" y2="290" stroke="#ad521b" stroke-width="4"/><path d="M467.5,280 L477.5,290 L467.5,300 L457.5,290 Z" fill="#ad521b"/><text x="70" y="393" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172e47" font-weight="bold" text-anchor="start">Right-leg targets</text><line x1="737.5" y1="385" x2="752.5" y2="385" stroke="#ad521b" stroke-width="4"/><path d="M752.5,375 L762.5,385 L752.5,395 L742.5,385 Z" fill="#ad521b"/><text x="70" y="488" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#172e47" font-weight="bold" text-anchor="start">Arm targets</text><line x1="737.5" y1="480" x2="977.5" y2="480" stroke="#ad521b" stroke-width="4"/><path d="M977.5,470 L987.5,480 L977.5,490 L967.5,480 Z" fill="#ad521b"/><text x="437.5" y="574" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506478" font-weight="normal" text-anchor="middle">-2</text><text x="587.5" y="574" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506478" font-weight="normal" text-anchor="middle">-1</text><text x="737.5" y="574" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506478" font-weight="normal" text-anchor="middle">0</text><text x="887.5" y="574" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506478" font-weight="normal" text-anchor="middle">1</text><text x="1037.5" y="574" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506478" font-weight="normal" text-anchor="middle">2</text><text x="315" y="214" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="normal" text-anchor="start">Less help</text><text x="1160" y="214" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="normal" text-anchor="end">More help</text><text x="737.5" y="614" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506478" font-weight="normal" text-anchor="middle">Illustrative standardized departure from normal</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Either direction can depart from normal. More help does not prove stronger biological coupling.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">17 / 40</text></svg>