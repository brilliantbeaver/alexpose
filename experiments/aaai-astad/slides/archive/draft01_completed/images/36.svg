<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Longer head fitting does not settle the claim.</title><desc>The 512-head-update run stays primary. Both runs retain the same 512-update JEPA pretraining.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">MEASURED: NORMAL-DIAGNOSTIC-MOTIVATED SENSITIVITY</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Longer head fitting does not settle the claim.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">The 512-head-update run stays primary. Both runs retain the same 512-update JEPA</text><text x="60" y="180.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">pretraining.</text><rect x="60" y="210" width="1160" height="58" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="244" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">AUROC score</text><text x="637" y="244" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">512 head updates</text><text x="917" y="244" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#ffffff" font-weight="bold" text-anchor="start">4,096 head updates</text><rect x="60" y="268" width="1160" height="58" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="302" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Latent profile</text><text x="637" y="302" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.641</text><text x="917" y="302" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.667</text><rect x="60" y="326" width="1160" height="58" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="360" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Raw full-context KL</text><text x="637" y="360" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.541</text><text x="917" y="360" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.529</text><rect x="60" y="384" width="1160" height="58" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Full-error distance</text><text x="637" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.673</text><text x="917" y="418" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.666</text><rect x="60" y="442" width="1160" height="58" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="476" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Random-backbone latent profile</text><text x="637" y="476" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.651</text><text x="917" y="476" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.714</text><rect x="60" y="500" width="1160" height="58" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="534" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Four-patch latent profile</text><text x="637" y="534" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.542</text><text x="917" y="534" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">0.644</text><text x="65" y="600.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Longer-run profile minus raw: +0.138; conditional interval [-0.008, 0.280].</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Retain the original primary. Do not select the longer schedule because a test point estimate is higher.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">36 / 40</text></svg>