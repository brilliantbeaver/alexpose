<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Adequate learning must be checked, not assumed.</title><desc>Both schedules are completed. Fixed update counts do not establish convergence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Adequate learning must be checked, not assumed.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Both schedules are completed. Fixed update counts do not establish convergence.</text><rect x="60" y="215" width="360" height="225" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Retain the primary</text><text x="84" y="282" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">recipe.</text><text x="84" y="320.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">Use 512 normal JEPA</text><text x="84" y="354.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">updates, then 512</text><text x="84" y="389.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">updates for each</text><text x="84" y="423.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">matched head.</text><rect x="460" y="215" width="360" height="225" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="484" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">Check normal adequacy.</text><text x="484" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">Full-context</text><text x="484" y="325.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">coordinate error</text><text x="484" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">exceeded own error in</text><text x="484" y="394.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">all four folds.</text><rect x="860" y="215" width="360" height="225" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="884" y="253" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">Retain the sensitivity.</text><text x="884" y="291.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">Fit heads for 4,096</text><text x="884" y="325.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">updates. Keep 512 JEPA</text><text x="884" y="360.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">updates and the</text><text x="884" y="394.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">primary unchanged.</text><rect x="205" y="485" width="870" height="74" rx="14" fill="#e7f1f1" stroke="#b6d9da" stroke-width="2"/><text x="640.0" y="532" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="middle">EMA: teacher ← 0.996 × teacher + 0.004 × online</text><text x="65" y="597.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Longer fitting was motivated by normal diagnostics before abnormal ranking inspection.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">13 / 40</text></svg>