<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Compare information and supervision fairly.</title><desc>The benefit profile must improve on more than a weak or differently weighted score.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Compare information and supervision fairly.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">The benefit profile must improve on more than a weak or differently weighted score.</text><rect x="60" y="214" width="1160" height="62" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="248" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="start">Comparison</text><text x="457" y="248" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="start">Supervision</text><text x="657" y="248" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="start">What it tests</text><rect x="60" y="276" width="1160" height="62" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Matched full raw KL</text><text x="457" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Normal only</text><text x="657" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Same 12 joints, support, weights and aggregation.</text><rect x="60" y="338" width="1160" height="62" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Own/full loss distances</text><text x="457" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Normal only</text><text x="657" y="372" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Whether subtraction adds information.</text><rect x="60" y="400" width="1160" height="62" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="434" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Matched ridge predictors</text><text x="457" y="434" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Normal only</text><text x="657" y="434" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Whether a linear relationship is sufficient.</text><rect x="60" y="462" width="1160" height="62" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">SeeKer or STG-NF</text><text x="457" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Not reproduced</text><text x="657" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Published comparison remains a gap.</text><rect x="60" y="524" width="1160" height="62" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="558" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">RF and frozen probes</text><text x="457" y="558" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">All five labels</text><text x="657" y="558" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Secondary supervised recognition only.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Do not attribute a gain to JEPA if matched ridge prediction explains it.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">22 / 40</text></svg>