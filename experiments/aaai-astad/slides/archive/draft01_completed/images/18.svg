<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Only inner normal sources define the profile reference.</title><desc>A small diagonal reference can rank departures without pretending to be a clinical normal range.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Only inner normal sources define the profile reference.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">A small diagonal reference can rank departures without pretending to be a clinical</text><text x="60" y="180.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">normal range.</text><rect x="60.0" y="220" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Fit normal predictors.</text><text x="84.0" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Use only outer-training</text><text x="84.0" y="327.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">normal sources. Exclude</text><text x="84.0" y="359.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">inner reference sources.</text><path d="M429.3333333333333,347.5 L452.3333333333333,347.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="457.3333333333333" y="220" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="481.3333333333333" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Fit the normal</text><text x="481.3333333333333" y="287" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">reference.</text><text x="481.3333333333333" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Estimate three means and</text><text x="481.3333333333333" y="356.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">a shrunk diagonal</text><text x="481.3333333333333" y="388.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">variance from inner</text><text x="481.3333333333333" y="420.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">normal sources.</text><path d="M826.6666666666666,347.5 L849.6666666666666,347.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="854.6666666666666" y="220" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="878.6666666666666" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Score held-out sources.</text><text x="878.6666666666666" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Measure the squared</text><text x="878.6666666666666" y="327.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">distance of each profile</text><text x="878.6666666666666" y="359.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">from that fixed</text><text x="878.6666666666666" y="391.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">reference.</text><rect x="152" y="521" width="976" height="74" rx="14" fill="#e7f1f1" stroke="#b6d9da" stroke-width="2"/><text x="640.0" y="568" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#087f82" font-weight="bold" text-anchor="middle">score = mean[(benefit − normal mean)² / shrunk variance]</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Do not repair an unstable normal reference by using outer-test normal sources.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">18 / 40</text></svg>