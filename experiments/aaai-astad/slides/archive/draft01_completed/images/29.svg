<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Constituent scores have higher point estimates.</title><desc>Two-sided reference calibration can explain a gain over an uncalibrated raw loss.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">MEASURED: MATCHED ALTERNATIVE EXPLANATIONS</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Constituent scores have higher point estimates.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Two-sided reference calibration can explain a gain over an uncalibrated raw loss.</text><rect x="60" y="218" width="1160" height="61" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Score on the same cohort</text><text x="907" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">AUROC</text><rect x="60" y="279" width="1160" height="61" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="313" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">Benefit profile</text><text x="907" y="313" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">0.641</text><rect x="60" y="340" width="1160" height="61" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="374" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">Full-error distance</text><text x="907" y="374" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">0.673</text><rect x="60" y="401" width="1160" height="61" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="435" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">Own-error distance</text><text x="907" y="435" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">0.657</text><rect x="60" y="462" width="1160" height="61" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="496" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">Random-backbone profile</text><text x="907" y="496" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">0.651</text><text x="65" y="568.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Profile minus full-error distance: -0.031, with conditional interval [-0.152, 0.096].</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Neither subtraction nor self-supervised representation learning has an established advantage here.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">29 / 40</text></svg>