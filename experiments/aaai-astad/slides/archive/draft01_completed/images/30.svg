<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Coordinate targets do not establish a JEPA gain either.</title><desc>The local-target control removes the contextual teacher from the prediction answer.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">MEASURED: LOCAL-TARGET COMPARISON</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Coordinate targets do not establish a JEPA gain either.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">The local-target control removes the contextual teacher from the prediction answer.</text><line x1="505" y1="215" x2="505" y2="483" stroke="#d9e3ec" stroke-width="1"/><text x="505" y="513" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#506478" font-weight="normal" text-anchor="middle">0.00</text><line x1="655.0" y1="215" x2="655.0" y2="483" stroke="#d9e3ec" stroke-width="1"/><text x="655.0" y="513" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#506478" font-weight="normal" text-anchor="middle">0.25</text><line x1="805.0" y1="215" x2="805.0" y2="483" stroke="#d9e3ec" stroke-width="1" stroke-dasharray="5 5"/><text x="805.0" y="513" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#506478" font-weight="normal" text-anchor="middle">0.50</text><line x1="955.0" y1="215" x2="955.0" y2="483" stroke="#d9e3ec" stroke-width="1"/><text x="955.0" y="513" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#506478" font-weight="normal" text-anchor="middle">0.75</text><line x1="1105" y1="215" x2="1105" y2="483" stroke="#d9e3ec" stroke-width="1"/><text x="1105" y="513" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#506478" font-weight="normal" text-anchor="middle">1.00</text><text x="65" y="262" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="bold" text-anchor="start">Learned coordinates</text><rect x="505" y="240" width="411.441647597254" height="31" rx="4" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="928.441647597254" y="264" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">0.686</text><text x="65" y="349" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="bold" text-anchor="start">Random-backbone coordinates</text><rect x="505" y="327" width="420.5949656750572" height="31" rx="4" fill="#ad521b" stroke="#ad521b" stroke-width="2"/><text x="937.5949656750572" y="351" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">0.701</text><text x="65" y="436" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="bold" text-anchor="start">Fixed ridge coordinates</text><rect x="505" y="414" width="364.30205949656744" height="31" rx="4" fill="#315cb5" stroke="#315cb5" stroke-width="2"/><text x="881.3020594965674" y="438" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">0.607</text><text x="65" y="585.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">The random-backbone coordinate control shares the same observable target.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">A useful coordinate score alone would not prove that learned JEPA features are necessary.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">30 / 40</text></svg>