<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Build a paper around the demonstrated limitations.</title><desc>The workshop deadline is November 20, 2026, verified on the official site on November 15.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">EVIDENCE AND SUBMISSION</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Build a paper around the demonstrated limitations.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">The workshop deadline is November 20, 2026, verified on the official site on November</text><text x="60" y="180.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">15.</text><rect x="60" y="220" width="360" height="270" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">A bounded empirical</text><text x="84" y="287" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">finding</text><text x="84" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">The primary interval</text><text x="84" y="358.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">includes zero. Matched</text><text x="84" y="391.24" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">controls do not</text><text x="84" y="424.36" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">establish a learned</text><text x="84" y="457.48" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">JEPA advantage.</text><rect x="460" y="220" width="360" height="270" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="484" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">A clear novelty</text><text x="484" y="287" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">boundary</text><text x="484" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">The contribution is a</text><text x="484" y="358.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">controlled limitation</text><text x="484" y="391.24" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">study. A validated</text><text x="484" y="424.36" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">published comparator is</text><text x="484" y="457.48" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">still missing.</text><rect x="860" y="220" width="360" height="270" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="884" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">A reviewable submission</text><text x="884" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Freeze claims by</text><text x="884" y="329.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">November 19. Submit PDF</text><text x="884" y="362.24" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">by November 20 using</text><text x="884" y="395.36" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">AAAI-27 format and</text><text x="884" y="428.48" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">double-blind review.</text><text x="65" y="554.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">ASTAD permits seven content pages plus two reference-only pages. The site does not</text><text x="65" y="587.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">state a cutoff timezone.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Current evidence supports an exploratory methods study, not clinical detection or a demonstrated JEPA gain.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">40 / 40</text></svg>