<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>A longer-term world model would represent the forward process.</title><desc>Control, body mechanics, state feedback and observation are separate modeling components.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">LONGER-TERM PROPOSAL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">A longer-term world model would represent the forward process.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Control, body mechanics, state feedback and observation are separate modeling</text><text x="60" y="180.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">components.</text><rect x="65" y="225" width="330" height="190" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="89" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">A controller selects</text><text x="89" y="292" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">action.</text><text x="89" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Its choice depends on</text><text x="89" y="361.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">state, task and</text><text x="89" y="393.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">control parameters.</text><rect x="475" y="225" width="330" height="190" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="499" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">The body produces</text><text x="499" y="292" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">motion.</text><text x="499" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Muscles, geometry and</text><text x="499" y="361.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">contact determine the</text><text x="499" y="393.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">next physical state.</text><rect x="885" y="225" width="330" height="190" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="909" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">A camera measures it.</text><text x="909" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Projection, occlusion</text><text x="909" y="332.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">and the pose estimator</text><text x="909" y="364.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">produce observed</text><text x="909" y="396.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">keypoints.</text><path d="M403,320 L465,320" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M813,320 L875,320" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M640,423 L640,465 L230,465 L230,424" stroke="#315cb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="420" y="494" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#315cb5" font-weight="normal" text-anchor="middle">State feedback</text><rect x="205" y="535" width="870" height="74" rx="14" fill="#e7f1f1" stroke="#b6d9da" stroke-width="2"/><text x="640.0" y="582" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="middle">External measurements are needed to validate hidden components.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">A physiological name for a latent variable is not physiological validation.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">38 / 40</text></svg>