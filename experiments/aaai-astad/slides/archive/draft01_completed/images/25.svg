<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Visible-phenotype annotations can test interpretation.</title><desc>A description of movement is different from a retrospective medical diagnosis.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Visible-phenotype annotations can test interpretation.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">A description of movement is different from a retrospective medical diagnosis.</text><rect x="60.0" y="220" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84.0" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Blind the review.</text><text x="84.0" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Hide folder labels and</text><text x="84.0" y="327.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">model scores. Fix the</text><text x="84.0" y="359.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">source sample in advance.</text><path d="M429.3333333333333,347.5 L452.3333333333333,347.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="457.3333333333333" y="220" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="481.3333333333333" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Describe visible</text><text x="481.3333333333333" y="287" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">movement.</text><text x="481.3333333333333" y="325.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Record asymmetry, arm</text><text x="481.3333333333333" y="356.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">excursion, knee flexion,</text><text x="481.3333333333333" y="388.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">trunk motion and aids.</text><path d="M826.6666666666666,347.5 L849.6666666666666,347.5" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="854.6666666666666" y="220" width="365.3333333333333" height="255" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="878.6666666666666" y="258" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Record uncertainty.</text><text x="878.6666666666666" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">Use two suitable</text><text x="878.6666666666666" y="327.74" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">reviewers, written</text><text x="878.6666666666666" y="359.48" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">definitions and an</text><text x="878.6666666666666" y="391.22" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#172e47" font-weight="normal" text-anchor="start">unscorable option.</text><text x="62" y="533.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Report agreement. Without independent review, call automatic measures proxies rather</text><text x="62" y="566.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">than physiological validation.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Movement descriptions support interpretation. They do not replace the detection endpoint.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">25 / 40</text></svg>