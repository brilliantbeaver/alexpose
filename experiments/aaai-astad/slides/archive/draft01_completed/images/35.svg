<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>The real diagnostic shows a contextual target effect.</title><desc>The left-leg timing edit preserves the eight measured arm and right-leg targets.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">MEASURED: DEVELOPMENT DIAGNOSTICS, FOLD 1</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">The real diagnostic shows a contextual target effect.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">The left-leg timing edit preserves the eight measured arm and right-leg targets.</text><rect x="60" y="225" width="355" height="270" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="84" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">Paired profile coverage</text><text x="84" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">5 of 12 normal</text><text x="84" y="336.88" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">fitting sources</text><text x="84" y="372.76" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">retain every required</text><text x="84" y="408.64" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">region after all</text><text x="84" y="444.52" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">edits.</text><rect x="462" y="225" width="355" height="270" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="486" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">Own prediction is</text><text x="486" y="292" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">unchanged</text><text x="486" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Maximum absolute own-</text><text x="486" y="363.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">predictor component:</text><text x="486" y="396.24" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">0.000. Its permitted</text><text x="486" y="429.36" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">coordinates did not</text><text x="486" y="462.48" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">change.</text><rect x="864" y="225" width="355" height="270" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="888" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">The teacher target can</text><text x="888" y="292" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#315cb5" font-weight="bold" text-anchor="start">change</text><text x="888" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">Own-branch teacher</text><text x="888" y="363.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">component spans -0.751</text><text x="888" y="396.24" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">to 0.278 in observed</text><text x="888" y="429.36" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">source-joint raw KL.</text><text x="65" y="559.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172e47" font-weight="normal" text-anchor="start">The raw teacher diagnostic has 87 observed source-joint rows across 12 fitting sources.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="17.796610169491522" fill="#172e47" font-weight="normal" text-anchor="start">The teacher can change an unchanged joint’s target. This does not establish disease mechanism or clinical explanation.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">35 / 40</text></svg>