roke="#b6d9da" stroke-width="2"/><text x="640.0" y="557" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#087f82" font-weight="bold" text-anchor="middle">8,950 windows | 1,303 annotated sequences | 251 source videos</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">The binary cohort contains 23 normal and 228 abnormal sources. Many windows do not replace normal diversity.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">08 / 40</text></svg>