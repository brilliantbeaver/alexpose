<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Information isolation must hold for each target token.</title><desc>A restricted prediction head is insufficient if its input already contains the whole body.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Information isolation must hold for each target token.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">A restricted prediction head is insufficient if its input already contains the whole</text><text x="60" y="180.12" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">body.</text><rect x="60" y="245" width="1160" height="66" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="279" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Branch</text><text x="347" y="279" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Target-joint history</text><text x="617" y="279" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Other joints at target patch</text><text x="1002" y="279" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="start">Other-joint times</text><rect x="60" y="311" width="1160" height="66" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="345" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Own joint</text><text x="347" y="345" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Allowed</text><text x="617" y="345" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Blocked</text><text x="1002" y="345" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Blocked</text><rect x="60" y="377" width="1160" height="66" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="411" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Patch-local context</text><text x="347" y="411" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Allowed</text><text x="617" y="411" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Allowed</text><text x="1002" y="411" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Blocked</text><rect x="60" y="443" width="1160" height="66" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="477" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Full context</text><text x="347" y="477" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Allowed</text><text x="617" y="477" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Allowed</text><text x="1002" y="477" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172e47" font-weight="normal" text-anchor="start">Allowed</text><text x="70" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">Apply the restriction before contextual encoding and at every attention layer.</text><text x="70" y="604.5" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#172e47" font-weight="normal" text-anchor="start">Test excluded-input noninterference.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">If local geometry and motion explain the benefit, do not call it long-range temporal information.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">15 / 40</text></svg>