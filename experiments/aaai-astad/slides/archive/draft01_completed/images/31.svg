<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Observation support and the normal reference matter.</title><desc>Five inner normal sources define each fitted reference.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">MEASURED: SUPPORT AND REFERENCE SENSITIVITY</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Observation support and the normal reference matter.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">Five inner normal sources define each fitted reference.</text><rect x="65" y="225" width="545" height="245" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="89" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#087f82" font-weight="bold" text-anchor="start">All eligible target patches</text><text x="89" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">AUROC 0.641. Sources contribute</text><text x="89" y="336.88" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">all eligible targets under the</text><text x="89" y="372.76" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">fixed masks.</text><rect x="670" y="225" width="545" height="245" rx="14" fill="#ffffff" stroke="#d9e3ec" stroke-width="2"/><text x="694" y="263" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ad521b" font-weight="bold" text-anchor="start">Four target patches per joint</text><text x="694" y="301.0" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">AUROC 0.542. The target-count</text><text x="694" y="336.88" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#172e47" font-weight="normal" text-anchor="start">restriction changes the result.</text><rect x="90" y="515" width="1100" height="74" rx="14" fill="#e7f1f1" stroke="#b6d9da" stroke-width="2"/><text x="640.0" y="562" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#087f82" font-weight="bold" text-anchor="middle">Leave-one-reference-out AUROC range: 0.585 to 0.673</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">The primary profile is sensitive to support and reference choices. Report both alongside its point estimate.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">31 / 40</text></svg>