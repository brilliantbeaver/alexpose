<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Each scientific claim needs its own evidence gate.</title><desc>A passing software test does not establish a useful anomaly detector.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#087f82"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><rect x="0" y="0" width="18" height="720" rx="0" fill="#087f82" stroke="#087f82" stroke-width="2"/><text x="60" y="40" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#087f82" font-weight="bold" text-anchor="start">STUDY PROTOCOL</text><text x="60" y="88" font-family="Arial, Helvetica, sans-serif" font-size="35" fill="#172e47" font-weight="bold" text-anchor="start">Each scientific claim needs its own evidence gate.</text><text x="60" y="147.0" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506478" font-weight="normal" text-anchor="start">A passing software test does not establish a useful anomaly detector.</text><rect x="60" y="218" width="1160" height="61" rx="7" fill="#172e47" stroke="#172e47" stroke-width="2"/><text x="77" y="252" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="start">Evidence gate</text><text x="327" y="252" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="start">Required observation</text><text x="782" y="252" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="start">If it does not hold</text><rect x="60" y="279" width="1160" height="61" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="313" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Learning</text><text x="327" y="313" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Stable development diagnostics.</text><text x="782" y="313" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Limit the claim to a bounded recipe.</text><rect x="60" y="340" width="1160" height="61" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Information</text><text x="327" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Other joints help held-out normals.</text><text x="782" y="374" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Investigate whether the contrast is useful.</text><rect x="60" y="401" width="1160" height="61" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="435" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Interpretation</text><text x="327" y="435" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Local target and controls survive.</text><text x="782" y="435" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Avoid a movement-relationship claim.</text><rect x="60" y="462" width="1160" height="61" rx="0" fill="#f2f6fa" stroke="#ffffff" stroke-width="2"/><text x="77" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Detection</text><text x="327" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Gain and interval on matched sources.</text><text x="782" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Report uncertainty or a precise null.</text><rect x="60" y="523" width="1160" height="61" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="77" y="557" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Generalization</text><text x="327" y="557" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Independent people and settings.</text><text x="782" y="557" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#172e47" font-weight="normal" text-anchor="start">Keep the claim internal to GAVD.</text><rect x="45" y="638" width="1190" height="47" rx="8" fill="#f2f6fa" stroke="#f2f6fa" stroke-width="2"/><text x="60" y="668" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#172e47" font-weight="normal" text-anchor="start">Uncertainty, missing evidence and failed hypotheses remain reportable outcomes.</text><text x="60" y="704" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#506478" font-weight="normal" text-anchor="start">Skeleton predictive learning | Neuromechanics study | November 2026</text><text x="1218" y="704" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#506478" font-weight="normal" text-anchor="end">26 / 40</text></svg>