  <g id="text_14">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203547" x="40.32" y="47.716406" transform="rotate(-0 40.32 47.716406)">The experiment that fits the coming week</text>
  </g>
  <g id="text_15">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="72.118125" transform="rotate(-0 40.32 72.118125)">Preserve normal-only learning, matched targets, and source-separated evaluation.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526575" x="40.32" y="483.837539" transform="rotate(-0 40.32 483.837539)">Proposed workflow. Existing training results do not validate it. Source groups stay separate across fitting, validation, and testing.</text>
  </g>
