   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #bc653b" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">EXTENSION GATES</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.128906" transform="rotate(-0 51.84 76.128906)">Additional complexity has explicit scientific prerequisites.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">The completed core is deterministic and coordinate-based. Extensions remain separately identified decisions.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="549.157031" transform="rotate(-0 51.84 549.157031)">These are proposed extensions with gates, not completed results or promised performance improvements.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  NEXT DECISIONS</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">39 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="64.8" y="217.111406" transform="rotate(-0 64.8 217.111406)">Extension</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="317.1" y="215.512969" transform="rotate(-0 317.1 215.512969)">Required prerequisite</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="691.2" y="217.111406" transform="rotate(-0 691.2 217.111406)">Evidence needed before a claim</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 273.377812)">Predict a learned</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 291.792266)">summary</text>
   </g>
   <g id="text_12">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 271.730937)">Keep the model, masks, and training</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 293.490937)">budget matched.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 271.730937)">Measure future coordinates and verify that</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 295.137812)">summaries retain variation.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 338.690937)">Learn which inputs to</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 362.097812)">hide</text>
   </g>
   <g id="text_15">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 338.690937)">A remaining question after fixed masks;</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 360.450937)">constrain coverage.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 338.690937)">Measure extra compute and add a</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 360.450937)">randomized-policy control.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="64.8" y="416.530937" transform="rotate(-0 64.8 416.530937)">Use walking-cycle timing</text>
   </g>
   <g id="text_18">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 405.650937)">Validate events blindly and require two</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 427.410937)">credible prefix cycles.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 405.650937)">Report timing error, failure rate, and the</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 427.410937)">eligible population.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 474.257812)">Predict a distribution of</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 496.017812)">futures</text>
   </g>
   <g id="text_21">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 472.610937)">Show why a deterministic forecast is</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(317.1 494.370937)">inadequate.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 472.610937)">Use proper distribution scores, coverage,</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(691.2 494.370937)">and sharpness.</text>
   </g>
  </g>
