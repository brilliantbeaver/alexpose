   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.242188" transform="rotate(-0 51.84 76.242188)">Seven mask policies test what the model can recover.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">All policies predict the same hidden future. Only additional training-prefix removal changes.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="549.157031" transform="rotate(-0 51.84 549.157031)">M1 and later arms hide 40% of eligible non-protected tokens. The endpoint uses a full naturally observed prefix.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  MASKING</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">14 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 17.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="64.8" y="217.339297" transform="rotate(-0 64.8 217.339297)">Arm</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="273.6" y="215.720547" transform="rotate(-0 273.6 215.720547)">Prefix information deliberately hidden</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 17.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="699.9" y="217.484219" transform="rotate(-0 699.9 217.484219)">Reason for the control</text>
   </g>
   <g id="text_11">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="64.8" y="284.471719" transform="rotate(-0 64.8 284.471719)">M0</text>
   </g>
   <g id="text_12">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="273.6" y="284.353594" transform="rotate(-0 273.6 284.353594)">None.</text>
   </g>
   <g id="text_13">
