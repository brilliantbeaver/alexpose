   </g>
   <g id="text_15">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="273.6" y="349.846875" transform="rotate(-0 273.6 349.846875)">Uniform tokens / four-sample time blocks.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(699.9 338.326875)">Random removal versus short tracking</text>
