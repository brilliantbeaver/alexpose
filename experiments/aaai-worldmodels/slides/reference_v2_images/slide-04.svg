   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.128906" transform="rotate(-0 51.84 76.128906)">Independent coverage sets the scale of the evidence.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">Thousands of overlapping windows provide many observations of a much smaller number of groups.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="549.157031" transform="rotate(-0 51.84 549.157031)">GAVD alone does not establish patient-disjoint, site-disjoint, or prospective clinical generalization.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  DATA</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">04 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 18.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="64.8" y="224.362578" transform="rotate(-0 64.8 224.362578)">Evaluation setting</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 18.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(349.527273 212.594844)">Windows / sequences or</text>
    <text style="font-weight: 700; font-size: 18.5px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(349.527273 236.202578)">recordings</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 18.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="729.163636" y="224.362578" transform="rotate(-0 729.163636 224.362578)">Independent-group proxy</text>
   </g>
   <g id="text_11">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 296.112812)">GAVD, internal grouped</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 322.273438)">evaluation</text>
   </g>
   <g id="text_12">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="349.527273" y="308.272812" transform="rotate(-0 349.527273 308.272812)">2,815 windows; 456 sequences</text>
   </g>
   <g id="text_13">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="729.163636" y="309.144141" transform="rotate(-0 729.163636 309.144141)">91 source videos; 29 normal</text>
   </g>
   <g id="text_14">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="64.8" y="392.844141" transform="rotate(-0 64.8 392.844141)">KOA-PD-NM, frozen transfer</text>
   </g>
   <g id="text_15">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="349.527273" y="391.972812" transform="rotate(-0 349.527273 391.972812)">773 windows; 168 recordings</text>
   </g>
   <g id="text_16">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="729.163636" y="391.972812" transform="rotate(-0 729.163636 391.972812)">90 coded participants; 27 normal</text>
   </g>
   <g id="text_17">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 465.353437)">What the count does not</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 485.934297)">prove</text>
   </g>
   <g id="text_18">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(349.527273 463.512812)">Windows from the same recording</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(349.527273 489.673437)">are related.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 465.353437)">GAVD source IDs are not verified</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 487.832812)">patient IDs.</text>
   </g>
