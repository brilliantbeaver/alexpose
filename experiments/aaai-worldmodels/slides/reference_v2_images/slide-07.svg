   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.128906" transform="rotate(-0 51.84 76.128906)">Every model sees the same past and predicts the same future.</text>
   </g>
   <g id="text_4">
