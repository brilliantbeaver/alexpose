   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="549.157031" transform="rotate(-0 51.84 549.157031)">Nearest-native-frame sampling is nominally 10 Hz. Actual decoded times are retained for motion calculations.</text>
