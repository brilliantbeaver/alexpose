   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 27.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="74.760859" transform="rotate(-0 51.84 74.760859)">Optimization seeds and repeated partitions are sensitivity checks.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 127.890937)">Three optimization seeds describe fitting variation. Two alternate source partitions repeat the compact forecast</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 149.650937)">comparison.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 549.157031)">Partition effects use complete refits under the declared normal-only selection. They remain correlated evaluations of the same</text>
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 568.949805)">sources.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  SENSITIVITY</text>
   </g>
   <g id="text_7">
