   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.128906" transform="rotate(-0 51.84 76.128906)">Transfer exposes acquisition and reference-range shifts.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">Nominal 10 Hz sampling does not make recording conditions equivalent.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 549.157031)">Confidence summaries use different joint sets in some descriptive caches; the declared 16-joint support and prefix covariates</text>
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 570.498594)">remain consistent.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  TRANSFER LIMITS</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">36 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 222.720625)">The cameras differ by</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 246.322188)">group.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 288.922812)">Among decodable recordings,</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 315.083438)">51 of 59 normal videos use 30</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 338.434141)">FPS; 98 of 100 osteoarthritis</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 363.723437)">videos use 50 FPS. Blur and</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 386.202812)">framing can remain different.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 224.73625)">The usable observations</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 250.33625)">differ.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 288.922812)">Only 84 of 218 candidate</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 315.083438)">normal windows survive the</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 337.562812)">fixed observation gates. Age,</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 361.882812)">clothing, reflective markers, and</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 386.202812)">hospital backgrounds also</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 412.363437)">differ.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 224.73625)">The reference can</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 249.759688)">saturate.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 288.922812)">Across the 15 PV components,</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 313.242813)">36 to 77 of 90 participants lie</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 337.562812)">outside a fitted covariate range.</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 361.882812)">Between 9 and 79 fall beyond a</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 386.202812)">normal residual range.</text>
   </g>
  </g>
