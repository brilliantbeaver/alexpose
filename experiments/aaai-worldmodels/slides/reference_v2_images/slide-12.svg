   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.242188" transform="rotate(-0 51.84 76.242188)">A compact movement state is interpretable and inexpensive.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">The 64 features describe joint positions and recent changes measured from observed prefix pairs.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 549.157031)">PV denotes the combined posture, velocity, dispersion, and support state. Any improvement must be interpreted for that combined</text>
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 568.997031)">input.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  MODELS</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">12 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="66.96" y="224.559687" transform="rotate(-0 66.96 224.559687)">Current state</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 263.322812)">Sixteen xy coordinates describe</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 287.642812)">eight distal joints. Eight</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 313.803437)">indicators record whether their</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 338.123437)">latest anchors are known.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="424.56" y="222.720625" transform="rotate(-0 424.56 222.720625)">Recent change</text>
   </g>
   <g id="text_11">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 265.163437)">Sixteen coordinatewise median</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 287.642812)">slopes use the last five prefix</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 311.962812)">intervals, divided by actual</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 336.282812)">measured time gaps.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="782.16" y="222.79875" transform="rotate(-0 782.16 222.79875)">Dispersion and support</text>
   </g>
   <g id="text_13">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 265.163437)">Sixteen median absolute</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 287.642812)">deviations describe slope</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 311.962812)">variation. Eight measured-pair</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 338.123437)">counts record observation</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 360.055078)">support.</text>
   </g>
  </g>
