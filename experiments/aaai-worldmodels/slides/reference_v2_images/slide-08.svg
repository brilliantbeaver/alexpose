   <g id="text_25">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="480.96" y="263.250938" transform="rotate(-0 480.96 263.250938)">Each frame uses its pelvis center. Scale uses the prefix only.</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="480.96" y="331.056563" transform="rotate(-0 480.96 331.056563)">Four target joints describe each leg.</text>
   </g>
   <g id="text_27">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="480.96" y="369.090938" transform="rotate(-0 480.96 369.090938)">Knee, ankle, heel, and foot index are predicted on each leg.</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="480.96" y="444.237188" transform="rotate(-0 480.96 444.237188)">Joint numbers follow BlazePose-33.</text>
