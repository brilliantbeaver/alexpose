   <g id="text_24">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="480.96" y="225.216563" transform="rotate(-0 480.96 225.216563)">A shared body reference defines the input.</text>
