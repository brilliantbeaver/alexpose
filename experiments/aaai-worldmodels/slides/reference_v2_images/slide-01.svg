   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.242188" transform="rotate(-0 51.84 76.242188)">Useful movement prediction needs reference-aware evaluation.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">Current posture reduces normal-source forecast error by 40.8% relative to persistence.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="549.157031" transform="rotate(-0 51.84 549.157031)">Source videos and coded participants are different evaluation units and are never pooled into one sample count.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  QUESTION</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">01 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 222.79875)">The scientific question is</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 248.39875)">specific.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 288.922812)">Can the model recognize</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 313.242813)">departures from normal</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 337.562812)">organization beyond movement</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 361.335078)">amount, current posture,</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(66.96 386.202812)">camera view, and pose quality?</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 222.720625)">The study uses strong</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 250.33625)">references.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 288.922812)">Compact forecasts, matched</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 313.242813)">masks, and a separate normal</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 339.403437)">reference are evaluated</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 361.882812)">alongside low-motion and</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(424.56 386.202812)">current-posture controls.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 222.720625)">Forecasting and ranking</text>
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 250.33625)">differ.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 288.922812)">The GAVD study uses 91 source</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 315.083438)">videos. Transfer uses 90 coded</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 337.562812)">participants. The locked</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 363.723437)">calibrated score adds no</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 386.202812)">demonstrated ranking</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(782.16 410.522812)">advantage over low motion.</text>
   </g>
  </g>
 </g>
