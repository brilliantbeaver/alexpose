   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.128906" transform="rotate(-0 51.84 76.128906)">Movement physiology motivates tests, not neural diagnoses.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">Impaired walking can become more variable, more stereotyped, or systematically compensated.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 549.157031)">The physiological literature motivates both unusually easy and unusually difficult prediction as possibilities. The direction is tested</text>
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 568.997031)">empirically.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  QUESTION</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">03 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="64.8" y="217.111406" transform="rotate(-0 64.8 217.111406)">Motivation</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="387.490909" y="215.512969" transform="rotate(-0 387.490909 215.512969)">Observable question</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="729.163636" y="215.512969" transform="rotate(-0 729.163636 215.512969)">Interpretation limit</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 271.730937)">Parkinson gait can alter bilateral</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 293.490937)">timing.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 271.730937)">Does opposite-leg timing add useful</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 293.490937)">prediction?</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 271.730937)">Projected joints do not identify</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 293.490937)">basal-ganglia circuitry.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 338.690937)">Stroke can change coordination</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 360.450937)">and compensation.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 338.690937)">Are left/right forecast patterns</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 362.097812)">unusual?</text>
   </g>
   <g id="text_16">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 340.337812)">Muscle-activation modules and affected</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 362.097812)">side are not measured.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 405.650937)">Cerebral palsy can alter selective</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 429.057812)">control.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 405.650937)">Do multijoint departures repeat</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 428.907734)">across sources?</text>
   </g>
   <g id="text_19">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 405.650937)">Age, devices, and view can explain</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 429.057812)">differences.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 472.610937)">Myopathic gait can reflect</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(64.8 496.017812)">weakness.</text>
   </g>
   <g id="text_21">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 472.610937)">Do hip-near and foot-near patterns</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(387.490909 496.017812)">differ?</text>
   </g>
   <g id="text_22">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 474.257812)">The video does not measure muscle</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(729.163636 494.370937)">strength.</text>
   </g>
  </g>
 </g>
