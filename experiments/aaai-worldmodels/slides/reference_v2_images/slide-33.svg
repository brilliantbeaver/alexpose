   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="75.216875" transform="rotate(-0 51.84 75.216875)">Participant aggregation precedes every nonlinear tail transform.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="129.632344" transform="rotate(-0 51.84 129.632344)">The GAVD forecast, nuisance model, and normal residual distribution are frozen.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="549.157031" transform="rotate(-0 51.84 549.157031)">Averaging per-recording tail ranks first would produce a different statistic and is not the declared method.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  EXTERNAL TRANSFER</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">33 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(68.812891 282.923437)">Observed coordinates</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(121.733828 305.402812)">→ each leg</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(362.403906 282.923437)">Windows → each</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(396.681094 305.402812)">recording</text>
   </g>
   <g id="text_10">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(614.870312 281.082812)">Recordings → coded</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(658.697969 305.402812)">participant</text>
   </g>
   <g id="text_11">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(917.613984 282.923437)">Stored GAVD</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(904.653906 307.243438)">reference → tail</text>
   </g>
   <g id="text_12">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(132.120781 449.190625)">Only after participant aggregation, apply each of the 15 frozen transforms. Then</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(156.891406 477.350625)">average the 15 tail scores. No external example fits the model or reference.</text>
   </g>
