   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.128906" transform="rotate(-0 51.84 76.128906)">The normal reference is separate from every contributing fit.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="130.550625" transform="rotate(-0 51.84 130.550625)">The same forecast and nuisance reference score C and the held-out outer sources.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="549.157031" transform="rotate(-0 51.84 549.157031)">The nuisance model sees log prefix motion and prefix missingness. C sources are excluded from all contributing fits and selections.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  ANOMALY SCORING</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">24 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="70.56" y="228.096562" transform="rotate(-0 70.56 228.096562)">R: normal forecast fitting</text>
   </g>
   <g id="text_9">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(70.56 267.777813)">15 or 16 sources fit a forecast.</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(70.56 289.537813)">Inner fits on 10 or 11 sources</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(70.56 311.297813)">create out-of-fit errors for the</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(70.56 333.057813)">nuisance reference.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(434.16 228.166875)">C: separate normal</text>
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(434.16 252.950625)">reference</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(434.16 290.817813)">The 7 or 8 C sources enter no</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(434.16 310.930938)">contributing fit. Their ranks</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(434.16 332.690938)">define unusual prediction.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="797.76" y="229.910625" transform="rotate(-0 797.76 229.910625)">Outer sources: evaluation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(797.76 267.777813)">Normal and abnormal sources</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(797.76 289.537813)">receive the same frozen</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(797.76 310.430547)">forecast, nuisance reference,</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(797.76 333.057813)">and tail transform.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(99.26 450.990625)">Rotate C three times inside each outer fold, then average the three tail scores. Repeat</text>
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(276.066094 479.150625)">the complete schedule for the current-posture control.</text>
   </g>
  </g>
