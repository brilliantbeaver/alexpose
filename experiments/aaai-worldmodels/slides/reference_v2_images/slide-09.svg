   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="76.128906" transform="rotate(-0 51.84 76.128906)">Missing observations, training masks, and queries differ.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">A confidence gate describes what was observed; a training mask deliberately removes an observed input.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 549.157031)">Confidence ≥ 0.5 and separate 70% prefix/future support gates are study settings. Future-relative target normalization and</text>
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 568.997031)">evaluation support may change.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  OBSERVATION CONTRACT</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">09 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="64.8" y="215.512969" transform="rotate(-0 64.8 215.512969)">Operation</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="294.833898" y="215.448516" transform="rotate(-0 294.833898 215.448516)">Meaning</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="666.427119" y="215.448516" transform="rotate(-0 666.427119 215.448516)">Where it may act</text>
   </g>
   <g id="text_11">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="64.8" y="282.610937" transform="rotate(-0 64.8 282.610937)">Natural missingness</text>
   </g>
   <g id="text_12">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 271.730937)">The pose estimate lacks sufficient</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 293.000859)">support.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 271.730937)">The prefix keeps validity indicators; missing</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 293.490937)">targets are not scored.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="64.8" y="349.570937" transform="rotate(-0 64.8 349.570937)">Artificial prefix masking</text>
   </g>
   <g id="text_15">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 338.690937)">A policy hides an otherwise observed</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 360.450937)">xy token.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 338.690937)">Coordinates are erased before causal filling</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 362.097812)">and feature calculation.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="64.8" y="416.269297" transform="rotate(-0 64.8 416.269297)">Future query</text>
   </g>
   <g id="text_18">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 405.650937)">The predictor is asked for a fixed future</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 427.410937)">joint and time.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 405.650937)">Queries do not depend on future confidence or</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 427.410937)">target values.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="64.8" y="485.137812" transform="rotate(-0 64.8 485.137812)">Future-isolation test</text>
   </g>
   <g id="text_21">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 472.610937)">Change every future coordinate and</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(294.833898 494.370937)">validity bit.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 472.610937)">Predictions, masks, anchors, and prefix</text>
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(666.427119 494.370937)">normalization must stay unchanged.</text>
   </g>
  </g>
 </g>
