   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 549.157031)">This is a feature-decoding diagnostic inside normal training sources. It is not participant recognition or an independent</text>
