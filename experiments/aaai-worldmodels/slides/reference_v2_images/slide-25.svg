   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="26.64" transform="rotate(-0 54 26.64)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1098" y="26.64" transform="rotate(-0 1098 26.64)">COMPLETED STUDY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17354b" x="51.84" y="79.051562" transform="rotate(-0 51.84 79.051562)">A two-sided tail asks what is unusual relative to normal.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="51.84" y="128.806875" transform="rotate(-0 51.84 128.806875)">The exact step curve uses the first frozen calibration component, selected by its saved order.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 549.157031)">The residual is log forecast MSE minus its normal prediction from the prefix. Orange ticks mark 8 normal references; open circles</text>
    <text style="font-size: 15.5px; font-family: 'DejaVu Sans'; fill: #526879" transform="translate(51.84 570.498594)">show midrank tails.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526879" x="54" y="618.48" transform="rotate(-0 54 618.48)">REFERENCE-AWARE GAIT STUDY V2  |  ANOMALY SCORING</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526879" x="1098" y="618.48" transform="rotate(-0 1098 618.48)">25 / 40</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(703.44 244.704687)">A high score can mean</text>
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(703.44 272.864688)">unusually easy or unusually</text>
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(703.44 301.110625)">difficult prediction.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(703.44 392.923437)">The small normal reference makes</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(703.44 417.243438)">ranks coarse. The transform has no</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(703.44 441.563438)">automatic clinical or conformal</text>
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; fill: #17354b" transform="translate(703.44 463.495078)">coverage guarantee.</text>
   </g>
