   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #526a79" transform="translate(54 565.559062)">A small normal-source sample limits calibration resolution. Empirical ranks do not establish clinical coverage under source</text>
