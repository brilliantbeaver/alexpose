   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="50.4" y="97.005938" transform="rotate(-0 50.4 97.005938)">Two-sided calibration tests both tails of normal variation.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="143.350937" transform="rotate(-0 50.4 143.350937)">Normal-only calibration tests unusually easy or difficult prediction relative to observed prefix conditions.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="54" y="565.559062" transform="rotate(-0 54 565.559062)">This is a proposed score. The displayed curve is conceptual and is not a fitted clinical distribution.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="619.2" transform="rotate(-0 50.4 619.2)">Source: iteration02 research instruction and linked primary literature; the new experiments are proposed.</text>
   </g>
