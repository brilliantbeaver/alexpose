   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="24.48" transform="rotate(-0 50.4 24.48)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1101.6" y="24.48" transform="rotate(-0 1101.6 24.48)">PLAN / EXECUTION STATUS IN NOTEBOOKS</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="50.4" y="97.005938" transform="rotate(-0 50.4 97.005938)">The notebooks should teach one decision at a time.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="143.350937" transform="rotate(-0 50.4 143.350937)">Each notebook needs independent setup, an input identity and an explicit execution status.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="54" y="565.559062" transform="rotate(-0 54 565.559062)">Notebook 16 is the bridge audit. Notebooks 20 through 26 describe the proposed next execution sequence.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="619.2" transform="rotate(-0 50.4 619.2)">Source: iteration02 research instruction and linked primary literature; the new experiments are proposed.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526a79" x="1101.6" y="619.2" transform="rotate(-0 1101.6 619.2)">31 / 36</text>
   </g>
