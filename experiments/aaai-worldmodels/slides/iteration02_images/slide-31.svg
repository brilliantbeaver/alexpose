   </g>
   <g id="text_12">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="314.251327" y="269.292188" transform="rotate(-0 314.251327 269.292188)">Audit scores and illustrate masks.</text>
   </g>
   <g id="text_13">
