   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="24.48" transform="rotate(-0 50.4 24.48)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1101.6" y="24.48" transform="rotate(-0 1101.6 24.48)">RATIONALE / PROPOSED</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="50.4" y="94.284844" transform="rotate(-0 50.4 94.284844)">Different annotations suggest different checks.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="143.350937" transform="rotate(-0 50.4 143.350937)">These hypotheses concern visible movement and need independent clinical validation.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="54" y="565.559062" transform="rotate(-0 54 565.559062)">No disease-specific direction is assumed for raw prediction error. The same condition can contain several movement patterns.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="619.2" transform="rotate(-0 50.4 619.2)">Sources: neurological primary studies in the iteration02 literature registry; GAVD labels.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526a79" x="1101.6" y="619.2" transform="rotate(-0 1101.6 619.2)">04 / 36</text>
   </g>
   <g id="text_8">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="64.8" y="221.232187" transform="rotate(-0 64.8 221.232187)">Annotation</text>
   </g>
   <g id="text_9">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="295.578947" y="219.779062" transform="rotate(-0 295.578947 219.779062)">Observable hypothesis</text>
   </g>
   <g id="text_10">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ffffff" x="636.252632" y="219.779062" transform="rotate(-0 636.252632 219.779062)">Required restraint</text>
   </g>
   <g id="text_11">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="64.8" y="285.685" transform="rotate(-0 64.8 285.685)">Parkinsons</text>
   </g>
   <g id="text_12">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="295.578947" y="284.135" transform="rotate(-0 295.578947 284.135)">Test bilateral timing.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="636.252632" y="284.135" transform="rotate(-0 636.252632 284.135)">Do not infer a specific neural cause.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="64.8" y="349.765" transform="rotate(-0 64.8 349.765)">Stroke</text>
   </g>
   <g id="text_15">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #153448" transform="translate(295.578947 337.655)">Test asymmetry and low</text>
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; fill: #153448" transform="translate(295.578947 358.775)">variability.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="636.252632" y="348.215" transform="rotate(-0 636.252632 348.215)">A simple trajectory may be impaired.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="64.8" y="412.295" transform="rotate(-0 64.8 412.295)">Cerebral palsy</text>
   </g>
   <g id="text_18">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="295.578947" y="413.845" transform="rotate(-0 295.578947 413.845)">Test constrained coordination.</text>
   </g>
   <g id="text_19">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="636.252632" y="413.845" transform="rotate(-0 636.252632 413.845)">Pose does not measure muscle activation.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="64.8" y="476.375" transform="rotate(-0 64.8 476.375)">Myopathic</text>
   </g>
   <g id="text_21">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="295.578947" y="476.375" transform="rotate(-0 295.578947 476.375)">Test weak or compensated motion.</text>
   </g>
   <g id="text_22">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="636.252632" y="476.375" transform="rotate(-0 636.252632 476.375)">Do not call every condition central.</text>
   </g>
  </g>
 </g>
