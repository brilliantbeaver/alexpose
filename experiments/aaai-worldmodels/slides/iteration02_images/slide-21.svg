   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="143.350937" transform="rotate(-0 50.4 143.350937)">A post hoc diagnostic reverses persistence to ask whether limited movement explains the association.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #526a79" transform="translate(54 565.559062)">Negated persistence has AUROC 0.806. The excess-error result does not demonstrate superiority to this diagnostic control.</text>
