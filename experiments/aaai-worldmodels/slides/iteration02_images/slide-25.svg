   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="24.48" transform="rotate(-0 50.4 24.48)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #bb6234" x="1101.6" y="24.48" transform="rotate(-0 1101.6 24.48)">PROPOSED / CONDITIONAL</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="50.4" y="94.284844" transform="rotate(-0 50.4 94.284844)">Phase-based masks require reliable cycle support.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="143.350937" transform="rotate(-0 50.4 143.350937)">A short prefix may not contain enough observed gait cycles to estimate phase.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="54" y="565.559062" transform="rotate(-0 54 565.559062)">Coverage is an outcome of the eligibility rule. It must be reported by source and annotation before interpretation.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="619.2" transform="rotate(-0 50.4 619.2)">Source: Plotnik et al. 2007 motivates timing; phase eligibility and mask tests are proposed.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526a79" x="1101.6" y="619.2" transform="rotate(-0 1101.6 619.2)">25 / 36</text>
   </g>
   <g id="text_8">
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #153448" transform="translate(90.036797 279.934687)">Are at least two cycles</text>
    <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #153448" transform="translate(164.368594 309.689062)">reliable?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153448" x="748.8" y="243.11875" transform="rotate(-0 748.8 243.11875)">Yes: add phase-aligned support masks.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #153448" x="748.8" y="422.842813" transform="rotate(-0 748.8 422.842813)">No: keep fixed-time masks and report coverage.</text>
   </g>
