   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="24.48" transform="rotate(-0 50.4 24.48)">GAIT OBSERVATIONS FOR MEDICAL WORLD MODELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #087d78" x="1101.6" y="24.48" transform="rotate(-0 1101.6 24.48)">MEASURED / EXPLORATORY</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="50.4" y="94.284844" transform="rotate(-0 50.4 94.284844)">The model predicts body-relative articulation.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="143.350937" transform="rotate(-0 50.4 143.350937)">A shared pelvis origin and prefix-only torso scale define the coordinate system.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="54" y="565.559062" transform="rotate(-0 54 565.559062)">The diagram is schematic. Projected 2D coordinates are neither physical speed nor measured three-dimensional anatomy.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526a79" x="50.4" y="619.2" transform="rotate(-0 50.4 619.2)">Source: restart-dynamics-v1; exact inputs and hashes are in iteration02_manifest.json.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #526a79" x="1101.6" y="619.2" transform="rotate(-0 1101.6 619.2)">11 / 36</text>
   </g>
   <g id="text_8">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="504" y="223.2" transform="rotate(-0 504 223.2)">The pelvis supplies a shared origin.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="504" y="320.4" transform="rotate(-0 504 320.4)">The observed prefix supplies torso scale.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #153448" x="504" y="417.6" transform="rotate(-0 504 417.6)">Each leg has four distal target joints.</text>
