[project]
name = "med-wm-gait-tutorials"
version = "0.1.0"
description = "Source-grouped skeleton JEPA tutorials for medical world models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alexpose", "torch>=2.6,<3", "numpy>=2,<3", "pandas>=2.3,<3",
  "scikit-learn>=1.8,<2", "joblib>=1.3,<2", "matplotlib>=3.10,<4", "python-dotenv>=1.2,<2",
  "jupyterlab>=4,<5", "ipykernel>=7,<8", "nbformat>=5.10,<6", "nbclient>=0.10,<1",
  "opencv-contrib-python>=4.12,<5", "imageio-ffmpeg>=0.6,<1", "pytest>=9,<10"
]
[tool.uv.sources]
alexpose = {path = "../..", editable = true}
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["worldmodels"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
