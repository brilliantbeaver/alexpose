   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="217.846562" y="21.648" transform="rotate(-0 217.846562 21.648)">Forecasting and anomaly ranking answer different questions.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="217.846562" y="95.694" transform="rotate(-0 217.846562 95.694)">Forecast error measures disagreement with the learned prediction.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="217.846562" y="110.142" transform="rotate(-0 217.846562 110.142)">Persistence error measures movement away from the last observed pose.</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle" x="217.846562" y="124.59" transform="rotate(-0 217.846562 124.59)">Excess error = forecast error minus persistence error. Larger values mean less forecast benefit.</text>
   </g>
