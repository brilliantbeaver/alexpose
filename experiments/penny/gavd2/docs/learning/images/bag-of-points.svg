<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <text x="490" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">Bug 2: a permutation-invariant encoder is a bag of points</text>
  <text x="490" y="57" font-size="13" text-anchor="middle" fill="#475569">With no positional embedding, an ordered walk and a shuffled pile of the same points look identical to the model.</text>

  <!-- ============ TOP-LEFT: ordered clip (blue) ============ -->
  <rect x="24" y="78" width="420" height="164" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="234" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Ordered skeleton clip</text>
  <text x="234" y="122" font-size="11" text-anchor="middle" fill="#475569">frames left to right, each joint on its own side</text>

  <!-- frame 1 -->
  <text x="96" y="147" font-size="10" text-anchor="middle" fill="#1d4ed8">frame 0</text>
  <circle cx="82" cy="170" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="110" cy="170" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="82" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">L knee</text>
  <text x="110" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">R knee</text>
  <!-- frame 2 -->
  <text x="188" y="147" font-size="10" text-anchor="middle" fill="#1d4ed8">frame 1</text>
  <circle cx="174" cy="176" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="202" cy="164" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="174" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">L knee</text>
  <text x="202" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">R knee</text>
  <!-- frame 3 -->
  <text x="280" y="147" font-size="10" text-anchor="middle" fill="#1d4ed8">frame 2</text>
  <circle cx="266" cy="164" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="294" cy="176" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="266" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">L knee</text>
  <text x="294" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">R knee</text>
  <!-- frame 4 -->
  <text x="372" y="147" font-size="10" text-anchor="middle" fill="#1d4ed8">frame 3</text>
  <circle cx="358" cy="170" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <circle cx="386" cy="170" r="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="358" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">L knee</text>
  <text x="386" y="196" font-size="8.5" text-anchor="middle" fill="#1e3a8a">R knee</text>

  <line x1="60" y1="216" x2="408" y2="216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="234" y="234" font-size="10.5" text-anchor="middle" fill="#475569">time, in order</text>

  <!-- ============ TOP-RIGHT: shuffled clip (red) ============ -->
  <rect x="536" y="78" width="420" height="164" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="746" y="103" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Same points, shuffled</text>
  <text x="746" y="122" font-size="11" text-anchor="middle" fill="#7f1d1d">order scrambled, no frame or side kept</text>

  <!-- the SAME 8 points as the ordered clip, scrambled: no labels, no frame or side kept -->
  <circle cx="612" cy="152" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="700" cy="178" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="788" cy="148" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="876" cy="182" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="656" cy="192" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="744" cy="150" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="832" cy="190" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>
  <circle cx="588" cy="184" r="7" fill="#fecaca" stroke="#b91c1c" stroke-width="1.6"/>

  <text x="746" y="222" font-size="10.5" text-anchor="middle" fill="#7f1d1d">same 8 points, but which joint and which frame is unknown</text>

  <!-- arrows from both panels into the shared encoder -->
  <line x1="234" y1="242" x2="380" y2="288" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="746" y1="242" x2="600" y2="288" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ CENTER: shared encoder (grey) ============ -->
  <rect x="320" y="292" width="340" height="66" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="490" y="318" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Transformer with NO positional embedding</text>
  <text x="490" y="340" font-size="11" text-anchor="middle" fill="#475569">treats its 1,056 tokens as an unordered set, then mean-pools</text>

  <!-- two identical output vectors below the encoder -->
  <line x1="420" y1="358" x2="360" y2="392" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="358" x2="620" y2="392" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- left vector -->
  <g>
    <rect x="300" y="396" width="120" height="26" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="308" y="401" width="16" height="16" rx="2" fill="#94a3b8"/>
    <rect x="329" y="401" width="16" height="16" rx="2" fill="#cbd5e1"/>
    <rect x="350" y="401" width="16" height="16" rx="2" fill="#64748b"/>
    <rect x="371" y="401" width="16" height="16" rx="2" fill="#94a3b8"/>
    <rect x="392" y="401" width="16" height="16" rx="2" fill="#cbd5e1"/>
  </g>
  <text x="360" y="438" font-size="10.5" text-anchor="middle" fill="#475569">from the ordered clip</text>

  <!-- equals sign -->
  <text x="490" y="418" font-size="28" font-weight="bold" text-anchor="middle" fill="#b91c1c">=</text>

  <!-- right vector -->
  <g>
    <rect x="560" y="396" width="120" height="26" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="568" y="401" width="16" height="16" rx="2" fill="#94a3b8"/>
    <rect x="589" y="401" width="16" height="16" rx="2" fill="#cbd5e1"/>
    <rect x="610" y="401" width="16" height="16" rx="2" fill="#64748b"/>
    <rect x="631" y="401" width="16" height="16" rx="2" fill="#94a3b8"/>
    <rect x="652" y="401" width="16" height="16" rx="2" fill="#cbd5e1"/>
  </g>
  <text x="620" y="438" font-size="10.5" text-anchor="middle" fill="#475569">from the shuffled clip</text>

  <!-- red WRONG banner -->
  <rect x="704" y="392" width="252" height="34" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="830" y="414" font-size="13" font-weight="bold" text-anchor="middle" fill="#b91c1c">WRONG: order erased</text>
  <text x="490" y="462" font-size="11.5" text-anchor="middle" fill="#7f1d1d">But which joint moves when IS the gait class, so the model cannot tell the conditions apart.</text>

  <!-- ============ BOTTOM: green fix strip ============ -->
  <rect x="24" y="484" width="932" height="86" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="46" y="510" font-size="14" font-weight="bold" text-anchor="start" fill="#14532d">The fix: tag every token with its place</text>
  <text x="46" y="532" font-size="11.5" text-anchor="start" fill="#14532d">Add a learned time_embed (per frame) and joint_embed (per joint):</text>
  <text x="46" y="552" font-size="11.5" text-anchor="start" fill="#15803d">pos[t, j] = time_embed[t] + joint_embed[j]</text>

  <rect x="616" y="500" width="320" height="52" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="776" y="522" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">Now shuffling changes the embedding.</text>
  <text x="776" y="540" font-size="10.5" text-anchor="middle" fill="#14532d">frame 0 differs from frame 31, left knee from right knee</text>

  <text x="490" y="590" font-size="11.5" text-anchor="middle" fill="#64748b">This is the standard I-JEPA / V-JEPA fix. Verified that permutation-invariance is now broken.</text>
</svg>
