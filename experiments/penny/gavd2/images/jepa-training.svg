<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="470" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">One Skeleton-JEPA training step</text>
  <text x="470" y="54" font-size="12.5" text-anchor="middle" fill="#475569">Predict the hidden joints in latent space; VICReg keeps the embeddings from collapsing.</text>

  <!-- Input clip -->
  <rect x="40" y="150" width="130" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="105" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">masked clip</text>
  <text x="105" y="200" font-size="10.5" text-anchor="middle" fill="#475569">visible joints</text>
  <text x="105" y="216" font-size="10.5" text-anchor="middle" fill="#475569">+ hidden block</text>

  <!-- Context encoder -->
  <rect x="230" y="90" width="150" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="305" y="118" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">context encoder</text>
  <text x="305" y="138" font-size="10.5" text-anchor="middle" fill="#475569">reads visible tokens</text>

  <!-- Target encoder -->
  <rect x="230" y="230" width="150" height="70" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="305" y="255" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#3730a3">EMA target encoder</text>
  <text x="305" y="274" font-size="10.5" text-anchor="middle" fill="#475569">reads full sequence,</text>
  <text x="305" y="289" font-size="10.5" text-anchor="middle" fill="#475569">stop-gradient</text>

  <!-- Predictor -->
  <rect x="440" y="90" width="140" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="510" y="118" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">predictor</text>
  <text x="510" y="138" font-size="10.5" text-anchor="middle" fill="#475569">guesses targets</text>

  <!-- Loss -->
  <rect x="650" y="150" width="150" height="100" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="725" y="178" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">loss (latent)</text>
  <text x="725" y="200" font-size="10.5" text-anchor="middle" fill="#475569">MSE +</text>
  <text x="725" y="216" font-size="10.5" text-anchor="middle" fill="#475569">VICReg variance</text>
  <text x="725" y="232" font-size="10.5" text-anchor="middle" fill="#475569">+ covariance</text>

  <!-- arrows -->
  <line x1="170" y1="180" x2="230" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="210" x2="230" y2="265" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="125" x2="440" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="130" x2="650" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="265" x2="650" y2="220" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="258" font-size="10.5" text-anchor="middle" fill="#6366f1">answer key</text>

  <!-- EMA update arrow (context -> target) -->
  <path d="M 250 160 C 210 195, 210 195, 250 230" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="196" y="199" font-size="10" text-anchor="middle" fill="#64748b">slow EMA</text>

  <text x="470" y="344" font-size="12" text-anchor="middle" fill="#334155">Gradients train the context encoder and predictor; the target only moves by the slow EMA update.</text>
  <text x="470" y="366" font-size="11.5" text-anchor="middle" fill="#94a3b8">No negative pairs and no pixel decoder: collapse is blocked by the EMA target plus VICReg.</text>
</svg>
