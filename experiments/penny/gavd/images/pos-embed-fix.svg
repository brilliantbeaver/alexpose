<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" fill="#ffffff"/>
  <text x="490" y="32" font-size="20" font-weight="bold" text-anchor="middle" fill="#0f172a">The positional-embedding fix</text>
  <text x="490" y="54" font-size="13" text-anchor="middle" fill="#475569">Give every pose token a learned time and joint tag, so the pooled clip embedding stops being an orderless bag of coordinates.</text>

  <!-- ============ BEFORE panel (red) ============ -->
  <rect x="24" y="80" width="440" height="300" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="244" y="108" font-size="15" font-weight="bold" text-anchor="middle" fill="#7f1d1d">No positional embedding</text>
  <text x="244" y="128" font-size="11" text-anchor="middle" fill="#7f1d1d">(x, y, z) coordinates, order and side lost</text>

  <!-- unordered bag of dots -->
  <ellipse cx="244" cy="212" rx="150" ry="62" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="150" cy="190" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="205" cy="168" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="278" cy="176" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="330" cy="198" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="172" cy="234" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="238" cy="222" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="302" cy="240" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="200" cy="258" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="272" cy="258" r="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>

  <text x="244" y="304" font-size="11" text-anchor="middle" fill="#7f1d1d">Transformer is permutation-invariant, so a mean-pooled</text>
  <text x="244" y="320" font-size="11" text-anchor="middle" fill="#7f1d1d">clip embedding is just a bag of coordinates.</text>
  <text x="244" y="342" font-size="11" text-anchor="middle" fill="#7f1d1d">Permuting the 1056 tokens changes it by only ~2e-7,</text>
  <text x="244" y="358" font-size="11" text-anchor="middle" fill="#7f1d1d">so it cannot represent gait.</text>

  <!-- ============ arrow between panels ============ -->
  <line x1="474" y1="230" x2="516" y2="230" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="495" y="218" font-size="10.5" text-anchor="middle" fill="#334155">fix</text>

  <!-- ============ AFTER panel (green) ============ -->
  <rect x="516" y="80" width="440" height="300" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="736" y="108" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">With learned time + joint embedding</text>
  <text x="736" y="128" font-size="11" text-anchor="middle" fill="#14532d">each token tagged with its (t, j) position</text>

  <!-- grid: columns = time t, rows = joint j -->
  <!-- column headers -->
  <text x="640" y="156" font-size="10.5" text-anchor="middle" fill="#14532d">t0</text>
  <text x="700" y="156" font-size="10.5" text-anchor="middle" fill="#14532d">t1</text>
  <text x="760" y="156" font-size="10.5" text-anchor="middle" fill="#14532d">t2</text>
  <text x="820" y="156" font-size="10.5" text-anchor="middle" fill="#14532d">t3</text>
  <text x="586" y="156" font-size="10.5" text-anchor="end" fill="#14532d">time</text>

  <!-- row 0: joint j0 -->
  <text x="586" y="184" font-size="10.5" text-anchor="end" fill="#14532d">j0</text>
  <rect x="614" y="168" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="640" y="185" font-size="10.5" text-anchor="middle" fill="#14532d">0,0</text>
  <rect x="674" y="168" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="700" y="185" font-size="10.5" text-anchor="middle" fill="#14532d">1,0</text>
  <rect x="734" y="168" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="760" y="185" font-size="10.5" text-anchor="middle" fill="#14532d">2,0</text>
  <rect x="794" y="168" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="820" y="185" font-size="10.5" text-anchor="middle" fill="#14532d">3,0</text>

  <!-- row 1: joint j1 -->
  <text x="586" y="216" font-size="10.5" text-anchor="end" fill="#14532d">j1</text>
  <rect x="614" y="200" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="640" y="217" font-size="10.5" text-anchor="middle" fill="#14532d">0,1</text>
  <rect x="674" y="200" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="700" y="217" font-size="10.5" text-anchor="middle" fill="#14532d">1,1</text>
  <rect x="734" y="200" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="760" y="217" font-size="10.5" text-anchor="middle" fill="#14532d">2,1</text>
  <rect x="794" y="200" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="820" y="217" font-size="10.5" text-anchor="middle" fill="#14532d">3,1</text>

  <!-- row 2: joint j2 -->
  <text x="586" y="248" font-size="10.5" text-anchor="end" fill="#14532d">j2</text>
  <rect x="614" y="232" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="640" y="249" font-size="10.5" text-anchor="middle" fill="#14532d">0,2</text>
  <rect x="674" y="232" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="700" y="249" font-size="10.5" text-anchor="middle" fill="#14532d">1,2</text>
  <rect x="734" y="232" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="760" y="249" font-size="10.5" text-anchor="middle" fill="#14532d">2,2</text>
  <rect x="794" y="232" width="52" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="820" y="249" font-size="10.5" text-anchor="middle" fill="#14532d">3,2</text>

  <!-- joint axis label -->
  <text x="736" y="284" font-size="10.5" text-anchor="middle" fill="#14532d">joint (rows), columns are frames</text>

  <text x="736" y="308" font-size="11" text-anchor="middle" fill="#14532d">pos[t, j] = time_embed[t] + joint_embed[j], init std 0.1</text>
  <text x="736" y="330" font-size="11" text-anchor="middle" fill="#14532d">The pooled embedding now carries frame order and</text>
  <text x="736" y="346" font-size="11" text-anchor="middle" fill="#14532d">left/right identity. This is the standard I-JEPA / V-JEPA fix.</text>

  <text x="490" y="404" font-size="11.5" text-anchor="middle" fill="#64748b">nb04 saves T and N_JOINTS in the checkpoint so nb05 rebuilds the same encoder and can decode time and side.</text>
</svg>
