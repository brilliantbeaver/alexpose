<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="340" fill="#ffffff"/>
  <text x="460" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#0f172a">From a video frame to 33 tracked joints</text>
  <text x="460" y="54" font-size="12.5" text-anchor="middle" fill="#475569">Repeat over a sequence's frames to get one skeleton array of shape (T, 33, 3).</text>

  <!-- Stage 1: frame with bbox -->
  <rect x="40" y="100" width="160" height="150" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="120" y="90" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">video frame</text>
  <!-- simple person silhouette -->
  <circle cx="120" cy="140" r="12" fill="#cbd5e1"/>
  <rect x="112" y="152" width="16" height="44" rx="6" fill="#cbd5e1"/>
  <rect x="108" y="196" width="7" height="34" rx="3" fill="#cbd5e1"/>
  <rect x="125" y="196" width="7" height="34" rx="3" fill="#cbd5e1"/>
  <!-- bbox -->
  <rect x="100" y="122" width="42" height="116" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="120" y="252" font-size="10" text-anchor="middle" fill="#ef4444">bbox from CSV</text>

  <!-- Stage 2: MediaPipe -->
  <rect x="320" y="140" width="150" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="395" y="170" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">MediaPipe</text>
  <text x="395" y="190" font-size="11" text-anchor="middle" fill="#475569">BLAZEPOSE_33</text>

  <!-- Stage 3: skeleton -->
  <rect x="590" y="100" width="160" height="150" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="670" y="90" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">33 joints</text>
  <!-- little skeleton -->
  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <line x1="670" y1="128" x2="670" y2="150"/>
    <line x1="648" y1="140" x2="692" y2="140"/>
    <line x1="648" y1="140" x2="640" y2="172"/>
    <line x1="692" y1="140" x2="700" y2="172"/>
    <line x1="670" y1="150" x2="670" y2="182"/>
    <line x1="670" y1="182" x2="654" y2="222"/>
    <line x1="670" y1="182" x2="686" y2="222"/>
  </g>
  <g fill="#ef4444">
    <circle cx="670" cy="124" r="4"/>
    <circle cx="648" cy="140" r="3.5"/><circle cx="692" cy="140" r="3.5"/>
    <circle cx="640" cy="172" r="3.5"/><circle cx="700" cy="172" r="3.5"/>
    <circle cx="670" cy="182" r="3.5"/>
    <circle cx="654" cy="222" r="3.5"/><circle cx="686" cy="222" r="3.5"/>
  </g>

  <!-- arrows -->
  <line x1="200" y1="175" x2="320" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="175" x2="590" y2="175" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="460" y="292" font-size="12" text-anchor="middle" fill="#334155">Keep frames with at least 25 of 33 joints; stack the good frames into one sequence.</text>
  <text x="460" y="314" font-size="11.5" text-anchor="middle" fill="#94a3b8">This mirrors the alexpose exp5 batch extraction, one file cached per condition.</text>
</svg>
