<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How softmax temperature changes a distribution</title>
  <desc id="desc">The same five example feature scores become progressively sharper as temperature decreases. The teacher temperature 0.06 is sharper than the predictor temperature 0.10.</desc>
  <style>.t{font:700 27px Arial;fill:#10233f}.h{font:700 19px Arial;fill:#10233f}.b{font:15px Arial;fill:#263746}.s{font:13px Arial;fill:#526575}.axis{stroke:#506273;stroke-width:1.7}.grid{stroke:#dce4eb;stroke-width:1}.bar1{fill:#a9bdd0}.bar2{fill:#8e74b5}.bar3{fill:#5b8f55}</style>
  <rect width="1200" height="560" fill="#fbfcfe"/>
  <text x="600" y="43" text-anchor="middle" class="t">Temperature changes confidence, not the winning dimension</text>
  <text x="600" y="75" text-anchor="middle" class="b">Illustrative softmax outputs from the same five feature scores</text>

  <g transform="translate(45 105)">
    <text x="160" y="20" text-anchor="middle" class="h">Higher temperature: flatter</text>
    <line x1="35" y1="300" x2="310" y2="300" class="axis"/><line x1="35" y1="50" x2="35" y2="300" class="axis"/>
    <rect x="55" y="260" width="34" height="40" class="bar1"/><rect x="105" y="245" width="34" height="55" class="bar1"/><rect x="155" y="220" width="34" height="80" class="bar1"/><rect x="205" y="190" width="34" height="110" class="bar1"/><rect x="255" y="145" width="34" height="155" class="bar1"/>
    <text x="172" y="332" text-anchor="middle" class="s">feature dimension →</text><text x="15" y="180" transform="rotate(-90 15 180)" text-anchor="middle" class="s">probability</text>
    <text x="172" y="370" text-anchor="middle" class="b">Differences are muted.</text>
  </g>
  <g transform="translate(430 105)">
    <text x="160" y="20" text-anchor="middle" class="h">Predictor: T = 0.10</text>
    <line x1="35" y1="300" x2="310" y2="300" class="axis"/><line x1="35" y1="50" x2="35" y2="300" class="axis"/>
    <rect x="55" y="291" width="34" height="9" class="bar2"/><rect x="105" y="286" width="34" height="14" class="bar2"/><rect x="155" y="270" width="34" height="30" class="bar2"/><rect x="205" y="235" width="34" height="65" class="bar2"/><rect x="255" y="82" width="34" height="218" class="bar2"/>
    <text x="172" y="332" text-anchor="middle" class="s">feature dimension →</text>
    <text x="172" y="370" text-anchor="middle" class="b">A confident prediction.</text>
  </g>
  <g transform="translate(815 105)">
    <text x="160" y="20" text-anchor="middle" class="h">Teacher: T = 0.06</text>
    <line x1="35" y1="300" x2="310" y2="300" class="axis"/><line x1="35" y1="50" x2="35" y2="300" class="axis"/>
    <rect x="55" y="298" width="34" height="2" class="bar3"/><rect x="105" y="297" width="34" height="3" class="bar3"/><rect x="155" y="294" width="34" height="6" class="bar3"/><rect x="205" y="282" width="34" height="18" class="bar3"/><rect x="255" y="58" width="34" height="242" class="bar3"/>
    <text x="172" y="332" text-anchor="middle" class="s">feature dimension →</text>
    <text x="172" y="370" text-anchor="middle" class="b">A sharper teaching signal.</text>
  </g>
  <rect x="95" y="495" width="1010" height="42" rx="10" fill="#eef3f8" stroke="#b7c5d3"/>
  <text x="600" y="522" text-anchor="middle" class="b">Smaller T magnifies score differences before softmax. Values shown are conceptual, not recorded model outputs.</text>
</svg>
