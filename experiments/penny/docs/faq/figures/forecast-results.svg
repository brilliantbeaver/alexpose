<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">The forecasting experiments contain a useful failure</title><desc id="desc">The model&#x27;s predicted future phase has mean angular error 1.531 radians versus 1.372 for persisting context, where lower is better. A latent cross-entropy comparison uses model training sequences but a leave-one-out reference, so its numerical difference cannot establish held-out forecast superiority.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="500" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">The forecasting experiments contain a useful failure</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="103" width="500" height="277" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="103" width="7" height="277" rx="3" fill="#9C681C" stroke="#9C681C" stroke-width="2"/>
<text x="52" y="136" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Phase prediction: lower is better</text>
<text x="52" y="168" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Predicted-model error: 1.531 radians</text>
<text x="52" y="197" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Persist-context error: 1.372 radians</text>
<text x="52" y="226" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The model does not beat persistence</text>
<text x="52" y="255" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">on this retained phase comparison</text>
<rect x="568" y="103" width="500" height="277" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="568" y="103" width="7" height="277" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="588" y="136" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Latent-loss comparison: audit first</text>
<text x="588" y="168" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Model loss uses its training sequences</text>
<text x="588" y="197" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Reference uses leave-one-out matching</text>
<text x="588" y="226" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">These evaluation conditions differ</text>
<text x="588" y="255" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">A held-out forecast test is still needed</text>
<text x="32" y="480" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Future latent similarity and accurate physical gait prediction require separate validation.</text>
</svg>