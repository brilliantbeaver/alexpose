<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc">
<title id="title">Measurement quality enters before the encoder</title><desc id="desc">Annotated walker frame spans and bounding boxes define a cropped source video. A pose detector estimates 33 landmarks with visibility. Validity and missing frames are preserved; valid poses are normalized, resized, patched and fed to the encoder.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="455" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">Measurement quality enters before the encoder</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="98" width="324" height="122" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="98" width="7" height="122" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="131" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Find the walker</text>
<text x="52" y="163" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Annotated frames</text>
<text x="52" y="192" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and bounding box</text>
<line x1="361" y1="158" x2="381" y2="158" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="386" y="98" width="324" height="122" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="386" y="98" width="7" height="122" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="406" y="131" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Extract pose</text>
<text x="406" y="163" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">33 estimated landmarks</text>
<text x="406" y="192" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and visibility</text>
<line x1="715" y1="158" x2="735" y2="158" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="740" y="98" width="324" height="122" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="740" y="98" width="7" height="122" rx="3" fill="#9C681C" stroke="#9C681C" stroke-width="2"/>
<text x="760" y="131" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Retain validity</text>
<text x="760" y="163" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Keep missing frames</text>
<text x="760" y="192" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and detector coverage</text>
<rect x="32" y="255" width="324" height="122" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="255" width="7" height="122" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="52" y="288" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Normalize</text>
<text x="52" y="320" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Center and scale</text>
<text x="52" y="349" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Resize the sequence</text>
<line x1="361" y1="315" x2="381" y2="315" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="386" y="255" width="324" height="122" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="386" y="255" width="7" height="122" rx="3" fill="#78558F" stroke="#78558F" stroke-width="2"/>
<text x="406" y="288" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Patch tokens</text>
<text x="406" y="320" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">One landmark</text>
<text x="406" y="349" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">over four frames</text>
<line x1="715" y1="315" x2="735" y2="315" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="740" y="255" width="324" height="122" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="740" y="255" width="7" height="122" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="760" y="288" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Encode</text>
<text x="760" y="320" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Learned token features</text>
<text x="760" y="349" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">then pooled summaries</text>
<line x1="1068" y1="221" x2="1068" y2="242" stroke="#526579" stroke-width="2"/>
<line x1="1068" y1="242" x2="46" y2="242" stroke="#526579" stroke-width="2"/>
<line x1="46" y1="242" x2="46" y2="251" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="435" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Coordinates and monocular depth are estimates; coverage and recording effects can persist.</text>
</svg>