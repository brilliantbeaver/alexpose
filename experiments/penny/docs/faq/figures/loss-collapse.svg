<title id="title">Prediction loss needs a second check: feature diversity</title><desc id="desc">Schematic feature points show how nearly constant embeddings can match without preserving useful variation. Centering, teacher and predictor temperatures, and collapse diagnostics accompany the loss. The dots are illustrative, not experiment results.</desc>
