<text x="308" y="364" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">The entire suffix is hidden; no later context is visible.</text>
<text x="32" y="435" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">These timelines explain tasks; forecasting needs an unseen sequence and unseen-source test.</text>
