<text x="526" y="154" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">?</text>
<rect x="581" y="118" width="73" height="54" rx="7" fill="#E2F1EF" stroke="#157B78" stroke-width="2"/>
<text x="617" y="154" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">4</text>
<rect x="672" y="118" width="73" height="54" rx="7" fill="#F0EAF5" stroke="#78558F" stroke-width="2"/>
<text x="708" y="154" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">?</text>
