<text x="981" y="154" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">?</text>
<text x="308" y="208" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Context may occur before and after a target.</text>
