<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="455" viewBox="0 0 1100 455" role="img" aria-labelledby="title desc">
<title id="title">Hidden-position prediction and future prediction ask different questions</title><desc id="desc">Infill predicts masked representations using available surrounding time patches. Future prediction supplies only earlier patches and hides the entire suffix. Showing future context would invalidate a forecasting claim.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
