<title id="title">Anatomy motivates targets; every link remains a hypothesis</title><desc id="desc">Ten bilateral landmarks at the shoulders, hips, knees, ankles and foot indices are eligible mask targets. Their motivation includes proximal motion, symmetry, joint excursion and gait timing. These targets do not define condition-specific biomarkers.</desc>
