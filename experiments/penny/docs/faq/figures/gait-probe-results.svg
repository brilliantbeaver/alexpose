<text x="47" y="288" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Pelvis sway proxy</text>
<text x="586" y="288" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="end">0.037</text>
<text x="797" y="288" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="end">-0.029</text>
