<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565" role="img" aria-labelledby="title desc">
<title id="title">Scalar gait probes recover only modest signal</title><desc id="desc">Out-of-fold R-squared for frozen S-JEPA latents ranges from 0.020 to 0.086 across six pose-derived targets. Missingness features exceed the latent scores for cadence and knee excursion. A separate phase vector probe has mean R-squared negative 0.127. All these are pose-based proxy targets.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="565" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">Scalar gait probes recover only modest signal</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<text x="32" y="105" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Pose-derived target</text>
<text x="586" y="105" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="end">S-JEPA R²</text>
<text x="797" y="105" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="end">Raw pose R²</text>
<text x="1034" y="105" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="end">Missingness R²</text>
