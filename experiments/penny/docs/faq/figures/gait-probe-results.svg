<text x="47" y="144" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Ankle cycle rate</text>
<text x="586" y="144" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="end">0.020</text>
<text x="797" y="144" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="end">-0.051</text>
<text x="1034" y="144" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="end">0.118</text>
<rect x="32" y="162" width="1036" height="42" rx="4" fill="white" stroke="none" stroke-width="2"/>
<text x="47" y="192" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Ankle excursion asymmetry</text>
<text x="586" y="192" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="end">0.024</text>
<text x="797" y="192" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="end">0.057</text>
<text x="1034" y="192" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="end">-0.128</text>
<rect x="32" y="210" width="1036" height="42" rx="4" fill="#F4F7FA" stroke="none" stroke-width="2"/>
<text x="47" y="240" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Knee excursion</text>
