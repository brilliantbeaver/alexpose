<text x="47" y="384" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Stance/swing proxy</text>
<text x="586" y="384" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="end">0.022</text>
<text x="797" y="384" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="end">-0.022</text>
<text x="1034" y="384" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="end">-0.026</text>
<text x="32" y="463" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">R² = 1 is perfect; 0 is the pooled mean-predictor reference; negative is worse.</text>
<text x="32" y="494" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Separate phase-vector probe: mean R² = −0.127.</text>
<text x="32" y="545" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Targets are extracted-pose proxies; pooled scores use 96 sequences, or 95 for stance/swing.</text>
