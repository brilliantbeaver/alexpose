<title id="title">Mask geometry: the observed difference is one test clip</title><desc id="desc">With one retained seed 42 run per mask strategy, neurologic-10 and motion-aware-10 each classify 12 of 21 test clips correctly, while random-10 and full-body-33 classify 13 of 21. This small sequence-split experiment does not establish a ranking of mask strategies.</desc>
