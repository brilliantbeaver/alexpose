<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Probe the representation against measurable movement</title><desc id="desc">A frozen representation is tested for information related to motion descriptors such as cadence, asymmetry and joint excursion. The descriptors come from extracted pose and are proxy measurements. Compare probes with raw-coordinate and missingness baselines.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="460" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">Probe the representation against measurable movement</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="118" width="285" height="156" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="118" width="7" height="156" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="151" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Frozen representation</text>
<text x="52" y="183" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">A fixed 384-value vector</text>
<text x="52" y="212" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">No encoder retraining</text>
<rect x="374" y="118" width="246" height="156" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="374" y="118" width="7" height="156" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="394" y="151" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Simple probe</text>
<text x="394" y="183" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Fit a small mapping</text>
<text x="394" y="212" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">on training examples</text>
<rect x="678" y="100" width="390" height="222" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="678" y="100" width="7" height="222" rx="3" fill="#78558F" stroke="#78558F" stroke-width="2"/>
<text x="698" y="133" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Pose-derived targets</text>
<text x="698" y="165" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Cadence: step rhythm</text>
<text x="698" y="194" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Asymmetry: left/right difference</text>
<text x="698" y="223" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Excursion: joint movement range</text>
<text x="698" y="252" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Sway: side-to-side movement</text>
<line x1="323" y1="196" x2="364" y2="196" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="626" y1="196" x2="668" y2="196" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="366" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start">Compare with raw-coordinate and missingness baselines on held-out sources.</text>
<text x="32" y="440" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Pose-derived targets are measurement proxies, not validated clinical motion-capture labels.</text>
</svg>