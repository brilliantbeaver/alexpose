<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Changing the split exposes a generalization gap</title><desc id="desc">Notebook 07&#x27;s 70/30 sequence-split classifier accuracy was 62.1 percent on 29 clips versus a training-majority control of 48.3 percent. Six video-grouped folds across 96 clips averaged 24.0 percent accuracy with a 16.5 percentage point sample standard deviation, below the mean training-majority control of 49.0 percent. One test fold includes the normal pretraining source.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="460" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">Changing the split exposes a generalization gap</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="103" width="488" height="249" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="103" width="7" height="249" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="136" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Sequence split: Notebook 07</text>
<text x="52" y="168" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">18/29 correct = 62.1% accuracy</text>
<text x="52" y="197" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Training-majority control = 48.3%</text>
<text x="52" y="226" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Source videos occur in train and test</text>
<text x="52" y="255" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">70/30 partition of all 96 sequences</text>
<rect x="555" y="103" width="513" height="249" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="555" y="103" width="7" height="249" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="575" y="136" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Video-grouped classifier folds</text>
<text x="575" y="168" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Mean accuracy = 24.0%</text>
<text x="575" y="197" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Training-majority control = 49.0%</text>
<text x="575" y="226" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Sample standard deviation = 16.5 points</text>
<text x="575" y="255" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Six folds × 16 held-out clips</text>
<text x="32" y="440" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">One grouped test fold includes the pretraining source; encoder training is still transductive.</text>
</svg>