<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="485" viewBox="0 0 1100 485" role="img" aria-labelledby="title desc">
<title id="title">Source video is predictable from several feature families</title><desc id="desc">Video-identity probe mean accuracy is 49.4 percent for S-JEPA, 51.7 percent for the untrained encoder, 46.0 percent for raw pose pooling, and 42.5 percent for missingness. A uniform guess among 18 videos would be 5.6 percent; this is not an empirical majority baseline.</desc>
