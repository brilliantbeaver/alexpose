<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">A condition label can travel through several pathways</title><desc id="desc">Health labels may be associated with real movement differences and with recording or extraction differences. Both can enter pose features and classifier outputs. A label prediction alone cannot distinguish these explanations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="460" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">A condition label can travel through several pathways</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="187" width="241" height="108" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="187" width="7" height="108" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="220" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Condition label</text>
<text x="52" y="252" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Dataset annotation</text>
<rect x="328" y="104" width="394" height="107" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="328" y="104" width="7" height="107" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="348" y="137" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Movement pathway</text>
<text x="348" y="169" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Timing, asymmetry, joint motion</text>
<rect x="328" y="287" width="394" height="107" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="328" y="287" width="7" height="107" rx="3" fill="#9C681C" stroke="#9C681C" stroke-width="2"/>
<text x="348" y="320" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Recording / extraction pathway</text>
<text x="348" y="352" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Camera, source, missing landmarks</text>
<rect x="795" y="184" width="273" height="119" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="795" y="184" width="7" height="119" rx="3" fill="#78558F" stroke="#78558F" stroke-width="2"/>
<text x="815" y="217" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Model features</text>
<text x="815" y="249" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Either pathway may</text>
<text x="815" y="278" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">support label prediction</text>
<line x1="280" y1="231" x2="318" y2="157" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="280" y1="254" x2="318" y2="338" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="729" y1="157" x2="785" y2="228" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="729" y1="338" x2="785" y2="261" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="440" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">Arrows show possible associations in the dataset, not established causal effects.</text>
</svg>