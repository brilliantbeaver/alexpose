<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">A token joins one landmark across four frames</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="102" width="365" height="123" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="102" width="7" height="123" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="135" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Patch the pose sequence</text>
<text x="52" y="167" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">64 frames ÷ 4 = 16 time patches</text>
<text x="52" y="196" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">16 × 33 landmarks = 528 tokens</text>
