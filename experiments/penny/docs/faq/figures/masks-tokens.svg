<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="485" viewBox="0 0 1100 485" role="img" aria-labelledby="title desc">
<title id="title">A token joins one landmark across four frames</title><desc id="desc">A 64-frame sequence produces 16 times 33 or 528 tokens. Masking samples approximately 60 percent of valid eligible tokens from ten of the 33 landmarks; other valid tokens stay visible. The grid is illustrative, not an actual sampled mask.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
