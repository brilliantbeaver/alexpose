<title id="title">Saved classifier results on the same 21 test sequences</title><desc id="desc">On the exact retained split, S-JEPA classified 13 of 21 clips correctly, the saved legacy 82-feature reference 16 of 21, the majority control 7 of 21, and missingness control 7 of 21. All 21 test sequences come from sources present in training. This is a within-corpus comparison.</desc>
