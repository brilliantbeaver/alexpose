<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">A sequence split can reuse the same source video</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="100" width="487" height="324" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
