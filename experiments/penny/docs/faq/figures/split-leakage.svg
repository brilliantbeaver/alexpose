<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">A sequence split can reuse the same source video</title><desc id="desc">A sequence split places clips from a single source video in both train and test. A source-disjoint split keeps each source in one partition. Pretraining on test-source normal clips is transductive exposure even without labels.</desc>
