<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">Each experiment should answer one narrower question</title><desc id="desc">A hypothesis-testing loop starts with a null hypothesis, defines a controlled comparison, evaluates held-out evidence with uncertainty, audits competing explanations and revises the next question.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="460" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">Each experiment should answer one narrower question</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="101" width="319" height="126" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="101" width="7" height="126" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="134" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">State a null hypothesis</text>
<text x="52" y="166" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">No added condition information</text>
<text x="52" y="195" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">beyond the chosen baseline</text>
<rect x="396" y="101" width="318" height="126" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="396" y="101" width="7" height="126" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="416" y="134" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Make a controlled test</text>
<text x="416" y="166" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Hold data and compute fixed</text>
<text x="416" y="195" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Change one relevant factor</text>
<rect x="759" y="101" width="309" height="126" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="759" y="101" width="7" height="126" rx="3" fill="#78558F" stroke="#78558F" stroke-width="2"/>
<text x="779" y="134" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Evaluate evidence</text>
<text x="779" y="166" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Held-out scores</text>
<text x="779" y="195" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Uncertainty and errors</text>
<line x1="357" y1="165" x2="385" y2="165" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="165" x2="748" y2="165" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="396" y="284" width="672" height="107" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="396" y="284" width="7" height="107" rx="3" fill="#9C681C" stroke="#9C681C" stroke-width="2"/>
<text x="416" y="317" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Audit competing explanations</text>
<text x="416" y="349" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Source identity • missing poses • view angle • label imbalance</text>
<rect x="32" y="284" width="319" height="107" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="284" width="7" height="107" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="317" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Refine the next question</text>
<text x="52" y="349" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Return to a testable claim</text>
<line x1="913" y1="233" x2="913" y2="274" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="387" y1="337" x2="360" y2="337" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="188" y1="277" x2="188" y2="237" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<text x="32" y="440" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start">A null hypothesis is a testable starting claim, not a conclusion selected after seeing the score.</text>
</svg>