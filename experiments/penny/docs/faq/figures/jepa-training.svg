<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Two encoders, one prediction task</title><desc id="desc">Visible skeleton tokens pass through the view encoder and predictor. Full tokens pass through a target encoder. The prediction is compared to the target at masked positions. Gradients update the view encoder and predictor; the target weights are updated through an exponential moving average.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<rect width="1100" height="520" fill="white"/>
<text x="32" y="47" fill="#183247" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start">Two encoders, one prediction task</text>
<line x1="32" y1="68" x2="1068" y2="68" stroke="#CCD6DE" stroke-width="1"/>
<rect x="32" y="112" width="226" height="118" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="112" width="7" height="118" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="52" y="145" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Visible tokens</text>
<text x="52" y="177" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Selected tokens</text>
<text x="52" y="206" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">are hidden</text>
<rect x="319" y="112" width="235" height="118" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="319" y="112" width="7" height="118" rx="3" fill="#285A91" stroke="#285A91" stroke-width="2"/>
<text x="339" y="145" fill="#285A91" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">View encoder</text>
<text x="339" y="177" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Trainable features</text>
<rect x="614" y="112" width="222" height="118" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="614" y="112" width="7" height="118" rx="3" fill="#78558F" stroke="#78558F" stroke-width="2"/>
<text x="634" y="145" fill="#78558F" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Predictor</text>
<text x="634" y="177" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Fill hidden</text>
<text x="634" y="206" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">latent positions</text>
<rect x="32" y="302" width="226" height="110" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="32" y="302" width="7" height="110" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="52" y="335" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Full tokens</text>
<text x="52" y="367" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Complete sequence</text>
<rect x="319" y="302" width="235" height="110" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="319" y="302" width="7" height="110" rx="3" fill="#157B78" stroke="#157B78" stroke-width="2"/>
<text x="339" y="335" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Target encoder</text>
<text x="339" y="367" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">No loss gradients</text>
<line x1="262" y1="167" x2="310" y2="167" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="558" y1="167" x2="605" y2="167" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="262" y1="357" x2="310" y2="357" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="862" y="236" width="206" height="123" rx="12" fill="#F4F7FA" stroke="#CCD6DE" stroke-width="2"/>
<rect x="862" y="236" width="7" height="123" rx="3" fill="#9C681C" stroke="#9C681C" stroke-width="2"/>
<text x="882" y="269" fill="#9C681C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Compare</text>
<text x="882" y="301" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">At masked</text>
<text x="882" y="330" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">positions only</text>
<line x1="840" y1="167" x2="964" y2="167" stroke="#526579" stroke-width="3"/>
<line x1="964" y1="167" x2="964" y2="227" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="558" y1="357" x2="851" y2="357" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="435" y1="236" x2="435" y2="292" stroke="#157B78" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="459" y="270" fill="#157B78" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">EMA weights</text>
<text x="32" y="458" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">EMA = exponential moving average: a slow blend of earlier and current encoder weights.</text>
</svg>