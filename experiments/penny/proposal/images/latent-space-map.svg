<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">Predicting meaning, not pixels</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">What "latent space" means: a short summary of a clip, not its raw pixels</text>

  <!-- LEFT: raw walking clip -->
  <rect x="30" y="100" width="220" height="200" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="140" y="126" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">a walking clip</text>

  <!-- stick figure -->
  <g stroke="#1e3a8a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="140" cy="158" r="11" fill="#eff6ff"/>
    <line x1="140" y1="169" x2="140" y2="210"/>
    <line x1="140" y1="180" x2="118" y2="198"/>
    <line x1="140" y1="180" x2="164" y2="196"/>
    <line x1="140" y1="210" x2="122" y2="238"/>
    <line x1="140" y1="210" x2="160" y2="240"/>
  </g>

  <text x="140" y="264" font-size="10" text-anchor="middle" fill="#334155">raw coordinates:</text>
  <text x="140" y="278" font-size="10" text-anchor="middle" fill="#334155">noisy, camera shake,</text>
  <text x="140" y="292" font-size="10" text-anchor="middle" fill="#334155">fingertip wobble</text>

  <!-- encoder arrow -->
  <line x1="256" y1="200" x2="336" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="192" font-size="11" text-anchor="middle" fill="#475569">encoder</text>

  <!-- MIDDLE: embedding box -->
  <rect x="342" y="118" width="270" height="164" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="477" y="142" font-size="13" font-weight="bold" text-anchor="middle" fill="#4c1d95">embedding</text>
  <text x="477" y="162" font-size="10" text-anchor="middle" fill="#334155">a short list of numbers that</text>
  <text x="477" y="176" font-size="10" text-anchor="middle" fill="#334155">summarizes the clip, e.g.</text>

  <rect x="360" y="190" width="234" height="78" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="477" y="210" font-size="10" text-anchor="middle" fill="#4c1d95">[ person walking,</text>
  <text x="477" y="226" font-size="10" text-anchor="middle" fill="#4c1d95">left leg forward,</text>
  <text x="477" y="242" font-size="10" text-anchor="middle" fill="#4c1d95">upright,</text>
  <text x="477" y="258" font-size="10" text-anchor="middle" fill="#4c1d95">steady rhythm ]</text>

  <!-- arrow to latent space -->
  <line x1="618" y1="200" x2="698" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658" y="192" font-size="11" text-anchor="middle" fill="#475569">place it</text>

  <!-- RIGHT: latent space scatter -->
  <rect x="704" y="100" width="226" height="200" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="817" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">latent space</text>

  <!-- light grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="726" y1="150" x2="908" y2="150"/>
    <line x1="726" y1="180" x2="908" y2="180"/>
    <line x1="726" y1="210" x2="908" y2="210"/>
    <line x1="726" y1="240" x2="908" y2="240"/>
    <line x1="726" y1="270" x2="908" y2="270"/>
    <line x1="756" y1="140" x2="756" y2="284"/>
    <line x1="796" y1="140" x2="796" y2="284"/>
    <line x1="836" y1="140" x2="836" y2="284"/>
    <line x1="876" y1="140" x2="876" y2="284"/>
  </g>

  <!-- blue cluster -->
  <circle cx="760" cy="170" r="5" fill="#1d4ed8"/>
  <circle cx="772" cy="178" r="5" fill="#1d4ed8"/>
  <circle cx="766" cy="188" r="5" fill="#1d4ed8"/>
  <text x="748" y="206" font-size="9.5" fill="#1e3a8a">steady, symmetric</text>
  <text x="748" y="218" font-size="9.5" fill="#1e3a8a">walking</text>

  <!-- amber cluster -->
  <circle cx="882" cy="166" r="5" fill="#c2410c"/>
  <circle cx="892" cy="176" r="5" fill="#c2410c"/>
  <circle cx="878" cy="180" r="5" fill="#c2410c"/>
  <text x="838" y="150" font-size="9.5" fill="#7c2d12">one-sided, slow</text>
  <text x="838" y="162" font-size="9.5" fill="#7c2d12">(stroke-like)</text>

  <!-- violet cluster -->
  <circle cx="818" cy="256" r="5" fill="#6d28d9"/>
  <circle cx="830" cy="262" r="5" fill="#6d28d9"/>
  <circle cx="822" cy="270" r="5" fill="#6d28d9"/>
  <text x="762" y="248" font-size="9.5" fill="#4c1d95">jittery rhythm (PD-like)</text>

  <!-- bottom caption strip -->
  <rect x="30" y="440" width="900" height="90" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="472" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">JEPA predicts the SUMMARY of a hidden part</text>
  <text x="480" y="496" font-size="12" text-anchor="middle" fill="#14532d">so it can ignore unpredictable detail (noise, wobble, camera shake)</text>
  <text x="480" y="514" font-size="12" text-anchor="middle" fill="#14532d">and focus on the structure that carries meaning.</text>
</svg>
