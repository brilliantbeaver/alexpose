<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="480" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#0f172a">The JEPA family, and where Gait-JEPA fits</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#475569">Tracing the self-supervised JEPA line of research down to this project</text>

  <!-- Root row -->
  <rect x="80" y="86" width="360" height="96" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="100" y="112" font-size="13" font-weight="bold" fill="#4c1d95">VICReg (Bardes, Ponce, LeCun 2022)</text>
  <text x="100" y="132" font-size="11" fill="#334155">The anti-collapse recipe:</text>
  <text x="100" y="149" font-size="11" fill="#334155">variance + covariance terms.</text>
  <text x="100" y="166" font-size="11" fill="#334155">No negatives, no decoder.</text>

  <rect x="520" y="86" width="360" height="96" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="540" y="112" font-size="13" font-weight="bold" fill="#4c1d95">JEPA idea (LeCun 2022 position paper)</text>
  <text x="540" y="132" font-size="11" fill="#334155">Predict hidden parts in latent</text>
  <text x="540" y="149" font-size="11" fill="#334155">space, not in pixels. Learn by</text>
  <text x="540" y="166" font-size="11" fill="#334155">filling in what is masked.</text>

  <!-- Root to middle connectors -->
  <line x1="260" y1="182" x2="200" y2="256" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="182" x2="760" y2="256" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="182" x2="480" y2="256" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Middle row: prior JEPA variants -->
  <rect x="60" y="258" width="270" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="76" y="284" font-size="13" font-weight="bold" fill="#1e3a8a">I-JEPA (2023)</text>
  <text x="76" y="306" font-size="11" fill="#334155">Images.</text>
  <text x="76" y="323" font-size="11" fill="#334155">Block masking over patches.</text>

  <rect x="345" y="258" width="270" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="361" y="284" font-size="13" font-weight="bold" fill="#1e3a8a">V-JEPA / V-JEPA 2 (2024 to 2025)</text>
  <text x="361" y="306" font-size="11" fill="#334155">Raw video.</text>
  <text x="361" y="323" font-size="11" fill="#334155">Tube masking over space + time.</text>

  <rect x="630" y="258" width="270" height="90" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="646" y="284" font-size="13" font-weight="bold" fill="#1e3a8a">MC-JEPA (2023)</text>
  <text x="646" y="306" font-size="11" fill="#334155">Joint motion + content.</text>
  <text x="646" y="323" font-size="11" fill="#334155">Optical flow meets features.</text>

  <!-- Middle to leaf connectors -->
  <line x1="195" y1="348" x2="400" y2="448" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="348" x2="480" y2="448" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="765" y1="348" x2="560" y2="448" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Highlighted leaf node -->
  <rect x="230" y="450" width="500" height="110" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
  <text x="480" y="478" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">Gait-JEPA (this work)</text>
  <text x="480" y="502" font-size="12" text-anchor="middle" fill="#334155">Pose SKELETONS over time, not pixels or raw video.</text>
  <text x="480" y="521" font-size="12" text-anchor="middle" fill="#334155">Spatiotemporal block masking of joints across frames.</text>
  <text x="480" y="540" font-size="12" text-anchor="middle" fill="#334155">Aimed at clinical gait analysis.</text>

  <!-- Bottom note -->
  <text x="480" y="596" font-size="12" text-anchor="middle" fill="#475569">Our twist: run the JEPA game on 33 tracked joints instead of pixels,</text>
  <text x="480" y="614" font-size="12" text-anchor="middle" fill="#475569">and aim the masking at clinical movement axes.</text>
</svg>
